    racine.setAttribute("data-theme", t);
    try { localStorage.setItem("lumineux-theme", t); } catch (e) { /* stockage indisponible */ }
    etiquetteTheme();
  });

  function vignettes() {
    var ol = $("vignettes"); ol.textContent = "";
    D.diapos.forEach(function (d, i) {
      var li = document.createElement("li"), b = document.createElement("button"), im = document.createElement("img"), s = document.createElement("span"), n = document.createElement("b");
      b.type = "button"; b.className = "vignette"; b.addEventListener("click", function () { aller(i); $("scene").scrollIntoView({ behavior: "smooth", block: "start" }); });
      im.src = img(langue, i); im.alt = ""; im.loading = "lazy";
      n.textContent = i + 1; s.appendChild(n); s.appendChild(document.createTextNode(d[langue]));
      b.appendChild(im); b.appendChild(s); li.appendChild(b); ol.appendChild(li);
    });
  }

  function afficher() {
    var d = D.diapos[index], t = D.textes[langue], c = code(d);
    $("image").src = img(langue, index);
    $("image").alt = (index + 1) + " / " + N + " : " + d[langue];
    $("titre-diapo").textContent = d[langue];
    $("compteur").textContent = (index + 1) + " / " + N;
    $("barre").style.width = ((index + 1) / N * 100) + "%";
    $("prec").disabled = index === 0; $("suiv").disabled = index === N - 1;
    $("code").hidden = !c; afficherCode(c);
    $("copier-texte").textContent = t.copier;
    Array.prototype.forEach.call(document.querySelectorAll(".vignette"), function (v, i) { v.setAttribute("aria-current", i === index ? "true" : "false"); });
    [index - 1, index + 1].forEach(function (i) { if (i >= 0 && i < N) new Image().src = img(langue, i); });
    history.replaceState(null, "", location.pathname + location.search + "#" + (index + 1));
  }

  /* Fichier Markdown : une ligne = un bloc dont le sens suit son premier caractère (titres latins à gauche, arabe à droite). */
  function afficherCode(c) {
    var cible = $("code-texte"); cible.textContent = "";
    if (D.genre !== "markdown") { cible.textContent = c; return; }
    c.split("\n").forEach(function (ligne) {
      var s = document.createElement("span"); s.dir = "auto"; s.textContent = ligne; cible.appendChild(s);
    });
  }

  function aller(i) { if (i < 0 || i >= N || i === index) return; index = i; afficher(); }

  function changerLangue(l) {
    langue = l; var t = D.textes[l];
    racine.lang = l; racine.dir = l === "ar" ? "rtl" : "ltr";
    document.title = t.titre + " · " + t.lecon;
    document.querySelector('meta[name="description"]').content = t.description;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (e) { e.textContent = t[e.getAttribute("data-t")]; });
    $("prec").setAttribute("aria-label", t.precedente); $("suiv").setAttribute("aria-label", t.suivante);
    $("plein").setAttribute("aria-label", t.plein_ecran); $("langues").setAttribute("aria-label", t.langue);
    $("accueil").href = l === "fr" ? "index.html" : l + "/index.html";
    $("pdf").href = "assets/telechargements/" + D.fichiers + "-" + l + ".pdf";
    Array.prototype.forEach.call(document.querySelectorAll("[data-langue]"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-langue") === l ? "true" : "false"); });
    params.set("lang", l);
    history.replaceState(null, "", location.pathname + "?" + params.toString() + "#" + (index + 1));
    etiquetteTheme(); vignettes(); afficher();
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-langue]"), function (b) {
    b.addEventListener("click", function () { changerLangue(b.getAttribute("data-langue")); });
  });
  $("prec").addEventListener("click", function () { aller(index - 1); });
  $("suiv").addEventListener("click", function () { aller(index + 1); });
  $("plein").addEventListener("click", function () {
    var s = $("scene");
    if (document.fullscreenElement) document.exitFullscreen(); else if (s.requestFullscreen) s.requestFullscreen();
  });
  $("copier").addEventListener("click", function () {
    var t = D.textes[langue], texte = code(D.diapos[index]);
    function ok() { $("copier-texte").textContent = t.copie; setTimeout(function () { $("copier-texte").textContent = t.copier; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(ok, function () {});
    else { var z = document.createElement("textarea"); z.value = texte; document.body.appendChild(z); z.select(); try { document.execCommand("copy"); ok(); } catch (e) {} z.remove(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var rtl = racine.dir === "rtl";
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { aller(index + ((e.key === "ArrowRight") !== rtl ? 1 : -1)); e.preventDefault(); }
    else if (e.key === "PageDown" || (e.key === " " && e.target === document.body)) { aller(index + 1); e.preventDefault(); }
    else if (e.key === "PageUp") { aller(index - 1); e.preventDefault(); }
    else if (e.key === "Home") { aller(0); e.preventDefault(); }
    else if (e.key === "End") { aller(N - 1); e.preventDefault(); }
    else if (e.key === "f" || e.key === "F") $("plein").click();
    else if (e.key === "t" || e.key === "T") $("theme").click();
  });
  var x0 = null;
  $("scene").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $("scene").addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, rtl = racine.dir === "rtl"; x0 = null;
    if (Math.abs(dx) > 40) aller(index + ((dx < 0) !== rtl ? 1 : -1));
  });
  window.addEventListener("hashchange", function () {
    var i = (parseInt(location.hash.slice(1), 10) || 1) - 1; if (i >= 0 && i < N) aller(i);
  });
  changerLangue(langue);
})();
</script>
</body>
</html>
