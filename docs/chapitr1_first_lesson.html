 a move no human would have played","Commentators think it is a mistake; it is a winning move","The machine no longer imitates humans: it finds its own strategies"],"illus":"go","notes":"“Move 37” has become the symbol of machine creativity. Go back to Lovelace's objection: did AlphaGo “create” something? In 2024, Demis Hassabis and John Jumper received the Nobel Prize in Chemistry for AlphaFold, which predicts the shape of proteins."},{"type":"section","numero":"7","titre":"Transformers and generative AI","periode":"2017–2022","texte":"A new architecture learns to read whole texts. Machines start to write, draw and translate.","illus":"attention","notes":"Seventh stage: the one that leads to the chatbots your students already use."},{"type":"schema","titre":"“Attention Is All You Need”","annee":"2017","illus":"attention","points":["Eight Google researchers propose the Transformer","The attention mechanism links each word to all the others","In “The student opened the book because she…”, “she” looks at “student”","All of today's large language models descend from it"],"notes":"The paper's title has become famous. The animation shows the attention links: thickness indicates importance. The Transformer reads all the words at once, which makes it possible to train huge models."},{"type":"frise","titre":"From BERT to ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google: a model that understands a word's context"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI: text so fluent that the company hesitates to release it"},{"annee":"2020","titre":"GPT-3","texte":"175 billion parameters; AlphaFold 2 solves the shape of proteins"},{"annee":"2021","titre":"DALL·E","texte":"An image drawn from a sentence"},{"annee":"2022","titre":"ChatGPT","texte":"November 30: generative AI reaches the general public"}],"notes":"In five years, we go from a laboratory tool to a service used by hundreds of millions of people. Ask who in the class has already used a chatbot, and for what."},{"type":"schema","titre":"How a language model “writes”","illus":"motsuivant","points":["It splits the text into pieces, the tokens","It calculates the probability of each possible next token","It picks one, adds it to the text, and starts again","Humans then rate its answers to refine it"],"notes":"It is the bigram model of notebook 08, on an immensely larger scale. Tuning by humans is called RLHF: reinforcement learning from human feedback. Stress this: the model predicts plausible text, not true text."},{"type":"chat","titre":"A dialogue with a language model","annee":"2022","legende":"Fictional example, written for the class","echanges":[{"qui":"h","texte":"Explain forward chaining to a literature student."},{"qui":"m","texte":"Imagine a detective: he starts from the clues he knows and applies his rules one by one, until he finds the culprit."},{"qui":"h","texte":"Give me a reference so I can cite this in my thesis."},{"qui":"m","texte":"Careful: always check a reference in a library. I can make mistakes or invent references."}],"notes":"Compare with ELIZA: this time, the answer is relevant, rephrased and adapted to its audience. But the risk remains: a model can invent a reference, a quotation, a date. This is the subject of the “reference test” activity in the guide."},{"type":"section","numero":"8","titre":"The age of agents","periode":"2023–2026","texte":"The language model no longer just answers: it plans, uses tools and acts.","illus":"agent","notes":"Final stage: this is what is in the news. Recall Shakey (1966): perceive, plan, act. The idea of an agent is old; what has changed is that a language model now serves as its “brain”."},{"type":"texte","titre":"What is an agent?","points":["An agent perceives its environment and acts on it to reach a goal","A thermostat is a very simple agent: it measures, then heats or not","Russell and Norvig (1995) define all of AI as the study of agents","A modern AI agent receives a goal, not just a question"],"illus":"thermostat","notes":"A definition for students to write down. The difference from a classic chatbot: we no longer ask it to “answer”, we ask it to “do”. Example: “Find three articles on Kateb Yacine, read them and write me a summary sheet.”"},{"type":"schema","titre":"The agent loop","illus":"boucle","points":["Goal: what the user asks for","Think: the model plans the next step","Act: it uses a tool (search, calculation, file, browser)","Observe: it reads the result, then starts again until the goal is reached"],"notes":"Have students follow the animated loop. Each round can succeed or fail; the agent corrects its plan. That is why the tools it can access must be limited and its important actions checked."},{"type":"frise","titre":"From chatbots to agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Researchers make a single model alternate between reasoning and actions"},{"annee":"2023","titre":"Tools","texte":"GPT-4; models learn to call tools and programs"},{"annee":"2024","titre":"Reason, act","texte":"Models that think before answering; a model operates a computer; the MCP protocol for connecting tools"},{"annee":"2025","titre":"Agents at work","texte":"Agents that browse the Web, write and fix programs"},{"annee":"2026","titre":"Everyday use","texte":"Agents settle into office, research and teaching software"}],"notes":"The 2025 and 2026 entries describe general trends rather than specific products, which change quickly. Invite students to find a recent example and present it in two minutes."},{"type":"deux","titre":"Chatbot or agent?","gauche":{"titre":"Chatbot","points":["Answers a question","Produces text","A single turn","The human does the rest"]},"droite":{"titre":"Agent","points":["Pursues a goal","Uses tools and acts","Several steps; it corrects its plan","The human supervises and approves"]},"notes":"The boundary keeps shifting: many chatbots can already search the Web. Remember the criterion: an agent chains actions in the world to reach a goal."},{"type":"texte","titre":"The risks, and good practice","points":["Hallucinations: an agent may act on false information","Irreversible actions: deleting, sending, paying; they must be approved","Instructions hidden in a Web page can hijack an agent","Personal data: Algerian Law 18-07 applies","2024: the European Union adopts the AI Act"],"illus":"bouclier","notes":"A simple rule for students: stay in control of every important action, check sources, and declare AI use in your work. Refer them to the AI use charter in the guide."},{"type":"texte","titre":"And in Algeria?","points":["2021: the National Higher School of Artificial Intelligence (ENSIA) opens","Arabic, Darja and Tamazight remain less well served by models","Local corpora, built in the humanities and social sciences, are a real contribution","Your theses can contribute: texts, surveys, interviews"],"illus":"carte","notes":"A local anchor point. Languages that are less present on the Web are handled less well by models: it is a question of data, and therefore also of the humanities. Encourage students to imagine a corpus they could build."},{"type":"section","numero":"9","titre":"Summary","periode":"From 1206 to 2026","texte":"Eight centuries of dreams, seventy years of science, a few years of agents.","illus":"frise","notes":"Final part: recap, watch the videos, check what has been understood."},{"type":"frise","titre":"The eight dates to remember","evenements":[{"annee":"1843","titre":"Lovelace","texte":"The first program, for a machine never completed"},{"annee":"1950","titre":"Turing","texte":"Can machines think?"},{"annee":"1956","titre":"Dartmouth","texte":"AI gets its name"},{"annee":"1974","titre":"Winter","texte":"The first AI winter"},{"annee":"1997","titre":"Deep Blue","texte":"A computer beats the chess champion"},{"annee":"2012","titre":"AlexNet","texte":"Deep learning wins out"},{"annee":"2017","titre":"Transformer","texte":"Attention at the heart of language models"},{"annee":"2022","titre":"ChatGPT","texte":"Generative AI for everyone; then come the agents"}],"notes":"Have students recite the timeline backwards, from 2022 to 1843. These eight dates are enough to tell the whole story in the exam."},{"type":"deux","titre":"The families of AI, on a single slide","gauche":{"titre":"By method","points":["Symbolic: written rules","Machine learning: examples","Deep learning: networks with many layers","Reinforcement: trials and rewards"]},"droite":{"titre":"By ambition","points":["Weak (narrow) AI: one specific task","Strong (general) AI: every task, hypothetical","Today's agents are still weak AI","… but increasingly versatile"]},"notes":"This table links the lesson to chapter 1 of the course (weak and strong AI, types of learning) and to chapter 3 (types of AI). A modern agent combines several families: a deep model, safety rules, sometimes reinforcement."},{"type":"video","titre":"Video: the complete history of AI (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"“The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence”, a documentary in English, on YouTube","notes":"Show a passage chosen in advance rather than the whole video. Ask students to spot three dates from the timeline in the video. The video requires an Internet connection."},{"type":"video","titre":"Video: a hundred years of artificial intelligence","youtube":"mSd9nmPM7Vg","legende":"“The Entire History of Artificial Intelligence (Last 100 Years)”, a documentary in English, on YouTube","notes":"For English groups, have students summarize the video orally in English: it is also a language exercise. For the others, use automatic subtitles in the chosen language."},{"type":"quiz","question":"In what year did the term “artificial intelligence” take hold, with the Dartmouth workshop?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"The term appears in the 1955 proposal and took hold with the workshop in the summer of 1956.","notes":"Have the class vote before revealing the answer (R key or button)."},{"type":"quiz","question":"Why do we speak of AI “winters”?","choix":["Computers overheated","Disappointment made funding and interest fall","Research was done in winter","Machines were banned"],"reponse":1,"explication":"After excessive promises, the results were disappointing: funding was cut (1974–1980, then 1987–1993).","notes":"Ask for an example of an excessive promise seen in the lesson: Herbert Simon's quotation (1965)."},{"type":"quiz","question":"What distinguishes an agent from a simple chatbot?","choix":["It writes faster","It pursues a goal by acting with tools","It never makes mistakes","It works without electricity"],"reponse":1,"explication":"An agent chains actions (searching, calculating, writing a file…) and observes the results to reach a goal.","notes":"Go back to the loop: goal, think, act, observe."},{"type":"quiz","question":"Did ELIZA (1966) understand what was said to it?","choix":["Yes, like a psychologist","No: it transformed sentences with rules","Yes, thanks to deep learning","We do not know"],"reponse":1,"explication":"ELIZA spotted keywords and sent back stock sentences. Believing that it understood is the “ELIZA effect”.","notes":"A transition question to the debate: and do today's models understand?"},{"type":"fin","titre":"Key takeaways","points":["The dream is old; AI as a science was born between 1950 and 1956","Two paths alternate: writing the rules or learning from data","The winters remind us to judge by results, not by promises","An agent perceives, plans and acts: from Shakey (1966) to the agents of 2025","Check, stay in control, declare your use: the three golden rules"],"texte":"Homework: choose a date from the timeline and write ten lines on what it changed, citing a verified source.","notes":"End with the opening question: can a machine think? Collect three reasoned answers. The homework prepares the round table on the origins of AI."}]},"ar":{"langue":"ar","titre":"من الآلة ذاتية الحركة إلى الوكيل","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","diapos":[{"type":"couverture","surtitre":"الذكاء الاصطناعي · الفصل 1 · الدرس الأول","titre":"من الآلة ذاتية الحركة إلى الوكيل","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","illus":"agent","notes":"استقبلوا الطلبة بسؤال مكتوب على السبورة: «هل تستطيع الآلة أن تفكّر؟» لا تجيبوا عنه: فالدرس كله يعود إليه. أعلنوا الخيط الناظم: إن حلم الآلات الذكية قديم جدًا، لكن عمر الذكاء الاصطناعي بوصفه علمًا سبعون سنة، وعمر وكلائه بضع سنوات فقط."},{"type":"plan","titre":"رحلة هذا الدرس","points":["حلم الآلات (من العصور القديمة إلى 1945)","ميلاد الذكاء الاصطناعي (1950–1956)","العصر الذهبي، ثم الشتاء الأول (1956–1980)","الأنظمة الخبيرة (1980–1993)","التعلّم من البيانات (1990–2016)","ثورة التعلم العميق (2006–2016)","المحوِّلات والذكاء الاصطناعي التوليدي (2017–2022)","عصر الوكلاء (2023–2026)"],"notes":"ثماني مراحل، لكل منها تاريخ أساسي ينبغي حفظه. اقترحوا على الطلبة أن يدوّنوا تاريخًا واحدًا لكل مرحلة: وسيعيدون بناء الخط الزمني في النهاية."},{"type":"texte","titre":"وأنتم، ماذا تسمّون «ذكاءً»؟","points":["فهم جملة، وترجمة قصيدة","التعرّف على وجه من بين ألف وجه","الفوز في الشطرنج، وحلّ مشكلة","التعلّم من الأخطاء","التصرّف باستقلال لبلوغ هدف"],"illus":"cerveau","notes":"دقيقتان من التصويت برفع الأيدي: أيّ هذه القدرات تمتلكها الآلة بالفعل؟ جواب نهاية الدرس: كلها، بدرجات متفاوتة، لكن لا آلة تجمعها كما يجمعها الإنسان. أما السطر الأخير، التصرّف باستقلال لبلوغ هدف، فيعرّف الوكيل: إنه وجهة هذا الدرس."},{"type":"section","numero":"1","titre":"حلم الآلات","periode":"من العصور القديمة إلى 1945","texte":"قبل الحواسيب بزمن طويل، تخيّل البشر آلاتٍ تحاكي الحياة وصنعوها، ثم آلاتٍ تحسب.","illus":"engrenages","notes":"المرحلة الأولى: الذكاء الاصطناعي لم يولد من العدم. يلتقي هنا خطّان: الآلات ذاتية الحركة، التي تحاكي الحركة، والآلات الحاسبة، التي تحاكي الاستدلال."},{"type":"texte","titre":"آلات ذاتية الحركة في الأساطير والورشات","points":["أسطورة إغريقية: تالوس، عملاق من البرونز يحرس جزيرة كريت","القرن الأول الميلادي: هيرون السكندري يصف آلات ذاتية الحركة للمسرح","سنة 1739: بطّة فوكانسون تخفق بجناحيها و«تهضم»","نحو سنة 1770: «الكاتب» الذي صنعه آل جاكيه-دروز يخطّ الحروف بالريشة"],"illus":"engrenages","notes":"تعيد الآلة ذاتية الحركة إنتاج حركة محدَّدة مسبقًا بواسطة تروسها أو حدباتها. إنها لا تقرّر شيئًا: وهذا هو الفرق بينها وبين الذكاء الاصطناعي. اسألوا: هل «يكتب» «كاتب» آل جاكيه-دروز حقًّا؟"},{"type":"texte","titre":"الجزري، مهندس الآلات البارعة","annee":"1206","points":["مهندس في بلاط بني أرتق، في أعالي بلاد الرافدين","ألّف سنة 1206 كتاب *الجامع بين العلم والعمل النافع في صناعة الحيل*","يصف نحو خمسين آلة: ساعات، ومضخات، وآلات ذاتية الحركة","ساعة الفيل التي صنعها تعلن الساعات بواسطة آلات ذاتية الحركة"],"illus":"elephant","notes":"يبيّن الجزري أن تقليد الآلات ذاتية الحركة يمتدّ عبر العالم العربي والإسلامي في العصر الوسيط. وما تزال رسومه المفصَّلة تسمح اليوم بإعادة بناء آلاته. التزموا الحذر: إنها آلات ذاتية الحركة مبرمجة مسبقًا، لا آلات تتعلّم."},{"type":"texte","titre":"آلات تحسب","points":["سنة 1642: يصنع بليز باسكال آلة «الباسكالين» التي تُجري الجمع","سنة 1673: يقدّم لايبنتز آلة تُجري الضرب","سنة 1837: يصمّم تشارلز باباج الآلة التحليلية، القابلة للبرمجة بالبطاقات المثقّبة","لن تكتمل الآلة التحليلية أبدًا في حياته"],"illus":"calculatrice","personne":"babbage","notes":"مرحلة مفصلية: الآلة التي تحسب تحلّ محلّ جزء من عمل العقل. فالآلة التحليلية لباباج تمتلك أصلًا ذاكرة ووحدة حساب، مثل حواسيبنا."},{"type":"portrait","personne":"lovelace","nom":"آدا لوفلايس","dates":"1815–1852","role":"عالمة رياضيات، أول مبرمجة","points":["سنة 1843: ملاحظاتها على الآلة التحليلية لباباج","تكتب فيها خوارزمية لحساب أعداد برنولي","تتخيّل أن الآلة قد تؤلّف الموسيقى"],"citation":"لا تدّعي الآلة التحليلية إطلاقًا أنها تُبدع أيّ شيء.","source":"آدا لوفلايس، ملاحظات سنة 1843","notes":"سيناقش تورينغ عبارتها هذه، «اعتراض الليدي لوفلايس»، بعد قرن من الزمن: هل لا تفعل الآلة إلا ما يُطلب منها؟ سؤال يُطرح على الطلبة: هل يُبدع نموذجٌ يكتب قصيدةً شيئًا ما؟"},{"type":"texte","titre":"حين يصير التفكير حسابًا","points":["سنة 1854: يختزل جورج بول الاستدلال في حسابات على الصواب والخطأ","سنة 1936: يصف آلان تورينغ آلة مجرّدة قادرة على إجراء أيّ حساب","شريط، ورأس قراءة، وجدول قواعد: إنها «آلة تورينغ»","كل حاسوب حالي هو، من حيث المبدأ، آلة تورينغ"],"illus":"turing","notes":"يقدّم بول الأبجدية (صحيح، خطأ، و، أو، لا)؛ ويقدّم تورينغ الآلة الشاملة. اعرضوا الرسم المتحرّك: يقرأ الرأس خانة، ثم يكتب، ثم يتحرّك، ثم يغيّر حالته. وبقواعد بهذه البساطة، يمكن حساب كل شيء."},{"type":"portrait","personne":"turing","nom":"آلان تورينغ","dates":"1912–1954","role":"عالم رياضيات، أبو المعلوماتية النظرية","points":["سنة 1936: الآلة الشاملة","بين 1939 و1945: يُسهم في كسر شيفرة Enigma في بليتشلي بارك","سنة 1950: «Computing Machinery and Intelligence»، المقال المؤسِّس"],"citation":"أقترح أن ننظر في السؤال الآتي: هل تستطيع الآلات أن تفكّر؟","source":"آلان تورينغ، مجلة Mind، سنة 1950","notes":"يُحِلّ تورينغ اختبارًا قابلًا للملاحظة، هو لعبة المحاكاة، محلَّ سؤالٍ مستحيل («التفكير»). تلك هي الخطوة المؤسِّسة للذكاء الاصطناعي. والجملة المقتبسة هي التي يُفتتح بها مقاله الصادر سنة 1950."},{"type":"schema","titre":"العصبون الاصطناعي","annee":"1943","illus":"neurone","points":["ينمذج وارن ماكولوك ووالتر بيتس العصبون بعملية حسابية","يجمع إشارات الدخل و«ينشط» عند تجاوز عتبة معيّنة","إنه سلف كل الشبكات العصبية الحالية"],"notes":"أول جسر بين البيولوجيا والحساب. ارسموا على السبورة: ثلاثة مداخل، وأوزانًا، ومجموعًا، وعتبة. وسنجد هذا المخطّط نفسه تمامًا في البيرسبترون سنة 1958، ثم في التعلم العميق."},{"type":"texte","titre":"الحواسيب الأولى","points":["سنة 1945: حاسوب ENIAC، بوزن 30 طنًا، يحسب المسارات الباليستية","سنة 1948: يؤسّس كلود شانون نظرية المعلومات","يصبح البت وحدة كل معلومة: النص والصورة والصوت","صارت الآلات موجودة أخيرًا؛ وبقي أن نجعلها «ذكية»"],"personne":"eniac","notes":"يشغل حاسوب ENIAC قاعة كاملة، ويُبرمَج بوصل الكابلات. أما شانون، فسيكون أحد الموقّعين الأربعة على مشروع دارتموث. نهاية المرحلة الأولى: كل شيء جاهز لميلاد الذكاء الاصطناعي."},{"type":"section","numero":"2","titre":"ميلاد الذكاء الاصطناعي","periode":"1950–1956","texte":"في ست سنوات، يتحوّل سؤالٌ إلى برنامج بحث، ثم إلى تخصص له اسم.","illus":"ampoule","notes":"المرحلة الثانية: ثلاث لحظات ينبغي حفظها، 1950 (تورينغ)، و1956 (دارتموث)، وأول برنامج «ذكي»."},{"type":"schema","titre":"لعبة المحاكاة","annee":"1950","illus":"imitation","points":["يتحاور حَكَمٌ كتابيًا مع محاوِرَين مخفيَّين","أحدهما إنسان، والآخر آلة","إذا عجز الحَكَم عن التمييز بينهما، «تنجح» الآلة"],"notes":"مثّلوا المشهد: متطوعان مخفيّان، وحَكَم، وخمس دقائق من الأسئلة المكتوبة. نقاش: هل يقيس الاختبار الذكاء، أم فنّ الإيهام؟ وقد أعاد وكلاء المحادثة الحاليون إحياء هذا النقاش."},{"type":"citation","texte":"كل جانب من جوانب التعلم، أو أيّ سمة أخرى من سمات الذكاء، يمكن من حيث المبدأ وصفه بدقة بالغة إلى حدّ يمكن معه صنع آلة تحاكيه.","auteur":"ج. مكارثي، م. مينسكي، ن. روتشستر، ك. شانون","source":"مقترح ورشة دارتموث، 31 أغسطس 1955","notes":"في هذا النص تظهر عبارة «الذكاء الاصطناعي». والفرضية طموحة جدًا: فكل ما يقوم به الذكاء يمكن أن يوصف بدقة. اسألوا: هل يصحّ ذلك على الفكاهة؟ وعلى الحدس الشعري؟"},{"type":"portrait","personne":"mccarthy","nom":"جون مكارثي","dates":"1927–2011","role":"عالم حاسوب، منح الذكاء الاصطناعي اسمه","points":["صيف 1956: ينظّم ورشة دارتموث، شهادة ميلاد الذكاء الاصطناعي","سنة 1958: يبتكر لغة Lisp، التي ظلّت طويلًا لغة الذكاء الاصطناعي","معه: مارفن مينسكي، وكلود شانون، وناثانيال روتشستر"],"notes":"جمعت ورشة دارتموث نحو عشرة باحثين خلال صيف 1956. لم تُسفر عن اكتشاف كبير، لكنها منحت هذا التخصص اسمًا وجماعةً علمية وبرنامجًا."},{"type":"texte","titre":"أول برنامج «ذكي»","annee":"1956","points":["برنامج Logic Theorist لألن نيويل وهربرت سايمون وكليف شو","يبرهن 38 من المبرهنات الـ52 الأولى في *Principia Mathematica*","ولإحداها، برهانٌ أكثر أناقة من برهان المؤلفين","فكرة أساسية: البحث بين الإمكانات بواسطة قواعد"],"illus":"arbre","notes":"يجسّد برنامج Logic Theorist الذكاءَ الاصطناعي الرمزي: رموز، وقواعد، وبحث في شجرة من الإمكانات. إنه المنطق نفسه الذي يقوم عليه التسلسل الأمامي في الأعمال الموجَّهة (TD) للفصل 3."},{"type":"section","numero":"3","titre":"العصر الذهبي، ثم الشتاء الأول","periode":"1956–1980","texte":"نجاحات مذهلة، ووعود مفرطة، ثم خيبة الأمل وتوقّف التمويل.","illus":"courbe","notes":"المرحلة الثالثة: إنها الدورة الأولى من الحماس وخيبة الأمل. وستتكرّر، وهذا ما يساعد على الحكم على وعود اليوم."},{"type":"schema","titre":"بيرسبترون روزنبلات","annee":"1958","illus":"perceptron","points":["يبني فرانك روزنبلات آلة تتعلّم التعرّف على الأشكال","تضبط أوزانها بنفسها بعد كل خطأ","تعلن الصحافة عن آلات «تفكّر»: فيجمح الحماس"],"personne":"perceptron","notes":"البيرسبترون هو أول شبكة عصبية تتعلّم. اربطوا ذلك بنشاط «العصبون البشري» في الدليل: أوزان، وعتبة، وتصحيح بعد كل خطأ."},{"type":"texte","titre":"التعلّم من دون برمجة","annee":"1959","points":["يكتب آرثر صامويل برنامجًا للعب الداما يتحسّن باللعب","يبتكر عبارة «machine learning»، أي التعلم الآلي","وينتهي البرنامج إلى هزيمة مبتكره نفسه","يرتسم مساران: كتابة القواعد، أو جعل الآلة تتعلّمها"],"illus":"dames","notes":"هذا هو التقابل الذي يُهيكل التاريخ كله: الذكاء الاصطناعي الرمزي (نكتب القواعد) في مقابل الذكاء الاصطناعي الاتصالي أو الإحصائي (تتعلّمها الآلة من الأمثلة)."},{"type":"chat","titre":"إليزا (ELIZA)، أول معالِجة نفسية اصطناعية","annee":"1966","legende":"مقتطف من مقال جوزيف فايزنباوم (1966)، مترجَم","echanges":[{"qui":"h","texte":"الرجال كلهم متشابهون."},{"qui":"m","texte":"بأيّ معنى؟"},{"qui":"h","texte":"إنهم يزعجوننا دائمًا بشيء أو بآخر."},{"qui":"m","texte":"هل يمكنكِ أن تذكري مثالًا محدَّدًا؟"},{"qui":"h","texte":"حسنًا، صديقي هو الذي جعلني آتي إلى هنا."},{"qui":"m","texte":"صديقكِ جعلكِ تأتين إلى هنا."}],"notes":"لا تفهم ELIZA شيئًا: فهي ترصد كلمات مفتاحية وتعيد الجملة بواسطة قواعد تحويل. ومع ذلك، كان مستخدمون يبوحون لها بأسرارهم. وقد ظلّ فايزنباوم قلقًا من ذلك طوال حياته. إنه «أثر ELIZA»: أن ننسب فهمًا إلى آلة تُحسن الإجابة."},{"type":"texte","titre":"شيكي (Shakey)، أول روبوت يستدلّ","annee":"1966–1972","points":["صُنع في معهد ستانفورد للأبحاث (SRI)","يدرك بيئته بواسطة كاميرا","يخطّط لسلسلة من الأفعال لبلوغ هدف","من أجله وُلدت خوارزمية A*‎، التي ما تزال تُستعمل لحساب المسارات"],"personne":"shakey","illus":"robot","notes":"شيكي سلف مباشر للوكلاء: فهو يدرك، ويخطّط، ويتصرّف. لكنه يستغرق دقائق ليقرّر دفع صندوق. احفظوا مخطّط الإدراك والتخطيط والتصرّف: سيعود في نهاية الدرس."},{"type":"citation","texte":"ستكون الآلات قادرة، في غضون عشرين سنة، على القيام بأيّ عمل يستطيع الإنسان القيام به.","auteur":"هربرت سايمون","source":"1965","notes":"كانت وعود تلك الحقبة مفرطة. وبعد عشرين سنة، أي في 1985، كنّا بعيدين جدًا عنها. اطلبوا من الطلبة أن يجدوا وعدًا حاليًا بشأن الذكاء الاصطناعي، وأن يتساءلوا كيف سيُحكم عليه بعد عشرين سنة."},{"type":"schema","titre":"الشتاء الأول للذكاء الاصطناعي","annee":"1974–1980","illus":"courbe","points":["سنة 1969: يبيّن مينسكي وبابيرت حدود البيرسبترون البسيط","سنة 1973: في المملكة المتحدة، يرى تقرير لايتهيل أن النتائج مخيّبة للآمال","تنفجر الحسابات بمجرّد أن تكبر المشكلات","يُقطع التمويل العمومي: إنه «الشتاء»"],"notes":"شتاء الذكاء الاصطناعي فترةٌ تدفع فيها خيبة الأمل التمويلَ والباحثين إلى الابتعاد. ويبيّن المنحنى الشتاءين: 1974–1980 و1987–1993. ملاحظة منهجية: الحكم على تقنية ما بنتائجها، لا بوعودها."},{"type":"section","numero":"4","titre":"الأنظمة الخبيرة","periode":"1980–1993","texte":"يعود الذكاء الاصطناعي بتحويل معرفة الخبراء إلى قواعد. فيدخل الشركات، ثم يتراجع.","illus":"regles","notes":"المرحلة الرابعة: انتصار الذكاء الاصطناعي الرمزي، أي ذكاء الفصل 3 وأعماله الموجَّهة حول التسلسل الأمامي."},{"type":"schema","titre":"تحويل المعرفة إلى قواعد","illus":"regles","points":["قاعدة وقائع، وقاعدة قواعد من نوع «إذا … فإن …»، ومحرّك استدلال","سبعينيات القرن العشرين: نظام MYCIN، في ستانفورد، يشخّص التهابات الدم","سنة 1980: يضبط نظام XCON تهيئة حواسيب شركة DEC","تستثمر الشركات: فيصبح الذكاء الاصطناعي صناعة"],"notes":"اربطوا ذلك بالحصة 6: لعب الأدوار حول الأشكال الشعرية نظام خبير صغير. وكان MYCIN يضمّ نحو 600 قاعدة كُتبت بالتعاون مع أطباء."},{"type":"texte","titre":"عودة العصبونات","annee":"1986","points":["سنة 1982: تطلق اليابان مشروع حواسيب الجيل الخامس","سنة 1986: يُشيع روملهارت وهينتون وويليامز خوارزمية الانتشار العكسي","صرنا أخيرًا نعرف كيف ندرّب شبكات متعددة الطبقات","لكن الحواسيب والبيانات ما تزال غير كافية"],"illus":"reseau","notes":"يحسب الانتشار العكسي كيف يُصحَّح كل وزن في الشبكة انطلاقًا من الخطأ النهائي. إنه الانحدار التدرّجي الذي رأيناه في الفصل 3، مطبَّقًا على ملايين الأوزان. كانت الفكرة جاهزة قبل انتصارها بخمس وعشرين سنة."},{"type":"texte","titre":"الشتاء الثاني","annee":"1987–1993","points":["سنة 1987: تنهار سوق آلات Lisp المتخصصة","الأنظمة الخبيرة مكلفة، وتخطئ خارج مجالها","كل قاعدة جديدة تناقض قواعد أخرى: فتصبح عصيّة على الإدارة","تصبح عبارة «الذكاء الاصطناعي» سيئة السمعة: فيُفضَّل الحديث عن «المعلوماتية المتقدمة»"],"illus":"flocon","notes":"الأنظمة الخبيرة هشّة: فهي لا تعرف إلا ما كُتب لها، ولا تعرف أنها لا تعرف. ويفسّر هذا الضعفُ المنعطفَ التالي: التعلّم من البيانات."},{"type":"section","numero":"5","titre":"التعلّم من البيانات","periode":"1990–2016","texte":"بدلًا من كتابة القواعد، نقدّم أمثلة. ومع الإنترنت، يصبح عدد الأمثلة بالمليارات.","illus":"donnees","notes":"المرحلة الخامسة: إنه الانقلاب الكبير. ويقوم على ثلاثة مكوّنات: الخوارزميات، والبيانات، والقدرة الحسابية."},{"type":"deux","titre":"طريقتان لصنع ذكاء اصطناعي","gauche":{"titre":"الذكاء الاصطناعي الرمزي","points":["يكتب خبيرٌ القواعد","قابل للتفسير: نتتبّع الاستدلال","هشّ خارج مجاله","مثال: نظام خبير"]},"droite":{"titre":"التعلم الآلي","points":["تستخرج الآلة الانتظامات من الأمثلة","يصعب تفسيره في الغالب","متين، إذا توفّرت بيانات كثيرة","مثال: مرشِّح الرسائل المزعجة"]},"notes":"اطلبوا من الطلبة تصنيف ثلاثة أشياء: مدقّق إملائي، ومترجم آلي، وجهاز GPS. واليوم، كثيرًا ما تجمع أفضل الأنظمة بين المقاربتين."},{"type":"portrait","personne":"deepblue","nom":"حاسوب Deep Blue في مواجهة كاسباروف","dates":"مايو 1997","role":"حاسوب شركة IBM يهزم بطل العالم في الشطرنج","points":["فوز بنتيجة 3,5 مقابل 2,5 في ست مباريات، في نيويورك","تقييم نحو 200 مليون وضعية في الثانية","قوة حساب، لا تعلّم: ما يزال ذكاءً اصطناعيًا قائمًا على البحث"],"illus":"echecs","notes":"طاف الحدث العالم. لكن Deep Blue لا يفهم الشطرنج: إنه يحسب النقلات ويقيّمها بقواعد كتبها خبراء. قارنوه ببرنامج AlphaGo، الذي سيتعلّم باللعب، بعد عشرين سنة."},{"type":"frise","titre":"التعلّم يترسّخ في كل مكان","evenements":[{"annee":"1989","titre":"قراءة الأرقام","texte":"يدرّب يان لوكان شبكة التفافية على قراءة الرموز البريدية"},{"annee":"1992","titre":"TD-Gammon","texte":"برنامج يتعلّم لعبة الطاولة باللعب ضد نفسه"},{"annee":"1998","titre":"الصكوك","texte":"تقرأ شبكات لوكان الصكوك البنكية في الولايات المتحدة"},{"annee":"2002","titre":"Roomba","texte":"مكنسة روبوتية تدخل المنازل"},{"annee":"2005","titre":"Stanley","texte":"سيارة بلا سائق تفوز بسباق الصحراء الذي تنظّمه DARPA"},{"annee":"2011","titre":"Watson و Siri","texte":"يفوز Watson في برنامج المسابقات التلفزيوني Jeopardy!‎؛ ويصل Siri إلى الهواتف"}],"notes":"لاحظوا أن الذكاء الاصطناعي يصبح غير مرئي: فهو يفرز البريد، ويقرأ الصكوك، ويرشّح الرسائل المزعجة، دون أن يُسمّى ذكاءً اصطناعيًا. وهذا ما يُسمّى أحيانًا «أثر الذكاء الاصطناعي»: ما إن تنجح تقنية ما حتى نكفّ عن اعتبارها ذكاءً."},{"type":"section","numero":"6","titre":"ثورة التعلم العميق","periode":"2006–2016","texte":"شبكات عصبية ذات طبقات كثيرة جدًا، تُدرَّب على بيانات ضخمة بواسطة معالجات الرسوميات.","illus":"reseau","notes":"المرحلة السادسة. تدلّ كلمة «العميق» على عدد طبقات الشبكة، لا على عمق التفكير."},{"type":"schema","titre":"شبكة عميقة، طبقةً بعد طبقة","illus":"reseau","points":["ترصد الطبقات الأولى سمات بسيطة: حوافّ وبقع","وتركّب الطبقات التالية: الأشكال، والقوامات، والأجزاء","وتتعرّف الطبقات الأخيرة على أشياء كاملة: «قطّ»، «سيارة»","تتعلّم كل طبقة بنفسها ما ينبغي أن ترصده"],"notes":"اعرضوا الرسم المتحرّك: تعبر الإشارة الطبقات من اليسار إلى اليمين. والأمر نفسه في النص: حروف، فكلمات، فعبارات، فمعنى. لا أحد يكتب ما ينبغي أن يرصده كل عصبون: بل يتعلّمه بنفسه."},{"type":"portrait","personne":"feifei","nom":"في في لي وقاعدة ImageNet","dates":"2009–2012","role":"قاعدة صور تغيّر كل شيء","points":["سنة 2009: ImageNet، أكثر من 14 مليون صورة موسومة يدويًا","سنة 2012: تكتسح شبكة AlexNet مسابقة التعرّف على الصور","ينخفض معدل خطئها إلى 15%، مقابل 26% للمرتبة الثانية"],"illus":"imagenet","notes":"تلتقي ثلاثة مكوّنات سنة 2012: البيانات (ImageNet)، وبطاقات الرسوميات للحساب السريع، والشبكات العميقة. إنها بداية الموجة الحالية. وقد أنجز وسمَ الصور آلافُ العمّال المأجورين بالقطعة: وهذه مسألة أخلاقية تستحق النقاش."},{"type":"portrait","personne":"hinton","nom":"جيفري هينتون","dates":"وُلد سنة 1947","role":"رائد الشبكات العصبية","points":["دافع عن الشبكات العصبية خلال الشتاءين","سنة 2018: جائزة تورينغ مع يوشوا بنجيو ويان لوكان","سنة 2024: جائزة نوبل في الفيزياء مع جون هوبفيلد"],"notes":"هينتون مثال على باحث كان محقًّا قبل الأوان: فأفكاره التي تعود إلى ثمانينيات القرن العشرين لم تنجح فعلًا إلا سنة 2012. وفي 2023، غادر Google لينبّه إلى مخاطر الذكاء الاصطناعي."},{"type":"frise","titre":"الآلات تتعلّم اللغة واللعب أيضًا","evenements":[{"annee":"2013","titre":"Word2vec","texte":"تصبح الكلمات متّجهات: «ملك» − «رجل» + «امرأة» ≈ «ملكة»"},{"annee":"2014","titre":"GAN","texte":"شبكتان تتواجهان لإنتاج صور واقعية"},{"annee":"2015","titre":"ألعاب Atari","texte":"وكيل من DeepMind يتعلّم 49 لعبة فيديو انطلاقًا من البكسلات والنقاط"},{"annee":"2016","titre":"AlphaGo","texte":"يهزم برنامج DeepMind لي سيدول في لعبة الغو، 4 مباريات مقابل 1"}],"notes":"كانت لعبة الغو تُعدّ أعقد من أن يتقنها الحاسوب: فعدد وضعياتها الممكنة يفوق عدد الذرّات في الكون. ويجمع AlphaGo بين التعلم العميق والتعلم المعزَّز، النوع الثالث من أنواع التعلم في الفصل 1."},{"type":"portrait","personne":"hassabis","nom":"برنامج AlphaGo والنقلة 37","dates":"مارس 2016، سيول","role":"شركة DeepMind، التي شارك في تأسيسها ديميس هاسابيس","points":["المباراة الثانية: يلعب AlphaGo نقلة ما كان أيّ إنسان ليلعبها","يظنّها المعلّقون خطأً؛ لكنها نقلة رابحة","لم تعد الآلة تقلّد البشر: إنها تجد استراتيجياتها الخاصة"],"illus":"go","notes":"أصبحت «النقلة 37» رمزًا لإبداع آلي. عودوا إلى اعتراض لوفلايس: هل «أبدع» AlphaGo شيئًا؟ وفي 2024، نال ديميس هاسابيس وجون جمبر جائزة نوبل في الكيمياء عن AlphaFold، الذي يتنبّأ بشكل البروتينات."},{"type":"section","numero":"7","titre":"المحوِّلات والذكاء الاصطناعي التوليدي","periode":"2017–2022","texte":"بنية جديدة تتعلّم قراءة نصوص كاملة. فتشرع الآلات في الكتابة والرسم والترجمة.","illus":"attention","notes":"المرحلة السابعة: هي التي تقود إلى وكلاء المحادثة التي يستعملها طلبتكم أصلًا."},{"type":"schema","titre":"مقال «Attention Is All You Need»","annee":"2017","illus":"attention","points":["يقترح ثمانية باحثين من Google بنية المحوِّل (Transformer)","تربط آلية الانتباه كل كلمة بكل الكلمات الأخرى","في «فتحت الطالبة الكتاب لأنها…»، يلتفت الضمير «ها» إلى «الطالبة»","تنحدر منه كل النماذج اللغوية الكبيرة الحالية"],"notes":"أصبح عنوان المقال شهيرًا. ويُظهر الرسم المتحرّك روابط الانتباه: يدلّ سُمكها على الأهمية. ويقرأ المحوِّل كل الكلمات في الوقت نفسه، مما يسمح بتدريب نماذج ضخمة."},{"type":"frise","titre":"من BERT إلى ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"شركة Google: نموذج يفهم سياق الكلمة"},{"annee":"2019","titre":"GPT-2","texte":"شركة OpenAI: نصوص سلسة إلى حدّ التردّد في نشره"},{"annee":"2020","titre":"GPT-3","texte":"نموذج بـ175 مليار معامل؛ وAlphaFold 2 يحلّ مسألة شكل البروتينات"},{"annee":"2021","titre":"DALL·E","texte":"صورة تُرسم انطلاقًا من جملة"},{"annee":"2022","titre":"ChatGPT","texte":"في 30 نوفمبر: يصل الذكاء الاصطناعي التوليدي إلى عامة الناس"}],"notes":"في خمس سنوات، ننتقل من أداة مخبرية إلى خدمة يستعملها مئات الملايين من الناس. اسألوا مَن مِن الطلبة سبق أن استعمل وكيل محادثة، ولأيّ غرض."},{"type":"schema","titre":"كيف «يكتب» نموذج لغوي","illus":"motsuivant","points":["يقطّع النص إلى أجزاء، هي الرموز (tokens)","يحسب احتمال كل رمز تالٍ","يختار واحدًا منها، ويضيفه إلى النص، ثم يعيد الكرّة","ثم يقيّم بشرٌ إجاباته لصقله"],"notes":"إنه نموذج الثنائيات (bigrammes) في الدفتر 08، لكن بحجم أكبر بما لا يُقاس. ويُسمّى الضبط بواسطة البشر بالإنجليزية RLHF: التعلم المعزَّز انطلاقًا من التغذية الراجعة البشرية. شدّدوا على أن النموذج يتنبّأ بنص معقول، لا بنص صحيح."},{"type":"chat","titre":"حوار مع نموذج لغوي","annee":"2022","legende":"مثال متخيَّل، كُتب للطلبة","echanges":[{"qui":"h","texte":"اشرح التسلسل الأمامي لطالب في الأدب."},{"qui":"m","texte":"تخيّل محقّقًا: ينطلق من القرائن التي يعرفها ويطبّق قواعده واحدةً تلو الأخرى، حتى يجد الجاني."},{"qui":"h","texte":"أعطني مرجعًا لأستشهد به في مذكّرتي."},{"qui":"m","texte":"انتبه: تحقّق دائمًا من المرجع في مكتبة. فقد أخطئ، وقد أختلق مراجع."}],"notes":"قارنوا بـELIZA: هذه المرة، الإجابة وجيهة، ومُعاد صياغتها، ومكيَّفة مع الجمهور. لكن الخطر قائم: فقد يختلق النموذج مرجعًا، أو اقتباسًا، أو تاريخًا. وهذا موضوع نشاط «اختبار المراجع» في الدليل."},{"type":"section","numero":"8","titre":"عصر الوكلاء","periode":"2023–2026","texte":"لم يعد النموذج اللغوي يكتفي بالإجابة: إنه يخطّط، ويستعمل الأدوات، ويتصرّف.","illus":"agent","notes":"المرحلة الأخيرة: إنها موضوع الساعة. ذكّروا بشيكي (1966): الإدراك، والتخطيط، والتصرّف. ففكرة الوكيل قديمة؛ أما الجديد فهو أن نموذجًا لغويًا صار يؤدّي دور «الدماغ»."},{"type":"texte","titre":"ما الوكيل؟","points":["يدرك الوكيل بيئته ويؤثّر فيها لبلوغ هدف","منظّم الحرارة وكيل بسيط جدًا: يقيس، ثم يشغّل التدفئة أو لا","يعرّف راسل ونورفيغ (1995) الذكاء الاصطناعي كله بأنه دراسة الوكلاء","يتلقّى وكيل الذكاء الاصطناعي الحديث هدفًا، لا مجرّد سؤال"],"illus":"thermostat","notes":"تعريف ينبغي أن يدوّنه الطلبة. الفرق عن وكيل المحادثة التقليدي: لم نعد نطلب «أجب»، بل نطلب «افعل». مثال: «ابحث عن ثلاثة مقالات حول كاتب ياسين، واقرأها، وأعدّ لي بطاقة عنها»."},{"type":"schema","titre":"حلقة الوكيل","illus":"boucle","points":["الهدف: ما يطلبه المستخدم","التفكير: يخطّط النموذج للخطوة التالية","التصرّف: يستعمل أداة (بحث، حساب، ملف، متصفّح)","الملاحظة: يقرأ النتيجة، ثم يعيد الكرّة حتى بلوغ الهدف"],"notes":"اجعلوا الطلبة يتتبّعون الحلقة المتحرّكة. قد تنجح كل دورة أو تفشل؛ فيصحّح الوكيل خطّته. لهذا ينبغي تقييد الأدوات المتاحة له والتحقّق من أفعاله المهمّة."},{"type":"frise","titre":"من وكلاء المحادثة إلى الوكلاء","evenements":[{"annee":"2022","titre":"ReAct","texte":"يجعل باحثون الاستدلال والأفعال تتناوب داخل نموذج واحد"},{"annee":"2023","titre":"الأدوات","texte":"نموذج GPT-4؛ وتتعلّم النماذج استدعاء الأدوات والبرامج"},{"annee":"2024","titre":"الاستدلال والتصرّف","texte":"نماذج تفكّر قبل أن تجيب؛ ونموذج يقود حاسوبًا؛ وبروتوكول MCP لربط الأدوات"},{"annee":"2025","titre":"وكلاء في العمل","texte":"وكلاء يتصفّحون الويب، ويكتبون البرامج ويصحّحونها"},{"annee":"2026","titre":"في الحياة اليومية","texte":"يستقرّ الوكلاء في البرمجيات المكتبية وبرمجيات البحث والتعليم"}],"notes":"تصف تواريخ 2025 و2026 توجّهات عامة لا منتجات محدّدة، إذ تتغيّر هذه بسرعة. ادعوا الطلبة إلى البحث عن مثال حديث وتقديمه في دقيقتين."},{"type":"deux","titre":"وكيل محادثة أم وكيل؟","gauche":{"titre":"وكيل المحادثة","points":["يجيب عن سؤال","ينتج نصًّا","جولة واحدة","يتولّى الإنسان الباقي"]},"droite":{"titre":"الوكيل","points":["يسعى إلى هدف","يستعمل الأدوات ويتصرّف","عدة خطوات، ويصحّح خطّته","يُشرف الإنسان ويصادق"]},"notes":"الحدّ بينهما متحرّك: فكثير من وكلاء المحادثة يعرفون أصلًا كيف يبحثون في الويب. المعيار الذي ينبغي حفظه: الوكيل ينجز سلسلة من الأفعال في العالم لبلوغ هدف."},{"type":"texte","titre":"المخاطر، والممارسات الجيدة","points":["الهلوسات: قد يتصرّف الوكيل بناءً على معلومة خاطئة","أفعال لا رجعة فيها: الحذف، والإرسال، والدفع؛ فلا بدّ من المصادقة","قد تحرف تعليماتٌ مخفيّة في صفحة ويب الوكيلَ عن مساره","البيانات الشخصية: يُطبَّق القانون الجزائري 18-07","سنة 2024: يعتمد الاتحاد الأوروبي اللائحة الخاصة بالذكاء الاصطناعي (AI Act)"],"illus":"bouclier","notes":"قاعدة بسيطة للطلبة: نحتفظ بزمام أيّ فعل مهمّ، ونتحقّق من المصادر، ونُفصح عن استعمال الذكاء الاصطناعي في أعمالنا. أحيلوا إلى ميثاق استعمال الذكاء الاصطناعي في الدليل."},{"type":"texte","titre":"وماذا عن الجزائر؟","points":["سنة 2021: افتتاح المدرسة الوطنية العليا للذكاء الاصطناعي (ENSIA)","ما تزال النماذج تخدم العربية والدارجة والأمازيغية خدمة أقلّ جودة","المدوّنات المحلية، المبنيّة في العلوم الإنسانية والاجتماعية، إسهام حقيقي","يمكن لمذكّراتكم أن تسهم في ذلك: نصوص، واستبيانات، ومقابلات"],"illus":"carte","notes":"نقطة ارتكاز محلية. اللغات الأقلّ حضورًا على الويب تعالجها النماذج على نحو أسوأ: إنها مسألة بيانات، ومن ثمّ مسألة علوم إنسانية أيضًا. شجّعوا الطلبة على تخيّل مدوّنة يمكنهم تكوينها."},{"type":"section","numero":"9","titre":"خلاصة","periode":"من 1206 إلى 2026","texte":"ثمانية قرون من الأحلام، وسبعون سنة من العلم، وبضع سنوات من الوكلاء.","illus":"frise","notes":"الجزء الأخير: التلخيص، ومشاهدة مقاطع الفيديو، والتحقّق ممّا فُهم."},{"type":"frise","titre":"التواريخ الثمانية التي ينبغي حفظها","evenements":[{"annee":"1843","titre":"لوفلايس","texte":"أول برنامج، لآلة لم تكتمل أبدًا"},{"annee":"1950","titre":"تورينغ","texte":"هل تستطيع الآلات أن تفكّر؟"},{"annee":"1956","titre":"دارتموث","texte":"يحصل الذكاء الاصطناعي على اسمه"},{"annee":"1974","titre":"الشتاء","texte":"الشتاء الأول للذكاء الاصطناعي"},{"annee":"1997","titre":"Deep Blue","texte":"يهزم الحاسوب بطل الشطرنج"},{"annee":"2012","titre":"AlexNet","texte":"ينتصر التعلم العميق"},{"annee":"2017","titre":"المحوِّل","texte":"آلية الانتباه في صميم النماذج اللغوية"},{"annee":"2022","titre":"ChatGPT","texte":"ذكاء اصطناعي توليدي للجميع؛ ثم يأتي الوكلاء"}],"notes":"اجعلوا الطلبة يسردون الخط الزمني معكوسًا، من 2022 إلى 1843. تكفي هذه التواريخ الثمانية لرواية التاريخ كله في الامتحان."},{"type":"deux","titre":"عائلات الذكاء الاصطناعي، في شريحة واحدة","gauche":{"titre":"بحسب الطريقة","points":["الرمزي: قواعد مكتوبة","التعلم الآلي: أمثلة","التعلم العميق: شبكات ذات طبقات عديدة","التعلم المعزَّز: محاولات ومكافآت"]},"droite":{"titre":"بحسب الطموح","points":["الذكاء الاصطناعي الضعيف (الضيّق): مهمة محدّدة","الذكاء الاصطناعي القوي (العام): كل المهام، وهو افتراضي","الوكلاء الحاليون ما زالوا ذكاءً اصطناعيًا ضعيفًا","… لكنهم يزدادون تعدّدًا في القدرات"]},"notes":"يربط هذا الجدول الدرسَ بالفصل 1 من المقرر (الذكاء الاصطناعي الضعيف والقوي، وأنواع التعلم) وبالفصل 3 (أنواع الذكاء الاصطناعي). ويجمع الوكيل الحديث بين عدة عائلات: نموذج عميق، وقواعد أمان، وأحيانًا تعلّم معزَّز."},{"type":"video","titre":"فيديو: التاريخ الكامل للذكاء الاصطناعي (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"فيلم وثائقي بالإنجليزية بعن   /* ---------- Rendu d'une diapositive ---------- */

  /* ---------- Construction, navigation ---------- */
  function construire() {
    var deck = L[langue];
    document.documentElement.lang = langue;
    document.documentElement.dir = langue === "ar" ? "rtl" : "ltr";
    document.title = deck.titre + " · " + UI[langue].marque;
    document.querySelector(".marque").setAttribute("href", langue === "fr" ? "index.html" : langue + "/index.html");
    cadre.innerHTML = deck.diapos.map(function (d, n) { return rendre(d, n, deck.diapos.length); }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.textContent = UI[langue][el.dataset.t]; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-titre]"), function (el) { el.title = UI[langue][el.dataset.titre]; el.setAttribute("aria-label", UI[langue][el.dataset.titre]); });

  // Réduit pas à pas les diapositives dont le contenu déborde sur le pied (textes plus longs selon la langue).

    diapos.forEach(function (d, k) {
      var etait = d.classList.contains("active");

      if (k === n && (!etait || force)) { void d.offsetWidth; }

    animerChat(d);
    preparerVideo(d);
    document.getElementById("compteur").textContent = (n + 1) + " / " + diapos.length;
    document.getElementById("titre-courant").textContent = (donnees.titre || donnees.nom || donnees.question || L[langue].titre).replace(/\*/g, "");
    document.getElementById("notes-texte").innerHTML = riche(donnees.notes || "");
    document.documentElement.style.setProperty("--avance", ((n + 1) / diapos.length).toFixed(4));
    document.querySelector(".barre").style.setProperty("--avance", ((n + 1) / diapos.length).toFixed(4));
    if (location.hash !== "#" + (n + 1)) history.replaceState(null, "", "#" + (n + 1));
    ecrire("lx-lecon1", JSON.stringify({ langue: langue, index: n }));

  function animerChat(d) {
    minuteursChat.forEach(clearTimeout); minuteursChat = [];
    var bulles = d.querySelectorAll(".bulle"), frappe = d.querySelector(".frappe");
    if (!bulles.length) return;
    Array.prototype.forEach.call(bulles, function (b) { b.classList.remove("vue"); });
    var t = 500;
    Array.prototype.forEach.call(bulles, function (b) {
      var machine = b.classList.contains("bulle--m");

        t += 1100;
      }
      minuteursChat.push(setTimeout(function () { if (frappe) frappe.classList.remove("vue"); b.classList.add("vue"); }, t));
      t += machine ? 900 : 1300;
    });
  }
  function preparerVideo(d) {
    var v = d.querySelector(".video[data-youtube]");
    if (!v || v.dataset.pret) return;
    v.dataset.pret = "1";
    var repli = v.querySelector(".video__repli");
    if (!navigator.onLine) { repli.insertAdjacentHTML("afterbegin", "<p>" + esc(UI[langue].video_hors) + "</p>"); return; }
    // Image de la vidéo en fond, si YouTube répond.
    var vignette = new Image();
    vignette.className = "video__vignette"; vignette.alt = "";
    vignette.onerror = function () { vignette.remove(); };
    vignette.src = "https://i.ytimg.com/vi/" + encodeURIComponent(v.dataset.youtube) + "/hqdefault.jpg";
    v.insertBefore(vignette, repli);
    // Le lecteur n'est chargé qu'au clic : la présentation reste légère et rien ne part sans le vouloir.

  function suivant() { aller(index + 1); }
  function precedent() { aller(index - 1); }

  // Mise à l'échelle 16:9
  function echelle() {
    var s = document.getElementById("scene"), w = s.clientWidth - 24, h = s.clientHeight - 24;

  }
  window.addEventListener("resize", echelle);

  /* ---------- Vue d'ensemble, notes, thème, plein écran, impression ---------- */
  function apercu(ouvrir) {

    if (!ouvrir) return;

      var b = document.createElement("button");

      b.appendChild(c);
      b.addEventListener("click", function () { apercu(false); aller(k); });
      g.appendChild(b);

    });

    b.setAttribute("aria-pressed", n.hidden ? "false" : "true");

  }

  }

    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }

  /* ---------- Commandes ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (b) {
      var a = b.dataset.action;
      if (a === "suivant") suivant(); else if (a === "precedent") precedent(); else if (a === "apercu") apercu();
      else if (a === "notes") notes(); else if (a === "theme") theme(); else if (a === "plein") plein(); else if (a === "imprimer") imprimer();
      return;
    }
    var l = e.target.closest("[data-langue]");
    if (l) { langue = l.dataset.langue; construire(); return; }
    // Un clic dans la scène fait avancer (ou reculer, sur le premier quart).
    if (e.target.closest(".scene") && !e.target.closest("a, button, iframe, .video")) {
      var x = e.clientX / window.innerWidth, rtl = langue === "ar";

    if (!document.getElementById("apercu").hidden && k === "Escape") { apercu(false); return; }
    if (k === (rtl ? "ArrowLeft" : "ArrowRight") || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Enter") { e.preventDefault(); suivant(); }
    else if (k === (rtl ? "ArrowRight" : "ArrowLeft") || k === "ArrowUp" || k === "PageUp" || k === "Backspace") { e.preventDefault(); precedent(); }
    else if (k === "Home") aller(0); else if (k === "End") aller(diapos.length - 1);
    else if (k === "o" || k === "O") apercu(); else if (k === "n" || k === "N") notes();
    else if (k === "t" || k === "T") theme(); else if (k === "f" || k === "F") plein(); else if (k === "p" || k === "P") imprimer();
