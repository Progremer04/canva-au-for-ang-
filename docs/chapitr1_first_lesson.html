age piéton ; la conductrice de sécurité ne regardait pas la route","Uber arrête ses essais : on ne confie pas une décision de vie ou de mort à une machine qu'on ne comprend pas"]},{"type":"schema","titre":"Trop apprendre, pas assez apprendre","illus":"ajustement","cas":["sous-apprentissage","juste équilibre","surapprentissage"],"points":["Surapprentissage : par cœur ; tous les médecins vus avaient des lunettes, donc sans lunettes, « pas médecin »","Sous-apprentissage : l'élève survole le livre et oublie les détails importants","Même remède : plus de données, et plus variées : jour et nuit, lieux, vêtements, angles","Tempe, 2018 : un piéton hors du passage ne ressemblait pas aux exemples appris"]},{"type":"frise","titre":"Les machines apprennent aussi le langage et le jeu","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Les mots deviennent des vecteurs : « roi » − « homme » + « femme » ≈ « reine »"},{"annee":"2014","titre":"GAN","texte":"Deux réseaux s'affrontent pour produire des images réalistes"},{"annee":"2015","titre":"Jeux Atari","texte":"Un agent de DeepMind apprend 49 jeux vidéo à partir des pixels et du score"},{"annee":"2016","titre":"AlphaGo","texte":"Le programme de DeepMind bat Lee Sedol au go, 4 parties à 1"}]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo et le coup 37","dates":"Mars 2016, Séoul","role":"DeepMind, cofondé par Demis Hassabis","points":["Deuxième partie : AlphaGo joue un coup qu'aucun humain n'aurait joué","Les commentateurs croient à une erreur ; c'est un coup gagnant","La machine n'imite plus les humains : elle trouve ses propres stratégies"],"illus":"go","encart":"leesedol"},{"type":"frise","titre":"Trois victoires, trois façons de battre l'humain","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"La force du calcul : 200 millions de positions par seconde, des règles écrites par des experts"},{"annee":"2011","titre":"Watson","texte":"Comprendre le contexte : il gagne le jeu Jeopardy!, aux questions pleines de sous-entendus, et un million de dollars"},{"annee":"2016","titre":"AlphaGo","texte":"La créativité : 10¹⁷⁰ positions au go, plus que d'atomes dans l'univers ; le coup 37 surprend ses propres créateurs"},{"annee":"2017","titre":"AlphaGo Zero","texte":"Plus besoin des parties humaines : il apprend en jouant contre lui-même, en quelques jours"},{"annee":"2024","titre":"AlphaFold","texte":"Des jeux à la science : la forme des protéines, et le prix Nobel de chimie"}]},{"type":"section","numero":"7","titre":"Transformers et IA générative","periode":"2017–2022","texte":"Une nouvelle architecture apprend à lire des textes entiers. Les machines se mettent à écrire, dessiner, traduire.","illus":"attention"},{"type":"deux","titre":"Du classement à la création","gauche":{"titre":"IA qui classe (hier)","points":["Elle filtre, juge, range le monde existant","Question : « Cette image est-elle un chat ? »","Réseaux convolutifs, filtres anti-spam, lecture de chèques","Elle répond par une étiquette"]},"droite":{"titre":"IA qui génère (aujourd'hui)","points":["Elle apprend les motifs des données pour produire du neuf","Demande : « Dessine un chat à la manière de Picasso »","2014 : les GAN, un faussaire et un détective qui s'entraînent l'un l'autre","Elle imite des styles ; en inventer un vraiment nouveau reste discuté"]}},{"type":"schema","titre":"« Attention Is All You Need »","annee":"2017","illus":"attention","points":["Huit chercheurs de Google proposent le Transformer","Le mécanisme d'attention relie chaque mot à tous les autres","Dans « L'étudiante ouvrit le livre car elle… », « elle » regarde « étudiante »","Tous les grands modèles de langue actuels en descendent"]},{"type":"frise","titre":"De BERT à ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google : un modèle qui comprend le contexte d'un mot"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI : des textes si fluides qu'on hésite à le publier"},{"annee":"2020","titre":"GPT-3","texte":"175 milliards de paramètres ; AlphaFold 2 résout la forme des protéines"},{"annee":"2021","titre":"DALL·E","texte":"Une image dessinée à partir d'une phrase"},{"annee":"2022","titre":"ChatGPT","texte":"30 novembre : l'IA générative arrive dans le grand public"}]},{"type":"frise","titre":"Vers le multimodal : voir, lire, parler","evenements":[{"annee":"2014","titre":"Légendes","texte":"Un réseau qui voit et un réseau qui écrit, collés ensemble, décrivent une photo"},{"annee":"2021","titre":"CLIP","texte":"400 millions de paires image-texte : images et mots dans le même espace"},{"annee":"2022","titre":"Diffusion","texte":"DALL·E 2, Stable Diffusion : une image naît d'un bruit qu'on débruite"},{"annee":"2023","titre":"Ponts","texte":"On relie un grand modèle de vision à un grand modèle de langue"},{"annee":"2024","titre":"Natif","texte":"Un seul réseau pour le texte, l'image et la voix : environ un tiers de seconde pour répondre"}]},{"type":"schema","titre":"Du texte aux nombres","illus":"tokens","phrase":"Le chat boit du lait","ids":"412 8093 5871 88 2310","points":["Un ordinateur ne connaît que des nombres","Le texte est découpé en morceaux : les **tokens**","Chaque token reçoit un numéro, puis une longue liste de nombres : un **vecteur**","Le modèle ne voit jamais les lettres, seulement ces nombres"]},{"type":"schema","titre":"La carte des sens","illus":"sens","mots":["chat","chien","cheval","livre","roman","lecteur","homme","femme","roi","reine"],"points":["Chaque vecteur est une adresse sur une immense carte des sens","Les mots qui ont les mêmes voisins se rapprochent : « chat », « chien »","Le modèle l'apprend seul, en devinant des mots cachés dans des milliards de phrases","La carte garde des relations : de « homme » à « femme » comme de « roi » à « reine »"]},{"type":"schema","titre":"Le contexte donne le sens","illus":"contexte","phrase1":"la souris mange le fromage","phrase2":"je clique avec la souris","liens":[[1,4],[4,1]],"points":["Un même mot peut avoir plusieurs sens : « souris »","L'**attention** relie chaque mot à ses voisins","Avec « fromage », la souris est l'animal ; avec « clique », c'est l'objet","Le vecteur du mot est recalculé selon son contexte"]},{"type":"schema","titre":"Comment « écrit » un modèle de langue","illus":"motsuivant","points":["Il découpe le texte en morceaux, les tokens","Il calcule la probabilité de chaque token suivant","Il en choisit un, l'ajoute au texte, et recommence","Des humains notent ensuite ses réponses pour l'affiner"],"debut":"Le chat boit du","suites":["lait","café","thé","jus"]},{"type":"chat","titre":"Un dialogue avec un modèle de langue","annee":"2022","legende":"Exemple fictif, écrit pour la classe","echanges":[{"qui":"h","texte":"Explique le chaînage avant à un étudiant de littérature."},{"qui":"m","texte":"Imaginez un détective : il part des indices qu'il connaît et applique ses règles une à une, jusqu'à trouver le coupable."},{"qui":"h","texte":"Donne-moi une référence pour citer ça dans mon mémoire."},{"qui":"m","texte":"Attention : vérifiez toujours une référence dans une bibliothèque. Je peux me tromper ou en inventer."}]},{"type":"section","numero":"8","titre":"L'ère des agents","periode":"2023–2026","texte":"Le modèle de langue ne se contente plus de répondre : il planifie, utilise des outils et agit.","illus":"agent"},{"type":"texte","titre":"Qu'est-ce qu'un agent ?","points":["Un agent perçoit son environnement et agit sur lui pour atteindre un but","Un thermostat est un agent très simple : il mesure, puis chauffe ou non","Russell et Norvig (1995) définissent toute l'IA comme l'étude des agents","Un agent d'IA moderne reçoit un objectif, pas seulement une question"],"illus":"thermostat"},{"type":"schema","titre":"La boucle d'un agent","illus":"boucle","points":["Objectif : ce que l'utilisateur demande","Réfléchir : le modèle planifie l'étape suivante","Agir : il utilise un outil (recherche, calcul, fichier, navigateur)","Observer : il lit le résultat, puis recommence jusqu'au but"]},{"type":"frise","titre":"Des agents conversationnels aux agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Des chercheurs font alterner raisonnement et actions dans un même modèle"},{"annee":"2023","titre":"Outils","texte":"GPT-4 ; les modèles apprennent à appeler des outils et des programmes"},{"annee":"2024","titre":"Raisonner, agir","texte":"Modèles qui réfléchissent avant de répondre ; un modèle pilote un ordinateur ; protocole MCP pour brancher des outils"},{"annee":"2025","titre":"Agents au travail","texte":"Agents qui naviguent sur le Web, écrivent et corrigent des programmes"},{"annee":"2026","titre":"Au quotidien","texte":"Les agents s'installent dans les logiciels de bureau, de recherche et d'enseignement"}]},{"type":"deux","titre":"Agent conversationnel ou agent ?","gauche":{"titre":"Agent conversationnel","points":["Répond à une question","Produit du texte","Un seul tour","L'humain fait le reste"]},"droite":{"titre":"Agent","points":["Poursuit un objectif","Utilise des outils et agit","Plusieurs étapes, il corrige son plan","L'humain supervise et valide"]}},{"type":"texte","titre":"Les risques, et les bonnes pratiques","points":["Hallucinations : un agent peut agir sur une information fausse","Actions irréversibles : effacer, envoyer, payer ; il faut valider","Consignes cachées dans une page Web peuvent détourner un agent","Données personnelles : la loi algérienne 18-07 s'applique","2024 : l'Union européenne adopte le règlement sur l'IA (AI Act)"],"illus":"bouclier"},{"type":"texte","titre":"L'échelle cassée des débutants","illus":"echelle","points":["On devient expert en commençant par les tâches simples : l'apprenti de l'atelier","L'IA fait ces tâches presque gratuitement : les premiers barreaux de l'échelle disparaissent","États-Unis : près de 20 % d'emplois en moins pour les développeurs de 22 à 25 ans","La révolution industrielle a pris un à deux siècles ; celle-ci, trois ou quatre ans"]},{"type":"texte","titre":"La vraie question : qui donne le pouvoir à la machine ?","illus":"balance","points":["Le modèle qui fait vos devoirs de maths décide aussi d'un crédit, d'un achat en bourse, d'une cible à la guerre","La question n'est plus « la machine est-elle intelligente ? »","Qui lui a donné cette autorité ? Qui l'a testée ? Qui répond quand elle se trompe ?","Comprendre le tour ne rend pas le magicien moins habile : cela évite d'être dupe"]},{"type":"texte","titre":"Et en Algérie ?","points":["2021 : ouverture de l'École nationale supérieure d'intelligence artificielle (ENSIA)","L'arabe, la darja et le tamazight restent moins bien servis par les modèles","Des corpus locaux, construits en SHS, sont une vraie contribution","Vos mémoires peuvent y participer : textes, enquêtes, entretiens"],"illus":"carte"},{"type":"section","numero":"9","titre":"Synthèse","periode":"De 1206 à 2026","texte":"Huit siècles de rêves, soixante-dix ans de science, quelques années d'agents.","illus":"frise"},{"type":"frise","titre":"Les huit dates à retenir","evenements":[{"annee":"1843","titre":"Lovelace","texte":"Premier programme, pour une machine jamais achevée"},{"annee":"1950","titre":"Turing","texte":"Les machines peuvent-elles penser ?"},{"annee":"1956","titre":"Dartmouth","texte":"L'IA reçoit son nom"},{"annee":"1974","titre":"Hiver","texte":"Premier hiver de l'IA"},{"annee":"1997","titre":"Deep Blue","texte":"L'ordinateur bat le champion d'échecs"},{"annee":"2012","titre":"AlexNet","texte":"L'apprentissage profond l'emporte"},{"annee":"2017","titre":"Transformer","texte":"L'attention au cœur des modèles de langue"},{"annee":"2022","titre":"ChatGPT","texte":"L'IA générative pour tous ; puis viennent les agents"}]},{"type":"deux","titre":"Les familles d'IA, sur une seule diapositive","gauche":{"titre":"Selon la méthode","points":["Symbolique : des règles écrites","Apprentissage automatique : des exemples","Apprentissage profond : des réseaux à nombreuses couches","Renforcement : des essais et des récompenses"]},"droite":{"titre":"Selon l'ambition","points":["IA faible (étroite) : une tâche précise","IA forte (générale) : toutes les tâches, hypothétique","Les agents actuels restent des IA faibles","… mais de plus en plus polyvalentes"]}},{"type":"texte","titre":"Quatre leçons de 90 ans d'IA","illus":"saisons","courbes":["attentes","puissance de calcul"],"points":["Le danger n'est pas l'échec, mais les attentes démesurées : c'est ce qui a causé les deux hivers","Les vieilles idées reviennent avec les données et le calcul : le perceptron de 1958 vit dans ChatGPT","Réussir un test n'est pas comprendre : généraliser au monde réel reste le plus difficile","Printemps éternel, ou nouvel hiver ? Jugez sur les résultats, pas sur les promesses"]},{"type":"video","titre":"Vidéo : l'histoire complète de l'IA (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"« The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence », documentaire en anglais, sur YouTube"},{"type":"video","titre":"Vidéo : cent ans d'intelligence artificielle","youtube":"mSd9nmPM7Vg","legende":"« The Entire History of Artificial Intelligence (Last 100 Years) », documentaire en anglais, sur YouTube"},{"type":"quiz","question":"En quelle année l'expression « intelligence artificielle » s'impose-t-elle, avec l'atelier de Dartmouth ?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"L'expression apparaît dans la proposition de 1955 et s'impose avec l'atelier de l'été 1956."},{"type":"quiz","question":"Pourquoi parle-t-on d'« hivers » de l'IA ?","choix":["Les ordinateurs chauffaient trop","La déception a fait chuter les crédits et l'intérêt","Les recherches se faisaient l'hiver","Les machines ont été interdites"],"reponse":1,"explication":"Après des promesses démesurées, les résultats ont déçu : les financements ont été coupés (1974–1980, puis 1987–1993)."},{"type":"quiz","question":"Qu'est-ce qui distingue un agent d'un simple agent conversationnel ?","choix":["Il écrit plus vite","Il poursuit un objectif en agissant avec des outils","Il ne fait jamais d'erreur","Il fonctionne sans électricité"],"reponse":1,"explication":"Un agent enchaîne des actions (chercher, calculer, écrire un fichier…) et observe les résultats pour atteindre un but."},{"type":"quiz","question":"ELIZA (1966) comprenait-elle ce qu'on lui disait ?","choix":["Oui, comme un psychologue","Non : elle transformait les phrases avec des règles","Oui, grâce à l'apprentissage profond","On ne le sait pas"],"reponse":1,"explication":"ELIZA repérait des mots-clés et renvoyait des phrases types. Croire qu'elle comprenait, c'est l'« effet ELIZA »."},{"type":"quiz","question":"Pourquoi le perceptron simple ne peut-il pas apprendre la « porte à deux clés » (le XOR) ?","choix":["Il n'a pas assez de mémoire","Une seule ligne droite ne sépare pas les deux groupes","Le XOR n'existe pas en mathématiques","Il lui faut une caméra plus précise"],"reponse":1,"explication":"Le perceptron trace une seule frontière droite ; le XOR demande deux règles l'une sur l'autre, donc au moins deux couches, entraînées par rétropropagation."},{"type":"quiz","question":"Un modèle n'a vu que des médecins portant des lunettes ; face à un médecin sans lunettes, il répond « pas médecin ». Quel est ce défaut ?","choix":["Le sous-apprentissage","Le surapprentissage","L'hallucination","Le biais d'activation"],"reponse":1,"explication":"Il a appris par cœur un détail de ses exemples au lieu de la règle générale : c'est le surapprentissage. Remède : des exemples plus nombreux et plus variés."},{"type":"fin","titre":"À retenir","points":["Le rêve est ancien ; l'IA comme science naît entre 1950 et 1956","Deux voies alternent : écrire les règles ou apprendre des données","Un réseau apprend en pondérant des indices ; trop ou pas assez apprendre mène à l'erreur","Les hivers rappellent de juger sur les résultats, pas sur les promesses","Un agent perçoit, planifie et agit : de Shakey (1966) aux agents de 2025","Vérifier, garder la main, déclarer son usage : les trois règles d'or"],"texte":"Travail personnel : choisissez une date de la frise et écrivez dix lignes sur ce qu'elle a changé, en citant une source vérifiée."}]},"en":{"langue":"en","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","diapos":[{"type":"couverture","surtitre":"Artificial intelligence · Chapter 1 · First lesson","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","illus":"agent"},{"type":"plan","titre":"This lesson's journey","points":["The dream of machines (from Antiquity to 1945)","The birth of AI (1950–1956)","The golden age, then the first winter (1956–1980)","Expert systems (1980–1993)","Learning from data (1990–2016)","The deep learning revolution (2006–2016)","Transformers and generative AI (2017–2022)","The age of agents (2023–2026)"]},{"type":"texte","titre":"And you, what do you call “intelligence”?","points":["Understanding a sentence, translating a poem","Recognizing one face among a thousand","Winning at chess, solving a problem","Learning from one's mistakes","Acting alone to reach a goal"],"illus":"cerveau"},{"type":"texte","titre":"“The last invention”: why now?","illus":"adoption","courbes":["computer","phone","Internet","generative AI"],"points":["4 billion generative AI users expected by 2026: half of humanity, in three years","Faster than the personal computer, the mobile phone and the Internet","88% of the organizations surveyed say they already use it","About 300 billion dollars invested in 2025, perhaps 1 trillion soon"]},{"type":"citation","texte":"The first ultraintelligent machine is the last invention that man need ever make, provided that the machine is docile enough to tell us how to keep it under control.","auteur":"Irving John Good","source":"“Speculations Concerning the First Ultraintelligent Machine”, 1965"},{"type":"schema","titre":"Artificial: it seems intelligent","illus":"niveaux","niveaux":["narrow","general","super"],"points":["“Artificial”: an imitated intelligence, not a manufactured one; the machine appears to understand","Narrow AI: excellent at one task, like Google Translate, Google Maps or a chess program; it exists","General AI: as flexible as a human, from one task to another; still theoretical","Superintelligence: stronger than us, perhaps self-aware; unknown"]},{"type":"texte","titre":"A new infrastructure… and a new geopolitics","illus":"couches","couches":["algorithms: the engine","compute: the chips","data: the fuel"],"points":["Data is the fuel, chips the compute, algorithms the engine","Large data centers are counted in gigawatts: as much as a whole region","The United States limits exports of NVIDIA chips; China answers with rare metals","Data sovereignty: Saudi Arabia keeps banking and hospital data at home"]},{"type":"section","numero":"1","titre":"The dream of machines","periode":"From Antiquity to 1945","texte":"Long before computers, humans imagined and built machines that imitate life, then machines that calculate.","illus":"engrenages"},{"type":"texte","titre":"Automata in myths and workshops","points":["Greek myth: Talos, a bronze giant who guards Crete","1st century: Hero of Alexandria describes theater automata","1739: Vaucanson's duck flaps its wings and “digests”","Around 1770: the Jaquet-Droz Writer traces letters with a quill"],"illus":"engrenages"},{"type":"texte","titre":"Al-Jazari, the engineer of ingenious machines","annee":"1206","points":["Engineer at the Artuqid court, in Upper Mesopotamia","In 1206, writes *The Book of Knowledge of Ingenious Mechanical Devices*","Describes some fifty machines: clocks, pumps, automata","His elephant clock marks the hours with automata"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"Machines that calculate","points":["1642: Blaise Pascal builds the Pascaline, which adds","1673: Leibniz presents a machine that multiplies","1837: Charles Babbage designs the Analytical Engine, programmable with punched cards","The Analytical Engine would never be completed in his lifetime"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathematician, the first programmer","points":["1843: her notes on Babbage's Analytical Engine","In them, she writes an algorithm to compute Bernoulli numbers","She imagines that the machine could compose music"],"citation":"The Analytical Engine has no pretensions whatever to originate anything.","source":"Ada Lovelace, notes of 1843"},{"type":"texte","titre":"When thought becomes calculation","points":["1854: George Boole reduces reasoning to calculations on true and false","1936: Alan Turing describes an abstract machine capable of any calculation","A tape, a read head, a table of rules: the “Turing machine”","Every computer today is, in principle, a Turing machine"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathematician, father of theoretical computer science","points":["1936: the universal machine","1939–1945: helps break the Enigma code at Bletchley Park","1950: “Computing Machinery and Intelligence”, the founding paper"],"citation":"I propose to consider the question, ‘Can machines think?’","source":"Alan Turing, Mind, 1950"},{"type":"schema","titre":"The formal neuron","annee":"1943","illus":"neurone","points":["Warren McCulloch and Walter Pitts model a neuron as a calculation","It adds up input signals and “fires” above a threshold","It is the ancestor of all today's neural networks"]},{"type":"texte","titre":"The first computers","points":["1945: ENIAC, 30 tonnes, calculates ballistic trajectories","1948: Claude Shannon founds information theory","The bit becomes the unit of all information: text, image, sound","The machines finally exist; now they must be made “intelligent”"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"2","titre":"The birth of AI","periode":"1950–1956","texte":"In six years, a question becomes a research program, then a discipline with a name.","illus":"ampoule"},{"type":"schema","titre":"The imitation game","annee":"1950","illus":"imitation","points":["A judge converses in writing with two hidden interlocutors","One is a human, the other a machine","If the judge cannot tell them apart, the machine “passes”"]},{"type":"citation","texte":"Every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposal for the Dartmouth workshop, August 31, 1955"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Computer scientist who gave AI its name","points":["Summer 1956: organizes the Dartmouth workshop, the birth certificate of AI","1958: creates the Lisp language, long the language of AI","With him: Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"encart":"dartmouth"},{"type":"texte","titre":"The first “intelligent” program","annee":"1956","points":["The Logic Theorist by Allen Newell, Herbert Simon and Cliff Shaw","It proves 38 of the first 52 theorems of *Principia Mathematica*","For one of them, a more elegant proof than the authors' own","A key idea: searching among possibilities with rules"],"illus":"arbre"},{"type":"section","numero":"3","titre":"The golden age, then the first winter","periode":"1956–1980","texte":"Spectacular successes, excessive promises, then disappointment and the end of funding.","illus":"courbe"},{"type":"schema","titre":"Rosenblatt's perceptron","annee":"1958","illus":"perceptron","points":["Frank Rosenblatt builds a machine that learns to recognize shapes","It adjusts its own weights after each error","The press announces machines that “think”: enthusiasm runs wild"],"personne":"perceptron"},{"type":"schema","titre":"1969: the XOR wall","annee":"1969","illus":"xor","points":["The perceptron draws a single straight line: “yes” on one side, “no” on the other","The two-key door: it opens with your key, or with your spouse's, but not with both at the same time","No straight line separates these cases: this is the “exclusive OR” (XOR) problem","Minsky and Papert show it in *Perceptrons*: the enthusiasm falls, and so does the funding"]},{"type":"texte","titre":"Learning without being programmed","annee":"1959","points":["Arthur Samuel writes a checkers program that improves by playing","He coins the term “machine learning”","The program ends up beating its own creator","Two paths emerge: writing the rules, or having them learned"],"illus":"dames"},{"type":"chat","titre":"ELIZA, the first artificial psychotherapist","annee":"1966","legende":"From Joseph Weizenbaum's 1966 paper","echanges":[{"qui":"h","texte":"Men are all alike."},{"qui":"m","texte":"IN WHAT WAY"},{"qui":"h","texte":"They're always bugging us about something or other."},{"qui":"m","texte":"CAN YOU THINK OF A SPECIFIC EXAMPLE"},{"qui":"h","texte":"Well, my boyfriend made me come here."},{"qui":"m","texte":"YOUR BOYFRIEND MADE YOU COME HERE"}]},{"type":"texte","titre":"Shakey, the first robot that reasons","annee":"1966–1972","points":["Built at the Stanford Research Institute (SRI)","It perceives its environment with a camera","It plans a sequence of actions to reach a goal","The A* algorithm, still used to compute routes, was created for it"],"personne":"shakey","illus":"robot"},{"type":"citation","texte":"Machines will be capable, within twenty years, of doing any work a man can do.","auteur":"Herbert Simon","source":"1965"},{"type":"schema","titre":"The first AI winter","annee":"1974–1980","illus":"courbe","points":["1969: Minsky and Papert show the limits of the single-layer perceptron","1973: the Lighthill report, in the United Kingdom, finds the results disappointing","Computations explode as soon as problems grow","Public funding is cut: this is the “winter”"]},{"type":"section","numero":"4","titre":"Expert systems","periode":"1980–1993","texte":"AI comes back by turning experts' knowledge into rules. It enters companies, then falls back.","illus":"regles"},{"type":"schema","titre":"Turning knowledge into rules","illus":"regles","points":["A fact base, a base of IF … THEN … rules, an inference engine","1970s: MYCIN, at Stanford, diagnoses blood infections","1980: XCON configures computers for the company DEC","Companies invest: AI becomes an industry"]},{"type":"texte","titre":"The return of neural networks","annee":"1986","points":["1982: Japan launches the Fifth Generation Computer project","1986: Rumelhart, Hinton and Williams popularize backpropagation","Networks with several layers can finally be trained","But computers and data are still lacking"],"illus":"reseau"},{"type":"schema","titre":"Stack the layers, send the error back","annee":"1986","illus":"retro","points":["Several layers of perceptrons on top of each other, like the sheets of a lasagna","Each layer checks one condition, then passes on to the next","When the answer is wrong, the error is sent back layer by layer: which weight contributed most?","Those weights are corrected, and it starts again: this is backpropagation"]},{"type":"texte","titre":"The second winter","annee":"1987–1993","points":["1987: the market for specialized Lisp machines collapses","Expert systems are expensive and fail outside their domain","Each new rule contradicts others: they become unmanageable","The word “AI” falls out of favor: people say “advanced computing” instead"],"illus":"flocon"},{"type":"section","numero":"5","titre":"Learning from data","periode":"1990–2016","texte":"Instead of writing the rules, we give examples. With the Internet, the examples run into the billions.","illus":"donnees"},{"type":"deux","titre":"Two ways to build an AI","gauche":{"titre":"Symbolic AI","points":["An expert writes the rules","Explainable: the reasoning can be followed","Brittle outside its domain","Example: an expert system"]},"droite":{"titre":"Machine learning","points":["The machine draws patterns from examples","Often hard to explain","Robust, if there is plenty of data","Example: a spam filter"]}},{"type":"portrait","personne":"deepblue","nom":"Deep Blue versus Kasparov","dates":"May 1997","role":"IBM's computer beats the world chess champion","points":["Wins 3½ to 2½ over six games, in New York","About 200 million positions evaluated per second","Computing power, not learning: this is still search-based AI"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"Learning spreads everywhere","evenements":[{"annee":"1989","titre":"Reading digits","texte":"Yann LeCun trains a convolutional network to read postal codes"},{"annee":"1992","titre":"TD-Gammon","texte":"A program learns backgammon by playing against itself"},{"annee":"1998","titre":"Checks","texte":"LeCun's networks read bank checks in the United States"},{"annee":"2002","titre":"Roomba","texte":"A robot vacuum cleaner enters people's homes"},{"annee":"2005","titre":"Stanley","texte":"A driverless car wins the DARPA desert race"},{"annee":"2011","titre":"Watson, Siri","texte":"Watson wins the TV quiz show Jeopardy!; Siri arrives on phones"}]},{"type":"section","numero":"6","titre":"The deep learning revolution","periode":"2006–2016","texte":"Neural networks with very many layers, trained on huge amounts of data with graphics processors.","illus":"reseau"},{"type":"schema","titre":"2012: why now? Three gears","annee":"2006–2012","illus":"engrenages","points":["Algorithms: backpropagation (1986) and, in 2006, Hinton trains networks layer by layer","Data: the Internet and ImageNet, millions of labeled images, AI's “gym”","Compute: video game graphics cards (NVIDIA CUDA, 2007), then Google's TPUs (2016)","2012: AlexNet, trained on two graphics cards, crushes the ImageNet contest"]},{"type":"schema","titre":"A deep network, layer by layer","illus":"reseau","points":["The first layers detect simple features: edges, blobs","The next layers combine them: shapes, textures, parts","The last ones recognize whole objects: “cat”, “car”","Each layer learns by itself what to detect"]},{"type":"schema","titre":"The guessing game: what is their job?","illus":"devinette","indices":["helmet: 90%","vest: 70%","boots: 60%"],"resultat":"engineer","points":["One team looks at the head, another at the clothes, a third at the shoes","Each gives a probability: helmet 90%, vest 70%, safety boots 60%","Each clue has a weight: the helmet counts more than the boots","Weighted average: (0.9 × 100 + 0.7 × 70 + 0.6 × 50) ÷ 220 ≈ 77% “engineer”"]},{"type":"schema","titre":"Anatomy of a decision: weights, bias, activation","illus":"decision","etapes":["inputs × weights","sum + bias","activation"],"points":["Each piece of information is multiplied by its weight: its importance for the decision","Add them up, then add a bias: a setting that stops one clue from deciding everything","The activation turns the total into a nuanced percentage, not a plain yes/no","A large model lines up billions of these small calculations"]},{"type":"schema","titre":"Three ways to learn","illus":"apprendre","types":["supervised","unsupervised","reinforcement"],"points":["Supervised: a teacher gives the right answer after each mistake; that is how LeNet reads checks (1989)","Unsupervised: the machine explores mountains of data on its own; in 2012, Google Brain discovers the “cat” in 10 million YouTube images","Reinforcement: it is only told “won” or “lost”; AlphaGo invents its own strategies","Today's large models often combine all three"]},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li and ImageNet","dates":"2009–2012","role":"An image database that changes everything","points":["2009: ImageNet, over 14 million images labeled by hand","2012: the AlexNet network crushes the image recognition competition","Its error rate falls to 15%, against 26% for the runner-up"],"illus":"imagenet"},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Born in 1947","role":"Pioneer of neural networks","points":["Defends neural networks through both winters","2018: Turing Award with Yoshua Bengio and Yann LeCun","2024: Nobel Prize in Physics with John Hopfield"],"encart":"lecun"},{"type":"texte","titre":"When the machine learns badly: Tempe, 2018","annee":"2018","illus":"uber","points":["18 March 2018, Arizona, at night: an Uber self-driving test car hits Elaine Herzberg, who is crossing while pushing her bicycle","The sensors saw her seconds before; the system hesitated: vehicle, bicycle, “other”?","It had not planned for pedestrians crossing outside a crosswalk; the safety driver was not watching the road","Uber stops its tests: a life-or-death decision is not given to a machine we do not understand"]},{"type":"schema","titre":"Learning too much, learning too little","illus":"ajustement","cas":["underfitting","right balance","overfitting"],"points":["Overfitting: learning by heart; every doctor it saw wore glasses, so no glasses, “not a doctor”","Underfitting: the pupil skims the book and misses the important details","Same remedy: more data, more varied: day, night, places, angles","Tempe, 2018: a pedestrian off the crosswalk matched none of the examples"]},{"type":"frise","titre":"Machines also learn language and games","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Words become vectors: “king” − “man” + “woman” ≈ “queen”"},{"annee":"2014","titre":"GAN","texte":"Two networks compete to produce realistic images"},{"annee":"2015","titre":"Atari games","texte":"A DeepMind agent learns 49 video games from the pixels and the score"},{"annee":"2016","titre":"AlphaGo","texte":"DeepMind's program beats Lee Sedol at Go, 4 games to 1"}]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo and Move 37","dates":"March 2016, Seoul","role":"DeepMind, co-founded by Demis Hassabis","points":["Game two: AlphaGo plays a move no human would have played","Commentators think it is a mistake; it is a winning move","The machine no longer imitates humans: it finds its own strategies"],"illus":"go","encart":"leesedol"},{"type":"frise","titre":"Three victories, three ways to beat humans","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"The power of calculation: 200 million positions per second, rules written by experts"},{"annee":"2011","titre":"Watson","texte":"Understanding context: it wins Jeopardy!, a quiz full of wordplay, and a million dollars"},{"annee":"2016","titre":"AlphaGo","texte":"Creativity: 10¹⁷⁰ positions in go, more than atoms in the universe; move 37 surprises its own makers"},{"annee":"2017","titre":"AlphaGo Zero","texte":"No more need for human games: it learns by playing against itself, in a few days"},{"annee":"2024","titre":"AlphaFold","texte":"From games to science: the shape of proteins, and the Nobel Prize in Chemistry"}]},{"type":"section","numero":"7","titre":"Transformers and generative AI","periode":"2017–2022","texte":"A new architecture learns to read whole texts. Machines start to write, draw and translate.","illus":"attention"},{"type":"deux","titre":"From sorting to creating","gauche":{"titre":"AI that sorts (yesterday)","points":["It filters, judges, files the existing world","Question: “Is this image a cat?”","Convolutional networks, spam filters, check reading","It answers with a label"]},"droite":{"titre":"AI that generates (today)","points":["It learns the patterns of the data to produce something new","Request: “Draw a cat in the style of Picasso”","2014: GANs, a forger and a detective who train each other","It imitates styles; inventing a truly new one is still debated"]}},{"type":"schema","titre":"“Attention Is All You Need”","annee":"2017","illus":"attention","points":["Eight Google researchers propose the Transformer","The attention mechanism links each word to all the others","In “The student opened the book because she…”, “she” looks at “student”","All of today's large language models descend from it"]},{"type":"frise","titre":"From BERT to ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google: a model that understands a word's context"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI: text so fluent that the company hesitates to release it"},{"annee":"2020","titre":"GPT-3","texte":"175 billion parameters; AlphaFold 2 solves the shape of proteins"},{"annee":"2021","titre":"DALL·E","texte":"An image drawn from a sentence"},{"annee":"2022","titre":"ChatGPT","texte":"November 30: generative AI reaches the general public"}]},{"type":"frise","titre":"Toward multimodal AI: seeing, reading, speaking","evenements":[{"annee":"2014","titre":"Captions","texte":"A network that sees and a network that writes, stuck together, describe a photo"},{"annee":"2021","titre":"CLIP","texte":"400 million image-text pairs: pictures and words in the same space"},{"annee":"2022","titre":"Diffusion","texte":"DALL·E 2, Stable Diffusion: an image is born from noise being removed"},{"annee":"2023","titre":"Bridges","texte":"A large vision model is linked to a large language model"},{"annee":"2024","titre":"Native","texte":"A single network for text, image and voice: about a third of a second to answer"}]},{"type":"schema","titre":"From text to numbers","illus":"tokens","phrase":"The cat drinks warm milk","ids":"412 8093 5871 88 2310","points":["A computer only knows numbers","The text is cut into pieces: **tokens**","Each token gets a number, then a long list of numbers: a **vector**","The model never sees letters, only these numbers"]},{"type":"schema","titre":"The map of meanings","illus":"sens","mots":["cat","dog","horse","book","novel","reader","man","woman","king","queen"],"points":["Each vector is an address on a huge map of meanings","Words with the same neighbors end up close: “cat”, “dog”","The model learns this by itself, guessing hidden words in billions of sentences","The map keeps relations: from “man” to “woman” as from “king” to “queen”"]},{"type":"schema","titre":"Context gives meaning","illus":"contexte","phrase1":"the mouse eats the cheese","phrase2":"I click with the mouse","liens":[[1,4],[4,1]],"points":["The same word can have several meanings: “mouse”","**Attention** links each word to its neighbors","With “cheese”, the mouse is the animal; with “click”, it is the device","The word's vector is recalculated from its context"]},{"type":"schema","titre":"How a language model “writes”","illus":"motsuivant","points":["It splits the text into pieces, the tokens","It calculates the probability of each possible next token","It picks one, adds it to the text, and starts again","Humans then rate its answers to refine it"],"debut":"The cat drinks some","suites":["milk","water","tea","juice"]},{"type":"chat","titre":"A dialogue with a language model","annee":"2022","legende":"Fictional example, written for the class","echanges":[{"qui":"h","texte":"Explain forward chaining to a literature student."},{"qui":"m","texte":"Imagine a detective: he starts from the clues he knows and applies his rules one by one, until he finds the culprit."},{"qui":"h","texte":"Give me a reference so I can cite this in my thesis."},{"qui":"m","texte":"Careful: always check a reference in a library. I can make mistakes or invent references."}]},{"type":"section","numero":"8","titre":"The age of agents","periode":"2023–2026","texte":"The language model no longer just answers: it plans, uses tools and acts.","illus":"agent"},{"type":"texte","titre":"What is an agent?","points":["An agent perceives its environment and acts on it to reach a goal","A thermostat is a very simple agent: it measures, then heats or not","Russell and Norvig (1995) define all of AI as the study of agents","A modern AI agent receives a goal, not just a question"],"illus":"thermostat"},{"type":"schema","titre":"The agent loop","illus":"boucle","points":["Goal: what the user asks for","Think: the model plans the next step","Act: it uses a tool (search, calculation, file, browser)","Observe: it reads the result, then starts again until the goal is reached"]},{"type":"frise","titre":"From chatbots to agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Researchers make a single model alternate between reasoning and actions"},{"annee":"2023","titre":"Tools","texte":"GPT-4; models learn to call tools and programs"},{"annee":"2024","titre":"Reason, act","texte":"Models that think before answering; a model operates a computer; the MCP protocol for connecting tools"},{"annee":"2025","titre":"Agents at work","texte":"Agents that browse the Web, write and fix programs"},{"annee":"2026","titre":"Everyday use","texte":"Agents settle into office, research and teaching software"}]},{"type":"deux","titre":"Chatbot or agent?","gauche":{"titre":"Chatbot","points":["Answers a question","Produces text","A single turn","The human does the rest"]},"droite":{"titre":"Agent","points":["Pursues a goal","Uses tools and acts","Several steps; it corrects its plan","The human supervises and approves"]}},{"type":"texte","titre":"The risks, and good practice","points":["Hallucinations: an agent may act on false information","Irreversible actions: deleting, sending, paying; they must be approved","Instructions hidden in a Web page can hijack an agent","Personal data: Algerian Law 18-07 applies","2024: the European Union adopts the AI Act"],"illus":"bouclier"},{"type":"texte","titre":"The beginners' broken ladder","illus":"echelle","points":["People become experts by starting with simple tasks: the workshop apprentice","AI does these tasks almost for free: the first rungs of the ladder disappear","United States: employment of developers aged 22 to 25 has fallen by nearly 20% since late 2022","The industrial revolution took one to two centuries; this one, three or four years"]},{"type":"texte","titre":"The real question: who gives the machine power?","illus":"balance","points":["The kind of model that does your math homework also decides a loan, a stock purchase, a target in war","The question is no longer “is the machine intelligent?”","Who gave it that authority? Who tested it? Who answers when it gets it wrong?","Knowing the trick takes nothing from the magician: it keeps us from being fooled"]},{"type":"texte","titre":"And in Algeria?","points":["2021: the National Higher School of Artificial Intelligence (ENSIA) opens","Arabic, Darja and Tamazight remain less well served by models","Local corpora, built in the humanities and social sciences, are a real contribution","Your theses can contribute: texts, surveys, interviews"],"illus":"carte"},{"type":"section","numero":"9","titre":"Summary","periode":"From 1206 to 2026","texte":"Eight centuries of dreams, seventy years of science, a few years of agents.","illus":"frise"},{"type":"frise","titre":"The eight dates to remember","evenements":[{"annee":"1843","titre":"Lovelace","texte":"The first program, for a machine never completed"},{"annee":"1950","titre":"Turing","texte":"Can machines think?"},{"annee":"1956","titre":"Dartmouth","texte":"AI gets its name"},{"annee":"1974","titre":"Winter","texte":"The first AI winter"},{"annee":"1997","titre":"Deep Blue","texte":"A computer beats the chess champion"},{"annee":"2012","titre":"AlexNet","texte":"Deep learning wins out"},{"annee":"2017","titre":"Transformer","texte":"Attention at the heart of language models"},{"annee":"2022","titre":"ChatGPT","texte":"Generative AI for everyone; then come the agents"}]},{"type":"deux","titre":"The families of AI, on a single slide","gauche":{"titre":"By method","points":["Symbolic: written rules","Machine learning: examples","Deep learning: networks with many layers","Reinforcement: trials and rewards"]},"droite":{"titre":"By ambition","points":["Weak (narrow) AI: one specific task","Strong (general) AI: every task, hypothetical","Today's agents are still weak AI","… but increasingly versatile"]}},{"type":"texte","titre":"Four lessons from 90 years of AI","illus":"saisons","courbes":["expectations","computing power"],"points":["The danger is not failure but inflated expectations: they caused the two winters","Old ideas return when data and compute arrive: the 1958 perceptron lives on in ChatGPT","Passing a test is not understanding: the real world is the hard part","Eternal spring, or a new winter? Judge by results, not by promises"]},{"type":"video","titre":"Video: the complete history of AI (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"“The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence”, a documentary in English, on YouTube"},{"type":"video","titre":"Video: a hundred years of artificial intelligence","youtube":"mSd9nmPM7Vg","legende":"“The Entire History of Artificial Intelligence (Last 100 Years)”, a documentary in English, on YouTube"},{"type":"quiz","question":"In what year did the term “artificial intelligence” take hold, with the Dartmouth workshop?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"The term appears in the 1955 proposal and took hold with the workshop in the summer of 1956."},{"type":"quiz","question":"Why do we speak of AI “winters”?","choix":["Computers overheated","Disappointment made funding and interest fall","Research was done in winter","Machines were banned"],"reponse":1,"explication":"After excessive promises, the results were disappointing: funding was cut (1974–1980, then 1987–1993)."},{"type":"quiz","question":"What distinguishes an agent from a simple chatbot?","choix":["It writes faster","It pursues a goal by acting with tools","It never makes mistakes","It works without electricity"],"reponse":1,"explication":"An agent chains actions (searching, calculating, writing a file…) and observes the results to reach a goal."},{"type":"quiz","question":"Did ELIZA (1966) understand what was said to it?","choix":["Yes, like a psychologist","No: it transformed sentences with rules","Yes, thanks to deep learning","We do not know"],"reponse":1,"explication":"ELIZA spotted keywords and sent back stock sentences. Believing that it understood is the “ELIZA effect”."},{"type":"quiz","question":"Why can't the simple perceptron learn the “two-key door” (XOR)?","choix":["It does not have enough memory","A single straight line does not separate the two groups","XOR does not exist in mathematics","It needs a more precise camera"],"reponse":1,"explication":"The perceptron draws a single straight border; XOR needs two rules on top of each other, so at least two layers, trained by backpropagation."},{"type":"quiz","question":"A model has only seen doctors wearing glasses; faced with a doctor without glasses, it answers “not a doctor”. What is this flaw?","choix":["Underfitting","Overfitting","Hallucination","Activation bias"],"reponse":1,"explication":"It learned a detail of its examples by heart instead of the general rule: that is overfitting. Remedy: more numerous and more varied examples."},{"type":"fin","titre":"Key takeaways","points":["The dream is old; AI as a science was born between 1950 and 1956","Two paths alternate: writing the rules or learning from data","A network learns by weighting clues; learning too much or too little leads to error","The winters remind us to judge by results, not by promises","An agent perceives, plans and acts: from Shakey (1966) to the agents of 2025","Check, stay in control, declare your use: the three golden rules"],"texte":"Homework: choose a date from the timeline and write ten lines on what it changed, citing a verified source."}]},"ar":{"langue":"ar","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","diapos":[{"type":"couverture","surtitre":"الذكاء الاصطناعي · الفصل 1 · الدرس الأول","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","illus":"agent"},{"type":"plan","titre":"رحلة هذا الدرس","points":["حلم الآلات (من العصور القديمة إلى 1945)","ميلاد الذكاء الاصطناعي (1950–1956)","العصر الذهبي، ثم الشتاء الأول (1956–1980)","الأنظمة الخبيرة (1980–1993)","التعلّم من البيانات (1990–2016)","ثورة التعلم العميق (2006–2016)","المحوِّلات والذكاء الاصطناعي التوليدي (2017–2022)","عصر الوكلاء (2023–2026)"]},{"type":"texte","titre":"وأنتم، ماذا تسمّون «ذكاءً»؟","points":["فهم جملة، وترجمة قصيدة","التعرّف على وجه من بين ألف وجه","الفوز في الشطرنج، وحلّ مشكلة","التعلّم من الأخطاء","التصرّف باستقلال لبلوغ هدف"],"illus":"cerveau"},{"type":"texte","titre":"«الاختراع الأخير»: لماذا الآن؟","illus":"adoption","courbes":["الحاسوب","الهاتف","الإنترنت","الذكاء التوليدي"],"points":["4 مليارات مستخدم للذكاء الاصطناعي التوليدي متوقَّعون سنة 2026: نصف البشرية في ثلاث سنوات","أسرع من انتشار الحاسوب الشخصي والهاتف المحمول والإنترنت","88% من المؤسسات المستجوَبة تقول إنها تستعمله فعلًا","نحو 300 مليار دولار من الاستثمارات سنة 2025، وربما تريليون قريبًا"]},{"type":"citation","texte":"ستكون أول آلة فائقة الذكاء آخرَ اختراع يحتاج الإنسان إلى صنعه، بشرط أن تكون الآلة مطيعة بما يكفي لتخبرنا كيف نُبقيها تحت السيطرة.","auteur":"إيرفينغ جون غود (Irving John Good)","source":"«تأمّلات في أول آلة فائقة الذكاء»، 1965"},{"type":"schema","titre":"اصطناعي: يبدو ذكيًّا","illus":"niveaux","niveaux":["ضيّق","عام","فائق"],"points":["«اصطناعي» لا «صناعي»: ذكاء مُصطنَع يحاكي الذكاء، فتبدو الآلة فاهمة","الذكاء الضيّق: بارع في مهمة واحدة، مثل ترجمة Google وخرائط Google وبرنامج الشطرنج؛ وهو موجود","الذكاء العام: مرن كالإنسان، ينتقل من مهمة إلى أخرى؛ ما زال نظريًّا","الذكاء الفائق: أقوى منّا بمراحل، وربما واعٍ بذاته؛ مجهول"]},{"type":"texte","titre":"بنية تحتية جديدة… وجغرافيا سياسية جديدة","illus":"couches","couches":["الخوارزميات: المحرّك","الحوسبة: الرقائق","البيانات: الوقود"],"points":["البيانات هي الوقود، والرقائق هي قوة الحساب، والخوارزميات هي المحرّك","تُقاس مراكز البيانات الكبرى بالجيغاواط: كاستهلاك منطقة بأك ":"texte","titre":"أول برنامج «ذكي»","annee":"1956","points":["برنامج Logic Theorist لآلن نيويل وهربرت سايمون وكليف شو","يبرهن 38 من المبرهنات الـ52 الأولى في *Principia Mathematica*","ويجد لإحداها برهانًا أكثر أناقة من برهان المؤلِّفَين","فكرة أساسية: البحث بين الإمكانات بواسطة قواعد"],"illus":"arbre"},{"type":"section","numero":"3","titre":"العصر الذهبي، ثم الشتاء الأول","periode":"1956–1980","texte":"نجاحات مذهلة، ووعود مفرطة، ثم خيبة الأمل وتوقّف التمويل.","illus":"courbe"},{"type":"schema","titre":"بيرسبترون روزنبلات","annee":"1958","illus":"perceptron","points":["يبني فرانك روزنبلات آلة تتعلّم التعرّف على الأشكال","تضبط أوزانها بنفسها بعد كل خطأ","تعلن الصحافة عن آلات «تفكّر»: فيجمح الحماس"],"personne":"perceptron"},{"type":"schema","titre":"1969: جدار XOR","annee":"1969","illus":"xor","points":["يرسم البيرسبترون خطًّا مستقيمًا واحدًا: «نعم» من جهة و«لا» من الجهة الأخرى","باب بمفتاحين: يُفتح بمفتاحك أو بمفتاح زوجتك، لكن لا يُفتح إذا استُعمل المفتاحان معًا","لا يفصل أيّ خط مستقيم بين هذه الحالات: إنها مسألة «أو الحصرية» (XOR)","يبيّن مينسكي وبابرت ذلك في كتاب «Perceptrons»: يخبو الحماس ويتوقف التمويل"]},{"type":"texte","titre":"التعلّم من دون برمجة","annee":"1959","points":["يكتب آرثر صامويل برنامجًا للعب الداما يتحسّن باللعب","يبتكر عبارة «machine learning»، أي التعلم الآلي","وينتهي البرنامج إلى هزيمة مبتكره نفسه","يرتسم مساران: كتابة القواعد، أو جعل الآلة تتعلّمها"],"illus":"dames"},{"type":"chat","titre":"إليزا (ELIZA)، أول معالِجة نفسية اصطناعية","annee":"1966","legende":"مقتطف من مقال جوزيف فايزنباوم (1966)، مترجَم","echanges":[{"qui":"h","texte":"الرجال كلهم متشابهون."},{"qui":"m","texte":"بأيّ معنى؟"},{"qui":"h","texte":"إنهم يزعجوننا دائمًا بشيء أو بآخر."},{"qui":"m","texte":"هل يمكنكِ أن تذكري مثالًا محدَّدًا؟"},{"qui":"h","texte":"حسنًا، صديقي هو الذي جعلني آتي إلى هنا."},{"qui":"m","texte":"صديقكِ جعلكِ تأتين إلى هنا."}]},{"type":"texte","titre":"شيكي (Shakey)، أول روبوت يستدلّ","annee":"1966–1972","points":["صُنع في معهد ستانفورد للأبحاث (SRI)","يدرك بيئته بواسطة كاميرا","يخطّط لسلسلة من الأفعال لبلوغ هدف","من أجله طُوِّرت خوارزمية A*‎، التي ما تزال تُستعمل لحساب المسارات"],"personne":"shakey","illus":"robot"},{"type":"citation","texte":"ستكون الآلات قادرة، في غضون عشرين سنة، على القيام بأيّ عمل يستطيع الإنسان القيام به.","auteur":"هربرت سايمون","source":"1965"},{"type":"schema","titre":"الشتاء الأول للذكاء الاصطناعي","annee":"1974–1980","illus":"courbe","points":["سنة 1969: يبيّن مينسكي وبابيرت حدود البيرسبترون البسيط","سنة 1973: في المملكة المتحدة، يرى تقرير لايتهيل أن النتائج مخيّبة للآمال","يتضخّم الحساب تضخّمًا انفجاريًا ما إن تكبر المسائل","يُقطع التمويل العمومي: إنه «الشتاء»"]},{"type":"section","numero":"4","titre":"الأنظمة الخبيرة","periode":"1980–1993","texte":"يعود الذكاء الاصطناعي بتحويل معرفة الخبراء إلى قواعد. فيدخل الشركات، ثم يتراجع.","illus":"regles"},{"type":"schema","titre":"تحويل المعرفة إلى قواعد","illus":"regles","points":["قاعدة وقائع، وقاعدة قواعد من نوع «إذا … فإن …»، ومحرّك استدلال","سبعينيات القرن العشرين: نظام MYCIN، في ستانفورد، يشخّص عدوى الدم","سنة 1980: يضبط نظام XCON تهيئة حواسيب شركة DEC","تستثمر الشركات: فيصبح الذكاء الاصطناعي صناعة"]},{"type":"texte","titre":"عودة العصبونات","annee":"1986","points":["سنة 1982: تطلق اليابان مشروع حواسيب الجيل الخامس","سنة 1986: يُشيع روملهارت وهينتون وويليامز خوارزمية الانتشار العكسي","صرنا أخيرًا نعرف كيف ندرّب شبكات متعددة الطبقات","لكن الحواسيب والبيانات ما تزال غير كافية"],"illus":"reseau"},{"type":"schema","titre":"نكدّس الطبقات ونُرجع الخطأ","annee":"1986","illus":"retro","points":["طبقات من البيرسبترون بعضها فوق بعض، كطبقات صينية البشاميل","كل طبقة تتحقق من شرط ثم تسلّم إلى الطبقة التالية","إذا أخطأ الجواب نُرجع الخطأ طبقةً طبقة: أيّ وزن ساهم فيه أكثر؟","نصحّح هذه الأوزان ونعيد الكرّة: هذا هو الانتشار الخلفي (Backpropagation)"]},{"type":"texte","titre":"الشتاء الثاني","annee":"1987–1993","points":["سنة 1987: تنهار سوق آلات Lisp المتخصصة","الأنظمة الخبيرة مكلفة، وتخطئ خارج مجالها","كل قاعدة جديدة قد تناقض قواعد أخرى: فتصير الأنظمة عصيّة زميات: الانتشار الخلفي (1986)، ثم يدرّب هينتون الشبكات طبقةً طبقة سنة 2006","البيانات: الإنترنت وImageNet، ملايين الصور الموسومة، «صالة الرياضة» للذكاء الاصطناعي","الحوسبة: بطاقات رسوميات ألعاب الفيديو (NVIDIA CUDA، 2007)، ثم رقائق TPU من Google (2016)","2012: AlexNet، المدرَّب على بطاقتَي رسوميات، يكتسح مسابقة ImageNet"]},{"type":"schema","titre":"شبكة عميقة، طبقةً بعد طبقة","illus":"reseau","points":["ترصد الطبقات الأولى سماتٍ بسيطة: حوافَّ وبُقعًا","وتركّب منها الطبقات التالية أشكالًا وأنسجةً وأجزاءً","وتتعرّف الطبقات الأخيرة على أشياء كاملة: «قطّ»، «سيارة»","تتعلّم كل طبقة بنفسها ما ينبغي أن ترصده"]},{"type":"schema","titre":"لعبة التخمين: ما مهنة هذا الشخص؟","illus":"devinette","indices":["خوذة: 90%","سترة: 70%","حذاء: 60%"],"resultat":"مهندس","points":["فريق ينظر إلى الرأس، وآخر إلى الملابس، وثالث إلى الحذاء","كلٌّ يعطي احتمالًا: خوذة 90%، سترة 70%، حذاء أمان 60%","لكل دليل وزن: الخوذة أهمّ من الحذاء","المتوسط الموزون: ⁦169 ÷ 220 ≈ 77%⁩، إذن «مهندس»"]},{"type":"schema","titre":"تشريح القرار: الأوزان والتحيّز والتنشيط","illus":"decision","etapes":["المدخلات × الأوزان","المجموع + التحيّز","التنشيط"],"points":["تُضرب كل معلومة في وزنها، أي في أهميتها للقرار","نجمع النتائج ثم نضيف التحيّز (bias): ضبطٌ يمنع دليلًا واحدًا من أن يقرّر كل شيء","تحوّل دالة التنشيط المجموع إلى نسبة دقيقة بدل «نعم» أو «لا» فقط","يرصف النموذج الكبير مليارات من هذه الحسابات الصغيرة"]},{"type":"schema","titre":"ثلاث طرق للتعلّم","illus":"apprendre","types":["بإشراف","دون إشراف","بالتعزيز"],"points":["بإشراف: يعطي المعلّم الجواب الصحيح بعد كل خطأ؛ وهكذا تقرأ LeNet الشيكات (1989)","دون إشراف: تستكشف الآلة وحدها جبالًا من البيانات؛ سنة 2012 اكتشفت Google Brain «القطة» في 10 ملايين صورة من يوتيوب","بالتعزيز: يُقال لها فقط «ربحتَ» أو «خسرتَ»؛ فيبتكر AlphaGo استراتيجياته الخاصة","تجمع النماذج الكبيرة اليوم بين الطرق الثلاث في الغالب"]},{"type":"portrait","personne":"feifei","nom":"فاي فاي لي وقاعدة ImageNet","dates":"2009–2012","role":"قاعدة صور تغيّر كل شيء","points":["سنة 2009: ImageNet، أكثر من 14 مليون صورة موسومة يدويًا","سنة 2012: تكتسح شبكة AlexNet مسابقة التعرّف على الصور","ينخفض معدل خطئها إلى 15%، مقابل 26% للمرتبة الثانية"],"illus":"imagenet"},{"type":"portrait","personne":"hinton","nom":"جيفري هينتون","dates":"وُلد سنة 1947","role":"رائد الشبكات العصبية","points":["دافع عن الشبكات العصبية خلال الشتاءين","سنة 2018: جائزة تورينغ مع يوشوا بنجيو ويان لوكان","سنة 2024: جائزة نوبل في الفيزياء مع جون هوبفيلد"],"encart":"lecun"},{"type":"texte","titre":"حين تتعلّم الآلة خطأً: تمبي، 2018","annee":"2018","illus":"uber","points":["18 مارس 2018، أريزونا، ليلًا: سيارة تجريبية ذاتية القيادة لشركة Uber تصدم إلين هيرتزبرغ وهي تعبر الطريق دافعةً درّاجتها","رأتها المستشعرات قبل ثوانٍ، لكن النظام تردّد: مركبة؟ درّاجة؟ «شيء آخر»؟","لم يكن مصمَّمًا لمشاةٍ يعبرون خارج ممرّ الراجلين، ولم تكن سائقة السلامة تنظر إلى الطريق","توقف Uber تجاربها: لا تُمنح آلةٌ لا نفهمها قرارًا فيه حياة أو موت"]},{"type":"schema","titre":"حين تتعلّم الآلة أكثر مما ينبغي أو أقل","illus":"ajustement","cas":["نقص الملاءمة","التوازن","الإفراط في الملاءمة"],"points":["الإفراط في الملاءمة (Overfitting): حفظٌ عن ظهر قلب؛ كل الأطباء الذين رآهم يلبسون نظّارات، إذن من لا نظّارة له «ليس طبيبًا»","نقص الملاءمة (Underfitting): التلميذ يتصفّح الكتاب سطحيًّا فيفوته المهم","والعلاج واحد: بيانات أكثر وأكثر تنوّعًا: ليلًا ونهارًا، أماكن وملابس وزوايا مختلفة","تمبي 2018: لم يشبه الراجلُ خارج الممرّ الأمثلةَ التي تعلّمتها السيارة"]},{"type":"frise","titre":"الآلات تتعلّم اللغة واللعب أيضًا","evenements":[{"annee":"2013","titre":"Word2vec","texte":"تصبح الكلمات متّجهات: «ملك» − «رجل» + «امرأة» ≈ «ملكة»"},{"annee":"2014","titre":"GAN","texte":"شبكتان تتواجهان لإنتاج صور واقعية"},{"annee":"2015","titre":"ألعاب Atari","texte":"وكيل من DeepMind يتعلّم 49 لعبة فيديو انطلاقًا من البكسلات والنقاط المُحرَزة وحدها"},{"annee":"2016","titre":"AlphaGo","texte":"يهزم برنامج DeepMind لي سيدول في لعبة الغو، بأربع مباريات مقابل واحدة"}]},{"type":"portrait","personne":"hassabis","nom":"برنامج AlphaGo والنقلة 37","dates":"مارس 2016، سيول","role":"شركة DeepMind، التي شارك في تأسيسها ديميس هاسابيس","points":["المباراة الثانية: يلعب AlphaGo نقلة ما كان أيّ إنسان ليلعبها","يظنّها المعلّقون خطأً؛ لكنها نقلة رابحة","لم تعد الآلة تقلّد البشر: إنها تجد استراتيجياتها الخاصة"],"illus":"go","encart":"leesedol"},{"type":"frise","titre":"ثلاثة انتصارات وثلاث طرق لهزيمة الإنسان","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"قوة الحساب: 200 مليون وضعية في الثانية، وقواعد كتبها خبراء"},{"annee":"2011","titre":"Watson","texte":"فهم السياق: يفوز في برنامج Jeopardy! ذي الأسئلة الملتوية، ويربح مليون دولار"},{"annee":"2016","titre":"AlphaGo","texte":"الإبداع: 10¹⁷⁰ وضعية في لعبة غو، أكثر من ذرّات الكون؛ والنقلة 37 تفاجئ صانعيه أنفسهم"},{"annee":"2017","titre":"AlphaGo Zero","texte":"لم يعد يحتاج إلى مباريات البشر: يتعلّم باللعب ضد نفسه في أيام قليلة"},{"annee":"2024","titre":"AlphaFold","texte":"من الألعاب إلى العلم: شكل البروتينات، وجائزة نوبل في الكيمياء"}]},{"type":"section","numero":"7","titre":"المحوِّلات والذكاء الاصطناعي التوليدي","periode":"2017–2022","texte":"بنية جديدة تتعلّم قراءة نصوص كاملة. فتشرع الآلات في الكتابة والرسم والترجمة.","illus":"attention"},{"type":"deux","titre":"من التصنيف إلى التوليد","gauche":{"titre":"ذكاء يصنّف (بالأمس)","points":["يفرز العالم الموجود ويحكم عليه ويرتّبه","السؤال: «هل هذه الصورة قطة؟»","الشبكات الالتفافية، مرشّحات الرسائل المزعجة، قراءة الشيكات","يجيب بوسم (تصنيف)"]},"droite":{"titre":"ذكاء يولّد (اليوم)","points":["يتعلّم أنماط البيانات لينتج شيئًا جديدًا","الطلب: «ارسم قطة على طريقة بيكاسو»","2014: شبكات GAN، مزوِّر ومحقِّق يدرّب كلٌّ منهما الآخر","يقلّد الأساليب؛ أما ابتكار أسلوب جديد حقًّا فمحلّ نقاش"]}},{"type":"schema","titre":"مقال «Attention Is All You Need»","annee":"2017","illus":"attention","points":["يقترح ثمانية باحثين من Google بنية المحوِّل (Transformer)","تربط آلية الانتباه كل كلمة بكل الكلمات الأخرى","في «فتحت الطالبة الكتاب لأنها…»، يوجّه الضمير «ها» انتباهه إلى «الطالبة»","تنحدر منه كل النماذج اللغوية الكبيرة الحالية"]},{"type":"frise","titre":"من BERT إلى ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"شركة Google: نموذج يفهم سياق الكلمة"},{"annee":"2019","titre":"GPT-2","texte":"شركة OpenAI: نصوص سلسة إلى حدّ أن الشركة تردّدت في نشره"},{"annee":"2020","titre":"GPT-3","texte":"نموذج بـ175 مليار معامل؛ وAlphaFold 2 يحلّ مسألة طيّ البروتينات"},{"annee":"2021","titre":"DALL·E","texte":"صورة تُرسم انطلاقًا من جملة"},{"annee":"2022","titre":"ChatGPT","texte":"في 30 نوفمبر: يصل الذكاء الاصطناعي التوليدي إلى عامة الناس"}]},{"type":"frise","titre":"نحو تعدّد الوسائط: يرى ويقرأ ويتكلّم","evenements":[{"annee":"2014","titre":"الوصف","texte":"شبكة ترى وشبكة تكتب، مُلصَقتان معًا، تصفان صورة"},{"annee":"2021","titre":"CLIP","texte":"400 مليون زوج من صورة ونص: الصور والكلمات في فضاء واحد"},{"annee":"2022","titre":"الانتشار","texte":"DALL·E 2 وStable Diffusion: تولد الصورة من ضجيج يُزال شيئًا فشيئًا"},{"annee":"2023","titre":"الجسور","texte":"يُربط نموذج رؤية كبير بنموذج لغوي كبير"},{"annee":"2024","titre":"أصيل","texte":"شبكة واحدة للنص والصورة والصوت: نحو ثلث ثانية للإجابة"}]},{"type":"schema","titre":"من النص إلى الأعداد","illus":"tokens","phrase":"القط يشرب الحليب","ids":"4127 9038 2310","points":["لا يعرف الحاسوب إلا الأعداد","يُقطَّع النص إلى أجزاء: **الرموز** (tokens)","يأخذ كل رمز رقمًا، ثم قائمة طويلة من الأعداد: **متّجهًا**","لا يرى النموذج الحروف أبدًا، بل هذه الأعداد فقط"]},{"type":"schema","titre":"خريطة المعاني","illus":"sens","mots":["قط","كلب","حصان","كتاب","رواية","قارئ","رجل","امرأة","ملك","ملكة"],"points":["كل متّجه عنوانٌ على خريطة ضخمة للمعاني","الكلمات التي لها الجيران أنفسهم تتقارب: «قط» و«كلب»","يتعلّم النموذج ذلك وحده، بتخمين كلمات مخفية في مليارات الجمل","تحفظ الخريطة العلاقات: من «رجل» إلى «امرأة» كما من «ملك» إلى «ملكة»"]},{"type":"schema","titre":"السياق يحدّد المعنى","illus":"contexte","phrase1":"الفأرة تأكل الجبن","phrase2":"نقرتُ زرّ الفأرة","liens":[[0,2],[2,0]],"points":["قد تحمل الكلمة الواحدة عدة معانٍ: «الفأرة»","يربط **الانتباه** كل كلمة بجيرانها","مع «الجبن» تكون الفأرة الحيوان، ومع «نقرتُ» تكون أداة الحاسوب","يُعاد حساب متّجه الكلمة بحسب سياقها"]},{"type":"schema","titre":"كيف «يكتب» نموذج لغوي","illus":"motsuivant","points":["يقطّع النص إلى أجزاء، هي الرموز (tokens)","يحسب احتمال كل رمز تالٍ","يختار واحدًا منها، ويضيفه إلى النص، ثم يعيد الكرّة","ثم يقيّم بشرٌ إجاباته لصقله"],"debut":"القط يشرب","suites":["الحليب","الماء","الشاي","العصير"]},{"type":"chat","titre":"حوار مع نموذج لغوي","annee":"2022","legende":"مثال متخيَّل، كُتب للطلبة","echanges":[{"qui":"h","texte":"اشرح التسلسل الأمامي لطالب في الأدب."},{"qui":"m","texte":"تخيّل محقّقًا: ينطلق من القرائن التي يعرفها ويطبّق قواعده واحدةً تلو الأخرى، حتى يجد الجاني."},{"qui":"h","texte":"أعطني مرجعًا لأستشهد به في مذكّرتي."},{"qui":"m","texte":"انتبه: تحقّق دائمًا من المرجع في مكتبة. فقد أخطئ، وقد أختلق مراجع."}]},{"type":"section","numero":"8","titre":"عصر الوكلاء","periode":"2023–2026","texte":"لم يعد النموذج اللغوي يكتفي بالإجابة: إنه يخطّط، ويستعمل الأدوات، ويتصرّف.","illus":"agent"},{"type":"texte","titre":"ما الوكيل؟","points":["يدرك الوكيل بيئته ويؤثّر فيها لبلوغ هدف","منظّم الحرارة وكيل بسيط جدًا: يقيس الحرارة، ثم يشغّل التدفئة أو يوقفها","يعرّف راسل ونورفيغ (1995) الذكاء الاصطناعي كله بأنه دراسة الوكلاء","يتلقّى وكيل الذكاء الاصطناعي الحديث هدفًا، لا مجرّد سؤال"],"illus":"thermostat"},{"type":"schema","titre":"حلقة الوكيل","illus":"boucle","points":["الهدف: ما يطلبه المستخدم","التفكير: يخطّط النموذج للخطوة التالية","التصرّف: يستعمل أداة (بحث، حساب، ملف، متصفّح)","الملاحظة: يقرأ النتيجة، ثم يعيد الكرّة حتى بلوغ الهدف"]},{"type":"frise","titre":"من وكلاء المحادثة إلى الوكلاء","evenements":[{"annee":"2022","titre":"ReAct","texte":"يُناوِب باحثون بين الاستدلال والفعل داخل نموذج واحد"},{"annee":"2023","titre":"الأدوات","texte":"نموذج GPT-4؛ وتتعلّم النماذج استدعاء الأدوات والبرامج"},{"annee":"2024","titre":"الاستدلال والتصرّف","texte":"نماذج تفكّر قبل أن تجيب؛ ونموذج يقود حاسوبًا؛ وبروتوكول MCP لربط الأدوات"},{"annee":"2025","titre":"وكلاء في العمل","texte":"و ":"ثمانية قرون من الأحلام، وسبعون سنة من العلم، وبضع سنوات من الوكلاء.","illus":"frise"},{"type":"frise","titre":"التواريخ الثمانية التي ينبغي حفظها","evenements":[{"annee":"1843","titre":"لوفلايس","texte":"أول برنامج، لآلة لم تكتمل قطّ"},{"annee":"1950","titre":"تورينغ","texte":"هل تستطيع الآلات أن تفكّر؟"},{"annee":"1956","titre":"دارتموث","texte":"يحصل الذكاء الاصطناعي على اسمه"},{"annee":"1974","titre":"الشتاء","texte":"الشتاء الأول للذكاء الاصطناعي"},{"annee":"1997","titre":"Deep Blue","texte":"يهزم الحاسوب بطلَ العالم في الشطرنج"},{"annee":"2012","titre":"AlexNet","texte":"ينتصر التعلم العميق"},{"annee":"2017","titre":"المحوِّل","texte":"آلية الانتباه في صميم النماذج اللغوية"},{"annee":"2022","titre":"ChatGPT","texte":"ذكاء اصطناعي توليدي للجميع؛ ثم يأتي الوكلاء"}]},{"type":"deux","titre":"عائلات الذكاء الاصطناعي، في شريحة واحدة","gauche":{"titre":"بحسب الطريقة","points":["الرمزي: قواعد مكتوبة","التعلم الآلي: أمثلة","التعلم العميق: شبكات ذات طبقات عديدة","التعلم المعزَّز: محاولات ومكافآت"]},"droite":{"titre":"بحسب الطموح","points":["الذكاء الاصطناعي الضعيف (الضيّق): مهمة محدّدة","الذكاء الاصطناعي القوي (العام): كل المهام، وما يزال فرضيًّا","الوكلاء الحاليون ما زالوا ذكاءً اصطناعيًا ضعيفًا","… لكنهم يزدادون تعدّدًا في القدرات"]}},{"type":"texte","titre":"أربعة دروس من 90 سنة من الذكاء الاصطناعي","illus":"saisons","courbes":["التوقّعات","قوة الحساب"],"points":["الخطر ليس في الفشل بل في التوقّعات المفرطة: هي التي تسبّبت في الشتاءين","تعود الأفكار القديمة حين تتوفّر البيانات وقوة الحساب: بيرسبترون 1958 يعيش في ChatGPT","النجاح في الاختبار ليس فهمًا: التعميم على العالم الحقيقي يبقى الأصعب","ربيع دائم أم شتاء جديد؟ احكموا بالنتائج لا بالوعود"]},{"type":"video","titre":"فيديو: التاريخ الكامل للذكاء الاصطناعي (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence»، على YouTube"},{"type":"video","titre":"فيديو: مئة سنة من الذكاء الاصطناعي","youtube":"mSd9nmPM7Vg","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Entire History of Artificial Intelligence (Last 100 Years)»، على YouTube"},{"type":"quiz","question":"في أيّ سنة فرضت عبارة «الذكاء الاصطناعي» نفسها، مع ورشة دارتموث؟","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"ظهرت العبارة في مقترح سنة 1955، وفرضت نفسها مع ورشة صيف 1956."},{"type":"quiz","question":"لماذا نتحدّث عن «شتاءات» الذكاء الاصطناعي؟","choix":["كانت الحواسيب تسخن كثيرًا","أدّت خيبة الأمل إلى تراجع التمويل والاهتمام","كانت الأبحاث تُجرى في فصل الشتاء","حُظرت الآلات"],"reponse":1,"explication":"بعد وعود مفرطة، خيّبت النتائج الآمال: فقُطع التمويل (1974–1980، ثم 1987–1993)."},{"type":"quiz","question":"ما الذي يميّز الوكيل عن مجرّد وكيل محادثة؟","choix":["يكتب بسرعة أكبر","يسعى إلى هدف بالتصرّف بواسطة الأدوات","لا يخطئ أبدًا","يعمل من دون كهرباء"],"reponse":1,"explication":"ينجز الوكيل سلسلة من الأفعال (البحث، والحساب، وكتابة ملف…) ويلاحظ النتائج لبلوغ هدف."},{"type":"quiz","question":"هل كانت ELIZA (1966) تفهم ما يُقال لها؟","choix":["نعم، مثل طبيب نفسي","لا: كانت تحوّل الجمل بواسطة قواعد","نعم، بفضل التعلم العميق","لا نعرف ذلك"],"reponse":1,"explication":"كانت ELIZA ترصد كلمات مفتاحية وتعيد جملًا جاهزة. والاعتقاد بأنها تفهم هو «أثر ELIZA»."},{"type":"quiz","question":"لماذا لا يستطيع البيرسبترون البسيط تعلّم «الباب ذي المفتاحين» (XOR)؟","choix":["ليست له ذاكرة كافية","لا يفصل خطٌّ مستقيم واحد بين المجموعتين","لا وجود لـ XOR في الرياضيات","يحتاج إلى كاميرا أدق"],"reponse":1,"explication":"يرسم البيرسبترون حدًّا مستقيمًا واحدًا، أما XOR فيتطلّب قاعدتين إحداهما فوق الأخرى، أي طبقتين على الأقل تُدرَّبان بالانتشار الخلفي."},{"type":"quiz","question":"لم يرَ نموذجٌ إلا أطباء يلبسون نظّارات؛ وأمام طبيب بلا نظّارة أجاب «ليس طبيبًا». ما هذا العيب؟","choix":["نقص الملاءمة","الإفراط في الملاءمة","الهلوسة","تحيّز التنشيط"],"reponse":1,"explication":"حفظ تفصيلًا من أمثلته بدل القاعدة العامة: هذا هو الإفراط في الملاءمة. والعلاج أمثلة أكثر عددًا وتنوّعًا."},{"type":"fin","titre":"ما ينبغي تذكّره","points":["الحلم قديم؛ والذكاء الاصطناعي بوصفه علمًا وُلد بين 1950 و1956","يتناوب مساران: كتابة القواعد أو التعلّم من البيانات","تتعلّم الشبكة بموازنة الأدلّة؛ والإفراط في التعلّم أو التقصير فيه يؤدّيان إلى الخطأ","تذكّرنا الشتاءات بأن نحكم بالنتائج، لا بالوعود","يدرك الوكيل ويخطّط ويتصرّف: من شيكي (1966) إلى وكلاء 2025","التحقّق، والاحتفاظ بزمام الأمور، والإفصاح عن الاستعمال: القواعد الذهبية الثلاث"],"texte":"عمل شخصي: اختاروا تاريخًا من الخط الزمني، واكتبوا عشرة أسطر عمّا غيّره، مع الاستشهاد بمصدر تحقّقتم منه."}]}};

    if (t - derniereMolette < 450) return;

    if (e.deltaY > 0) suivant(); else precedent();
  }, { passive: true });

  /* ---------- Notes chiffrées : SHA-256, HMAC et PBKDF2, sans dépendance (fonctionne aussi en file://) ---------- */
  var NOTES = window.NOTES || null, notesOuvertes = !NOTES;
  var K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]), H0 = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19], W = new Uint32Array(64);
  function compresser(h, b, o) {
    var i, x, y;
    for (i = 0; i < 16; i++) W[i] = (b[o + 4 * i] << 24) | (b[o + 4 * i + 1] << 16) | (b[o + 4 * i + 2] << 8) | b[o + 4 * i + 3];
    for (i = 16; i < 64; i++) {
      x = W[i - 15]; y = W[i - 2];
      W[i] = (W[i - 16] + (((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3)) + W[i - 7] + (((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10))) | 0;
    }
    var a = h[0], bb = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7], t1, t2;
    for (i = 0; i < 64; i++) {
      t1 = (hh + (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) + ((e & f) ^ (~e & g)) + K256[i] + W[i]) | 0;
      t2 = ((((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;

  // Même calcul que chiffrer() dans tools/lecon1.py ; renvoie null si la clé est fausse.
  function dechiffrer(cle, iv, donnees) {

  function ouvrirNotes(cle) {

    if (texte === null) return false;

  function verrouillerNotes() {

  function afficherVerrou() {

    document.querySelector('[data-action="verrouiller"]').hidden = !notesOuvertes || !NOTES;

  document.getElementById("langue-projetee").addEventListener("change", function (e) {

  document.getElementById("langue-notes").addEventListener("change", function (e) {

  // Mise à l'échelle 16:9
  function echelle() {

    document.getElementById("cadre").style.setProperty("--k", Math.max(.1, Math.min(w / 1280, h / 720)).toFixed(4));

  window.addEventListener("resize", echelle);

  /* ---------- Vue d'ensemble, notes, thème, plein écran, impression ---------- */
  function apercu(ouvrir) {

  function theme() {

    zone.querySelectorAll(".diapo").forEach(function (d) { d.classList.add("active"); d.classList.remove("passee"); d.querySelectorAll(".bulle").forEach(function (b) { b.classList.add("vue"); }); });

    setTimeout(function () { window.print(); }, 300);
  }

  /* ---------- Commandes ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (b) {
      var a = b.dataset.action;
      if (a === "suivant") suivant(); else if (a === "precedent") precedent(); else if (a === "apercu") apercu();
      else if (a === "presentateur") ouvrirPresentateur(); else if (a === "theme") theme(); else if (a === "diaporama") diaporama(false); else if (a === "imprimer") imprimer();
      else if (a === "sortir") quitterDiaporama(); else if (a === "noir") ecranNoir(noir === "noir" ? "" : "noir"); else if (a === "verrouiller") verrouillerNotes();
      else if (a === "zero") { debut = Date.now(); horloges(); } else if (a === "plus") tailleNotes(2); else if (a === "moins") tailleNotes(-2);
      return;
    }
    var l = e.target.closest("[data-langue]");
    if (l) { langue = l.dataset.langue; construire(); return; }
    if (e.target.closest("#ecran-noir")) { suivant(); return; }

    if (e.target.closest(".scene") && !e.target.closest("a, button, iframe, .video")) {
      if (diaporamaActif) { suivant(); return; }
      var x = e.clientX / window.innerWidth, rtl = langue === "ar";
      if (rtl ? x > .75 : x < .25) precedent(); else suivant();
    }
  });
  // Clavier : les raccourcis de PowerPoint pendant le diaporama (N/P, B/W, numéro + Entrée, Échap, F5, Maj+F5, Alt+F5).
  var chiffres = "", minuteurChiffres = null;

    if (e.target.closest && e.target.closest("input, textarea, select") && k !== "PageDown" && k !== "PageUp") return;

    if ((k === " " || k === "Enter") && !chiffres && e.target.closest && e.target.closest("button, a")) return; // le bouton reçoit sa propre action
    if (!document.getElementById("apercu").hidden && k === "Escape") { apercu(false); return; }
    if (ppt && /^[0-9]$/.test(k)) {
      chiffres += k; clearTimeout(minuteurChiffres);
      minuteurChiffres = setTimeout(function () { chiffres = ""; }, 2000);
      return;
    }
    if (k === "Enter" && chiffres) { e.preventDefault(); var c = parseInt(chiffres, 10); chiffres = ""; if (c) { if (noir) ecranNoir(""); aller(c - 1); } return; }
    if (k === (rtl ? "ArrowLeft" : "ArrowRight") || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Enter" || (ppt && (k === "n" || k === "N"))) { e.preventDefault(); suivant(); }
    else if (k === (rtl ? "ArrowRight" : "ArrowLeft") || k === "ArrowUp" || k === "PageUp" || k === "Backspace" || (ppt && (k === "p" || k === "P"))) { e.preventDefault(); precedent(); }
    else if (k === "Home") { if (noir) ecranNoir(""); aller(0); } else if (k === "End") { if (noir) ecranNoir(""); aller(diapos.length - 1); }
    else if (k === "Escape" && diaporamaActif) quitterDiaporama();
    else if (ppt && (k === "b" || k === "B" || k === ".")) ecranNoir(noir === "noir" ? "" : "noir");
    else if (ppt && (k === "w" || k === "W" || k === ",")) ecranNoir(noir === "blanc" ? "" : "blanc");
    else if (k === "o" || k === "O" || k === "g" || k === "G") apercu();
    else if (k === "s" || k === "S" || k === "n" || k === "N") ouvrirPresentateur();
    else if (k === "t" || k === "T") theme();
    else if (k === "f" || k === "F") diaporama(false);
    else if (k === "p" || k === "P") imprimer();
    else if (k === "r" || k === "R") { var q = diapos[index].querySelector(".quiz"); if (q) basculerQuiz(q); }

  });
  var depart = null;
  document.getElementById("scene").addEventListener("touchstart", function (e) { depart = e.touches[0].clientX; }, { passive: true });

  var memo = null; try { memo = JSON.parse(lire("lx-lecon1") || "null"); } catch (e) { memo = null; }
