<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De l'automate à l'agent · Chapitre 1, première leçon</title>
<meta name="description" content="Présentation animée en trois langues : l'histoire complète de l'intelligence artificielle, des automates aux agents (Chapitre 1, première leçon).">
<meta name="theme-color" content="#07070a">
<link rel="preload" href="assets/fonts/im-fell-dw-pica-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/polices.css">
<style>
/* ==========================================================================
   « De l'automate à l'agent » : une présentation autonome (un seul fichier).
   Chaque diapositive est dessinée à 1280 × 720 puis mise à l'échelle de l'écran.
   ========================================================================== */
:root {
  --fond: #07070a; --surface: #151515; --surface-2: #1f1f25; --ligne: #2e2e35; --texte: #f5f5f5; --doux: #a9a9b6;
  --c1: #ffff00; --c2: #87ceeb; --c3: #ff512f; --c4: #dd2476; --c5: #1c64ff; --juste: #6fdcaa;
  --t1: #ffe94d; --t2: #87ceeb; --t3: #ff8466; --t4: #f472a8; --t5: #86a8ff;
  --prisme: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5));
  --prisme-conique: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c1));
  --f-titre: "IM Fell DW Pica SC", Georgia, "Times New Roman", serif;
  --f-texte: Literata, Georgia, "Times New Roman", serif;
  --f-ui: Rajdhani, "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --fond: #f4f4f6; --surface: #ffffff; --surface-2: #ececf1; --ligne: #d6d6de; --texte: #121216; --doux: #55555f;
  --t1: #8a7400; --t2: #1f6f96; --t3: #c2371b; --t4: #b0195b; --t5: #1c4fd1;
  color-scheme: light;
}
:root[lang="ar"] {
  --f-titre: "El Messiri", "Noto Naskh Arabic", Tahoma, serif;
  --f-texte: "Noto Naskh Arabic", "El Messiri", Tahoma, serif;
  --f-ui: "El Messiri", Tahoma, system-ui, sans-serif;
  --f-code: "JetBrains Mono", "Noto Naskh Arabic", monospace;
}
:root[lang="ar"] .bulle--m { font-family: var(--f-texte); font-size: 23px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font-family: var(--f-texte); overflow: hidden; }
:root[lang="ar"] body * { letter-spacing: 0 !important; }
button { font: inherit; color: inherit; }
a { color: var(--t2); }
.visuellement-cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Barre du haut ---------- */
.barre {
  position: fixed; inset: 0 0 auto; z-index: 20; height: 56px; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid var(--ligne); background: color-mix(in srgb, var(--fond) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--f-ui);
}
.barre::after { content: ""; position: absolute; inset: auto 0 -1px 0; height: 3px; background: var(--prisme); transform-origin: left; transform: scaleX(var(--avance, 0)); transition: transform .4s; }
[dir="rtl"] .barre::after { transform-origin: right; }
.marque { display: flex; align-items: center; gap: 10px; color: var(--texte); text-decoration: none; font-weight: 700; white-space: nowrap; }
.marque__anneau { width: 18px; height: 18px; border-radius: 50%; background: var(--prisme-conique); -webkit-mask: radial-gradient(closest-side, transparent 55%, #000 58%); mask: radial-gradient(closest-side, transparent 55%, #000 58%); }
.barre__titre { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--doux); font-size: 15px; font-weight: 600; }
.langues { display: flex; padding: 3px; border: 1px solid var(--ligne); border-radius: 30px; }
.langues button { min-width: 44px; height: 32px; padding: 0 10px; border: 0; border-radius: 30px; background: none; color: var(--doux); font-weight: 700; cursor: pointer; }
.langues button[aria-pressed="true"] { background: var(--texte); color: var(--fond); }
.outils { display: flex; gap: 4px; }
.outil {
  display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--ligne); border-radius: 50%;
  background: var(--surface); cursor: pointer; transition: border-color .2s, transform .2s;
}
.outil:hover { border-color: var(--texte); transform: scale(1.06); }
.outil[hidden] { display: none; }
.outil[aria-pressed="true"] { border-color: var(--t2); color: var(--t2); }
.outil--projecteur { border-color: var(--t2); color: var(--t2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--t2) 30%, transparent); }
.outil svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }

/* ---------- Scène et diapositives ---------- */
.scene { position: fixed; inset: 56px 0 52px 0; overflow: hidden; }
.scene__cadre { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--k, 1)); }
.diapo {
  position: absolute; inset: 0; overflow: hidden; border-radius: 22px; padding: 64px 80px 56px;
  background:
    radial-gradient(110% 90% at 100% 0%, color-mix(in srgb, var(--c5) 14%, transparent), transparent 55%),
    radial-gradient(90% 80% at 0% 100%, color-mix(in srgb, var(--c4) 12%, transparent), transparent 60%),
    var(--surface);
  box-shadow: 0 30px 80px -30px #000, inset 0 0 0 1px var(--ligne);
  opacity: 0; visibility: hidden; transform: translateX(6%) scale(.98);
  transition: opacity .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1), visibility .55s;
  font-size: 28px; line-height: 1.42;
}
.diapo::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: var(--prisme); }
.diapo.passee { transform: translateX(-6%) scale(.98); }
[dir="rtl"] .diapo { transform: translateX(-6%) scale(.98); }
[dir="rtl"] .diapo.passee { transform: translateX(6%) scale(.98); }
.diapo.active { opacity: 1; visibility: visible; transform: none; }
.diapo--section.active .grand-numero { animation: zoom 1s cubic-bezier(.2,.7,.2,1) both; }
.diapo__num { position: absolute; bottom: 20px; inset-inline-end: 34px; color: var(--doux); font: 700 16px var(--f-ui); }
.diapo__marque { position: absolute; bottom: 20px; inset-inline-start: 34px; color: var(--doux); font: 600 16px var(--f-ui); letter-spacing: .04em; }

/* Ajustement : une diapositive trop chargée est réduite (zoom) pour tenir dans le cadre */
.diapo > :not(.diapo__marque):not(.diapo__num):not(.anneau-decor):not(.guillemet):not(.grand-numero) { zoom: var(--z, 1); }
.mesure .diapo, .mesure .a, .mesure .bulle { transform: none !important; }

/* Apparition progressive des éléments d'une diapositive active */
.a { opacity: 0; transform: translateY(18px); }
.active .a { animation: monte .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms + 150ms); }
.active .a--gauche { animation-name: glisse; }
@keyframes monte { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes glisse { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
[dir="rtl"] .active .a--gauche { animation-name: glisse-rtl; }
@keyframes glisse-rtl { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes zoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

/* Typographie commune */
.surtitre { color: var(--t2); font: 700 22px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
.titre { margin: 0 0 26px; font-family: var(--f-titre); font-size: 52px; font-weight: 400; line-height: 1.1; text-wrap: balance; }
.titre::after { content: ""; display: block; width: 130px; height: 6px; margin-top: 16px; border-radius: 6px; background: var(--prisme); }
.annee { display: inline-block; margin-bottom: 14px; padding: 4px 16px; border-radius: 30px; background: color-mix(in srgb, var(--c1) 16%, transparent); color: var(--t1); font: 700 22px var(--f-ui); letter-spacing: .06em; }
.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.points li { position: relative; padding-inline-start: 40px; }
.points li::before { content: ""; position: absolute; inset-inline-start: 4px; top: .52em; width: 16px; height: 16px; border-radius: 50%; background: var(--prisme-conique); }
em { font-style: italic; } strong { font-weight: 700; } .insecable { white-space: nowrap; }
.colonnes { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 50px; align-items: center; height: calc(100% - 20px); }
.colonnes--schema { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.illus { width: 100%; max-height: 440px; }
.illus svg { width: 100%; height: auto; max-height: 440px; display: block; overflow: visible; }

/* Couverture */
.diapo--couverture { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 40px; align-items: center; padding: 80px 90px; }
.diapo--couverture .titre { font-size: 84px; }
:root[lang="ar"] .diapo--couverture .titre { font-size: 64px; line-height: 1.25; }
.diapo--couverture .titre::after { width: 220px; }
.sous-titre { margin: 0; color: var(--doux); font-size: 30px; line-height: 1.4; }
.anneau-decor { position: absolute; width: 420px; height: 420px; inset-inline-end: -170px; bottom: -250px; border-radius: 50%; background: var(--prisme-conique); -webkit-mask: radial-gradient(closest-side, transparent 74%, #000 75%); mask: radial-gradient(closest-side, transparent 74%, #000 75%); opacity: .8; }
.active .anneau-decor { animation: tourne 22s linear infinite; }
@keyframes tourne { to { transform: rotate(1turn); } }

/* Plan */
.plan { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; counter-reset: etape; }
.plan li { display: flex; gap: 18px; align-items: center; padding: 18px 22px; border: 1px solid var(--ligne); border-radius: 18px; background: var(--surface-2); counter-increment: etape; font-size: 25px; line-height: 1.3; }
.plan li::before { content: counter(etape); flex: none; display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--prisme-conique); color: #111; font: 700 24px var(--f-ui); }
.plan--dense { gap: 12px 32px; } .plan--dense li { gap: 14px; padding: 9px 18px; font-size: 21px; } .plan--dense li::before { width: 38px; height: 38px; font-size: 19px; }

/* Section */
.diapo--section { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; }
.grand-numero { font-family: var(--f-titre); font-size: 200px; line-height: .9; background: var(--prisme); -webkit-background-clip: text; background-clip: text; color: transparent; }
.periode { display: inline-block; margin: 10px 0 18px; padding: 6px 18px; border: 2px solid var(--t2); border-radius: 30px; color: var(--t2); font: 700 24px var(--f-ui); }
.diapo--section .titre { font-size: 64px; }
.diapo--section .texte { color: var(--doux); font-size: 28px; margin: 0; }

/* Portrait */
.portrait { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 56px; align-items: center; height: 100%; }
.photo { position: relative; width: 340px; height: 420px; border-radius: 28px; padding: 6px; background: var(--prisme-conique); }
.photo__cadre { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 23px; background: var(--surface-2); }
.photo img[hidden] { display: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.15) contrast(1.05); }
.photo__repli { position: absolute; inset: 0; display: grid; place-items: center; }
.photo__repli svg { width: 88%; height: auto; }
.photo__initiales { position: absolute; inset: auto 0 18px; text-align: center; font: 700 44px var(--f-titre); color: var(--texte); }
.photo__credit { position: absolute; inset-block-end: 10px; inset-inline-start: 10px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 8px; border-radius: 8px; background: #000b; color: #fff; font: 600 12px/1.5 var(--f-ui); text-decoration: none; }
[dir="rtl"] .photo__credit { direction: ltr; }
.photo--largeur { width: 440px; height: 310px; }
.portrait .photo--largeur { width: 340px; height: 250px; }
/* Encart : une seconde photo posée sur le coin de la première, ou sur un schéma */
.illus { position: relative; }
.photo--encart { position: absolute; z-index: 2; display: none; width: 160px; height: 200px; padding: 5px; inset-inline-end: -46px; bottom: -34px; border-radius: 18px; rotate: 4deg; box-shadow: 0 18px 40px -12px #000; }
.photo--encart.charge { display: block; }
.active .photo--encart.charge { animation: encart .7s .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes encart { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }
[dir="rtl"] .photo--encart { rotate: -4deg; }
.photo--encart.photo--largeur { width: 240px; height: 165px; }
.photo--encart .photo__cadre { border-radius: 14px; }
.photo--encart .photo__credit { inset: auto 5px 5px 5px; max-width: none; padding: 1px 5px; white-space: normal; font-size: 9px; line-height: 1.25; text-align: center; }
/* Sur un schéma : la photo se range à côté du dessin, qui se resserre */
.illus--photo { display: flex; align-items: center; gap: 22px; }
.illus--photo > svg { flex: 1 1 0; min-width: 0; }
.illus--photo > .photo--encart { position: relative; inset: auto; flex: none; width: 184px; height: 226px; }
.nom { margin: 0; font-family: var(--f-titre); font-size: 56px; line-height: 1.05; }
.dates { margin: 6px 0 4px; color: var(--t1); font: 700 24px var(--f-ui); letter-spacing: .05em; }
.role { margin: 0 0 22px; color: var(--doux); font-size: 26px; font-style: italic; }
.citation-courte { margin: 22px 0 0; padding: 16px 22px; border-inline-start: 6px solid var(--c4); border-radius: 12px; background: color-mix(in srgb, var(--c4) 10%, transparent); font-family: var(--f-titre); font-size: 26px; }
.citation-courte small { display: block; margin-top: 6px; color: var(--doux); font: italic 18px var(--f-texte); }

/* Citation */
.diapo--citation { display: grid; align-content: center; padding: 80px 120px; }
.guillemet { position: absolute; top: 40px; inset-inline-start: 60px; font-family: var(--f-titre); font-size: 260px; line-height: 1; color: var(--c4); opacity: .5; }
.citation__texte { margin: 0; font-family: var(--f-titre); font-size: 46px; line-height: 1.3; text-wrap: balance; }
.citation__auteur { margin: 30px 0 0; color: var(--t2); font: 700 26px var(--f-ui); }
.citation__source { margin: 4px 0 0; color: var(--doux); font-size: 22px; font-style: italic; }

/* Deux colonnes */
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.carte { padding: 28px 32px; border: 1px solid var(--ligne); border-radius: 22px; background: color-mix(in srgb, var(--surface-2) 85%, transparent); }
.carte:first-child { border-top: 6px solid var(--c2); }
.carte:last-child { border-top: 6px solid var(--c4); }
.carte h3 { margin: 0 0 18px; font-size: 32px; }
.carte .points { gap: 12px; font-size: 25px; }

/* Frise */
.frise { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; margin-top: 30px; padding-top: 150px; }
.frise__ligne { position: absolute; left: 0; right: 0; top: 118px; height: 6px; border-radius: 6px; background: var(--prisme); transform-origin: left; transform: scaleX(0); }
[dir="rtl"] .frise__ligne { transform-origin: right; }
.active .frise__ligne { animation: trace-ligne 1.2s .2s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes trace-ligne { to { transform: scaleX(1); } }
.evenement { position: relative; text-align: center; }
.evenement::before { content: ""; position: absolute; top: -41px; left: calc(50% - 12px); width: 24px; height: 24px; border: 5px solid var(--surface); border-radius: 50%; background: var(--texte); }
.evenement__annee { position: absolute; top: -118px; left: 0; right: 0; font-family: var(--f-titre); font-size: 40px; color: var(--t1); }
.evenement__titre { margin: 0 0 6px; font: 700 23px var(--f-ui); }
.evenement__texte { margin: 0; color: var(--doux); font-size: 19px; line-height: 1.35; }
.frise--dense .evenement__texte { font-size: 17px; }
.frise--dense .evenement__annee { font-size: 32px; }

/* Dialogue */
.chat { position: relative; display: grid; gap: 14px; max-width: 900px; margin: 0 auto; padding: 24px; border: 1px solid var(--ligne); border-radius: 22px; background: var(--fond); }
.bulle { max-width: 80%; margin: 0; padding: 14px 20px; border-radius: 20px; font-size: 24px; line-height: 1.35; opacity: 0; transform: translateY(10px); }
.bulle--h { justify-self: start; border-end-start-radius: 4px; background: var(--surface-2); }
.bulle--m { justify-self: end; border-end-end-radius: 4px; background: color-mix(in srgb, var(--c5) 22%, var(--surface)); font-family: var(--f-code); font-size: 21px; }
.bulle.vue { animation: monte .5s both; }
.frappe { position: absolute; inset-inline-end: 24px; display: none; gap: 6px; padding: 14px 18px; border-radius: 20px; background: color-mix(in srgb, var(--c5) 22%, var(--surface)); }
.frappe.vue { display: flex; }
.frappe i { width: 10px; height: 10px; border-radius: 50%; background: var(--texte); animation: point 1s infinite; }
.frappe i:nth-child(2) { animation-delay: .15s; } .frappe i:nth-child(3) { animation-delay: .3s; }
@keyframes point { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
.legende { margin: 14px 0 0; color: var(--doux); font-size: 19px; font-style: italic; text-align: center; }

/* Vidéo */
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 470px; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video__vignette { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.video__repli { position: absolute; inset: 0; z-index: 1; text-shadow: 0 2px 8px #000; display: grid; place-content: center; gap: 16px; padding: 30px; color: #fff; text-align: center; font-size: 24px; }
.video__repli a { color: #9fd3ff; font-weight: 700; }
.video__jouer { width: 110px; height: 110px; margin: 0 auto; border-radius: 50%; background: var(--prisme-conique); display: grid; place-items: center; }
.video__jouer::after { content: ""; border-left: 34px solid #111; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 8px; }

/* Quiz */
.question { margin: 0 0 26px; font-size: 36px; font-weight: 700; line-height: 1.3; }
.choix { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.choix button { display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px 20px; border: 2px solid var(--ligne); border-radius: 18px; background: var(--surface-2); text-align: start; font-size: 25px; line-height: 1.3; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.choix button:hover { border-color: var(--t2); transform: translateY(-2px); }
.lettre { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--t2); border-radius: 50%; color: var(--t2); font: 700 22px var(--f-ui); }
.choix button[aria-pressed="true"] { border-color: var(--t2); }
.quiz--revele .choix button.juste { border-color: var(--juste); background: color-mix(in srgb, var(--juste) 16%, var(--surface-2)); }
.quiz--revele .choix button.faux[aria-pressed="true"] { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 14%, var(--surface-2)); }
.explication { margin: 22px 0 0; padding: 16px 22px; border-radius: 16px; background: color-mix(in srgb, var(--juste) 14%, transparent); font-size: 24px; visibility: hidden; opacity: 0; transition: opacity .4s; }
.quiz--revele .explication { visibility: visible; opacity: 1; }
.reveler { margin-top: 18px; padding: 10px 22px; border: 2px solid var(--texte); border-radius: 30px; background: none; font: 700 20px var(--f-ui); cursor: pointer; }

/* Fin */
.fin .points li::before { content: "✓"; display: grid; place-items: center; width: 26px; height: 26px; top: .25em; background: var(--juste); color: #111; font: 700 16px var(--f-ui); }
.devoir { margin-top: 26px; padding: 18px 24px; border: 2px dashed var(--t1); border-radius: 18px; font-size: 24px; }

/* ---------- Illustrations : couleurs et animations ---------- */
.i-t { stroke: var(--texte); } .i-d { stroke: var(--doux); } .i-l { stroke: var(--ligne); }
.i-c1 { stroke: var(--c1); } .i-c2 { stroke: var(--c2); } .i-c3 { stroke: var(--c3); } .i-c4 { stroke: var(--c4); } .i-c5 { stroke: var(--c5); } .i-j { stroke: var(--juste); }
.f-t { fill: var(--texte); } .f-d { fill: var(--doux); } .f-s { fill: var(--surface-2); } .f-f { fill: var(--fond); }
.f-c1 { fill: var(--c1); } .f-c2 { fill: var(--c2); } .f-c3 { fill: var(--c3); } .f-c4 { fill: var(--c4); } .f-c5 { fill: var(--c5); } .f-j { fill: var(--juste); }
svg .trait { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
svg .fin { stroke-width: 2.5; }
svg text { font-family: var(--f-ui); font-weight: 700; }
.active .anim-tourne { animation: tourne 8s linear infinite; transform-box: fill-box; transform-origin: center; }
.active .anim-tourne-inverse { animation: tourne 8s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
.active .anim-tourne-lent { animation: tourne 30s linear infinite; transform-box: fill-box; transform-origin: center; }
.active .anim-pulse { animation: pulse 1.8s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 1s); }
.active .anim-flotte { animation: flotte 3s ease-in-out infinite; }
.active .anim-trace { stroke-dasharray: var(--l, 800); stroke-dashoffset: var(--l, 800); animation: trace 1.8s .3s ease-out forwards; }
.active .anim-apparait { opacity: 0; animation: apparait .6s both; animation-delay: calc(var(--d, 0) * 1s + .3s); }
.active .anim-signal { animation: signal 2.4s linear infinite; animation-delay: calc(var(--d, 0) * 1s); }
.active .anim-tete { animation: tete 6s steps(1) infinite; }
.active .anim-clignote { animation: clignote 1.2s steps(2) infinite; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes flotte { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes trace { to { stroke-dashoffset: 0; } }
@keyframes apparait { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes signal { from { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
@keyframes tete { 0% { transform: translateX(0); } 16% { transform: translateX(48px); } 33% { transform: translateX(96px); } 50% { transform: translateX(144px); } 66% { transform: translateX(96px); } 83% { transform: translateX(48px); } }
@keyframes clignote { 50% { opacity: 0; } }
svg [class*="anim-apparait"] { transform-box: fill-box; transform-origin: center; }

/* ---------- Pied : navigation ---------- */
.pied { position: fixed; inset: auto 0 0 0; z-index: 20; height: 52px; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: var(--f-ui); }
.pied__compteur { min-width: 90px; text-align: center; color: var(--doux); font-weight: 700; font-variant-numeric: tabular-nums; }
/* ---------- Mode présentateur : une seconde fenêtre, vue du seul enseignant ----------
   La fenêtre projetée n'affiche jamais les notes. Celle-ci montre la diapositive en cours,
   la suivante, les notes, le chronomètre et l'heure ; les deux fenêtres avancent ensemble. */
.console { display: none; }
.mode-presentateur .scene { inset-block: 56px 52px; inset-inline: 0 40%; }
.mode-presentateur .pied { inset-inline: 0 40%; }
.mode-presentateur .console {
  position: fixed; inset-block: 56px 0; inset-inline-end: 0; z-index: 19; width: 40%; display: flex; flex-direction: column; gap: 14px;
  padding: 14px 18px; border-inline-start: 1px solid var(--ligne); background: var(--surface); font-family: var(--f-ui);
}
.console h2 { margin: 0; color: var(--doux); font: 700 12px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; }
.console__horloges { display: flex; gap: 12px; align-items: center; }
.console__horloge { display: flex; flex-direction: column; margin: 0; padding: 8px 14px; border: 1px solid var(--ligne); border-radius: 14px; background: var(--fond); }
.console__horloge span { color: var(--doux); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.console__horloge strong { font: 700 30px/1.1 var(--f-code); font-variant-numeric: tabular-nums; }
.console__horloges .outil { margin-inline-start: auto; }
.console__suivante .miniature { display: block; width: min(100%, 360px); margin-top: 6px; cursor: default; }
.console__suivante .miniature * { animation: none !important; transition: none !important; }
.console__suivante .miniature .a, .console__suivante .miniature .bulle { opacity: 1; transform: none; }
.console__fin { margin: 6px 0 0; color: var(--doux); font-weight: 700; }
.notes { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.notes__tete { display: flex; align-items: center; justify-content: space-between; }
.notes__tete .outil { width: 32px; height: 32px; font: 700 13px var(--f-ui); }
.notes__tete span { display: flex; gap: 6px; align-items: center; }
.console__projetee { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--doux); font: 700 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; }
.choix-langue { height: 32px; max-width: 170px; padding: 0 10px; border: 1px solid var(--ligne); border-radius: 999px; background: var(--surface); color: var(--texte); font: 700 13px var(--f-ui); cursor: pointer; }
/* Les notes peuvent être dans une autre langue que les diapositives : chacune garde sa police et son sens de lecture. */
.notes__texte[lang="fr"], .notes__texte[lang="en"] { font-family: Literata, Georgia, "Times New Roman", serif; }
.notes__texte[lang="ar"] { font-family: "Noto Naskh Arabic", "El Messiri", Tahoma, serif; }
.mode-presentateur [data-action="presentateur"] { display: none; }
.notes__texte { flex: 1; overflow-y: auto; padding: 14px 16px; border: 1px solid var(--ligne); border-radius: 14px; background: var(--fond); font-family: var(--f-texte); font-size: var(--taille-notes, 22px); line-height: 1.55; }
.notes__texte p { margin: 0 0 .6em; }
.notes__reponse { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--juste) 18%, transparent); font-weight: 700; }
.console__aide { margin: 0; color: var(--doux); font-size: 13px; line-height: 1.45; }

/* ---------- Diaporama : plein écran, sans barre ni boutons, comme PowerPoint ---------- */
.mode-diaporama, .mode-diaporama body { background: #000; }
.mode-diaporama .barre, .mode-diaporama .pied { display: none; }
.mode-diaporama .scene { inset: 0; }
.mode-diaporama .diapo { border-radius: 0; box-shadow: none; }
.mode-diaporama .apercu { inset: 0; }
.curseur-cache, .curseur-cache * { cursor: none !important; }
.commandes { position: fixed; inset-block-end: 16px; inset-inline-start: 16px; z-index: 36; display: none; align-items: center; gap: 2px; padding: 4px; border-radius: 30px; background: #000b; color: #fff; opacity: 0; transition: opacity .35s; font-family: var(--f-ui); }
.mode-diaporama .commandes { display: flex; }
.commandes.visible, .commandes:hover, .commandes:focus-within { opacity: 1; }
.commandes button { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: #fff; cursor: pointer; }
.commandes button:hover { background: #ffffff30; }
.commandes svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.commandes span { min-width: 64px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ecran-noir { position: fixed; inset: 0; z-index: 35; display: none; place-items: center; background: #000; color: #9a9a9a; font: 600 20px var(--f-ui); cursor: pointer; }
.ecran-noir[data-etat="noir"], .ecran-noir[data-etat="blanc"], .ecran-noir[data-etat="fin"] { display: grid; }
.ecran-noir[data-etat="blanc"] { background: #fff; }
.ecran-noir[data-etat="fin"] { place-items: start center; padding-top: 24px; }
.astuce { position: fixed; inset-block-start: 20px; inset-inline: 16px; z-index: 37; width: max-content; max-width: calc(100% - 32px); margin: 0 auto; padding: 10px 18px; border-radius: 30px; background: #000d; color: #fff; font: 600 15px var(--f-ui); pointer-events: none; }
.astuce[hidden] { display: none; }
.outil--diaporama { display: flex; width: auto; gap: 6px; padding: 0 16px 0 12px; border-color: var(--texte); border-radius: 30px; background: var(--texte); color: var(--fond); font: 700 14px var(--f-ui); }
.outil--diaporama svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.mode-presentateur .outil--diaporama { display: none; }
@media (max-width: 720px) { .outil--diaporama span { display: none; } .outil--diaporama { padding: 0 12px; } }

/* Notes protégées par mot de passe */
.verrou { display: grid; gap: 10px; align-content: start; padding: 16px; border: 1px dashed var(--ligne); border-radius: 14px; background: var(--fond); font-family: var(--f-ui); }
.verrou[hidden] { display: none; }
.verrou__titre { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 700; }
.verrou__titre svg, .notes__tete svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.verrou label { display: grid; gap: 4px; color: var(--doux); font-size: 13px; font-weight: 700; }
.verrou input { height: 44px; padding: 0 12px; border: 1px solid var(--ligne); border-radius: 10px; background: var(--surface); color: var(--texte); font: 600 18px var(--f-code); letter-spacing: .12em; }
.verrou button { justify-self: start; height: 40px; padding: 0 20px; border: 0; border-radius: 30px; background: var(--texte); color: var(--fond); font-weight: 700; cursor: pointer; }
.verrou__message { margin: 0; color: var(--doux); font-size: 14px; }
.verrou__message.erreur { color: var(--c3); font-weight: 700; }
.notes__texte[hidden] { display: none; }

/* Vue d'ensemble */
.apercu { position: fixed; inset: 56px 0 0 0; z-index: 30; overflow-y: auto; padding: 24px; background: var(--fond); }
.apercu[hidden] { display: none; }
.apercu__grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.miniature { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid var(--ligne); border-radius: 12px; background: var(--surface); cursor: pointer; padding: 0; }
.miniature[aria-current="true"] { border-color: var(--c1); }
.miniature .diapo { opacity: 1; visibility: visible; transform: scale(var(--km, .18)); transform-origin: 0 0; width: 1280px; height: 720px; transition: none; border-radius: 0; }
[dir="rtl"] .miniature .diapo { transform-origin: 100% 0; right: 0; left: auto; }
.miniature .a { opacity: 1; transform: none; }
.miniature__num { position: absolute; top: 6px; inset-inline-start: 6px; z-index: 2; padding: 0 7px; border-radius: 6px; background: #000b; color: #fff; font: 700 13px/20px var(--f-ui); }

/* Mouvement réduit */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* Petits écrans : la barre se simplifie */
@media (max-width: 720px) {
  .barre__titre, .outil--secondaire { display: none; }
  .barre { gap: 6px; padding: 0 8px; }
  .langues button { min-width: 36px; padding: 0 6px; }
}

/* Impression : une diapositive par page 16:9 */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .barre, .pied, .console, .apercu, .scene, .commandes, .ecran-noir, .astuce { display: none !important; }
  .impression { display: block !important; }
  .impression .diapo { position: relative; opacity: 1; visibility: visible; transform: none; width: 1280px; height: 720px; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .impression .a, .impression .bulle { opacity: 1 !important; transform: none !important; animation: none !important; }
  .impression .frise__ligne { transform: none !important; }
  .impression .explication { visibility: visible; opacity: 1; }
}
.impression { display: none; }
</style>

La révolution industrielle a pris un à deux siècles ; l'IA change la société en 3 ou 4 ans","États-Unis, développeurs de 22 à 25 ans : près de 20 % d'emplois en moins depuis fin 2022","L'IA ne remplace pas encore l'expert : elle prend les tâches qui forment les débutants","Pas d'apprenti à l'atelier aujourd'hui, pas de maître demain"]},{"type":"texte","titre":"La vraie question : qui donne le pouvoir à la machine ?","illus":"balance","points":["Elle aide à décider d'un prêt, d'un achat en bourse, de mesures pour des millions de gens","Elle sert aussi à la guerre… le même type de modèle qui fait vos devoirs de maths !","La question n'est plus « est-elle intelligente ? »","Mais : qui lui a donné l'autorité ? Qui l'a testée ? Qui répond quand elle se trompe ?"]},{"type":"texte","titre":"Le tour du magicien","illus":"chapeau","points":["Pas « bonne ou mauvaise ? » : ce qu'elle fait bien ou mal, pour qui, aux dépens de qui","Comprendre remet tout à sa place : la peur ou l'émerveillement, quand il le faut","Connaître le tour n'enlève rien au magicien : on mesure mieux son habileté","Le chemin : son histoire, puis l'intérieur de la machine (réseaux, poids, attention)"]},{"type":"section","numero":"2","titre":"Qu'est-ce que l'IA ?","periode":"Définitions","texte":"Avant de raconter l'histoire, mettons-nous d'accord sur les mots : que veut dire « intelligence artificielle » ?","illus":"profil"},{"type":"texte","titre":"Et vous, qu'appelez-vous « intelligence » ?","points":["Comprendre une phrase, traduire un poème","Reconnaître un visage parmi mille","Gagner aux échecs, résoudre un problème","Apprendre de ses erreurs","Agir seul pour atteindre un but"],"illus":"cerveau"},{"type":"texte","titre":"Une intelligence « artificielle »","points":["Définition simple : l'IA est une tentative de la machine pour *simuler* l'intelligence","Elle n'a pas besoin de comprendre : il lui suffit de *paraître* comprendre","« Artificiel », comme un sourire artificiel : imité, et pas seulement fabriqué","« Je vous comprends », dit l'agent conversationnel : sans doute pas, mais il aide souvent"],"illus":"imitation"},{"type":"schema","titre":"Trois niveaux d'IA","illus":"niveaux","niveaux":["étroite","générale","super"],"points":["IA étroite : un génie d'une seule tâche (Google Maps, échecs, jeux vidéo) ; elle existe","Google Traduction : près de 250 langues… mais il ne sait pas jouer aux échecs","IA générale : traduire, jouer, trouver sa route… comme un humain ; encore théorique","Superintelligence : au-delà de l'humain, peut-être consciente, libre de ses buts ; inconnue"]},{"type":"texte","titre":"Et ChatGPT, alors ?","points":["Il traduit, écrit, code, crée des images… et même des poèmes, pas toujours bons","Mais il a appris des données reçues, pas du monde lui-même, et en sort difficilement","Étroit ou général ? Les experts en débattent ; l'IA générale n'existe pas encore","Argent, puces, électricité, algorithmes : beaucoup pensent qu'on y arrivera ; soyons prêts"],"illus":"attention"},{"type":"texte","titre":"De quoi est faite une IA ? Trois couches","illus":"couches","couches":["algorithmes : le moteur","calcul : les puces","données : le carburant"],"points":["Les données, le carburant : les textes, images et sons dont la machine apprend","Le calcul, la puissance : puces graphiques (GPU), serveurs, centres de données","Les algorithmes, le moteur : la recette qui transforme les données en savoir-faire","Les trois avancent ensemble : l'histoire qui suit est celle de ces trois couches"]},{"type":"section","numero":"3","titre":"Le rêve des machines","periode":"De l'Antiquité à 1949","texte":"Bien avant les ordinateurs, les humains ont imaginé et construit des machines qui imitent la vie, puis des machines qui calculent.","illus":"engrenages"},{"type":"texte","titre":"Des automates dans les mythes et les ateliers","points":["Mythe grec : Talos, géant de bronze qui garde la Crète","Ier siècle : Héron d'Alexandrie décrit des automates de théâtre","1739 : le canard de Vaucanson bat des ailes et « digère »","Vers 1770 : l'Écrivain des Jaquet-Droz trace des lettres à la plume"],"illus":"engrenages"},{"type":"texte","titre":"Al-Jazari, l'ingénieur des machines ingénieuses","annee":"1206","points":["Ingénieur de la cour artuqide, en Haute-Mésopotamie","Écrit en 1206 le *Livre de la connaissance des procédés mécaniques ingénieux*","Décrit une cinquantaine de machines : horloges, pompes, automates","Son horloge-éléphant marque les heures par des automates"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"Des machines qui calculent","points":["1642 : Blaise Pascal construit la Pascaline, qui additionne","1673 : Leibniz présente une machine qui multiplie","1837 : Charles Babbage conçoit la machine analytique, programmable par cartes perforées","La machine analytique ne sera jamais achevée de son vivant"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathématicienne, première programmeuse","points":["1843 : ses notes sur la machine analytique de Babbage","Elle y écrit un algorithme pour calculer les nombres de Bernoulli","Elle imagine que la machine pourrait composer de la musique"],"citation":"La machine analytique n'a aucune prétention à créer quoi que ce soit.","source":"Ada Lovelace, notes de 1843"},{"type":"texte","titre":"Quand la pensée devient calcul","points":["1854 : George Boole réduit le raisonnement à des calculs sur vrai et faux","1936 : Alan Turing décrit une machine abstraite capable de tout calcul","Un ruban, une tête de lecture, une table de règles : c'est la « machine de Turing »","Tout ordinateur actuel est, en principe, une machine de Turing"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathématicien, père de l'informatique théorique","points":["1936 : la machine universelle","1939–1945 : contribue à casser le code Enigma à Bletchley Park","1950 : « Computing Machinery and Intelligence », l'article fondateur"],"citation":"Je propose d'examiner la question suivante : les machines peuvent-elles penser ?","source":"Alan Turing, Mind, 1950"},{"type":"schema","titre":"Le neurone formel","annee":"1943","illus":"neurone","points":["Warren McCulloch et Walter Pitts modélisent un neurone par un calcul","Il additionne des signaux d'entrée et « s'active » au-delà d'un seuil","C'est l'ancêtre de tous les réseaux de neurones actuels"]},{"type":"texte","titre":"Les premiers ordinateurs","points":["1945 : l'ENIAC, 30 tonnes, calcule des trajectoires balistiques","1948 : Claude Shannon fonde la théorie de l'information","Le bit devient l'unité de toute information : texte, image, son","Les machines existent enfin ; reste à les rendre « intelligentes »"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"4","titre":"La naissance de l'IA","periode":"1950–1980","texte":"Une question qui semblait absurde : un ordinateur peut-il penser ? Deux réponses vont s'affronter : écrire des règles, ou copier les neurones.","illus":"ampoule"},{"type":"schema","titre":"Le jeu de l'imitation","annee":"1950","illus":"imitation","points":["Un juge dialogue par écrit avec deux interlocuteurs cachés","L'un est un humain, l'autre une machine","Si le juge ne sait pas les distinguer, la machine « réussit »"]},{"type":"citation","texte":"Chaque aspect de l'apprentissage ou de toute autre caractéristique de l'intelligence peut en principe être décrit si précisément qu'une machine peut être construite pour le simuler.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposition pour l'atelier de Dartmouth, 31 août 1955"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Informaticien, a donné son nom à l'IA","points":["Été 1956 : organise l'atelier de Dartmouth, acte de naissance de l'IA","1958 : crée le langage Lisp, longtemps langage de l'IA","Avec lui : Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"encart":"dartmouth"},{"type":"texte","titre":"Le premier programme « intelligent »","annee":"1956","points":["Le Logic Theorist d'Allen Newell, Herbert Simon et Cliff Shaw","Il démontre 38 des 52 premiers théorèmes des *Principia Mathematica*","Pour l'un d'eux, une preuve plus élégante que celle des auteurs","Une idée clé : chercher parmi des possibilités avec des règles"],"illus":"arbre"},{"type":"texte","titre":"L'âge des règles : SI… ALORS…","points":["Première époque de l'IA : l'âge de la logique, ou des règles","Pour agir comme nous, la machine reçoit des règles : « SI ceci, ALORS cela »","Résultat : un bon exécutant qui suit des étapes, pas une intelligence","Mais les règles sont faites pour être brisées… et un jeune chercheur va s'en charger"],"illus":"regles"},{"type":"portrait","personne":"perceptron","nom":"Frank Rosenblatt et le Mark I Perceptron","dates":"1957–1960","role":"Psychologue au Cornell Aeronautical Laboratory (Buffalo, États-Unis)","points":["Au lieu de règles fixes, apprendre comme un humain : copier les neurones du cerveau","Une « rétine » de 20 × 20 = 400 cellules photoélectriques traduit l'image en nombres","Cercle ou carré ? S'il se trompe, il corrige ses poids : il apprend de ses erreurs"],"citation":"La première machine capable d'avoir une idée originale","source":"Frank Rosenblatt, 1958","illus":"perceptron"},{"type":"schema","titre":"Comment décide le perceptron","annee":"1958","illus":"perceptron","points":["Chaque information d'entrée est multipliée par un *poids*, puis tout est additionné","Somme au-dessus du seuil → 1, en dessous → 0 : comme un neurone qui s'active ou non","Ingénieur ? La moyenne au bac pèse lourd ; la taille, presque rien","Sportif ? L'inverse : la taille compte (volley, basket). Chaque information a son poids"]},{"type":"citation","texte":"La Marine a dévoilé aujourd'hui l'embryon d'un ordinateur électronique qui, espère-t-elle, pourra marcher, parler, voir, écrire, se reproduire et avoir conscience de son existence.","auteur":"*The New York Times*","source":"« New Navy Device Learns by Doing », 8 juillet 1958"},{"type":"texte","titre":"Arthur Samuel : apprendre en jouant","annee":"1959","points":["Chez IBM, Arthur Samuel crée un programme de dames qui progresse en jouant contre lui-même","1959 : son article lance l'expression « machine learning », l'apprentissage automatique","Après 8 à 10 heures de jeu, le programme joue mieux que son propre créateur","Deux voies se dessinent : écrire les règles, ou les faire apprendre"],"illus":"dames"},{"type":"citation","texte":"Les machines seront capables, d'ici vingt ans, de faire tout travail qu'un homme peut faire.","auteur":"Herbert Simon","source":"1965"},{"type":"chat","titre":"ELIZA, la première psychothérapeute artificielle","annee":"1966","legende":"Extrait de l'article de Joseph Weizenbaum (1966), traduit","echanges":[{"qui":"h","texte":"Les hommes sont tous pareils."},{"qui":"m","texte":"EN QUEL SENS ?"},{"qui":"h","texte":"Ils nous embêtent toujours avec une chose ou une autre."},{"qui":"m","texte":"POUVEZ-VOUS DONNER UN EXEMPLE PRÉCIS ?"},{"qui":"h","texte":"Eh bien, c'est mon ami qui m'a fait venir ici."},{"qui":"m","texte":"VOTRE AMI VOUS A FAIT VENIR ICI."}]},{"type":"texte","titre":"Shakey, le premier robot qui raisonne","annee":"1966–1972","points":["Construit au Stanford Research Institute (SRI)","Il perçoit son environnement avec une caméra","Il planifie une suite d'actions pour atteindre un but","Pour lui naît l'algorithme A*, encore utilisé pour calculer des itinéraires"],"personne":"shakey","illus":"robot"},{"type":"schema","titre":"1969 : le mur du XOR","annee":"1969","illus":"xor","points":["1969 : Marvin Minsky et Seymour Papert (MIT) publient le livre *Perceptrons*","Le perceptron sépare deux groupes par une ligne droite : cercle ou carré, malade ou sain","Porte à deux clés : elle s'ouvre si l'un OU l'autre tourne sa clé, pas si les deux le font","Il faut une règle sur une règle : aucune ligne ne suffit, c'est le « OU exclusif » (XOR)"],"personne":"minsky"},{"type":"schema","titre":"Le premier hiver de l'IA","annee":"1974–1980","illus":"courbe","points":["Après *Perceptrons*, la peur : l'argent pour les réseaux de neurones s'arrête","1973 : le rapport Lighthill (Royaume-Uni) juge les promesses non tenues ; crédits coupés","Vers 1974, aux États-Unis, la DARPA exige des résultats militaires et réduit ses crédits","Réseaux de neurones : une quinzaine d'années de doute, « seul le cerveau est intelligent »"]},{"type":"section","numero":"5","titre":"Des règles aux données","periode":"1980–2005","texte":"Les règles conquièrent les entreprises, puis se heurtent au réel. Pendant ce temps, les machines commencent à apprendre à partir d'exemples.","illus":"regles"},{"type":"schema","titre":"Mettre le savoir en règles","illus":"regles","points":["Une base de faits, une base de règles SI … ALORS …, un moteur d'inférence","Années 1970 : MYCIN, à Stanford, diagnostique des infections du sang","1980 : XCON configure les ordinateurs de l'entreprise DEC","Les entreprises investissent : l'IA devient une industrie"]},{"type":"texte","titre":"Apprendre plutôt que tout écrire","points":["Chat, chien ou hyène ? Tous ont une queue, deux yeux, du poil : les règles s'y perdent","Il faut apprendre comme un enfant : voir beaucoup d'exemples et repérer les différences","Années 1980 : des ordinateurs plus rapides et moins chers ; on expérimente librement","Les données sont la salle de sport de l'IA : plus il y en a, plus le muscle se renforce"],"illus":"donnees"},{"type":"deux","titre":"Deux façons de faire une IA","gauche":{"titre":"IA symbolique","points":["Un expert écrit les règles","Explicable : on suit le raisonnement","Fragile hors de son domaine","Exemple : un système expert"]},"droite":{"titre":"Apprentissage automatique","points":["La machine tire des régularités des exemples","Souvent difficile à expliquer","Robuste, s'il y a beaucoup de données","Exemple : un filtre anti-spam"]}},{"type":"texte","titre":"Le retour des neurones","annee":"1986","points":["L'idée : empiler des perceptrons en couches, comme les feuilles d'un plat de lasagnes","Chaque couche vérifie une condition et passe à la suivante : le XOR devient possible","Plus le problème est compliqué, plus on ajoute de couches","1986 : Rumelhart, Hinton et Williams popularisent la rétropropagation pour les entraîner"],"personne":"rumelhart","illus":"reseau"},{"type":"schema","titre":"Faire remonter l'erreur","annee":"1986","illus":"retro","points":["La machine répond ; le maître compare avec la bonne réponse : juste ou faux ?","Si c'est faux, elle remonte les couches : quels poids ont causé l'erreur, et de combien ?","Elle corrige ces poids et recommence, des milliers de fois : c'est la rétropropagation","Un maître qui connaît la réponse : c'est l'apprentissage *supervisé*"]},{"type":"portrait","personne":"lecun","nom":"Yann LeCun et LeNet","dates":"1989–1998","role":"Chercheur français aux Bell Labs, puis à la tête de la recherche en IA de Meta","points":["1989 : son réseau lit les chiffres écrits à la main sur les codes postaux américains","Pour la première fois, l'IA fait un vrai travail, hors du laboratoire","Dès 1996, LeNet lit les chèques : vers 2001, environ 10 % des chèques américains"],"illus":"reseau"},{"type":"texte","titre":"Le second hiver","annee":"1987–1993","points":["1987 : le marché des machines Lisp s'effondre ; les systèmes experts déçoivent","Les réseaux restent faibles : entraînement trop lent, ordinateurs pas assez puissants","Pas un échec, mais des attentes trop hautes : après 5 buts, 2 buts semblent une défaite","Pour les réseaux de neurones, le froid dure jusque vers 2006"],"illus":"flocon"},{"type":"portrait","personne":"deepblue","nom":"Deep Blue contre Kasparov","dates":"Mai 1997","role":"L'ordinateur d'IBM bat le champion du monde d'échecs","points":["New York, six parties : 2 victoires, 1 défaite, 3 nulles, soit 3½ à 2½","Partie 2 : un coup si « humain » que Kasparov accuse IBM de tricher","Aucun réseau de neurones : 200 millions de positions par seconde et des règles d'experts"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"L'apprentissage s'installe partout","evenements":[{"annee":"1992","titre":"TD-Gammon","texte":"Un réseau apprend le jacquet en jouant contre lui-même, sans parties humaines"},{"annee":"1997","titre":"Mémoire (LSTM)","texte":"Hochreiter et Schmidhuber donnent aux réseaux une mémoire pour lire des suites"},{"annee":"2001","titre":"Visages","texte":"Viola et Jones : une machine apprend à repérer les visages en temps réel"},{"annee":"2002","titre":"Filtres anti-spam","texte":"Des filtres apprennent de vos propres courriels à reconnaître le spam"},{"annee":"2005","titre":"Stanley","texte":"Une voiture sans conducteur de Stanford gagne la course du désert de la DARPA"}]},{"type":"section","numero":"6","titre":"La révolution de l'apprentissage profond","periode":"2006–2017","texte":"En plein hiver, un chercheur relance les réseaux profonds. En 2012, données, cartes graphiques et algorithmes se rencontrent : la machine apprend à voir, à créer, puis à battre les champions.","illus":"reseau"},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Né en 1947","role":"Chercheur à l'université de Toronto, pionnier des réseaux de neurones","points":["Il défend les réseaux de neurones pendant les deux hivers, contre presque tout le monde","2006 : il entraîne un réseau profond couche par couche ; « profond » = beaucoup de couches","Prix Turing 2018 (avec Bengio et LeCun), prix Nobel de physique 2024 (avec Hopfield)"]},{"type":"schema","titre":"Des cartes graphiques pour calculer","annee":"2007","illus":"gpu","puces":["CPU : 4 cœurs","GPU : des milliers"],"personne":"gpu","points":["Les cartes graphiques (GPU) servent aux jeux vidéo : des millions de pixels à la fois","2007 : avec CUDA, NVIDIA permet de les programmer pour n'importe quel calcul","Un CPU a quelques gros cœurs ; un GPU, des centaines puis des milliers de petits","Un réseau s'entraîne jusqu'à 70 fois plus vite ; en 2016, Google dévoile ses puces TPU"]},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li et ImageNet","dates":"2009–2017","role":"Chercheuse à Princeton, puis à Stanford : elle mise sur les données","points":["2009 : ImageNet ; la base dépassera 14 millions d'images, en près de 22 000 catégories","Étiquetées à la main par près de 49 000 personnes de 167 pays, via Amazon Mechanical Turk","De 2010 à 2017, un concours annuel : quel programme reconnaît le mieux 1 000 catégories ?"],"illus":"imagenet"},{"type":"texte","titre":"2011 : l'IA sort du laboratoire","annee":"2011","points":["Février 2011 : Watson, d'IBM, bat les deux plus grands champions du jeu *Jeopardy!*","Des indices pleins de jeux de mots : il faut saisir le contexte, pas seulement savoir","Watson gagne 1 million de dollars, qu'IBM offre à des œuvres caritatives","Octobre 2011 : Siri arrive sur l'iPhone 4S ; des millions de gens parlent à leur téléphone"],"personne":"watson"},{"type":"texte","titre":"2012 : la machine découvre le chat toute seule","annee":"2012","points":["Google Brain (Andrew Ng, Jeff Dean) relie 1 000 ordinateurs : 16 000 cœurs de calcul","Le réseau regarde 10 millions d'images tirées de vidéos YouTube ; personne ne lui dit rien","Seul, il forme un détecteur de « chat » : c'est l'apprentissage *non supervisé*","Premier signe qu'un réseau profond peut trouver des concepts, pas seulement mémoriser"],"illus":"chat"},{"type":"schema","titre":"2012 : AlexNet, les trois engrenages se rencontrent","annee":"2012","illus":"engrenages","points":["Krizhevsky, Sutskever et Hinton (Toronto) entraînent un réseau profond sur deux GPU de jeu","Concours ImageNet 2012 : 15,3 % d'erreur, contre 26,2 % pour le deuxième","Algorithmes (réseaux profonds) + données (ImageNet) + calcul (GPU) : tout se rencontre","Le deuxième printemps de l'IA commence : l'ère de l'apprentissage profond"]},{"type":"schema","titre":"Un réseau profond, couche après couche","illus":"reseau","points":["Les premières couches repèrent des traits simples : bords, taches","Les couches suivantes combinent : formes, textures, parties","Les dernières reconnaissent des objets entiers : « chat », « voiture »","Chaque couche apprend seule ce qu'elle doit repérer"]},{"type":"schema","titre":"2014 : le faussaire et le détective","annee":"2014","illus":"gan","roles":["faussaire","détective"],"personne":"goodfellow","points":["Ian Goodfellow invente les GAN : deux réseaux qui s'entraînent l'un contre l'autre","Le faussaire fabrique de fausses images ; le détective essaie de les démasquer","Chaque fois qu'il est pris, le faussaire s'améliore ; le détective aussi","Des images presque vraies, puis les « deepfakes » : l'IA ne juge plus seulement, elle crée"]},{"type":"schema","titre":"Le go : plus de positions que d'atomes","illus":"go10","echelle":["échecs 10⁴³","atomes 10⁸⁰","go 10¹⁷⁰"],"personne":"goban","points":["Plateau de 19 × 19 lignes, pierres noires et blanches : il faut encercler l'adversaire","Né en Chine il y a plus de 2 500 ans, c'est un jeu d'intuition plus que de calcul","Échecs : environ 10⁴³ positions possibles (Shannon, 1950) ; go : environ 10¹⁷⁰","C'est bien plus que les quelque 10⁸⁰ atomes de l'univers observable"]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo et le coup 37","dates":"Mars 2016, Séoul","role":"DeepMind (Google), cofondée par Demis Hassabis","points":["Cinq parties contre Lee Sedol, légende du go : tous attendent la victoire de l'humain","Partie 2, coup 37 : un coup qu'aucun humain n'aurait joué ; on croit à une erreur","AlphaGo gagne 4 à 1 ; Lee Sedol gagne la partie 4 grâce à son propre coup génial, le 78e"],"citation":"Ce n'est pas un coup humain. Je n'ai jamais vu un humain jouer ce coup. Si beau.","source":"Fan Hui, champion d'Europe de go, dans *Wired*, mars 2016","illus":"go","encart":"leesedol"},{"type":"texte","titre":"AlphaZero, puis AlphaFold : du jeu à la science","annee":"2017–2024","points":["2017 : AlphaGo Zero apprend le go en jouant contre lui-même, sans aucune partie humaine","En 3 jours, il bat 100 à 0 la version qui avait vaincu Lee Sedol","AlphaZero apprend aussi les échecs et le shogi, avec les seules règles, en quelques heures","2020 : AlphaFold prédit la forme des protéines ; Nobel de chimie 2024 (Hassabis, Jumper)"],"illus":"echecs"},{"type":"frise","titre":"Trois victoires, trois façons de battre l'humain","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"Le calcul : 200 millions de positions par seconde et des règles écrites par des experts"},{"annee":"2011","titre":"Watson","texte":"Le langage : il gagne *Jeopardy!*, jeu plein de sous-entendus, et 1 million de dollars"},{"annee":"2016","titre":"AlphaGo","texte":"La créativité : au go, 10¹⁷⁰ positions ; le coup 37 surprend ses propres créateurs"},{"annee":"2017","titre":"AlphaGo Zero","texte":"Sans parties humaines : en 3 jours de jeu contre lui-même, il bat AlphaGo 100 à 0"},{"annee":"2024","titre":"AlphaFold","texte":"Des jeux à la science : la forme des protéines, et le prix Nobel de chimie"}]},{"type":"section","numero":"7","titre":"Transformers et IA générative","periode":"2017–2026","texte":"Jusqu'ici, la machine jugeait. Avec le Transformer (2017), elle apprend à lire des textes entiers, puis se met à écrire, dessiner, composer et créer des vidéos.","illus":"attention"},{"type":"deux","titre":"Du classement à la création","gauche":{"titre":"L'IA qui juge (hier)","points":["Une photo : « chat ou chien ? »","Un chèque : quel montant est écrit ?","Un malade : quel risque de maladie ?","Elle répond par une étiquette ou un pourcentage"]},"droite":{"titre":"L'IA qui génère (aujourd'hui)","points":["Elle a appris des motifs : visages, ordre des mots, sons","Elle produit du neuf : images, musique, histoires","Elle imite un style : « à la manière de Picasso, de Dalí »","Inventer un style vraiment nouveau ? La question reste ouverte"]}},{"type":"schema","titre":"« Attention Is All You Need »","annee":"2017","illus":"attention","points":["Juin 2017 : huit chercheurs de Google présentent le **Transformer**, testé sur la traduction","Il lit toute la phrase d'un coup : l'**attention** relie chaque mot à ceux qui l'éclairent","« L'étudiante ouvrit le livre car elle… » : « elle » regarde « étudiante »","C'est le « T » de GPT ; tous les grands modèles de langue en descendent (partie 9)"]},{"type":"frise","titre":"De GPT-1 à ChatGPT","evenements":[{"annee":"2018","titre":"GPT-1 et BERT","texte":"OpenAI entraîne GPT-1 sur plus de 7 000 livres inédits ; Google lance BERT"},{"annee":"2019","titre":"GPT-2","texte":"1,5 milliard de paramètres ; OpenAI retarde sa diffusion complète par peur des abus"},{"annee":"2020","titre":"GPT-3","texte":"175 milliards de paramètres : il rédige, résume et reformule"},{"annee":"2022","titre":"ChatGPT","texte":"30 novembre : 1 million d'utilisateurs en 5 jours, 100 millions en 2 mois"},{"annee":"2023","titre":"GPT-4","texte":"14 mars : il accepte aussi des images et réussit un examen du barreau simulé"}]},{"type":"frise","titre":"Vers le multimodal : voir, lire, parler","evenements":[{"annee":"2014","titre":"Légendes","texte":"Un réseau qui voit et un réseau qui écrit, collés ensemble, décrivent une photo"},{"annee":"2021","titre":"CLIP","texte":"400 millions de paires image-texte : images et mots dans le même espace"},{"annee":"2022","titre":"Diffusion","texte":"DALL·E 2, Stable Diffusion : une image naît d'un bruit qu'on débruite"},{"annee":"2023","titre":"Ponts","texte":"On relie un grand modèle de vision à un grand modèle de langue"},{"annee":"2024","titre":"Natif","texte":"Un seul réseau pour le texte, l'image et la voix : environ un tiers de seconde pour répondre"}]},{"type":"texte","titre":"2026 : printemps éternel ou nouvel hiver ?","illus":"saisons","courbes":["attentes","capacités"],"points":["L'IA est multimodale : elle écrit, résume, dessine, compose, fait des vidéos, programme","La question de toute cette histoire : nos attentes dépassent-elles ses capacités ?","Si oui, un nouvel hiver peut venir, même quand les réussites restent immenses","La leçon des deux hivers : juger sur les résultats, pas sur les promesses"]},{"type":"section","numero":"8","titre":"Comment une machine apprend-elle ?","periode":"Épisode 3 : le réseau de neurones","texte":"Ouvrons la machine : comment un réseau de neurones artificiels apprend-il ? Mais d'abord, une histoire.","illus":"reseau"},{"type":"texte","titre":"Une nuit à Tempe","annee":"2018","personne":"ubercar","points":["18 mars 2018, vers 22 h, Tempe (Arizona) : une femme traverse une rue sombre avec son vélo","Sur le vélo, ses sacs de courses. Une voiture arrive, ne freine pas à temps : elle meurt","La voiture se conduisait seule : un essai d'Uber, avec une conductrice de sécurité à bord","Ses capteurs l'avaient « vue ». Pourquoi n'a-t-elle pas compris ? Uber suspend ses essais"]},{"type":"texte","titre":"Copier la nature","illus":"oiseau","points":["Pour voler, on a observé les oiseaux ; pour bâtir une intelligence, on observe le cerveau","Le cerveau humain compte environ 86 milliards de neurones, reliés entre eux","Comprendre comment ils travaillent, c'est peut-être s'approcher de l'IA générale","De cette idée naît le réseau de neurones artificiels : une copie très simplifiée"]},{"type":"schema","titre":"Le jeu des devinettes : quel est son métier ?","illus":"devinette","indices":["casque : 90 %","gilet : 70 %","bottes : 60 %"],"resultat":"ingénieur","points":["Blouse blanche, stéthoscope autour du cou : c'est un médecin. Facile !","Puis une équipe qui ignore nos métiers : chacun ne voit qu'un bout de la photo","L'un voit la tête (casque ? casquette ?), l'autre les habits, le dernier les chaussures","Casque 90 %, gilet 70 %, bottes de sécurité 60 % : l'équipe conclut « ingénieur »"]},{"type":"schema","titre":"Anatomie d'une décision : poids, biais, activation","illus":"decision","etapes":["entrées × poids","somme + biais","activation"],"points":["Poids = importance : casque 100, gilet 70, bottes 50 (l'indice le plus douteux)","(0,9 × 100 + 0,7 × 70 + 0,6 × 50) ÷ 220 = 169 ÷ 220 ≈ 77 % « ingénieur »","Biais : un nombre ajouté à la somme, qui corrige un penchant (bottes surestimées)","Activation : pas « ingénieur ou non », mais « 60 % ingénieur, 30 % soldat… »"]},{"type":"schema","titre":"Niveau 2 : le soldat en tenue camouflée","illus":"devinette","indices":["casque : 90 %","gilet : 70 %","bottes : 60 %"],"resultat":"ingénieur ✗","points":["Même casque, même gilet, mêmes bottes… mais une tenue camouflée : un soldat en service","L'équipe a répondu « ingénieur » : la couleur des vêtements n'avait aucun poids","On lui signale l'erreur, elle ajuste : désormais, la couleur compte. C'est cela, apprendre","Plus d'équipes (objet tenu, véhicule, décor) = plus de paramètres = de meilleures réponses"]},{"type":"texte","titre":"Un réseau de neurones, en une phrase","illus":"reseau","points":["Chaque neurone artificiel reçoit des indices et leur donne une probabilité et un poids","Il transmet sa conclusion à la couche suivante, jusqu'à la réponse finale","Apprendre = ajuster les poids après chaque erreur : des millions, puis des milliards","Tout cela sans rien comprendre : c'est l'idée fondatrice de l'IA d'aujourd'hui"]},{"type":"schema","titre":"Trois façons d'apprendre","illus":"apprendre","types":["supervisé","non supervisé","renforcement"],"points":["Supervisé : le maître donne la bonne réponse, même après une erreur (LeNet et les chèques)","Non supervisé : « trouve seul ce qui se répète » (le chat de Google, 2012)","Par renforcement : seulement « faux » ou « juste », jamais la réponse (AlphaGo Zero, 2017)","ChatGPT mêle les trois : lire seul, imiter des dialogues, puis être noté par des humains"]},{"type":"schema","titre":"Trop apprendre, pas assez apprendre","illus":"ajustement","cas":["pas assez","équilibre","par cœur"],"points":["Surapprentissage : sur les photos d'entraînement, tous les médecins portaient des lunettes","Le modèle donne aux lunettes un poids de 100 : un médecin sans lunettes ? « Pas médecin »","Sous-apprentissage : l'élève qui survole le livre et laisse de côté des détails importants","Même remède : plus de données, plus variées : jour et nuit, lieux, couleurs, vêtements"]},{"type":"texte","titre":"Retour à Tempe : ce qui s'est passé","annee":"2018","illus":"uber","points":["Détectée 5,6 s avant le choc, mais classée tour à tour véhicule, vélo, « autre »","Rien de prévu pour les piétons hors des passages (NTSB, 2019) : une vision trop étroite","Freinage d'urgence désactivé en mode autonome ; la conductrice regardait son téléphone","La leçon d'Uber, et la nôtre : comprendre la machine avant de lui faire confiance"]},{"type":"section","numero":"9","titre":"Comment une machine lit-elle un texte ?","periode":"Des mots aux nombres","texte":"Nous avons vu comment un modèle « voit » ; il comprend le langage de façon assez semblable. Comment transforme-t-il des mots en nombres ?","illus":"attention"},{"type":"schema","titre":"Du texte aux nombres","illus":"tokens","phrase":"Le chat boit du lait","ids":"412 8093 5871 88 2310","points":["Un ordinateur ne connaît que des nombres","Le texte est découpé en morceaux : les **tokens**","Chaque token reçoit un numéro, puis une longue liste de nombres : un **vecteur**","Le modèle ne voit jamais les lettres, seulement ces nombres"]},{"type":"schema","titre":"La carte des sens","illus":"sens","mots":["chat","chien","cheval","livre","roman","lecteur","homme","femme","roi","reine"],"points":["Chaque vecteur est une adresse sur une immense carte des sens","Les mots qui ont les mêmes voisins se rapprochent : « chat », « chien »","Le modèle l'apprend seul, en devinant des mots cachés dans des milliards de phrases","La carte garde des relations : de « homme » à « femme » comme de « roi » à « reine »"]},{"type":"schema","titre":"Le contexte donne le sens","illus":"contexte","phrase1":"la souris mange le fromage","phrase2":"je clique avec la souris","liens":[[1,4],[4,1]],"points":["Un même mot peut avoir plusieurs sens : « souris »","L'**attention** relie chaque mot à ses voisins","Avec « fromage », la souris est l'animal ; avec « clique », c'est l'objet","Le vecteur du mot est recalculé selon son contexte"]},{"type":"schema","titre":"Comment « écrit » un modèle de langue","illus":"motsuivant","points":["Il découpe le texte en morceaux, les tokens","Il calcule la probabilité de chaque token suivant","Il en choisit un, l'ajoute au texte, et recommence","Des humains notent ensuite ses réponses pour l'affiner"],"debut":"Le chat boit du","suites":["lait","café","thé","jus"]},{"type":"chat","titre":"Un dialogue avec un modèle de langue","annee":"2022","legende":"Exemple fictif, écrit pour la classe","echanges":[{"qui":"h","texte":"Explique le chaînage avant à un étudiant de littérature."},{"qui":"m","texte":"Imaginez un détective : il part des indices qu'il connaît et applique ses règles une à une, jusqu'à trouver le coupable."},{"qui":"h","texte":"Donne-moi une référence pour citer ça dans mon mémoire."},{"qui":"m","texte":"Attention : vérifiez toujours une référence dans une bibliothèque. Je peux me tromper ou en inventer."}]},{"type":"section","numero":"10","titre":"L'ère des agents","periode":"2023–2026","texte":"Le modèle de langue ne se contente plus de répondre : il planifie, utilise des outils et agit.","illus":"agent"},{"type":"texte","titre":"Qu'est-ce qu'un agent ?","points":["Un agent perçoit son environnement et agit sur lui pour atteindre un but","Un thermostat est un agent très simple : il mesure, puis chauffe ou non","Russell et Norvig (1995) définissent toute l'IA comme l'étude des agents","Un agent d'IA moderne reçoit un objectif, pas seulement une question"],"illus":"thermostat"},{"type":"schema","titre":"La boucle d'un agent","illus":"boucle","points":["Objectif : ce que l'utilisateur demande","Réfléchir : le modèle planifie l'étape suivante","Agir : il utilise un outil (recherche, calcul, fichier, navigateur)","Observer : il lit le résultat, puis recommence jusqu'au but"]},{"type":"frise","titre":"Des agents conversationnels aux agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Des chercheurs font alterner raisonnement et actions dans un même modèle"},{"annee":"2023","titre":"Outils","texte":"GPT-4 ; les modèles apprennent à appeler des outils et des programmes"},{"annee":"2024","titre":"Raisonner, agir","texte":"Modèles qui réfléchissent avant de répondre ; un modèle pilote un ordinateur ; protocole MCP pour brancher des outils"},{"annee":"2025","titre":"Agents au travail","texte":"Agents qui naviguent sur le Web, écrivent et corrigent des programmes"},{"annee":"2026","titre":"Au quotidien","texte":"Les agents s'installent dans les logiciels de bureau, de recherche et d'enseignement"}]},{"type":"deux","titre":"Agent conversationnel ou agent ?","gauche":{"titre":"Agent conversationnel","points":["Répond à une question","Produit du texte","Un seul tour","L'humain fait le reste"]},"droite":{"titre":"Agent","points":["Poursuit un objectif","Utilise des outils et agit","Plusieurs étapes, il corrige son plan","L'humain supervise et valide"]}},{"type":"texte","titre":"Les risques, et les bonnes pratiques","points":["Hallucinations : un agent peut agir sur une information fausse","Actions irréversibles : effacer, envoyer, payer ; il faut valider","Consignes cachées dans une page Web peuvent détourner un agent","Données personnelles : la loi algérienne 18-07 s'applique","2024 : l'Union européenne adopte le règlement sur l'IA (AI Act)"],"illus":"bouclier"},{"type":"texte","titre":"Et en Algérie ?","points":["2021 : ouverture de l'École nationale supérieure d'intelligence artificielle (ENSIA)","L'arabe, la darja et le tamazight restent moins bien servis par les modèles","Des corpus locaux, construits en SHS, sont une vraie contribution","Vos mémoires peuvent y participer : textes, enquêtes, entretiens"],"illus":"carte"},{"type":"section","numero":"11","titre":"Synthèse","periode":"De 1206 à 2026","texte":"Huit siècles de rêves, soixante-dix ans de science, quelques années d'agents.","illus":"frise"},{"type":"frise","titre":"Les huit dates à retenir","evenements":[{"annee":"1843","titre":"Lovelace","texte":"Premier programme, pour une machine jamais achevée"},{"annee":"1950","titre":"Turing","texte":"Les machines peuvent-elles penser ?"},{"annee":"1956","titre":"Dartmouth","texte":"L'IA reçoit son nom"},{"annee":"1974","titre":"Hiver","texte":"Premier hiver de l'IA"},{"annee":"1997","titre":"Deep Blue","texte":"L'ordinateur bat le champion d'échecs"},{"annee":"2012","titre":"AlexNet","texte":"L'apprentissage profond l'emporte"},{"annee":"2017","titre":"Transformer","texte":"L'attention au cœur des modèles de langue"},{"annee":"2022","titre":"ChatGPT","texte":"L'IA générative pour tous ; puis viennent les agents"}]},{"type":"deux","titre":"Les familles d'IA, sur une seule diapositive","gauche":{"titre":"Selon la méthode","points":["Symbolique : des règles écrites","Apprentissage automatique : des exemples","Apprentissage profond : des réseaux à nombreuses couches","Renforcement : des essais et des récompenses"]},"droite":{"titre":"Selon l'ambition","points":["IA faible (étroite) : une tâche précise","IA forte (générale) : toutes les tâches, hypothétique","Les agents actuels restent des IA faibles","… mais de plus en plus polyvalentes"]}},{"type":"texte","titre":"Quatre leçons de 90 ans d'IA","illus":"saisons","courbes":["attentes","puissance de calcul"],"points":["Le danger n'est pas l'échec, mais les attentes démesurées : c'est ce qui a causé les deux hivers","Les vieilles idées reviennent avec les données et le calcul : le perceptron de 1958 vit dans ChatGPT","Réussir un test n'est pas comprendre : généraliser au monde réel reste le plus difficile","Printemps éternel, ou nouvel hiver ? Jugez sur les résultats, pas sur les promesses"]},{"type":"video","titre":"Vidéo : l'histoire complète de l'IA (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"« The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence », documentaire en anglais, sur YouTube"},{"type":"video","titre":"Vidéo : cent ans d'intelligence artificielle","youtube":"mSd9nmPM7Vg","legende":"« The Entire History of Artificial Intelligence (Last 100 Years) », documentaire en anglais, sur YouTube"},{"type":"quiz","question":"En quelle année l'expression « intelligence artificielle » s'impose-t-elle, avec l'atelier de Dartmouth ?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"L'expression apparaît dans la proposition de 1955 et s'impose avec l'atelier de l'été 1956."},{"type":"quiz","question":"Pourquoi parle-t-on d'« hivers » de l'IA ?","choix":["Les ordinateurs chauffaient trop","La déception a fait chuter les crédits et l'intérêt","Les recherches se faisaient l'hiver","Les machines ont été interdites"],"reponse":1,"explication":"Après des promesses démesurées, les résultats ont déçu : les financements ont été coupés (1974–1980, puis 1987–1993)."},{"type":"quiz","question":"Qu'est-ce qui distingue un agent d'un simple agent conversationnel ?","choix":["Il écrit plus vite","Il poursuit un objectif en agissant avec des outils","Il ne fait jamais d'erreur","Il fonctionne sans électricité"],"reponse":1,"explication":"Un agent enchaîne des actions (chercher, calculer, écrire un fichier…) et observe les résultats pour atteindre un but."},{"type":"quiz","question":"ELIZA (1966) comprenait-elle ce qu'on lui disait ?","choix":["Oui, comme un psychologue","Non : elle transformait les phrases avec des règles","Oui, grâce à l'apprentissage profond","On ne le sait pas"],"reponse":1,"explication":"ELIZA repérait des mots-clés et renvoyait des phrases types. Croire qu'elle comprenait, c'est l'« effet ELIZA »."},{"type":"quiz","question":"Pourquoi le perceptron simple ne peut-il pas apprendre la « porte à deux clés » (le XOR) ?","choix":["Il n'a pas assez de mémoire","Une seule ligne droite ne sépare pas les deux groupes","Le XOR n'existe pas en mathématiques","Il lui faut une caméra plus précise"],"reponse":1,"explication":"Le perceptron trace une seule frontière droite ; le XOR demande deux règles l'une sur l'autre, donc au moins deux couches, entraînées par rétropropagation."},{"type":"quiz","question":"Un modèle n'a vu que des médecins portant des lunettes ; face à un médecin sans lunettes, il répond « pas médecin ». Quel est ce défaut ?","choix":["Le sous-apprentissage","Le surapprentissage","L'hallucination","Le biais d'activation"],"reponse":1,"explication":"Il a appris par cœur un détail de ses exemples au lieu de la règle générale : c'est le surapprentissage. Remède : des exemples plus nombreux et plus variés."},{"type":"quiz","question":"Google Traduction est un exemple de quel type d'IA ?","choix":["Une IA étroite","Une IA générale","Une super-intelligence","Un agent autonome"],"reponse":0,"explication":"Génial en traduction, il ne sait ni jouer aux échecs ni programmer : il excelle dans une seule tâche. C'est une IA étroite."},{"type":"quiz","question":"En 2012, qu'est-ce qui a rendu possible la victoire d'AlexNet ?","choix":["Un algorithme entièrement nouveau, à lui seul","Des millions d'images, à elles seules","Des cartes graphiques, à elles seules","Réseau profond, images d'ImageNet et cartes graphiques réunis"],"reponse":3,"explication":"Les idées dataient des années 1980 ; il fallait aussi les images d'ImageNet et la puissance des GPU. Les trois engrenages se sont enfin rencontrés."},{"type":"quiz","question":"Tempe, 2018 : pourquoi la voiture d'essai d'Uber n'a-t-elle pas réagi à temps ?","choix":["Elle n'avait aucun capteur capable de voir la nuit","Elle roulait bien trop vite pour pouvoir freiner à temps","Elle n'avait pas appris qu'on traverse hors des passages et hésitait sur ce qu'elle voyait","La passante était invisible pour ses caméras comme pour ses radars"],"reponse":2,"explication":"Repérée 5,6 s avant le choc, elle n'a jamais été reconnue comme piétonne : le système ne prévoyait pas qu'on traverse hors d'un passage (NTSB, 2019)."},{"type":"fin","titre":"À retenir","points":["L'IA se répand plus vite que le PC, le mobile et Internet : un enjeu d'États et d'emplois","L'IA imite l'intelligence : elle paraît comprendre ; l'IA générale n'existe pas encore","Règles et neurones alternent ; les hivers naissent d'attentes démesurées","2012 : données, cartes graphiques et réseaux profonds se rencontrent","Un réseau pèse des indices, corrige ses erreurs ; il échoue s'il apprend trop ou trop peu","Qui donne le pouvoir à la machine ? Vérifier, garder la main, déclarer son usage"],"texte":"Travail personnel : choisissez une date de la frise et écrivez dix lignes sur ce qu'elle a changé, en citant une source vérifiée."}]},"en":{"langue":"en","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","diapos":[{"type":"couverture","surtitre":"Artificial intelligence · Chapter 1 · First lesson","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","illus":"agent"},{"type":"plan","titre":"This lesson's journey","points":["Why AI, and why now? (2026)","What is AI? (definitions)","The dream of machines (from Antiquity to 1949)","The birth of AI (1950–1980)","From rules to data (1980–2005)","The deep learning revolution (2006–2017)","Transformers and generative AI (2017–2026)","How does a machine learn? (episode 3: the neural network)","How does a machine read a text? (from words to numbers)","The age of agents (2023–2026)","Summary (from 1206 to 2026)"]},{"type":"section","numero":"1","titre":"Why AI, and why now?","periode":"2026","texte":"Every time we think we have understood AI, it surprises us again. Why is everything speeding up now?","illus":"ampoule"},{"type":"texte","titre":"AI keeps surprising us","illus":"capacites","etapes":["calculate","play","translate","write","draw","film"],"points":["It calculated, played chess, translated, wrote, drew, filmed… and tomorrow?","Each time we say “this is its limit”, and each time it goes further","What I thought only a human could do, a machine now does, thousands of times faster","The question of this course: what is AI, and why now?"]},{"type":"texte","titre":"“The last invention”: why now?","illus":"adoption","courbes":["computer","phone","Internet","generative AI"],"points":["In three years, generative AI spread faster than the PC, the mobile phone and the Internet","ChatGPT alone: 900 million users every week (February 2026)","88% of organizations use it in at least one business function (McKinsey, 2025)","2025: $345 billion invested; 2026: over $1 trillion spent on data centers"]},{"type":"citation","texte":"The first ultraintelligent machine is the last invention that man need ever make, provided that the machine is docile enough to tell us how to keep it under control.","auteur":"Irving John Good","source":"“Speculations Concerning the First Ultraintelligent Machine”, 1965"},{"type":"texte","titre":"A race between nations","illus":"engrenages","points":["Nations are racing: whoever wins could lead the world in the years to come","“A new nuclear bomb” that does not only destroy: it builds and plans","An economic bet: AI becomes infrastructure, like electricity or the Internet","Investors want to buy the “land” early, before its price soars"]},{"type":"texte","titre":"Thinking factories: data centers","personne":"datacenter","points":["The “cloud” is on the ground: buildings full of chips, cables and cooling","The largest AI campuses exceed 1 gigawatt; Meta's Hyperion (Louisiana) aims for 5","5 GW: nearly a quarter of Algeria's record peak demand (almost 22 GW, summer 2026)","Thinking becomes a commodity: produced, sold and billed"
