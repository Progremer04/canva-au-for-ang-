antaine de machines : horloges, pompes, automates","Son horloge-éléphant marque les heures par des automates"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"Des machines qui calculent","points":["1642 : Blaise Pascal construit la Pascaline, qui additionne","1673 : Leibniz présente une machine qui multiplie","1837 : Charles Babbage conçoit la machine analytique, programmable par cartes perforées","La machine analytique ne sera jamais achevée de son vivant"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathématicienne, première programmeuse","points":["1843 : ses notes sur la machine analytique de Babbage","Elle y écrit un algorithme pour calculer les nombres de Bernoulli","Elle imagine que la machine pourrait composer de la musique"],"citation":"La machine analytique n'a aucune prétention à créer quoi que ce soit.","source":"Ada Lovelace, notes de 1843"},{"type":"texte","titre":"Quand la pensée devient calcul","points":["1854 : George Boole réduit le raisonnement à des calculs sur vrai et faux","1936 : Alan Turing décrit une machine abstraite capable de tout calcul","Un ruban, une tête de lecture, une table de règles : c'est la « machine de Turing »","Tout ordinateur actuel est, en principe, une machine de Turing"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathématicien, père de l'informatique théorique","points":["1936 : la machine universelle","1939–1945 : contribue à casser le code Enigma à Bletchley Park","1950 : « Computing Machinery and Intelligence », l'article fondateur"],"citation":"Je propose d'examiner la question suivante : les machines peuvent-elles penser ?","source":"Alan Turing, Mind, 1950"},{"type":"schema","titre":"Le neurone formel","annee":"1943","illus":"neurone","points":["Warren McCulloch et Walter Pitts modélisent un neurone par un calcul","Il additionne des signaux d'entrée et « s'active » au-delà d'un seuil","C'est l'ancêtre de tous les réseaux de neurones actuels"]},{"type":"texte","titre":"Les premiers ordinateurs","points":["1945 : l'ENIAC, 30 tonnes, calcule des trajectoires balistiques","1948 : Claude Shannon fonde la théorie de l'information","Le bit devient l'unité de toute information : texte, image, son","Les machines existent enfin ; reste à les rendre « intelligentes »"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"2","titre":"La naissance de l'IA","periode":"1950–1956","texte":"En six ans, une question devient un programme de recherche, puis une discipline avec un nom.","illus":"ampoule"},{"type":"schema","titre":"Le jeu de l'imitation","annee":"1950","illus":"imitation","points":["Un juge dialogue par écrit avec deux interlocuteurs cachés","L'un est un humain, l'autre une machine","Si le juge ne sait pas les distinguer, la machine « réussit »"]},{"type":"citation","texte":"Chaque aspect de l'apprentissage ou de toute autre caractéristique de l'intelligence peut en principe être décrit si précisément qu'une machine peut être construite pour le simuler.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposition pour l'atelier de Dartmouth, 31 août 1955"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Informaticien, a donné son nom à l'IA","points":["Été 1956 : organise l'atelier de Dartmouth, acte de naissance de l'IA","1958 : crée le langage Lisp, longtemps langage de l'IA","Avec lui : Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"encart":"dartmouth"},{"type":"texte","titre":"Le premier programme « intelligent »","annee":"1956","points":["Le Logic Theorist d'Allen Newell, Herbert Simon et Cliff Shaw","Il démontre 38 des 52 premiers théorèmes des *Principia Mathematica*","Pour l'un d'eux, une preuve plus élégante que celle des auteurs","Une idée clé : chercher parmi des possibilités avec des règles"],"illus":"arbre"},{"type":"section","numero":"3","titre":"L'âge d'or, puis le premier hiver","periode":"1956–1980","texte":"Des succès spectaculaires, des promesses démesurées, puis la déception et la fin des crédits.","illus":"courbe"},{"type":"schema","titre":"Le perceptron de Rosenblatt","annee":"1958","illus":"perceptron","points":["Frank Rosenblatt construit une machine qui apprend à reconnaître des formes","Elle ajuste elle-même ses poids après chaque erreur","La presse annonce des machines qui « pensent » : l'enthousiasme s'emballe"],"personne":"perceptron"},{"type":"texte","titre":"Apprendre sans être programmé","annee":"1959","points":["Arthur Samuel écrit un programme de jeu de dames qui s'améliore en jouant","Il invente l'expression « machine learning », apprentissage automatique","Le programme finit par battre son propre créateur","Deux voies se dessinent : écrire les règles, ou les faire apprendre"],"illus":"dames"},{"type":"chat","titre":"ELIZA, la première psychothérapeute artificielle","annee":"1966","legende":"Extrait de l'article de Joseph Weizenbaum (1966), traduit","echanges":[{"qui":"h","texte":"Les hommes sont tous pareils."},{"qui":"m","texte":"EN QUEL SENS ?"},{"qui":"h","texte":"Ils nous embêtent toujours avec une chose ou une autre."},{"qui":"m","texte":"POUVEZ-VOUS DONNER UN EXEMPLE PRÉCIS ?"},{"qui":"h","texte":"Eh bien, c'est mon ami qui m'a fait venir ici."},{"qui":"m","texte":"VOTRE AMI VOUS A FAIT VENIR ICI."}]},{"type":"texte","titre":"Shakey, le premier robot qui raisonne","annee":"1966–1972","points":["Construit au Stanford Research Institute (SRI)","Il perçoit son environnement avec une caméra","Il planifie une suite d'actions pour atteindre un but","Pour lui naît l'algorithme A*, encore utilisé pour calculer des itinéraires"],"personne":"shakey","illus":"robot"},{"type":"citation","texte":"Les machines seront capables, d'ici vingt ans, de faire tout travail qu'un homme peut faire.","auteur":"Herbert Simon","source":"1965"},{"type":"schema","titre":"Le premier hiver de l'IA","annee":"1974–1980","illus":"courbe","points":["1969 : Minsky et Papert montrent les limites du perceptron simple","1973 : le rapport Lighthill, au Royaume-Uni, juge les résultats décevants","Les calculs explosent dès que les problèmes grandissent","Les financements publics sont coupés : c'est l'« hiver »"]},{"type":"section","numero":"4","titre":"Les systèmes experts","periode":"1980–1993","texte":"L'IA revient en mettant le savoir des experts en règles. Elle entre dans les entreprises, puis retombe.","illus":"regles"},{"type":"schema","titre":"Mettre le savoir en règles","illus":"regles","points":["Une base de faits, une base de règles SI … ALORS …, un moteur d'inférence","Années 1970 : MYCIN, à Stanford, diagnostique des infections du sang","1980 : XCON configure les ordinateurs de l'entreprise DEC","Les entreprises investissent : l'IA devient une industrie"]},{"type":"texte","titre":"Le retour des neurones","annee":"1986","points":["1982 : le Japon lance le projet des ordinateurs de cinquième génération","1986 : Rumelhart, Hinton et Williams popularisent la rétropropagation","On sait enfin entraîner des réseaux à plusieurs couches","Mais les ordinateurs et les données manquent encore"],"illus":"reseau"},{"type":"texte","titre":"Le second hiver","annee":"1987–1993","points":["1987 : le marché des machines spécialisées Lisp s'effondre","Les systèmes experts coûtent cher et se trompent hors de leur domaine","Chaque nouvelle règle en contredit d'autres : ils deviennent ingérables","Le mot « IA » devient mal vu : on parle plutôt d'« informatique avancée »"],"illus":"flocon"},{"type":"section","numero":"5","titre":"Apprendre à partir des données","periode":"1990–2016","texte":"Au lieu d'écrire les règles, on donne des exemples. Avec Internet, les exemples deviennent des milliards.","illus":"donnees"},{"type":"deux","titre":"Deux façons de faire une IA","gauche":{"titre":"IA symbolique","points":["Un expert écrit les règles","Explicable : on suit le raisonnement","Fragile hors de son domaine","Exemple : un système expert"]},"droite":{"titre":"Apprentissage automatique","points":["La machine tire des régularités des exemples","Souvent difficile à expliquer","Robuste, s'il y a beaucoup de données","Exemple : un filtre anti-spam"]}},{"type":"portrait","personne":"deepblue","nom":"Deep Blue contre Kasparov","dates":"Mai 1997","role":"L'ordinateur d'IBM bat le champion du monde d'échecs","points":["Victoire 3½ à 2½ en six parties, à New York","Environ 200 millions de positions évaluées par seconde","Une force de calcul, pas d'apprentissage : c'est encore une IA de recherche"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"L'apprentissage s'installe partout","evenements":[{"annee":"1989","titre":"Lire les chiffres","texte":"Yann LeCun entraîne un réseau convolutif à lire les codes postaux"},{"annee":"1992","titre":"TD-Gammon","texte":"Un programme apprend le jacquet en jouant contre lui-même"},{"annee":"1998","titre":"Chèques","texte":"Les réseaux de LeCun lisent des chèques bancaires aux États-Unis"},{"annee":"2002","titre":"Roomba","texte":"Un robot aspirateur entre dans les maisons"},{"annee":"2005","titre":"Stanley","texte":"Une voiture sans conducteur gagne la course du désert de la DARPA"},{"annee":"2011","titre":"Watson, Siri","texte":"Watson gagne au jeu télévisé Jeopardy! ; Siri arrive dans les téléphones"}]},{"type":"section","numero":"6","titre":"La révolution de l'apprentissage profond","periode":"2006–2016","texte":"Des réseaux de neurones à très nombreuses couches, entraînés sur d'énormes données avec des processeurs graphiques.","illus":"reseau"},{"type":"schema","titre":"Un réseau profond, couche après couche","illus":"reseau","points":["Les premières couches repèrent des traits simples : bords, taches","Les couches suivantes combinent : formes, textures, parties","Les dernières reconnaissent des objets entiers : « chat », « voiture »","Chaque couche apprend seule ce qu'elle doit repérer"]},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li et ImageNet","dates":"2009–2012","role":"Une base d'images qui change tout","points":["2009 : ImageNet, plus de 14 millions d'images annotées à la main","2012 : le réseau AlexNet écrase la compétition de reconnaissance d'images","Son taux d'erreur tombe à 15 %, contre 26 % pour le deuxième"],"illus":"imagenet"},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Né en 1947","role":"Pionnier des réseaux de neurones","points":["Défend les réseaux de neurones pendant les deux hivers","2018 : prix Turing avec Yoshua Bengio et Yann LeCun","2024 : prix Nobel de physique avec John Hopfield"],"encart":"lecun"},{"type":"frise","titre":"Les machines apprennent aussi le langage et le jeu","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Les mots deviennent des vecteurs : « roi » − « homme » + « femme » ≈ « reine »"},{"annee":"2014","titre":"GAN","texte":"Deux réseaux s'affrontent pour produire des images réalistes"},{"annee":"2015","titre":"Jeux Atari","texte":"Un agent de DeepMind apprend 49 jeux vidéo à partir des pixels et du score"},{"annee":"2016","titre":"AlphaGo","texte":"Le programme de DeepMind bat Lee Sedol au go, 4 parties à 1"}]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo et le coup 37","dates":"Mars 2016, Séoul","role":"DeepMind, cofondé par Demis Hassabis","points":["Deuxième partie : AlphaGo joue un coup qu'aucun humain n'aurait joué","Les commentateurs croient à une erreur ; c'est un coup gagnant","La machine n'imite plus les humains : elle trouve ses propres stratégies"],"illus":"go","encart":"leesedol"},{"type":"section","numero":"7","titre":"Transformers et IA générative","periode":"2017–2022","texte":"Une nouvelle architecture apprend à lire des textes entiers. Les machines se mettent à écrire, dessiner, traduire.","illus":"attention"},{"type":"schema","titre":"« Attention Is All You Need »","annee":"2017","illus":"attention","points":["Huit chercheurs de Google proposent le Transformer","Le mécanisme d'attention relie chaque mot à tous les autres","Dans « L'étudiante ouvrit le livre car elle… », « elle » regarde « étudiante »","Tous les grands modèles de langue actuels en descendent"]},{"type":"frise","titre":"De BERT à ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google : un modèle qui comprend le contexte d'un mot"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI : des textes si fluides qu'on hésite à le publier"},{"annee":"2020","titre":"GPT-3","texte":"175 milliards de paramètres ; AlphaFold 2 résout la forme des protéines"},{"annee":"2021","titre":"DALL·E","texte":"Une image dessinée à partir d'une phrase"},{"annee":"2022","titre":"ChatGPT","texte":"30 novembre : l'IA générative arrive dans le grand public"}]},{"type":"schema","titre":"Du texte aux nombres","illus":"tokens","phrase":"Le chat boit du lait","ids":"412 8093 5871 88 2310","points":["Un ordinateur ne connaît que des nombres","Le texte est découpé en morceaux : les **tokens**","Chaque token reçoit un numéro, puis une longue liste de nombres : un **vecteur**","Le modèle ne voit jamais les lettres, seulement ces nombres"]},{"type":"schema","titre":"La carte des sens","illus":"sens","mots":["chat","chien","cheval","livre","roman","lecteur","homme","femme","roi","reine"],"points":["Chaque vecteur est une adresse sur une immense carte des sens","Les mots qui ont les mêmes voisins se rapprochent : « chat », « chien »","Le modèle l'apprend seul, en devinant des mots cachés dans des milliards de phrases","La carte garde des relations : de « homme » à « femme » comme de « roi » à « reine »"]},{"type":"schema","titre":"Le contexte donne le sens","illus":"contexte","phrase1":"la souris mange le fromage","phrase2":"je clique avec la souris","liens":[[1,4],[4,1]],"points":["Un même mot peut avoir plusieurs sens : « souris »","L'**attention** relie chaque mot à ses voisins","Avec « fromage », la souris est l'animal ; avec « clique », c'est l'objet","Le vecteur du mot est recalculé selon son contexte"]},{"type":"schema","titre":"Comment « écrit » un modèle de langue","illus":"motsuivant","points":["Il découpe le texte en morceaux, les tokens","Il calcule la probabilité de chaque token suivant","Il en choisit un, l'ajoute au texte, et recommence","Des humains notent ensuite ses réponses pour l'affiner"],"debut":"Le chat boit du","suites":["lait","café","thé","jus"]},{"type":"chat","titre":"Un dialogue avec un modèle de langue","annee":"2022","legende":"Exemple fictif, écrit pour la classe","echanges":[{"qui":"h","texte":"Explique le chaînage avant à un étudiant de littérature."},{"qui":"m","texte":"Imaginez un détective : il part des indices qu'il connaît et applique ses règles une à une, jusqu'à trouver le coupable."},{"qui":"h","texte":"Donne-moi une référence pour citer ça dans mon mémoire."},{"qui":"m","texte":"Attention : vérifiez toujours une référence dans une bibliothèque. Je peux me tromper ou en inventer."}]},{"type":"section","numero":"8","titre":"L'ère des agents","periode":"2023–2026","texte":"Le modèle de langue ne se contente plus de répondre : il planifie, utilise des outils et agit.","illus":"agent"},{"type":"texte","titre":"Qu'est-ce qu'un agent ?","points":["Un agent perçoit son environnement et agit sur lui pour atteindre un but","Un thermostat est un agent très simple : il mesure, puis chauffe ou non","Russell et Norvig (1995) définissent toute l'IA comme l'étude des agents","Un agent d'IA moderne reçoit un objectif, pas seulement une question"],"illus":"thermostat"},{"type":"schema","titre":"La boucle d'un agent","illus":"boucle","points":["Objectif : ce que l'utilisateur demande","Réfléchir : le modèle planifie l'étape suivante","Agir : il utilise un outil (recherche, calcul, fichier, navigateur)","Observer : il lit le résultat, puis recommence jusqu'au but"]},{"type":"frise","titre":"Des agents conversationnels aux agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Des chercheurs font alterner raisonnement et actions dans un même modèle"},{"annee":"2023","titre":"Outils","texte":"GPT-4 ; les modèles apprennent à appeler des outils et des programmes"},{"annee":"2024","titre":"Raisonner, agir","texte":"Modèles qui réfléchissent avant de répondre ; un modèle pilote un ordinateur ; protocole MCP pour brancher des outils"},{"annee":"2025","titre":"Agents au travail","texte":"Agents qui naviguent sur le Web, écrivent et corrigent des programmes"},{"annee":"2026","titre":"Au quotidien","texte":"Les agents s'installent dans les logiciels de bureau, de recherche et d'enseignement"}]},{"type":"deux","titre":"Agent conversationnel ou agent ?","gauche":{"titre":"Agent conversationnel","points":["Répond à une question","Produit du texte","Un seul tour","L'humain fait le reste"]},"droite":{"titre":"Agent","points":["Poursuit un objectif","Utilise des outils et agit","Plusieurs étapes, il corrige son plan","L'humain supervise et valide"]}},{"type":"texte","titre":"Les risques, et les bonnes pratiques","points":["Hallucinations : un agent peut agir sur une information fausse","Actions irréversibles : effacer, envoyer, payer ; il faut valider","Consignes cachées dans une page Web peuvent détourner un agent","Données personnelles : la loi algérienne 18-07 s'applique","2024 : l'Union européenne adopte le règlement sur l'IA (AI Act)"],"illus":"bouclier"},{"type":"texte","titre":"Et en Algérie ?","points":["2021 : ouverture de l'École nationale supérieure d'intelligence artificielle (ENSIA)","L'arabe, la darja et le tamazight restent moins bien servis par les modèles","Des corpus locaux, construits en SHS, sont une vraie contribution","Vos mémoires peuvent y participer : textes, enquêtes, entretiens"],"illus":"carte"},{"type":"section","numero":"9","titre":"Synthèse","periode":"De 1206 à 2026","texte":"Huit siècles de rêves, soixante-dix ans de science, quelques années d'agents.","illus":"frise"},{"type":"frise","titre":"Les huit dates à retenir","evenements":[{"annee":"1843","titre":"Lovelace","texte":"Premier programme, pour une machine jamais achevée"},{"annee":"1950","titre":"Turing","texte":"Les machines peuvent-elles penser ?"},{"annee":"1956","titre":"Dartmouth","texte":"L'IA reçoit son nom"},{"annee":"1974","titre":"Hiver","texte":"Premier hiver de l'IA"},{"annee":"1997","titre":"Deep Blue","texte":"L'ordinateur bat le champion d'échecs"},{"annee":"2012","titre":"AlexNet","texte":"L'apprentissage profond l'emporte"},{"annee":"2017","titre":"Transformer","texte":"L'attention au cœur des modèles de langue"},{"annee":"2022","titre":"ChatGPT","texte":"L'IA générative pour tous ; puis viennent les agents"}]},{"type":"deux","titre":"Les familles d'IA, sur une seule diapositive","gauche":{"titre":"Selon la méthode","points":["Symbolique : des règles écrites","Apprentissage automatique : des exemples","Apprentissage profond : des réseaux à nombreuses couches","Renforcement : des essais et des récompenses"]},"droite":{"titre":"Selon l'ambition","points":["IA faible (étroite) : une tâche précise","IA forte (générale) : toutes les tâches, hypothétique","Les agents actuels restent des IA faibles","… mais de plus en plus polyvalentes"]}},{"type":"video","titre":"Vidéo : l'histoire complète de l'IA (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"« The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence », documentaire en anglais, sur YouTube"},{"type":"video","titre":"Vidéo : cent ans d'intelligence artificielle","youtube":"mSd9nmPM7Vg","legende":"« The Entire History of Artificial Intelligence (Last 100 Years) », documentaire en anglais, sur YouTube"},{"type":"quiz","question":"En quelle année l'expression « intelligence artificielle » s'impose-t-elle, avec l'atelier de Dartmouth ?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"L'expression apparaît dans la proposition de 1955 et s'impose avec l'atelier de l'été 1956."},{"type":"quiz","question":"Pourquoi parle-t-on d'« hivers » de l'IA ?","choix":["Les ordinateurs chauffaient trop","La déception a fait chuter les crédits et l'intérêt","Les recherches se faisaient l'hiver","Les machines ont été interdites"],"reponse":1,"explication":"Après des promesses démesurées, les résultats ont déçu : les financements ont été coupés (1974–1980, puis 1987–1993)."},{"type":"quiz","question":"Qu'est-ce qui distingue un agent d'un simple agent conversationnel ?","choix":["Il écrit plus vite","Il poursuit un objectif en agissant avec des outils","Il ne fait jamais d'erreur","Il fonctionne sans électricité"],"reponse":1,"explication":"Un agent enchaîne des actions (chercher, calculer, écrire un fichier…) et observe les résultats pour atteindre un but."},{"type":"quiz","question":"ELIZA (1966) comprenait-elle ce qu'on lui disait ?","choix":["Oui, comme un psychologue","Non : elle transformait les phrases avec des règles","Oui, grâce à l'apprentissage profond","On ne le sait pas"],"reponse":1,"explication":"ELIZA repérait des mots-clés et renvoyait des phrases types. Croire qu'elle comprenait, c'est l'« effet ELIZA »."},{"type":"fin","titre":"À retenir","points":["Le rêve est ancien ; l'IA comme science naît entre 1950 et 1956","Deux voies alternent : écrire les règles ou apprendre des données","Les hivers rappellent de juger sur les résultats, pas sur les promesses","Un agent perçoit, planifie et agit : de Shakey (1966) aux agents de 2025","Vérifier, garder la main, déclarer son usage : les trois règles d'or"],"texte":"Travail personnel : choisissez une date de la frise et écrivez dix lignes sur ce qu'elle a changé, en citant une source vérifiée."}]},"en":{"langue":"en","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","diapos":[{"type":"couverture","surtitre":"Artificial intelligence · Chapter 1 · First lesson","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","illus":"agent"},{"type":"plan","titre":"This lesson's journey","points":["The dream of machines (from Antiquity to 1945)","The birth of AI (1950–1956)","The golden age, then the first winter (1956–1980)","Expert systems (1980–1993)","Learning from data (1990–2016)","The deep learning revolution (2006–2016)","Transformers and generative AI (2017–2022)","The age of agents (2023–2026)"]},{"type":"texte","titre":"And you, what do you call “intelligence”?","points":["Understanding a sentence, translating a poem","Recognizing one face among a thousand","Winning at chess, solving a problem","Learning from one's mistakes","Acting alone to reach a goal"],"illus":"cerveau"},{"type":"section","numero":"1","titre":"The dream of machines","periode":"From Antiquity to 1945","texte":"Long before computers, humans imagined and built machines that imitate life, then machines that calculate.","illus":"engrenages"},{"type":"texte","titre":"Automata in myths and workshops","points":["Greek myth: Talos, a bronze giant who guards Crete","1st century: Hero of Alexandria describes theater automata","1739: Vaucanson's duck flaps its wings and “digests”","Around 1770: the Jaquet-Droz Writer traces letters with a quill"],"illus":"engrenages"},{"type":"texte","titre":"Al-Jazari, the engineer of ingenious machines","annee":"1206","points":["Engineer at the Artuqid court, in Upper Mesopotamia","In 1206, writes *The Book of Knowledge of Ingenious Mechanical Devices*","Describes some fifty machines: clocks, pumps, automata","His elephant clock marks the hours with automata"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"Machines that calculate","points":["1642: Blaise Pascal builds the Pascaline, which adds","1673: Leibniz presents a machine that multiplies","1837: Charles Babbage designs the Analytical Engine, programmable with punched cards","The Analytical Engine would never be completed in his lifetime"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathematician, the first programmer","points":["1843: her notes on Babbage's Analytical Engine","In them, she writes an algorithm to compute Bernoulli numbers","She imagines that the machine could compose music"],"citation":"The Analytical Engine has no pretensions whatever to originate anything.","source":"Ada Lovelace, notes of 1843"},{"type":"texte","titre":"When thought becomes calculation","points":["1854: George Boole reduces reasoning to calculations on true and false","1936: Alan Turing describes an abstract machine capable of any calculation","A tape, a read head, a table of rules: the “Turing machine”","Every computer today is, in principle, a Turing machine"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathematician, father of theoretical computer science","points":["1936: the universal machine","1939–1945: helps break the Enigma code at Bletchley Park","1950: “Computing Machinery and Intelligence”, the founding paper"],"citation":"I propose to consider the question, ‘Can machines think?’","source":"Alan Turing, Mind, 1950"},{"type":"schema","titre":"The formal neuron","annee":"1943","illus":"neurone","points":["Warren McCulloch and Walter Pitts model a neuron as a calculation","It adds up input signals and “fires” above a threshold","It is the ancestor of all today's neural networks"]},{"type":"texte","titre":"The first computers","points":["1945: ENIAC, 30 tonnes, calculates ballistic trajectories","1948: Claude Shannon founds information theory","The bit becomes the unit of all information: text, image, sound","The machines finally exist; now they must be made “intelligent”"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"2","titre":"The birth of AI","periode":"1950–1956","texte":"In six years, a question becomes a research program, then a discipline with a name.","illus":"ampoule"},{"type":"schema","titre":"The imitation game","annee":"1950","illus":"imitation","points":["A judge converses in writing with two hidden interlocutors","One is a human, the other a machine","If the judge cannot tell them apart, the machine “passes”"]},{"type":"citation","texte":"Every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposal for the Dartmouth workshop, August 31, 1955"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Computer scientist who gave AI its name","points":["Summer 1956: organizes the Dartmouth workshop, the birth certificate of AI","1958: creates the Lisp language, long the language of AI","With him: Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"encart":"dartmouth"},{"type":"texte","titre":"The first “intelligent” program","annee":"1956","points":["The Logic Theorist by Allen Newell, Herbert Simon and Cliff Shaw","It proves 38 of the first 52 theorems of *Principia Mathematica*","For one of them, a more elegant proof than the authors' own","A key idea: searching among possibilities with rules"],"illus":"arbre"},{"type":"section","numero":"3","titre":"The golden age, then the first winter","periode":"1956–1980","texte":"Spectacular successes, excessive promises, then disappointment and the end of funding.","illus":"courbe"},{"type":"schema","titre":"Rosenblatt's perceptron","annee":"1958","illus":"perceptron","points":["Frank Rosenblatt builds a machine that learns to recognize shapes","It adjusts its own weights after each error","The press announces machines that “think”: enthusiasm runs wild"],"personne":"perceptron"},{"type":"texte","titre":"Learning without being programmed","annee":"1959","points":["Arthur Samuel writes a checkers program that improves by playing","He coins the term “machine learning”","The program ends up beating its own creator","Two paths emerge: writing the rules, or having them learned"],"illus":"dames"},{"type":"chat","titre":"ELIZA, the first artificial psychotherapist","annee":"1966","legende":"From Joseph Weizenbaum's 1966 paper","echanges":[{"qui":"h","texte":"Men are all alike."},{"qui":"m","texte":"IN WHAT WAY"},{"qui":"h","texte":"They're always bugging us about something or other."},{"qui":"m","texte":"CAN YOU THINK OF A SPECIFIC EXAMPLE"},{"qui":"h","texte":"Well, my boyfriend made me come here."},{"qui":"m","texte":"YOUR BOYFRIEND MADE YOU COME HERE"}]},{"type":"texte","titre":"Shakey, the first robot that reasons","annee":"1966–1972","points":["Built at the Stanford Research Institute (SRI)","It perceives its environment with a camera","It plans a sequence of actions to reach a goal","The A* algorithm, still used to compute routes, was created for it"],"personne":"shakey","illus":"robot"},{"type":"citation","texte":"Machines will be capable, within twenty years, of doing any work a man can do.","auteur":"Herbert Simon","source":"1965"},{"type":"schema","titre":"The first AI winter","annee":"1974–1980","illus":"courbe","points":["1969: Minsky and Papert show the limits of the single-layer perceptron","1973: the Lighthill report, in the United Kingdom, finds the results disappointing","Computations explode as soon as problems grow","Public funding is cut: this is the “winter”"]},{"type":"section","numero":"4","titre":"Expert systems","periode":"1980–1993","texte":"AI comes back by turning experts' knowledge into rules. It enters companies, then falls back.","illus":"regles"},{"type":"schema","titre":"Turning knowledge into rules","illus":"regles","points":["A fact base, a base of IF … THEN … rules, an inference engine","1970s: MYCIN, at Stanford, diagnoses blood infections","1980: XCON configures computers for the company DEC","Companies invest: AI becomes an industry"]},{"type":"texte","titre":"The return of neural networks","annee":"1986","points":["1982: Japan launches the Fifth Generation Computer project","1986: Rumelhart, Hinton and Williams popularize backpropagation","Networks with several layers can finally be trained","But computers and data are still lacking"],"illus":"reseau"},{"type":"texte","titre":"The second winter","annee":"1987–1993","points":["1987: the market for specialized Lisp machines collapses","Expert systems are expensive and fail outside their domain","Each new rule contradicts others: they become unmanageable","The word “AI” falls out of favor: people say “advanced computing” instead"],"illus":"flocon"},{"type":"section","numero":"5","titre":"Learning from data","periode":"1990–2016","texte":"Instead of writing the rules, we give examples. With the Internet, the examples run into the billions.","illus":"donnees"},{"type":"deux","titre":"Two ways to build an AI","gauche":{"titre":"Symbolic AI","points":["An expert writes the rules","Explainable: the reasoning can be followed","Brittle outside its domain","Example: an expert system"]},"droite":{"titre":"Machine learning","points":["The machine draws patterns from examples","Often hard to explain","Robust, if there is plenty of data","Example: a spam filter"]}},{"type":"portrait","personne":"deepblue","nom":"Deep Blue versus Kasparov","dates":"May 1997","role":"IBM's computer beats the world chess champion","points":["Wins 3½ to 2½ over six games, in New York","About 200 million positions evaluated per second","Computing power, not learning: this is still search-based AI"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"Learning spreads everywhere","evenements":[{"annee":"1989","titre":"Reading digits","texte":"Yann LeCun trains a convolutional network to read postal codes"},{"annee":"1992","titre":"TD-Gammon","texte":"A program learns backgammon by playing against itself"},{"annee":"1998","titre":"Checks","texte":"LeCun's networks read bank checks in the United States"},{"annee":"2002","titre":"Roomba","texte":"A robot vacuum cleaner enters people's homes"},{"annee":"2005","titre":"Stanley","texte":"A driverless car wins the DARPA desert race"},{"annee":"2011","titre":"Watson, Siri","texte":"Watson wins the TV quiz show Jeopardy!; Siri arrives on phones"}]},{"type":"section","numero":"6","titre":"The deep learning revolution","periode":"2006–2016","texte":"Neural networks with very many layers, trained on huge amounts of data with graphics processors.","illus":"reseau"},{"type":"schema","titre":"A deep network, layer by layer","illus":"reseau","points":["The first layers detect simple features: edges, blobs","The next layers combine them: shapes, textures, parts","The last ones recognize whole objects: “cat”, “car”","Each layer learns by itself what to detect"]},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li and ImageNet","dates":"2009–2012","role":"An image database that changes everything","points":["2009: ImageNet, over 14 million images labeled by hand","2012: the AlexNet network crushes the image recognition competition","Its error rate falls to 15%, against 26% for the runner-up"],"illus":"imagenet"},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Born in 1947","role":"Pioneer of neural networks","points":["Defends neural networks through both winters","2018: Turing Award with Yoshua Bengio and Yann LeCun","2024: Nobel Prize in Physics with John Hopfield"],"encart":"lecun"},{"type":"frise","titre":"Machines also learn language and games","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Words become vectors: “king” − “man” + “woman” ≈ “queen”"},{"annee":"2014","titre":"GAN","texte":"Two networks compete to produce realistic images"},{"annee":"2015","titre":"Atari games","texte":"A DeepMind agent learns 49 video games from the pixels and the score"},{"annee":"2016","titre":"AlphaGo","texte":"DeepMind's program beats Lee Sedol at Go, 4 games to 1"}]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo and Move 37","dates":"March 2016, Seoul","role":"DeepMind, co-founded by Demis Hassabis","points":["Game two: AlphaGo plays a move no human would have played","Commentators think it is a mistake; it is a winning move","The machine no longer imitates humans: it finds its own strategies"],"illus":"go","encart":"leesedol"},{"type":"section","numero":"7","titre":"Transformers and generative AI","periode":"2017–2022","texte":"A new architecture learns to read whole texts. Machines start to write, draw and translate.","illus":"attention"},{"type":"schema","titre":"“Attention Is All You Need”","annee":"2017","illus":"attention","points":["Eight Google researchers propose the Transformer","The attention mechanism links each word to all the others","In “The student opened the book because she…”, “she” looks at “student”","All of today's large language models descend from it"]},{"type":"frise","titre":"From BERT to ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google: a model that understands a word's context"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI: text so fluent that the company hesitates to release it"},{"annee":"2020","titre":"GPT-3","texte":"175 billion parameters; AlphaFold 2 solves the shape of proteins"},{"annee":"2021","titre":"DALL·E","texte":"An image drawn from a sentence"},{"annee":"2022","titre":"ChatGPT","texte":"November 30: generative AI reaches the general public"}]},{"type":"schema","titre":"From text to numbers","illus":"tokens","phrase":"The cat drinks warm milk","ids":"412 8093 5871 88 2310","points":["A computer only knows numbers","The text is cut into pieces: **tokens**","Each token gets a number, then a long list of numbers: a **vector**","The model never sees letters, only these numbers"]},{"type":"schema","titre":"The map of meanings","illus":"sens","mots":["cat","dog","horse","book","novel","reader","man","woman","king","queen"],"points":["Each vector is an address on a huge map of meanings","Words with the same neighbors end up close: “cat”, “dog”","The model learns this by itself, guessing hidden words in billions of sentences","The map keeps relations: from “man” to “woman” as from “king” to “queen”"]},{"type":"schema","titre":"Context gives meaning","illus":"contexte","phrase1":"the mouse eats the cheese","phrase2":"I click with the mouse","liens":[[1,4],[4,1]],"points":["The same word can have several meanings: “mouse”","**Attention** links each word to its neighbors","With “cheese”, the mouse is the animal; with “click”, it is the device","The word's vector is recalculated from its context"]},{"type":"schema","titre":"How a language model “writes”","illus":"motsuivant","points":["It splits the text into pieces, the tokens","It calculates the probability of each possible next token","It picks one, adds it to the text, and starts again","Humans then rate its answers to refine it"],"debut":"The cat drinks some","suites":["milk","water","tea","juice"]},{"type":"chat","titre":"A dialogue with a language model","annee":"2022","legende":"Fictional example, written for the class","echanges":[{"qui":"h","texte":"Explain forward chaining to a literature student."},{"qui":"m","texte":"Imagine a detective: he starts from the clues he knows and applies his rules one by one, until he finds the culprit."},{"qui":"h","texte":"Give me a reference so I can cite this in my thesis."},{"qui":"m","texte":"Careful: always check a reference in a library. I can make mistakes or invent references."}]},{"type":"section","numero":"8","titre":"The age of agents","periode":"2023–2026","texte":"The language model no longer just answers: it plans, uses tools and acts.","illus":"agent"},{"type":"texte","titre":"What is an agent?","points":["An agent perceives its environment and acts on it to reach a goal","A thermostat is a very simple agent: it measures, then heats or not","Russell and Norvig (1995) define all of AI as the study of agents","A modern AI agent receives a goal, not just a question"],"illus":"thermostat"},{"type":"schema","titre":"The agent loop","illus":"boucle","points":["Goal: what the user asks for","Think: the model plans the next step","Act: it uses a tool (search, calculation, file, browser)","Observe: it reads the result, then starts again until the goal is reached"]},{"type":"frise","titre":"From chatbots to agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Researchers make a single model alternate between reasoning and actions"},{"annee":"2023","titre":"Tools","texte":"GPT-4; models learn to call tools and programs"},{"annee":"2024","titre":"Reason, act","texte":"Models that think before answering; a model operates a computer; the MCP protocol for connecting tools"},{"annee":"2025","titre":"Agents at work","texte":"Agents that browse the Web, write and fix programs"},{"annee":"2026","titre":"Everyday use","texte":"Agents settle into office, research and teaching software"}]},{"type":"deux","titre":"Chatbot or agent?","gauche":{"titre":"Chatbot","points":["Answers a question","Produces text","A single turn","The human does the rest"]},"droite":{"titre":"Agent","points":["Pursues a goal","Uses tools and acts","Several steps; it corrects its plan","The human supervises and approves"]}},{"type":"texte","titre":"The risks, and good practice","points":["Hallucinations: an agent may act on false information","Irreversible actions: deleting, sending, paying; they must be approved","Instructions hidden in a Web page can hijack an agent","Personal data: Algerian Law 18-07 applies","2024: the European Union adopts the AI Act"],"illus":"bouclier"},{"type":"texte","titre":"And in Algeria?","points":["2021: the National Higher School of Artificial Intelligence (ENSIA) opens","Arabic, Darja and Tamazight remain less well served by models","Local corpora, built in the humanities and social sciences, are a real contribution","Your theses can contribute: texts, surveys, interviews"],"illus":"carte"},{"type":"section","numero":"9","titre":"Summary","periode":"From 1206 to 2026","texte":"Eight centuries of dreams, seventy years of science, a few years of agents.","illus":"frise"},{"type":"frise","titre":"The eight dates to remember","evenements":[{"annee":"1843","titre":"Lovelace","texte":"The first program, for a machine never completed"},{"annee":"1950","titre":"Turing","texte":"Can machines think?"},{"annee":"1956","titre":"Dartmouth","texte":"AI gets its name"},{"annee":"1974","titre":"Winter","texte":"The first AI winter"},{"annee":"1997","titre":"Deep Blue","texte":"A computer beats the chess champion"},{"annee":"2012","titre":"AlexNet","texte":"Deep learning wins out"},{"annee":"2017","titre":"Transformer","texte":"Attention at the heart of language models"},{"annee":"2022","titre":"ChatGPT","texte":"Generative AI for everyone; then come the agents"}]},{"type":"deux","titre":"The families of AI, on a single slide","gauche":{"titre":"By method","points":["Symbolic: written rules","Machine learning: examples","Deep learning: networks with many layers","Reinforcement: trials and rewards"]},"droite":{"titre":"By ambition","points":["Weak (narrow) AI: one specific task","Strong (general) AI: every task, hypothetical","Today's agents are still weak AI","… but increasingly versatile"]}},{"type":"video","titre":"Video: the complete history of AI (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"“The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence”, a documentary in English, on YouTube"},{"type":"video","titre":"Video: a hundred years of artificial intelligence","youtube":"mSd9nmPM7Vg","legende":"“The Entire History of Artificial Intelligence (Last 100 Years)”, a documentary in English, on YouTube"},{"type":"quiz","question":"In what year did the term “artificial intelligence” take hold, with the Dartmouth workshop?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"The term appears in the 1955 proposal and took hold with the workshop in the summer of 1956."},{"type":"quiz","question":"Why do we speak of AI “winters”?","choix":["Computers overheated","Disappointment made funding and interest fall","Research was done in winter","Machines were banned"],"reponse":1,"explication":"After excessive promises, the results were disappointing: funding was cut (1974–1980, then 1987–1993)."},{"type":"quiz","question":"What distinguishes an agent from a simple chatbot?","choix":["It writes faster","It pursues a goal by acting with tools","It never makes mistakes","It works without electricity"],"reponse":1,"explication":"An agent chains actions (searching, calculating, writing a file…) and observes the results to reach a goal."},{"type":"quiz","question":"Did ELIZA (1966) understand what was said to it?","choix":["Yes, like a psychologist","No: it transformed sentences with rules","Yes, thanks to deep learning","We do not know"],"reponse":1,"explication":"ELIZA spotted keywords and sent back stock sentences. Believing that it understood is the “ELIZA effect”."},{"type":"fin","titre":"Key takeaways","points":["The dream is old; AI as a science was born between 1950 and 1956","Two paths alternate: writing the rules or learning from data","The winters remind us to judge by results, not by promises","An agent perceives, plans and acts: from Shakey (1966) to the agents of 2025","Check, stay in control, declare your use: the three golden rules"],"texte":"Homework: choose a date from the timeline and write ten lines on what it changed, citing a verified source."}]},"ar":{"langue":"ar","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","diapos":[{"type":"couverture","surtitre":"الذكاء الاصطناعي · الفصل 1 · الدرس الأول","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","illus":"agent"},{"type":"plan","titre":"رحلة هذا الدرس","points":["حلم الآلات (من العصور القديمة إلى 1945)","ميلاد الذكاء الاصطناعي (1950–1956)","العصر الذهبي، ثم الشتاء الأول (1956–1980)","الأنظمة الخبيرة (1980–1993)","التعلّم من البيانات (1990–2016)","ثورة التعلم العميق (2006–2016)","المحوِّلات والذكاء الاصطناعي التوليدي (2017–2022)","عصر الوكلاء (2023–2026)"]},{"type":"texte","titre":"وأنتم، ماذا تسمّون «ذكاءً»؟","points":["فهم جملة، وترجمة قصيدة","التعرّف على وجه من بين ألف وجه","الفوز في الشطرنج، وحلّ مشكلة","التعلّم من الأخطاء","التصرّف باستقلال لبلوغ هدف"],"illus":"cerveau"},{"type":"section","numero":"1","titre":"حلم الآلات","periode":"من العصور القديمة إلى 1945","texte":"قبل الحواسيب بزمن طويل، تخيّل البشر آلاتٍ تحاكي الحياة وصنعوها، ثم آلاتٍ تحسب.","illus":"engrenages"},{"type":"texte","titre":"آلات ذاتية الحركة في الأساطير والورشات","points":["أسطورة إغريقية: تالوس، عملاق من البرونز يحرس جزيرة كريت","القرن الأول الميلادي: هيرون السكندري يصف آلات ذاتية الحركة للمسرح","سنة 1739: بطّة فوكانسون تخفق بجناحيها و«تهضم»","نحو سنة 1770: «الكاتب» الذي صنعه آل جاكيه-دروز يخطّ الحروف بالريشة"],"illus":"engrenages"},{"type":"texte","titre":"الجزري، مهندس الآلات البارعة","annee":"1206","points":["مهندس في بلاط بني أرتق، في أعالي بلاد الرافدين","ألّف سنة 1206 كتاب *الجامع بين العلم والعمل النافع في صناعة الحيل*","يصف نحو خمسين آلة: ساعات، ومضخات، وآلات ذاتية الحركة","ساعة الفيل التي صنعها تعلن الساعات بواسطة آلات ذاتية الحركة"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"آلات تحسب","points":["سنة 1642: يصنع بليز باسكال آلة «الباسكالين» التي تُجري الجمع","سنة 1673: يقدّم لايبنتز آلة تُجري الضرب","سنة 1837: يصمّم تشارلز باباج الآلة التحليلية، القابلة للبرمجة بالبطاقات المثقّبة","لم تُستكمَل الآلة التحليلية قطّ في حياته"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"آدا لوفلايس","dates":"1815–1852","role":"عالمة رياضيات، أول مبرمجة","points":["سنة 1843: ملاحظاتها على الآلة التحليلية لباباج","تكتب فيها خوارزمية لحساب أعداد برنولي","تتخيّل أن الآلة قد تؤلّف الموسيقى"],"citation":"لا تدّعي الآلة التحليلية البتّة أنها تُبدع شيئًا من عندها.","source":"آدا لوفلايس، ملاحظات سنة 1843"},{"type":"texte","titre":"حين يصير التفكير حسابًا","points":["سنة 1854: يختزل جورج بول الاستدلال في حسابات على الصواب والخطأ","سنة 1936: يصف آلان تورينغ آلة مجرّدة قادرة على إجراء أيّ حساب","شريط، ورأس قراءة، وجدول قواعد: إنها «آلة تورينغ»","كل حاسوب حالي هو، من حيث المبدأ، آلة تورينغ"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"آلان تورينغ","dates":"1912–1954","role":"عالم رياضيات، أبو المعلوماتية النظرية","points":["سنة 1936: الآلة الشاملة","بين 1939 و1945: يُسهم في كسر شيفرة Enigma في بليتشلي بارك","سنة 1950: «Computing Machinery and Intelligence»، المقال المؤسِّس"],"citation":"أقترح أن ننظر في السؤال الآتي: هل تستطيع الآلات أن تفكّر؟","source":"آلان تورينغ، مجلة Mind، سنة 1950"},{"type":"schema","titre":"العصبون الاصطناعي","annee":"1943","illus":"neurone","points":["ينمذج وارن ماكولوك ووالتر بيتس العصبون بعملية حسابية","يجمع إشارات الدخل و«ينشط» عند تجاوز عتبة معيّنة","إنه سلف كل الشبكات العصبية الحالية"]},{"type":"texte","titre":"الحواسيب الأولى","points":["سنة 1945: حاسوب ENIAC، بوزن 30 طنًا، يحسب المسارات الباليستية","سنة 1948: يؤسّس كلود شانون نظرية المعلومات","يصبح البت وحدة كل معلومة: النص والصورة والصوت","صارت الآلات موجودة أخيرًا؛ وبقي أن نجعلها «ذكية»"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"2","titre":"ميلاد الذكاء الاصطناعي","periode":"1950–1956","texte":"في ست سنوات، يتحوّل سؤالٌ إلى برنامج بحث، ثم إلى تخصص له اسم.","illus":"ampoule"},{"type":"schema","titre":"لعبة المحاكاة","annee":"1950","illus":"imitation","points":["يتحاور حَكَمٌ كتابيًا مع محاوِرَين مخفيَّين","أحدهما إنسان، والآخر آلة","إذا عجز الحَكَم عن التمييز بينهما، «تنجح» الآلة"]},{"type":"citation","texte":"كل جانب من جوانب التعلم، أو أيّ سمة أخرى من سمات الذكاء، يمكن من حيث المبدأ وصفه بدقة بالغة إلى حدّ يمكن معه صنع آلة تحاكيه.","auteur":"ج. مكارثي، م. مينسكي، ن. روتشستر، ك. شانون","source":"مقترح ورشة دارتموث، 31 أغسطس 1955"},{"type":"portrait","personne":"mccarthy","nom":"جون مكارثي","dates":"1927–2011","role":"عالم حاسوب، منح الذكاء الاصطناعي اسمه","points":["صيف 1956: ينظّم ورشة دارتموث، شهادة ميلاد الذكاء الاصطناعي","سنة 1958: يبتكر لغة Lisp، التي ظلّت طويلًا لغة الذكاء الاصطناعي","معه: مارفن مينسكي، وكلود شانون، وناثانيال روتشستر"],"encart":"dartmouth"},{"type":"texte","titre":"أول برنامج «ذكي»","annee":"1956","points":["برنامج Logic Theorist لآلن نيويل وهربرت سايمون وكليف شو","يبرهن 38 من المبرهنات الـ52 الأولى في *Principia Mathematica*","ويجد لإحداها برهانًا أكثر أناقة من برهان المؤلِّفَين","فكرة أساسية: البحث بين الإمكانات بواسطة قواعد"],"illus":"arbre"},{"type":"section","numero":"3","titre":"العصر الذهبي، ثم الشتاء الأول","periode":"1956–1980","texte":"نجاحات مذهلة، ووعود مفرطة، ثم خيبة الأمل وتوقّف التمويل.","illus":"courbe"},{"type":"schema","titre":"بيرسبترون روزنبلات","annee":"1958","illus":"perceptron","points":["يبني فرانك روزنبلات آلة تتعلّم التعرّف على الأشكال","تضبط أوزانها بنفسها بعد كل خطأ","تعلن الصحافة عن آلات «تفكّر»: فيجمح الحماس"],"personne":"perceptron"},{"type":"texte","titre":"التعلّم من دون برمجة","annee":"1959","points":["يكتب آرثر صامويل برنامجًا للعب الداما يتحسّن باللعب","يبتكر عبارة «machine learning»، أي التعلم الآلي","وينتهي البرنامج إلى هزيمة مبتكره نفسه","يرتسم مساران: كتابة القواعد، أو جعل الآلة تتعلّمها"],"illus":"dames"},{"type":"chat","titre":"إليزا (ELIZA)، أول معالِجة نفسية اصطناعية","annee":"1966","legende":"مقتطف من مقال جوزيف فايزنباوم (1966)، مترجَم","echanges":[{"qui":"h","texte":"الرجال كلهم متشابهون."},{"qui":"m","texte":"بأيّ معنى؟"},{"qui":"h","texte":"إنهم يزعجوننا دائمًا بشيء أو بآخر."},{"qui":"m","texte":"هل يمكنكِ أن تذكري مثالًا محدَّدًا؟"},{"qui":"h","texte":"حسنًا، صديقي هو الذي جعلني آتي إلى هنا."},{"qui":"m","texte":"صديقكِ جعلكِ تأتين إلى هنا."}]},{"type":"texte","titre":"شيكي (Shakey)، أول روبوت يستدلّ","annee":"1966–1972","points":["صُنع في معهد ستانفورد للأبحاث (SRI)","يدرك بيئته بواسطة كاميرا","يخطّط لسلسلة من الأفعال لبلوغ هدف","من أجله طُوِّرت خوارزمية A*‎، التي ما تزال تُستعمل لحساب المسارات"],"personne":"shakey","illus":"robot"},{"type":"citation","texte":"ستكون الآلات قادرة، في غضون عشرين سنة، على القيام بأيّ عمل يستطيع الإنسان القيام به.","auteur":"هربرت سايمون","source":"1965"},{"type":"schema","titre":"الشتاء الأول للذكاء الاصطناعي","annee":"1974–1980","illus":"courbe","points":["سنة 1969: يبيّن مينسكي وبابيرت حدود البيرسبترون البسيط","سنة 1973: في المملكة المتحدة، يرى تقرير لايتهيل أن النتائج مخيّبة للآمال","يتضخّم الحساب تضخّمًا انفجاريًا ما إن تكبر المسائل","يُقطع التمويل العمومي: إنه «الشتاء»"]},{"type":"section","numero":"4","titre":"الأنظمة الخبيرة","periode":"1980–1993","texte":"يعود الذكاء الاصطناعي بتحويل معرفة الخبراء إلى قواعد. فيدخل الشركات، ثم يتراجع.","illus":"regles"},{"type":"schema","titre":"تحويل المعرفة إلى قواعد","illus":"regles","points":["قاعدة وقائع، وقاعدة قواعد من نوع «إذا … فإن …»، ومحرّك استدلال","سبعينيات القرن العشرين: نظام MYCIN، في ستانفورد، يشخّص عدوى الدم","سنة 1980: يضبط نظام XCON تهيئة حواسيب شركة DEC","تستثمر الشركات: فيصبح الذكاء الاصطناعي صناعة"]},{"type":"texte","titre":"عودة العصبونات","annee":"1986","points":["سنة 1982: تطلق اليابان مشروع حواسيب الجيل الخامس","سنة 1986: يُشيع روملهارت وهينتون وويليامز خوارزمية الانتشار العكسي","صرنا أخيرًا نعرف كيف ندرّب شبكات متعددة الطبقات","لكن الحواسيب والبيانات ما تزال غير كافية"],"illus":"reseau"},{"type":"texte","titre":"الشتاء الثاني","annee":"1987–1993","points":["سنة 1987: تنهار سوق آلات Lisp المتخصصة","الأنظمة الخبيرة مكلفة، وتخطئ خارج مجالها","كل قاعدة جديدة قد تناقض قواعد أخرى: فتصير الأنظمة عصيّة على الصيانة","تصبح عبارة «الذكاء الاصطناعي» سيئة السمعة: فيُفضَّل الحديث عن «المعلوماتية المتقدمة»"],"illus":"flocon"},{"type":"section","numero":"5","titre":"التعلّم من البيانات","periode":"1990–2016","texte":"بدلًا من كتابة القواعد، نقدّم أمثلة. ومع الإنترنت، يصبح عدد الأمثلة بالمليارات.","illus":"donnees"},{"type":"deux","titre":"طريقتان لصنع ذكاء اصطناعي","gauche":{"titre":"الذكاء الاصطناعي الرمزي","points":["يكتب خبيرٌ القوا خاصة بالذكاء الاصطناعي (AI Act)"],"illus":"bouclier"},{"type":"texte","titre":"وماذا عن الجزائر؟","points":["سنة 2021: افتتاح المدرسة الوطنية العليا للذكاء الاصطناعي (ENSIA)","ما تزال النماذج تخدم العربية والدارجة والأمازيغية خدمة أقلّ جودة","المدوّنات اللغوية المحلية التي تُبنى في العلوم الإنسانية والاجتماعية إسهامٌ حقيقي","يمكن لمذكّراتكم أن تسهم في ذلك: نصوص، واستبيانات، ومقابلات"],"illus":"carte"},{"type":"section","numero":"9","titre":"خلاصة","periode":"من 1206 إلى 2026","texte":"ثمانية قرون من الأحلام، وسبعون سنة من العلم، وبضع سنوات من الوكلاء.","illus":"frise"},{"type":"frise","titre":"التواريخ الثمانية التي ينبغي حفظها","evenements":[{"annee":"1843","titre":"لوفلايس","texte":"أول برنامج، لآلة لم تكتمل قطّ"},{"annee":"1950","titre":"تورينغ","texte":"هل تستطيع الآلات أن تفكّر؟"},{"annee":"1956","titre":"دارتموث","texte":"يحصل الذكاء الاصطناعي على اسمه"},{"annee":"1974","titre":"الشتاء","texte":"الشتاء الأول للذكاء الاصطناعي"},{"annee":"1997","titre":"Deep Blue","texte":"يهزم الحاسوب بطلَ العالم في الشطرنج"},{"annee":"2012","titre":"AlexNet","texte":"ينتصر التعلم العميق"},{"annee":"2017","titre":"المحوِّل","texte":"آلية الانتباه في صميم النماذج اللغوية"},{"annee":"2022","titre":"ChatGPT","texte":"ذكاء اصطناعي توليدي للجميع؛ ثم يأتي الوكلاء"}]},{"type":"deux","titre":"عائلات الذكاء الاصطناعي، في شريحة واحدة","gauche":{"titre":"بحسب الطريقة","points":["الرمزي: قواعد مكتوبة","التعلم الآلي: أمثلة","التعلم العميق: شبكات ذات طبقات عديدة","التعلم المعزَّز: محاولات ومكافآت"]},"droite":{"titre":"بحسب الطموح","points":["الذكاء الاصطناعي الضعيف (الضيّق): مهمة محدّدة","الذكاء الاصطناعي القوي (العام): كل المهام، وما يزال فرضيًّا","الوكلاء الحاليون ما زالوا ذكاءً اصطناعيًا ضعيفًا","… لكنهم يزدادون تعدّدًا في القدرات"]}},{"type":"video","titre":"فيديو: التاريخ الكامل للذكاء الاصطناعي (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence»، على YouTube"},{"type":"video","titre":"فيديو: مئة سنة من الذكاء الاصطناعي","youtube":"mSd9nmPM7Vg","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Entire History of Artificial Intelligence (Last 100 Years)»، على YouTube"},{"type":"quiz","question":"في أيّ سنة فرضت عبارة «الذكاء الاصطناعي» نفسها، مع ورشة دارتموث؟","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"ظهرت العبارة في مقترح سنة 1955، وفرضت نفسها مع ورشة صيف 1956."},{"type":"quiz","question":"لماذا نتحدّث عن «شتاءات» الذكاء الاصطناعي؟","choix":["كانت الحواسيب تسخن كثيرًا","أدّت خيبة الأمل إلى تراجع التمويل والاهتمام","كانت الأبحاث تُجرى في فصل الشتاء","حُظرت الآلات"],"reponse":1,"explication":"بعد وعود مفرطة، خيّبت النتائج الآمال: فقُطع التمويل (1974–1980، ثم 1987–1993)."},{"type":"quiz","question":"ما الذي يميّز الوكيل عن مجرّد وكيل محادثة؟","choix":["يكتب بسرعة أكبر","يسعى إلى هدف بالتصرّف بواسطة الأدوات","لا يخطئ أبدًا","يعمل من دون كهرباء"],"reponse":1,"explication":"ينجز الوكيل سلسلة من الأفعال (البحث، والحساب، وكتابة ملف…) ويلاحظ النتائج لبلوغ هدف."},{"type":"quiz","question":"هل كانت ELIZA (1966) تفهم ما يُقال لها؟","choix":["نعم، مثل طبيب نفسي","لا: كانت تحوّل الجمل بواسطة قواعد","نعم، بفضل التعلم العميق","لا نعرف ذلك"],"reponse":1,"explication":"كانت ELIZA ترصد كلمات مفتاحية وتعيد جملًا جاهزة. والاعتقاد بأنها تفهم هو «أثر ELIZA»."},{"type":"fin","titre":"ما ينبغي تذكّره","points":["الحلم قديم؛ والذكاء الاصطناعي بوصفه علمًا وُلد بين 1950 و1956","يتناوب مساران: كتابة القواعد أو التعلّم من البيانات","تذكّرنا الشتاءات بأن نحكم بالنتائج، لا بالوعود","يدرك الوكيل ويخطّط ويتصرّف: من شيكي (1966) إلى وكلاء 2025","التحقّق، والاحتفاظ بزمام الأمور، والإفصاح عن الاستعمال: القواعد الذهبية الثلاث"],"texte":"عمل شخصي: اختاروا تاريخًا من الخط الزمني، واكتبوا عشرة أسطر عمّا غيّره، مع الاستشهاد بمصدر تحقّقتم منه."}]}};

    return t;
  }
  function joindre(a, b) { var r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; }
  function octets(texte) { return new TextEncoder().encode(texte); }
  function depuisHex(h) { var r = new Uint8Array(h.length / 2); for (var i = 0; i < r.length; i++) r[i] = parseInt(h.substr(2 * i, 2), 16); return r; }
  function versHex(o) { return Array.prototype.map.call(o, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
  function depuisBase64(t) { var s = atob(t), r = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) r[i] = s.charCodeAt(i); return r; }
  // Même calcul que chiffrer() dans tools/lecon1.py ; renvoie null si la clé est fausse.
  function dechiffrer(cle, iv, donnees) {
    var kc = sha256(joindre(cle, octets("lx-chiffre"))), km = sha256(joindre(cle, octets("lx-controle")));
    var sortie = new Uint8Array(donnees.length), bloc = new Uint8Array(52), i, j, flux;
    bloc.set(kc); bloc.set(iv, 32);
    for (i = 0; i * 32 < donnees.length; i++) {
      bloc[48] = i >>> 24; bloc[49] = (i >>> 16) & 255; bloc[50] = (i >>> 8) & 255; bloc[51] = i & 255;
      flux = sha256(bloc);
      for (j = 0; j < 32 && i * 32 + j < donnees.length; j++) sortie[i * 32 + j] = donnees[i * 32 + j] ^ flux[j];
    }

    for (j = 0; j < 16; j++) if (controle[j] !== iv[j]) return null;
    return new TextDecoder().decode(sortie);
  }
  function ouvrirNotes(cle) {
    var texte = dechiffrer(cle, depuisBase64(NOTES.iv), depuisBase64(NOTES.donnees)), n;
    if (texte === null) return false;
    try { n = JSON.parse(texte); } catch (e) { return false; }
    Object.keys(L).forEach(function (l) { L[l].diapos.forEach(function (d, i) { d.notes = (n[l] || [])[i] || ""; }); });
    notesOuvertes = true;
    try { sessionStorage.setItem("lx-lecon1-cle", versHex(cle)); } catch (e) { /* stockage indisponible */ }
    afficherVerrou();
    return true;
  }
  function verrouillerNotes() {
    if (!NOTES) return;
    Object.keys(L).forEach(function (l) { L[l].diapos.forEach(function (d) { delete d.notes; }); });
    notesOuvertes = false;
    try { sessionStorage.removeItem("lx-lecon1-cle"); } catch (e) { /* stockage indisponible */ }
    afficherVerrou();
  }
  function afficherVerrou() {
    document.getElementById("verrou").hidden = notesOuvertes;
    document.getElementById("notes-texte").hidden = !notesOuvertes;
    document.querySelector('[data-action="verrouiller"]').hidden = !notesOuvertes || !NOTES;
    if (PRESENTATEUR && diapos.length) majConsole(index, L[langue].diapos[index]);
    if (!notesOuvertes) setTimeout(function () { document.getElementById("mdp").focus(); }, 50);
  }
  document.getElementById("verrou").addEventListener("submit", function (e) {
    e.preventDefault();
    var champ = document.getElementById("mdp"), message = document.getElementById("mdp-message");
    message.hidden = false; message.classList.remove("erreur"); message.textContent = UI[langue].calcul;
    setTimeout(function () {
      var cle = pbkdf2(octets(champ.value.trim()), depuisHex(NOTES.sel), NOTES.iterations);
      if (ouvrirNotes(cle)) { champ.value = ""; message.hidden = true; }
      else { message.classList.add("erreur"); message.textContent = UI[langue].mdp_faux; champ.select(); }
    }, 30);
  });

  // Mise à l'échelle 16:9
  function echelle() {
    var s = document.getElementById("scene"), marge = diaporamaActif ? 0 : 24, w = s.clientWidth - marge, h = s.clientHeight - marge;
    document.getElementById("cadre").style.setProperty("--k", Math.max(.1, Math.min(w / 1280, h / 720)).toFixed(4));
    var m = document.querySelector("#suivante .miniature");
    if (m) m.firstChild.style.setProperty("--km", (m.clientWidth / 1280).toFixed(4));
  }
  window.addEventListener("resize", echelle);

  /* ---------- Vue d'ensemble, notes, thème, plein écran, impression ---------- */
  function apercu(ouvrir) {
    var a = document.getElementById("apercu"), g = document.getElementById("apercu-grille");
    if (ouvrir === undefined) ouvrir = a.hidden;
    a.hidden = !ouvrir;
    if (!ouvrir) return;
    g.innerHTML = "";
    diapos.forEach(function (d, k) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "miniature"; b.setAttribute("aria-label", tpl(UI[langue].diapo, { n: k + 1, t: diapos.length }));
      if (k === index) b.setAttribute("aria-current", "true");
      var c = d.cloneNode(true); c.classList.add("active"); c.classList.remove("passee");
      c.querySelectorAll("iframe").forEach(function (f) { f.remove(); });
      b.innerHTML = '<span class="miniature__num">' + (k + 1) + '</span>';
      b.appendChild(c);
      b.addEventListener("click", function () { apercu(false); aller(k); });
      g.appendChild(b);
      requestAnimationFrame(function () { b.style.setProperty("--km", (b.clientWidth / 1280).toFixed(4)); c.style.setProperty("--km", (b.clientWidth / 1280).toFixed(4)); });
    });
    rechargerCopies(g);
    var courant = g.children[index]; if (courant) courant.scrollIntoView({ block: "center" });
  }
  function theme() {
    var r = document.documentElement, t = r.dataset.theme === "light" ? "dark" : "light";
    r.dataset.theme = t; ecrire("lx-theme", t);
  }
  function imprimer() {
    var zone = document.getElementById("impression");
    zone.innerHTML = cadre.innerHTML;
    zone.querySelectorAll(".diapo").forEach(function (d) { d.classList.add("active"); d.classList.remove("passee"); d.querySelectorAll(".bulle").forEach(function (b) { b.classList.add("vue"); }); });
    zone.querySelectorAll(".quiz").forEach(function (q) { q.classList.add("quiz--revele"); });
    rechargerCopies(zone);
    setTimeout(function () { window.print(); }, 300);
  }

  /* ---------- Commandes ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (b) {
      var a = b.dataset.action;
      if (a === "suivant") suivant(); else if (a === "precedent") precedent(); else if (a === "apercu") apercu();
      else if (a === "presentateur") ouvrirPresentateur(); else if (a === "theme") theme(); else if (a === "diaporama") diaporama(false); else if (a === "imprimer") imprimer();
      else if (a === "sortir") quitterDiaporama(); else if (a === "noir") ecranNoir(noir === "noir" ? "" : "noir"); else if (a === "verrouiller") verrouillerNotes();
      else if (a === "zero") { debut = Date.now(); horloges(); } else if (a === "plus") tailleNotes(2); else if (a === "moins") tailleNotes(-2);
      return;
    }
    var l = e.target.closest("[data-langue]");
    if (l) { langue = l.dataset.langue; construire(); return; }
    if (e.target.closest("#ecran-noir")) { suivant(); return; }
    // Un clic dans la scène fait avancer (hors diaporama, le premier quart fait reculer).
    if (e.target.closest(".scene") && !e.target.closest("a, button, iframe, .video")) {
      if (diaporamaActif) { suivant(); return; }
      var x = e.clientX / window.innerWidth, rtl = langue === "ar";
      if (rtl ? x > .75 : x < .25) precedent(); else suivant();
    }
  });
  // Clavier : les raccourcis de PowerPoint pendant le diaporama (N/P, B/W, numéro + Entrée, Échap, F5, Maj+F5, Alt+F5).
  var chiffres = "", minuteurChiffres = null;
  document.addEventListener("keydown", function (e) {
    var k = e.key, rtl = langue === "ar", ppt = diaporamaActif || PRESENTATEUR;
    // Dans le champ du mot de passe, seules les touches des télécommandes de présentation (Page préc./suiv.) font défiler.
    if (e.target.closest && e.target.closest("input, textarea, select") && k !== "PageDown" && k !== "PageUp") return;
    if (k === "F5") { e.preventDefault(); if (e.altKey) ouvrirPresentateur(); else diaporama(!e.shiftKey); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if ((k === " " || k === "Enter") && !chiffres && e.target.closest && e.target.closest("button, a")) return; // le bouton reçoit sa propre action
    if (!document.getElementById("apercu").hidden && k === "Escape") { apercu(false); return; }
    if (ppt && /^[0-9]$/.test(k)) {
      chiffres += k; clearTimeout(minuteurChiffres);
      minuteurChiffres = setTimeout(function () { chiffres = ""; }, 2000);
      return;
    }
    if (k === "Enter" && chiffres) { e.preventDefault(); var c = parseInt(chiffres, 10); chiffres = ""; if (c) { if (noir) ecranNoir(""); aller(c - 1); } return; }
    if (k === (rtl ? "ArrowLeft" : "ArrowRight") || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Enter" || (ppt && (k === "n" || k === "N"))) { e.preventDefault(); suivant(); }
    else if (k === (rtl ? "ArrowRight" : "ArrowLeft") || k === "ArrowUp" || k === "PageUp" || k === "Backspace" || (ppt && (k === "p" || k === "P"))) { e.preventDefault(); precedent(); }
    else if (k === "Home") { if (noir) ecranNoir(""); aller(0); } else if (k === "End") { if (noir) ecranNoir(""); aller(diapos.length - 1); }
    else if (k === "Escape" && diaporamaActif) quitterDiaporama();
    else if (ppt && (k === "b" || k === "B" || k === ".")) ecranNoir(noir === "noir" ? "" : "noir");
    else if (ppt && (k === "w" || k === "W" || k === ",")) ecranNoir(noir === "blanc" ? "" : "blanc");
    else if (k === "o" || k === "O" || k === "g" || k === "G") apercu();
    else if (k === "s" || k === "S" || k === "n" || k === "N") ouvrirPresentateur();
    else if (k === "t" || k === "T") theme();
    else if (k === "f" || k === "F") diaporama(false);
    else if (k === "p" || k === "P") imprimer();
    else if (k === "r" || k === "R") { var q = diapos[index].querySelector(".quiz"); if (q) basculerQuiz(q); }
    else if (k === "l" || k === "L") { langue = { fr: "en", en: "ar", ar: "fr" }[langue]; construire(); }
  });
  var depart = null;
  document.getElementById("scene").addEventListener("touchstart", function (e) { depart = e.touches[0].clientX; }, { passive: true });
  document.getElementById("scene").addEventListener("touchend", function (e) {
    if (depart == null) return;
    var dx = e.changedTouches[0].clientX - depart; depart = null;
    if (Math.abs(dx) < 50) return;
    if ((dx < 0) !== (langue === "ar")) suivant(); else precedent();
  });
  window.addEventListener("hashchange", function () { var n = parseInt(location.hash.slice(1), 10); if (n) aller(n - 1); });

  /* ---------- Démarrage : langue de l'adresse, sinon la dernière utilisée ---------- */
  var memo = null; try { memo = JSON.parse(lire("lx-lecon1") || "null"); } catch (e) { memo = null; }
  var parametre = (location.search.match(/[?&]lang=(fr|en|ar)\b/) || [])[1];
  langue = parametre || (memo && memo.langue) || (/^ar/.test(navigator.language) ? "ar" : /^en/.test(navigator.language) ? "en" : "fr");
  if (!L[langue]) langue = "fr";
  var h = parseInt(location.hash.slice(1), 10);
  index = h ? h - 1 : (memo && memo.langue === langue ? memo.index || 0 : 0);
  var th = lire("lx-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
  if (PRESENTATEUR) {
    document.documentElement.classList.add("mode-presentateur");
    tailleNotes(0); horloges(); setInterval(horloges, 1000);
    // Signale sa présence à la fenêtre projetée, même si celle-ci a été rechargée.
    setInterval(function () { try { if (window.opener && !window.opener.closed) window.opener.postMessage({ type: "presence" }, "*"); } catch (e) { /* fermée */ } }, 3000);
  }
  construire();
  if (PRESENTATEUR) {
    // Notes : déjà ouvertes dans cet onglet ? Sinon, le mot de passe est demandé.
    var memoCle = null; try { memoCle = sessionStorage.getItem("lx-lecon1-cle"); } catch (e) { memoCle = null; }
    if (!(NOTES && memoCle && /^[0-9a-f]{64}$/.test(memoCle) && ouvrirNotes(depuisHex(memoCle)))) afficherVerrou();
    envoyer({ type: "bonjour" });
  }
})();
