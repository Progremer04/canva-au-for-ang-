]},{"type":"texte","titre":"Chips, rare earths, data: the geopolitics of AI","illus":"carte","points":["October 2022: Washington restricts sales of the most powerful AI chips to China","Beijing answers with metals: gallium and germanium (2023), rare earths (2025)","Every country wonders: American or Chinese models? Where does my data go?","Sovereignty: Saudi Arabia and Algeria (law 18-07) regulate data leaving the country"]},{"type":"texte","titre":"The beginners' broken ladder","illus":"echelle","points":["The industrial revolution took one or two centuries; AI changes society in 3 or 4 years","US software developers aged 22–25: nearly 20% fewer jobs since late 2022","AI does not yet replace the expert: it takes the tasks that train beginners","No apprentice in the workshop today, no master tomorrow"]},{"type":"texte","titre":"The real question: who gives the machine power?","illus":"balance","points":["It helps decide a loan, a stock purchase, policies for millions of people","It is used in war too… the same kind of model that does your math homework!","The question is no longer “is it intelligent?”","But: who gave it authority? Who tested it? Who answers when it gets it wrong?"]},{"type":"texte","titre":"The magician's trick","illus":"chapeau","points":["Not “good or bad?”, but: what it does well or badly, for whom, at whose expense","Understanding puts everything in its place: fear or wonder, when each is due","Knowing the trick takes nothing from the magician: we see how skillful he is","The path: its history, then inside the machine (networks, weights, attention)"]},{"type":"section","numero":"2","titre":"What is AI?","periode":"Definitions","texte":"Before telling the story, let us agree on the words: what does “artificial intelligence” mean?","illus":"profil"},{"type":"texte","titre":"And you, what do you call “intelligence”?","points":["Understanding a sentence, translating a poem","Recognizing one face among a thousand","Winning at chess, solving a problem","Learning from one's mistakes","Acting alone to reach a goal"],"illus":"cerveau"},{"type":"texte","titre":"An “artificial” intelligence","points":["A simple definition: AI is a machine's attempt to *simulate* intelligence","It does not need to understand: it only needs to *seem* to understand","“Artificial” as in “an artificial smile”: imitated, not just manufactured","“I understand you,” says the chatbot: probably not, but it often helps"],"illus":"imitation"},{"type":"schema","titre":"Three levels of AI","illus":"niveaux","niveaux":["narrow","general","super"],"points":["Narrow AI: a genius at one task (Google Maps, chess, video games); it exists","Google Translate: nearly 250 languages… but it cannot play chess","General AI: translating, playing, finding the way… like a human; still theoretical","Superintelligence: far beyond us, perhaps self-aware, with its own goals; unknown"]},{"type":"texte","titre":"What about ChatGPT?","points":["It translates, writes, codes, makes images… and even poems, not always good ones","But it learned from the data it was given, not from the world, and struggles to go further","Narrow or general? Experts disagree; general AI does not exist yet","Money, chips, electricity, algorithms: many think we will get there; let us be ready"],"illus":"attention"},{"type":"texte","titre":"What is an AI made of? Three layers","illus":"couches","couches":["algorithms: the engine","compute: the chips","data: the fuel"],"points":["Data, the fuel: the texts, images and sounds the machine learns from","Compute, the power: graphics chips (GPUs), servers, data centers","Algorithms, the engine: the recipe that turns data into know-how","The three advance together: the history that follows is the story of these three layers"]},{"type":"section","numero":"3","titre":"The dream of machines","periode":"From Antiquity to 1949","texte":"Long before computers, humans imagined and built machines that imitate life, then machines that calculate.","illus":"engrenages"},{"type":"texte","titre":"Automata in myths and workshops","points":["Greek myth: Talos, a bronze giant who guards Crete","1st century: Hero of Alexandria describes theater automata","1739: Vaucanson's duck flaps its wings and “digests”","Around 1770: the Jaquet-Droz Writer traces letters with a quill"],"illus":"engrenages"},{"type":"texte","titre":"Al-Jazari, the engineer of ingenious machines","annee":"1206","points":["Engineer at the Artuqid court, in Upper Mesopotamia","In 1206, writes *The Book of Knowledge of Ingenious Mechanical Devices*","Describes some fifty machines: clocks, pumps, automata","His elephant clock marks the hours with automata"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"Machines that calculate","points":["1642: Blaise Pascal builds the Pascaline, which adds","1673: Leibniz presents a machine that multiplies","1837: Charles Babbage designs the Analytical Engine, programmable with punched cards","The Analytical Engine would never be completed in his lifetime"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathematician, the first programmer","points":["1843: her notes on Babbage's Analytical Engine","In them, she writes an algorithm to compute Bernoulli numbers","She imagines that the machine could compose music"],"citation":"The Analytical Engine has no pretensions whatever to originate anything.","source":"Ada Lovelace, notes of 1843"},{"type":"texte","titre":"When thought becomes calculation","points":["1854: George Boole reduces reasoning to calculations on true and false","1936: Alan Turing describes an abstract machine capable of any calculation","A tape, a read head, a table of rules: the “Turing machine”","Every computer today is, in principle, a Turing machine"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathematician, father of theoretical computer science","points":["1936: the universal machine","1939–1945: helps break the Enigma code at Bletchley Park","1950: “Computing Machinery and Intelligence”, the founding paper"],"citation":"I propose to consider the question, ‘Can machines think?’","source":"Alan Turing, Mind, 1950"},{"type":"schema","titre":"The formal neuron","annee":"1943","illus":"neurone","points":["Warren McCulloch and Walter Pitts model a neuron as a calculation","It adds up input signals and “fires” above a threshold","It is the ancestor of all today's neural networks"]},{"type":"texte","titre":"The first computers","points":["1945: ENIAC, 30 tonnes, calculates ballistic trajectories","1948: Claude Shannon founds information theory","The bit becomes the unit of all information: text, image, sound","The machines finally exist; now they must be made “intelligent”"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"4","titre":"The birth of AI","periode":"1950–1980","texte":"A question that seemed absurd: can a computer think? Two answers will compete: write rules, or copy neurons.","illus":"ampoule"},{"type":"schema","titre":"The imitation game","annee":"1950","illus":"imitation","points":["A judge converses in writing with two hidden interlocutors","One is a human, the other a machine","If the judge cannot tell them apart, the machine “passes”"]},{"type":"citation","texte":"Every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposal for the Dartmouth workshop, August 31, 1955"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Computer scientist who gave AI its name","points":["Summer 1956: organizes the Dartmouth workshop, the birth certificate of AI","1958: creates the Lisp language, long the language of AI","With him: Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"encart":"dartmouth"},{"type":"texte","titre":"The first “intelligent” program","annee":"1956","points":["The Logic Theorist by Allen Newell, Herbert Simon and Cliff Shaw","It proves 38 of the first 52 theorems of *Principia Mathematica*","For one of them, a more elegant proof than the authors' own","A key idea: searching among possibilities with rules"],"illus":"arbre"},{"type":"texte","titre":"The age of rules: IF… THEN…","points":["The first era of AI: the age of logic, or of rules","To act like us, the machine is given rules: “IF this, THEN that”","The result: a good executor that follows steps, not an intelligence","But rules are made to be broken… and a young researcher is about to do it"],"illus":"regles"},{"type":"portrait","personne":"perceptron","nom":"Frank Rosenblatt and the Mark I Perceptron","dates":"1957–1960","role":"Psychologist at the Cornell Aeronautical Laboratory (Buffalo, USA)","points":["Instead of fixed rules, learn as a human does: copy the neurons of the brain","A “retina” of 20 × 20 = 400 photocells turns the image into numbers","Circle or square? When it is wrong, it corrects its weights: it learns from its mistakes"],"citation":"The first machine which is capable of having an original idea","source":"Frank Rosenblatt, 1958","illus":"perceptron"},{"type":"schema","titre":"How the perceptron decides","annee":"1958","illus":"perceptron","points":["Each input is multiplied by a *weight*, then everything is added up","Sum above the threshold → 1, below → 0: like a neuron that fires or not","An engineer? The baccalaureate grade weighs a lot; height, almost nothing","An athlete? The reverse: height counts (volleyball, basketball). Each clue has its weight"]},{"type":"citation","texte":"The Navy revealed the embryo of an electronic computer today that it expects will be able to walk, talk, see, write, reproduce itself and be conscious of its existence.","auteur":"*The New York Times*","source":"“New Navy Device Learns by Doing”, July 8, 1958"},{"type":"texte","titre":"Arthur Samuel: learning by playing","annee":"1959","points":["At IBM, Arthur Samuel writes a checkers program that improves by playing against itself","1959: his paper launches the term “machine learning”","After 8 to 10 hours of play, the program plays better than its own creator","Two paths emerge: writing the rules, or having them learned"],"illus":"dames"},{"type":"citation","texte":"Machines will be capable, within twenty years, of doing any work a man can do.","auteur":"Herbert Simon","source":"1965"},{"type":"chat","titre":"ELIZA, the first artificial psychotherapist","annee":"1966","legende":"From Joseph Weizenbaum's 1966 paper","echanges":[{"qui":"h","texte":"Men are all alike."},{"qui":"m","texte":"IN WHAT WAY"},{"qui":"h","texte":"They're always bugging us about something or other."},{"qui":"m","texte":"CAN YOU THINK OF A SPECIFIC EXAMPLE"},{"qui":"h","texte":"Well, my boyfriend made me come here."},{"qui":"m","texte":"YOUR BOYFRIEND MADE YOU COME HERE"}]},{"type":"texte","titre":"Shakey, the first robot that reasons","annee":"1966–1972","points":["Built at the Stanford Research Institute (SRI)","It perceives its environment with a camera","It plans a sequence of actions to reach a goal","The A* algorithm, still used to compute routes, was created for it"],"personne":"shakey","illus":"robot"},{"type":"schema","titre":"1969: the XOR wall","annee":"1969","illus":"xor","points":["1969: Marvin Minsky and Seymour Papert (MIT) publish the book *Perceptrons*","The perceptron splits two groups with one straight line: circle or square, sick or healthy","The two-key door: it opens if one OR the other turns a key, but not if both do","It needs a rule on top of a rule: no line is enough. This is “exclusive OR” (XOR)"],"personne":"minsky"},{"type":"schema","titre":"The first AI winter","annee":"1974–1980","illus":"courbe","points":["After *Perceptrons*, fear: the money for neural networks stops","1973: the Lighthill report (United Kingdom) finds the promises unkept, and funding is cut","Around 1974, in the United States, DARPA demands military results and cuts its funding","Neural networks: some fifteen years of doubt, “only the brain is intelligent”"]},{"type":"section","numero":"5","titre":"From rules to data","periode":"1980–2005","texte":"Rules conquer companies, then run into reality. Meanwhile, machines start learning from examples.","illus":"regles"},{"type":"schema","titre":"Turning knowledge into rules","illus":"regles","points":["A fact base, a base of IF … THEN … rules, an inference engine","1970s: MYCIN, at Stanford, diagnoses blood infections","1980: XCON configures computers for the company DEC","Companies invest: AI becomes an industry"]},{"type":"texte","titre":"Learning instead of writing everything","points":["Cat, dog or hyena? All have a tail, two eyes and fur: rules get lost","It must learn like a child: see many examples and spot the differences","1980s: faster, cheaper computers; researchers can experiment freely","Data is AI's gym: the more data, the stronger the muscle"],"illus":"donnees"},{"type":"deux","titre":"Two ways to build an AI","gauche":{"titre":"Symbolic AI","points":["An expert writes the rules","Explainable: the reasoning can be followed","Brittle outside its domain","Example: an expert system"]},"droite":{"titre":"Machine learning","points":["The machine draws patterns from examples","Often hard to explain","Robust, if there is plenty of data","Example: a spam filter"]}},{"type":"texte","titre":"The return of neural networks","annee":"1986","points":["The idea: stack perceptrons in layers, like the layers of a lasagna","Each layer checks one condition and passes on to the next: XOR becomes possible","The harder the problem, the more layers you add","1986: Rumelhart, Hinton and Williams popularize backpropagation to train them"],"personne":"rumelhart","illus":"reseau"},{"type":"schema","titre":"Sending the error back","annee":"1986","illus":"retro","points":["The machine answers; the teacher compares with the right answer: right or wrong?","If wrong, it goes back through the layers: which weights caused the error, and by how much?","It corrects those weights and tries again, thousands of times: this is backpropagation","A teacher who knows the answer: this is *supervised* learning"]},{"type":"portrait","personne":"lecun","nom":"Yann LeCun and LeNet","dates":"1989–1998","role":"French researcher at Bell Labs, later head of AI research at Meta","points":["1989: his network reads handwritten digits on US zip codes","For the first time, AI does a real job, outside the laboratory","From 1996, LeNet reads checks: by 2001, about 10% of all US checks"],"illus":"reseau"},{"type":"texte","titre":"The second winter","annee":"1987–1993","points":["1987: the Lisp machine market collapses; expert systems disappoint","Networks remain weak: training too slow, computers not powerful enough","Not failure, but inflated expectations: after 5 goals, 2 goals feel like a defeat","For neural networks, the cold lasts until about 2006"],"illus":"flocon"},{"type":"portrait","personne":"deepblue","nom":"Deep Blue versus Kasparov","dates":"May 1997","role":"IBM's computer beats the world chess champion","points":["New York, six games: 2 wins, 1 loss, 3 draws, so 3½ to 2½","Game 2: a move so “human” that Kasparov accuses IBM of cheating","No neural network: 200 million positions per second and experts' rules"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"Learning spreads everywhere","evenements":[{"annee":"1992","titre":"TD-Gammon","texte":"A network learns backgammon by playing against itself, without human games"},{"annee":"1997","titre":"Memory (LSTM)","texte":"Hochreiter and Schmidhuber give networks a memory to read sequences"},{"annee":"2001","titre":"Faces","texte":"Viola and Jones: a machine learns to spot faces in real time"},{"annee":"2002","titre":"Spam filters","texte":"Filters learn from your own emails to recognize spam"},{"annee":"2005","titre":"Stanley","texte":"A Stanford driverless car wins DARPA's desert race"}]},{"type":"section","numero":"6","titre":"The deep learning revolution","periode":"2006–2017","texte":"In the middle of winter, one researcher revives deep networks. In 2012, data, graphics cards and algorithms come together: the machine learns to see, to create, then to beat the champions.","illus":"reseau"},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Born in 1947","role":"Researcher at the University of Toronto, pioneer of neural networks","points":["He defends neural networks through both winters, against almost everyone","2006: he trains a deep network layer by layer; “deep” means many layers","2018 Turing Award (with Bengio and LeCun), 2024 Nobel Prize in Physics (with Hopfield)"]},{"type":"schema","titre":"Graphics cards for computing","annee":"2007","illus":"gpu","puces":["CPU: 4 cores","GPU: thousands"],"personne":"gpu","points":["Graphics cards (GPUs) are made for video games: millions of pixels at once","2007: with CUDA, NVIDIA lets researchers program them for any calculation","A CPU has a few big cores; a GPU has hundreds, then thousands, of small ones","A network trains up to 70 times faster; in 2016, Google unveils its TPU chips"]},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li and ImageNet","dates":"2009–2017","role":"Researcher at Princeton, then Stanford: she bets on data","points":["2009: ImageNet; it will grow to over 14 million images in nearly 22,000 categories","Labeled by hand by nearly 49,000 people in 167 countries, via Amazon Mechanical Turk","From 2010 to 2017, a yearly contest: which program best recognizes 1,000 categories?"],"illus":"imagenet"},{"type":"texte","titre":"2011: AI leaves the lab","annee":"2011","points":["February 2011: IBM's Watson beats the two greatest champions of the TV quiz *Jeopardy!*","Clues full of puns: it must grasp the context, not just know facts","Watson wins 1 million dollars, which IBM gives to charity","October 2011: Siri arrives on the iPhone 4S; millions of people talk to their phone"],"personne":"watson"},{"type":"texte","titre":"2012: the machine discovers the cat on its own","annee":"2012","points":["Google Brain (Andrew Ng, Jeff Dean) links 1,000 computers: 16,000 processor cores","The network watches 10 million images from YouTube videos; nobody tells it anything","On its own, it forms a “cat” detector: this is *unsupervised* learning","First sign that a deep network can find concepts, not just memorize"],"illus":"chat"},{"type":"schema","titre":"2012: AlexNet, the three gears meet","annee":"2012","illus":"engrenages","points":["Krizhevsky, Sutskever and Hinton (Toronto) train a deep network on two gaming GPUs","2012 ImageNet contest: 15.3% error, against 26.2% for the runner-up","Algorithms (deep networks) + data (ImageNet) + compute (GPUs): everything meets","AI's second spring begins: the era of deep learning"]},{"type":"schema","titre":"A deep network, layer by layer","illus":"reseau","points":["The first layers detect simple features: edges, blobs","The next layers combine them: shapes, textures, parts","The last ones recognize whole objects: “cat”, “car”","Each layer learns by itself what to detect"]},{"type":"schema","titre":"2014: the forger and the detective","annee":"2014","illus":"gan","roles":["forger","detective"],"personne":"goodfellow","points":["Ian Goodfellow invents GANs: two networks that train against each other","The forger makes fake images; the detective tries to expose them","Each time it is caught, the forger improves; so does the detective","Almost real images, then “deepfakes”: AI no longer only judges, it creates"]},{"type":"schema","titre":"Go: more positions than atoms","illus":"go10","echelle":["chess 10⁴³","atoms 10⁸⁰","go 10¹⁷⁰"],"personne":"goban","points":["A 19 × 19 board, black and white stones: you must surround your opponent","Born in China over 2,500 years ago, it is a game of intuition more than calculation","Chess: about 10⁴³ possible positions (Shannon, 1950); go: about 10¹⁷⁰","That is far more than the roughly 10⁸⁰ atoms in the observable universe"]},{"type":"portrait","personne":"hassabis","nom":"AlphaGo and Move 37","dates":"March 2016, Seoul","role":"DeepMind (Google), co-founded by Demis Hassabis","points":["Five games against Lee Sedol, a go legend: everyone expects the human to win","Game 2, move 37: a move no human would have played; experts think it is a mistake","AlphaGo wins 4–1; Lee Sedol wins game 4 with a brilliant move of his own, move 78"],"citation":"It's not a human move. I've never seen a human play this move. So beautiful.","source":"Fan Hui, European go champion, in *Wired*, March 2016","illus":"go","encart":"leesedol"},{"type":"texte","titre":"AlphaZero, then AlphaFold: from games to science","annee":"2017–2024","points":["2017: AlphaGo Zero learns go by playing against itself, without a single human game","After 3 days, it wins 100–0 against the version that beat Lee Sedol","AlphaZero also learns chess and shogi, from the rules alone, in a few hours","2020: AlphaFold predicts protein shapes; 2024 Nobel Prize in Chemistry (Hassabis, Jumper)"],"illus":"echecs"},{"type":"frise","titre":"Three victories, three ways to beat humans","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"Calculation: 200 million positions per second and rules written by experts"},{"annee":"2011","titre":"Watson","texte":"Language: it wins *Jeopardy!*, a quiz full of wordplay, and 1 million dollars"},{"annee":"2016","titre":"AlphaGo","texte":"Creativity: 10¹⁷⁰ positions in go; move 37 surprises its own makers"},{"annee":"2017","titre":"AlphaGo Zero","texte":"No human games: after 3 days of playing itself, it beats AlphaGo 100–0"},{"annee":"2024","titre":"AlphaFold","texte":"From games to science: the shape of proteins, and the Nobel Prize in Chemistry"}]},{"type":"section","numero":"7","titre":"Transformers and generative AI","periode":"2017–2026","texte":"Until now, the machine judged. With the Transformer (2017), it learns to read whole texts, then starts to write, draw, compose and make videos.","illus":"attention"},{"type":"deux","titre":"From sorting to creating","gauche":{"titre":"AI that judges (yesterday)","points":["A photo: “cat or dog?”","A check: what amount is written?","A patient: what is the risk of disease?","It answers with a label or a percentage"]},"droite":{"titre":"AI that generates (today)","points":["It has learned patterns: faces, word order, sounds","It produces something new: images, music, stories","It imitates a style: “in the manner of Picasso, of Dalí”","Inventing a truly new style? The question is still open"]}},{"type":"schema","titre":"“Attention Is All You Need”","annee":"2017","illus":"attention","points":["June 2017: eight Google researchers present the **Transformer**, tested on translation","It reads the whole sentence at once: **attention** links each word to those that explain it","“The student opened the book because she…”: “she” looks at “student”","It is the “T” in GPT; all large language models descend from it (part 9)"]},{"type":"frise","titre":"From GPT-1 to ChatGPT","evenements":[{"annee":"2018","titre":"GPT-1 and BERT","texte":"OpenAI trains GPT-1 on over 7,000 unpublished books; Google launches BERT"},{"annee":"2019","titre":"GPT-2","texte":"1.5 billion parameters; OpenAI delays its full release for fear of misuse"},{"annee":"2020","titre":"GPT-3","texte":"175 billion parameters: it drafts, summarizes and rephrases"},{"annee":"2022","titre":"ChatGPT","texte":"November 30: 1 million users in 5 days, 100 million in 2 months"},{"annee":"2023","titre":"GPT-4","texte":"March 14: it also takes images and passes a simulated bar exam"}]},{"type":"frise","titre":"Toward multimodal AI: seeing, reading, speaking","evenements":[{"annee":"2014","titre":"Captions","texte":"A network that sees and a network that writes, stuck together, describe a photo"},{"annee":"2021","titre":"CLIP","texte":"400 million image-text pairs: pictures and words in the same space"},{"annee":"2022","titre":"Diffusion","texte":"DALL·E 2, Stable Diffusion: an image is born from noise being removed"},{"annee":"2023","titre":"Bridges","texte":"A large vision model is linked to a large language model"},{"annee":"2024","titre":"Native","texte":"A single network for text, image and voice: about a third of a second to answer"}]},{"type":"texte","titre":"2026: eternal spring or a new winter?","illus":"saisons","courbes":["expectations","abilities"],"points":["AI has become multimodal: it writes, summarizes, draws, composes, makes videos, codes","The question of this whole history: do our expectations exceed its abilities?","If so, a new winter may come, even when the achievements remain huge","The lesson of the two winters: judge by results, not by promises"]},{"type":"section","numero":"8","titre":"How does a machine learn?","periode":"Episode 3: the neural network","texte":"Let us open the machine: how does a network of artificial neurons learn? But first, a story.","illus":"reseau"},{"type":"texte","titre":"A night in Tempe","annee":"2018","personne":"ubercar","points":["18 March 2018, about 10 p.m., Tempe (Arizona): a woman crosses a dark street with her bicycle","On the bicycle, her shopping bags. A car comes, does not brake in time: she dies","The car was driving itself: an Uber test, with a safety driver on board","Its sensors had “seen” her. Why did it not understand? Uber suspends its tests"]},{"type":"texte","titre":"Copying nature","illus":"oiseau","points":["To fly, we watched birds; to build intelligence, we watch the brain","The human brain has about 86 billion neurons, connected to each other","Understanding how they work may bring us closer to general AI","From this idea comes the artificial neural network: a very simplified copy"]},{"type":"schema","titre":"The guessing game: what is their job?","illus":"devinette","indices":["helmet: 90%","vest: 70%","boots: 60%"],"resultat":"engineer","points":["White coat, stethoscope around the neck: a doctor. Easy!","Now a team that knows nothing of our jobs; each member sees only one piece of the photo","One looks at the head (helmet? cap?), one at the clothes, one at the shoes","Helmet 90%, vest 70%, safety boots 60%: the team concludes “engineer”"]},{"type":"schema","titre":"Anatomy of a decision: weights, bias, activation","illus":"decision","etapes":["inputs × weights","sum + bias","activation"],"points":["Weight = importance: helmet 100, vest 70, boots 50 (the most doubtful clue)","(0.9 × 100 + 0.7 × 70 + 0.6 × 50) ÷ 220 = 169 ÷ 220 ≈ 77% “engineer”","Bias: a number added to the sum that corrects a leaning (boots overrated)","Activation: not “engineer or not”, but “60% engineer, 30% soldier…”"]},{"type":"schema","titre":"Level 2: the soldier in camouflage","illus":"devinette","indices":["helmet: 90%","vest: 70%","boots: 60%"],"resultat":"engineer ✗","points":["Same helmet, same vest, same boots… but camouflage clothes: a soldier on duty","The team answered “engineer”: the color of the clothes had no weight","We point out the mistake, it adjusts: from now on, color counts. That is learning","More teams (what he holds, what he rides, the setting) = more parameters = better answers"]},{"type":"texte","titre":"A neural network in one sentence","illus":"reseau","points":["Each artificial neuron receives information and gives it a probability and a weight","It passes its conclusion on to the next layer, up to the final answer","Learning = adjusting the weights after each mistake: millions, then billions","All this without understanding anything: the founding idea of today's AI"]},{"type":"schema","titre":"Three ways to learn","illus":"apprendre","types":["supervised","unsupervised","reinforcement"],"points":["Supervised: the teacher gives the right answer, even after a mistake (LeNet and the checks)","Unsupervised: “find on your own what repeats” (Google's cat, 2012)","Reinforcement: only “wrong” or “right”, never the answer (AlphaGo Zero, 2017)","ChatGPT uses all three: reading alone, imitating dialogues, then being rated by humans"]},{"type":"schema","titre":"Learning too much, learning too little","illus":"ajustement","cas":["underfitting","right balance","overfitting"],"points":["Overfitting: in the training photos, every doctor wore glasses","The model gives glasses a weight of 100: a doctor without glasses? “Not a doctor”","Underfitting: the pupil who skims the book and misses important details","Same remedy: more data, more varied: day and night, places, colors, clothes"]},{"type":"texte","titre":"Back to Tempe: what happened","annee":"2018","illus":"uber","points":["Detected 5.6 s before impact, but labeled in turn vehicle, bicycle, “other”","The system did not expect pedestrians outside crosswalks (NTSB, 2019): too narrow a view","Emergency braking disabled in self-driving mode; the safety driver was looking at her phone","Uber's lesson, and ours: understand the machine before you trust it"]},{"type":"section","numero":"9","titre":"How does a machine read a text?","periode":"From words to numbers","texte":"We have seen how a model “sees”; it understands language in a fairly similar way. How does it turn words into numbers?","illus":"attention"},{"type":"schema","titre":"From text to numbers","illus":"tokens","phrase":"The cat drinks warm milk","ids":"412 8093 5871 88 2310","points":["A computer only knows numbers","The text is cut into pieces: **tokens**","Each token gets a number, then a long list of numbers: a **vector**","The model never sees letters, only these numbers"]},{"type":"schema","titre":"The map of meanings","illus":"sens","mots":["cat","dog","horse","book","novel","reader","man","woman","king","queen"],"points":["Each vector is an address on a huge map of meanings","Words with the same neighbors end up close: “cat”, “dog”","The model learns this by itself, guessing hidden words in billions of sentences","The map keeps relations: from “man” to “woman” as from “king” to “queen”"]},{"type":"schema","titre":"Context gives meaning","illus":"contexte","phrase1":"the mouse eats the cheese","phrase2":"I click with the mouse","liens":[[1,4],[4,1]],"points":["The same word can have several meanings: “mouse”","**Attention** links each word to its neighbors","With “cheese”, the mouse is the animal; with “click”, it is the device","The word's vector is recalculated from its context"]},{"type":"schema","titre":"How a language model “writes”","illus":"motsuivant","points":["It splits the text into pieces, the tokens","It calculates the probability of each possible next token","It picks one, adds it to the text, and starts again","Humans then rate its answers to refine it"],"debut":"The cat drinks some","suites":["milk","water","tea","juice"]},{"type":"chat","titre":"A dialogue with a language model","annee":"2022","legende":"Fictional example, written for the class","echanges":[{"qui":"h","texte":"Explain forward chaining to a literature student."},{"qui":"m","texte":"Imagine a detective: he starts from the clues he knows and applies his rules one by one, until he finds the culprit."},{"qui":"h","texte":"Give me a reference so I can cite this in my thesis."},{"qui":"m","texte":"Careful: always check a reference in a library. I can make mistakes or invent references."}]},{"type":"section","numero":"10","titre":"The age of agents","periode":"2023–2026","texte":"The language model no longer just answers: it plans, uses tools and acts.","illus":"agent"},{"type":"texte","titre":"What is an agent?","points":["An agent perceives its environment and acts on it to reach a goal","A thermostat is a very simple agent: it measures, then heats or not","Russell and Norvig (1995) define all of AI as the study of agents","A modern AI agent receives a goal, not just a question"],"illus":"thermostat"},{"type":"schema","titre":"The agent loop","illus":"boucle","points":["Goal: what the user asks for","Think: the model plans the next step","Act: it uses a tool (search, calculation, file, browser)","Observe: it reads the result, then starts again until the goal is reached"]},{"type":"frise","titre":"From chatbots to agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Researchers make a single model alternate between reasoning and actions"},{"annee":"2023","titre":"Tools","texte":"GPT-4; models learn to call tools and programs"},{"annee":"2024","titre":"Reason, act","texte":"Models that think before answering; a model operates a computer; the MCP protocol for connecting tools"},{"annee":"2025","titre":"Agents at work","texte":"Agents that browse the Web, write and fix programs"},{"annee":"2026","titre":"Everyday use","texte":"Agents settle into office, research and teaching software"}]},{"type":"deux","titre":"Chatbot or agent?","gauche":{"titre":"Chatbot","points":["Answers a question","Produces text","A single turn","The human does the rest"]},"droite":{"titre":"Agent","points":["Pursues a goal","Uses tools and acts","Several steps; it corrects its plan","The human supervises and approves"]}},{"type":"texte","titre":"The risks, and good practice","points":["Hallucinations: an agent may act on false information","Irreversible actions: deleting, sending, paying; they must be approved","Instructions hidden in a Web page can hijack an agent","Personal data: Algerian Law 18-07 applies","2024: the European Union adopts the AI Act"],"illus":"bouclier"},{"type":"texte","titre":"And in Algeria?","points":["2021: the National Higher School of Artificial Intelligence (ENSIA) opens","Arabic, Darja and Tamazight remain less well served by models","Local corpora, built in the humanities and social sciences, are a real contribution","Your theses can contribute: texts, surveys, interviews"],"illus":"carte"},{"type":"section","numero":"11","titre":"Summary","periode":"From 1206 to 2026","texte":"Eight centuries of dreams, seventy years of science, a few years of agents.","illus":"frise"},{"type":"frise","titre":"The eight dates to remember","evenements":[{"annee":"1843","titre":"Lovelace","texte":"The first program, for a machine never completed"},{"annee":"1950","titre":"Turing","texte":"Can machines think?"},{"annee":"1956","titre":"Dartmouth","texte":"AI gets its name"},{"annee":"1974","titre":"Winter","texte":"The first AI winter"},{"annee":"1997","titre":"Deep Blue","texte":"A computer beats the chess champion"},{"annee":"2012","titre":"AlexNet","texte":"Deep learning wins out"},{"annee":"2017","titre":"Transformer","texte":"Attention at the heart of language models"},{"annee":"2022","titre":"ChatGPT","texte":"Generative AI for everyone; then come the agents"}]},{"type":"deux","titre":"The families of AI, on a single slide","gauche":{"titre":"By method","points":["Symbolic: written rules","Machine learning: examples","Deep learning: networks with many layers","Reinforcement: trials and rewards"]},"droite":{"titre":"By ambition","points":["Weak (narrow) AI: one specific task","Strong (general) AI: every task, hypothetical","Today's agents are still weak AI","… but increasingly versatile"]}},{"type":"texte","titre":"Four lessons from 90 years of AI","illus":"saisons","courbes":["expectations","computing power"],"points":["The danger is not failure but inflated expectations: they caused the two winters","Old ideas return when data and compute arrive: the 1958 perceptron lives on in ChatGPT","Passing a test is not understanding: the real world is the hard part","Eternal spring, or a new winter? Judge by results, not by promises"]},{"type":"video","titre":"Video: the complete history of AI (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"“The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence”, a documentary in English, on YouTube"},{"type":"video","titre":"Video: a hundred years of artificial intelligence","youtube":"mSd9nmPM7Vg","legende":"“The Entire History of Artificial Intelligence (Last 100 Years)”, a documentary in English, on YouTube"},{"type":"quiz","question":"In what year did the term “artificial intelligence” take hold, with the Dartmouth workshop?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"The term appears in the 1955 proposal and took hold with the workshop in the summer of 1956."},{"type":"quiz","question":"Why do we speak of AI “winters”?","choix":["Computers overheated","Disappointment made funding and interest fall","Research was done in winter","Machines were banned"],"reponse":1,"explication":"After excessive promises, the results were disappointing: funding was cut (1974–1980, then 1987–1993)."},{"type":"quiz","question":"What distinguishes an agent from a simple chatbot?","choix":["It writes faster","It pursues a goal by acting with tools","It never makes mistakes","It works without electricity"],"reponse":1,"explication":"An agent chains actions (searching, calculating, writing a file…) and observes the results to reach a goal."},{"type":"quiz","question":"Did ELIZA (1966) understand what was said to it?","choix":["Yes, like a psychologist","No: it transformed sentences with rules","Yes, thanks to deep learning","We do not know"],"reponse":1,"explication":"ELIZA spotted keywords and sent back stock sentences. Believing that it understood is the “ELIZA effect”."},{"type":"quiz","question":"Why can't the simple perceptron learn the “two-key door” (XOR)?","choix":["It does not have enough memory","A single straight line does not separate the two groups","XOR does not exist in mathematics","It needs a more precise camera"],"reponse":1,"explication":"The perceptron draws a single straight border; XOR needs two rules on top of each other, so at least two layers, trained by backpropagation."},{"type":"quiz","question":"A model has only seen doctors wearing glasses; faced with a doctor without glasses, it answers “not a doctor”. What is this flaw?","choix":["Underfitting","Overfitting","Hallucination","Activation bias"],"reponse":1,"explication":"It learned a detail of its examples by heart instead of the general rule: that is overfitting. Remedy: more numerous and more varied examples."},{"type":"quiz","question":"Google Translate is an example of which kind of AI?","choix":["Narrow AI","General AI","Superintelligence","An autonomous agent"],"reponse":0,"explication":"Brilliant at translation, it can neither play chess nor write code: it excels at a single task. That is narrow AI."},{"type":"quiz","question":"In 2012, what made AlexNet's victory possible?","choix":["A brand-new algorithm, on its own","Millions of images, on their own","Graphics cards, on their own","A deep network, ImageNet's images and graphics cards together"],"reponse":3,"explication":"The ideas dated from the 1980s; it also took ImageNet's images and the power of GPUs. The three gears finally met."},{"type":"quiz","question":"Tempe, 2018: why did Uber's test car not react in time?","choix":["It had no sensor able to see at night","It was driving far too fast to brake in time","It had not learned that people cross outside crosswalks, and hesitated over what it saw","The woman was invisible to its cameras and its radars"],"reponse":2,"explication":"Detected 5.6 s before impact, she was never recognized as a pedestrian: the system did not expect people to cross outside a crosswalk (NTSB, 2019)."},{"type":"fin","titre":"Key takeaways","points":["AI has spread faster than the PC, mobile phone and Internet: states and jobs are at stake","AI imitates intelligence: it seems to understand; general AI does not exist yet","Rules and neurons take turns; winters are born of inflated expectations","2012: data, graphics cards and deep networks come together","A network weighs clues and corrects errors; it fails if it learns too much or too little","Who gives the machine power? Check, stay in control, declare your use"],"texte":"Homework: choose a date from the timeline and write ten lines on what it changed, citing a verified source."}]},"ar":{"langue":"ar","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","diapos":[{"type":"couverture","surtitre":"الذكاء الاصطناعي · الفصل 1 · الدرس الأول","titre":"من الآلة الذاتية الحركة إلى الوكيل الذكي","sousTitre":"التاريخ الكامل للذكاء الاصطناعي، من الآلات الأولى إلى وكلاء اليوم","illus":"agent"},{"type":"plan","titre":"رحلة هذا الدرس","points":["لماذا الذكاء الاصطناعي، ولماذا الآن؟ (2026)","ما الذكاء الاصطناعي؟ (تعريفات)","حلم الآلات (من العصور القديمة إلى 1949)","ميلاد الذكاء الاصطناعي (1950–1980)","من القواعد إلى البيانات (1980–2005)","ثورة التعلم العميق (2006–2017)","المحوِّلات والذكاء الاصطناعي التوليدي (2017–2026)","كيف تتعلّم الآلة؟ (الحلقة 3: الشبكة العصبية)","كيف تقرأ الآلة نصًّا؟ (من الكلمات إلى الأرقام)","عصر الوكلاء (2023–2026)","خلاصة (من 1206 إلى 2026)"]},{"type":"section","numero":"1","titre":"لماذا الذكاء الاصطناعي، ولماذا الآن؟","periode":"2026","texte":"كلما ظننّا أننا فهمنا الذكاء الاصطناعي، فاجأنا من جديد. فلماذا يتسارع كل شيء الآن؟","illus":"ampoule"},{"type":"texte","titre":"الذكاء الاصطناعي يفاجئنا من جديد","illus":"capacites","etapes":["يحسب","يلعب","يترجم","يكتب","يرسم","يصوّر"],"points":["حسب، ولعب الشطرنج، وترجم، وكتب، ورسم، وصوّر… وماذا غدًا؟","في كل مرة نقول: «هذا أقصى ما يبلغه»، وفي كل مرة يذهب أبعد","ما ظننتُه حكرًا على الإنسان صارت الآلة تفعله، وأسرع بآلاف المرات","سؤال هذا المساق: ما الذكاء الاصطناعي، ولماذا الآن؟"]},{"type":"texte","titre":"«الاختراع الأخير»: لماذا الآن؟","illus":"adoption","courbes":["الحاسوب","الهاتف","الإنترنت","الذكاء التوليدي"],"points":["في ثلاث سنوات، انتشر الذكاء الاصطناعي التوليدي أسرع من الحاسوب والهاتف المحمول والإنترنت","ChatGPT وحده: 900 مليون مستخدم كل أسبوع (فبراير 2026)","88% من المؤسسات تستعمله في وظيفة واحدة على الأقل (McKinsey، 2025)","2025: استثمار 345 مليار دولار؛ 2026: أكثر من تريليون دولار لمراكز البيانات"]},{"type":"citation","texte":"ستكون أول آلة فائقة الذكاء آخرَ اختراع يحتاج الإنسان إلى صنعه، بشرط أن تكون الآلة مطيعة بما يكفي لتخبرنا كيف نُبقيها تحت السيطرة.","auteur":"إيرفينغ جون غود (Irving John Good)","source":"«تأمّلات في أول آلة فائقة الذكاء»، 1965"},{"type":"texte","titre":"سباق بين الأمم","illus":"engrenages","points":["الدول في سباق: من يفوز به قد يقود العالم في السنوات المقبلة","«قنبلة نووية جديدة» لا تدمّر فحسب، بل تبني وتخطّط","رهان اقتصادي: يصبح الذكاء الاصطناعي بنيةً تحتية، مثل الكهرباء أو الإنترنت","يريد المستثمرون شراء «الأرض» مبكرًا، قبل أن يرتفع ثمنها"]},{"type":"texte","titre":"مصانع للتفكير: مراكز البيانات","personne":"datacenter","points":["«السحابة» قائمة على الأرض: مبانٍ مليئة بالرقائق والأسلاك وأجهزة التبريد","أكبر المجمّعات تتجاوز 1 غيغاواط، ومشروع Hyperion (Meta، لويزيانا) يستهدف 5","5 غيغاواط: نحو ربع ذروة الاستهلاك القياسية في الجزائر (قرابة 22 غيغاواط، صيف 2026)","يصبح التفكير سلعة: يُنتَج ويُباع وتُدفع فاتورته"]},{"type":"texte","titre":"رقائق ومعادن نادرة وبيانات: جيوسياسة الذكاء الاصطناعي","illus":"carte","points":["أكتوبر 2022: واشنطن تقيّد بيع أقوى رقائق الذكاء الاصطناعي إلى الصين","تردّ بكين بالمعادن: الغاليوم والجرمانيوم (2023)، ثم العناصر الأرضية النادرة (2025)","كل دولة تتساءل: نماذج أمريكية أم صينية؟ وإلى أين تذهب بياناتي؟","السيادة: السعودية والجزائر (القانون 18-07) تضبطان خروج البيانات من البلاد"]},{"type":"texte","titre":"سلّم المبتدئين المكسور","illus":"echelle","points":["احتاجت الثورة الصناعية إلى قرن أو قرنين، والذكاء الاصطناعي يغيّر المجتمع في 3 أو 4 سنوات","المبرمجون بين 22 و25 سنة في الولايات المتحدة: وظائف أقل بنحو 20% منذ أواخر 2022","لا يحلّ الذكاء الاصطناعي بعدُ محلّ الخبير، لكنه يأخذ المهام التي تكوّن المبتدئين","لا صبيَّ في الورشة اليوم، فلا معلّمَ صنعةٍ غدًا"]},{"type":"texte","titre":"السؤال الحقيقي: من يمنح الآلة السلطة؟","illus":"balance","points":["يساعد الذكاء الاصطناعي في تقرير منح قرض، وشراء أسهم، وسياسات تمسّ الملايين","ويُستعمل في الحرب أيضًا… وهو من النوع نفسه الذي يحلّ واجباتكم في الرياضيات!","لم يعد السؤال: «هل الآلة ذكية؟»","بل: من منحها السلطة؟ من اختبرها؟ ومن يُحاسَب حين تخطئ؟"]},{"type":"texte","titre":"خدعة الساحر","illus":"chapeau","points":["لا «جيّد أم سيّئ؟»، بل: ماذا يُحسن وماذا يُسيء، ولمصلحة مَن، وعلى حساب مَن","الفهم يضع كل شيء في موضعه: الخوف أو الانبهار، كلٌّ في وقته","معرفة الخدعة لا تُنقص من براعة الساحر، بل تكشف مقدارها","الطريق: تاريخه، ثم داخل الآلة (الشبكات، والأوزان، والانتباه)"]},{"type":"section","numero":"2","titre":"ما الذكاء الاصطناعي؟","periode":"تعريفات","texte":"قبل أن نروي التاريخ، لنتّفق على الكلمات: ماذا تعني عبارة «الذكاء الاصطناعي»؟","illus":"profil"},{"type":"texte","titre":"وأنتم، ماذا تسمّون «ذكاءً»؟","points":["فهم جملة، وترجمة قصيدة","التعرّف على وجه من بين ألف وجه","الفوز في الشطرنج، وحلّ مشكلة","التعلّم من الأخطاء","التصرّف باستقلال لبلوغ هدف"],"illus":"cerveau"},{"type":"texte","titre":"ذكاء «اصطناعي»","points":["تعريف بسيط: الذكاء الاصطناعي محاولةٌ من الآلة أن *تتصنّع* الذكاء","لا يُشترط أن تفهم: يكفي أن *تبدو* فاهمة","«اصطناعي» أي مُصطنَع، كالابتسامة المصطنعة، لا «صناعي» أي مصنوع","يقول وكيل المحادثة «أنا أفهمك»: غالبًا لا يفهم، لكنه كثيرًا ما يفيد"],"illus":"imitation"},{"type":"schema","titre":"ثلاثة مستويات للذكاء الاصطناعي","illus":"niveaux","niveaux":["ضيّق","عام","فائق"],"points":["الذكاء الضيّق: عبقري في مهمة واحدة (خرائط Google، الشطرنج، ألعاب الفيديو)؛ وهو موجود","ترجمة Google: قرابة 250 لغة… لكنها لا تعرف لعب الشطرنج","الذكاء العام: يترجم ويلعب ويجد طريقه… كالإنسان؛ ما زال نظريًّا","الذكاء الفائق: يتجاوزنا بمراحل، وربما يعي ذاته ويضع أهدافه؛ مجهول"]},{"type":"texte","titre":"وماذا عن ChatGPT؟","points":["يترجم، ويكتب، ويبرمج، ويصنع الصور… بل يكتب الشعر أيضًا، وإن لم يكن جيّدًا دائمًا","لكنه تعلّم من البيانات التي زُوِّد بها، لا من تجربة العالم، ويصعب عليه تجاوزها","ضيّق أم عام؟ الخبراء مختلفون، والذكاء العام غير موجود بعد","المال والرقائق والكهرباء والخوارزميات: كثيرون يرون أننا سنبلغه؛ فلنستعدّ"],"illus":"attention"},{"type":"texte","titre":"ممّ يتكوّن الذكاء الاصطناعي؟ ثلاث طبقات","illus":"couches","couches":["الخوارزميات: المحرّك","الحوسبة: الرقائق","البيانات: الوقود"],"points":["البيانات، الوقود: النصوص والصور والأصوات التي تتعلّم منها الآلة","الحوسبة، القوّة: وحدات معالجة الرسوميات (GPU)، والخوادم، ومراكز البيانات","الخوارزميات، المحرّك: الوصفة التي تحوّل البيانات إلى مهارة","تتقدّم الطبقات الثلاث معًا، والتاريخ الآتي هو قصّتها"]},{"type":"section","numero":"3","titre":"حلم الآلات","periode":"من العصور القديمة إلى 1949","texte":"قبل الحواسيب بزمن طويل، تخيّل البشر آلاتٍ تحاكي الحياة وصنعوها، ثم آلاتٍ تحسب.","illus":"engrenages"},{"type":"texte","titre":"آلات ذاتية الحركة في الأساطير والورشات","points":["أسطورة إغريقية: تالوس، عملاق من البرونز يحرس جزيرة كريت","القرن الأول الميلادي: هيرون السكندري يصف آلات ذاتية الحركة للمسرح","سنة 1739: بطّة فوكانسون تخفق بجناحيها و«تهضم»","نحو سنة 1770: «الكاتب» الذي صنعه آل جاكيه-دروز يخطّ الحروف بالريشة"],"illus":"engrenages"},{"type":"texte","titre":"الجزري، مهندس الآلات البارعة","annee":"1206","points":["مهندس في بلاط بني أرتق، في أعالي بلاد الرافدين","ألّف سنة 1206 كتاب *الجامع بين العلم والعمل النافع في صناعة الحيل*","يصف نحو خمسين آلة: ساعات، ومضخات، وآلات ذاتية الحركة","ساعة الفيل التي صنعها تعلن الساعات بواسطة آلات ذاتية الحركة"],"illus":"elephant","personne":"jazari"},{"type":"texte","titre":"آلات تحسب","points":["سنة 1642: يصنع بليز باسكال آلة «الباسكالين» التي تُجري الجمع","سنة 1673: يقدّم لايبنتز آلة تُجري الضرب","سنة 1837: يصمّم تشارلز باباج الآلة التحليلية، القابلة للبرمجة بالبطاقات المثقّبة","لم تُستكمَل الآلة التحليلية قطّ في حياته"],"illus":"calculatrice","personne":"pascaline","encart":"babbage"},{"type":"portrait","personne":"lovelace","nom":"آدا لوفلايس","dates":"1815–1852","role":"عالمة رياضيات، أول مبرمجة","points":["سنة 1843: ملاحظاتها على الآلة التحليلية لباباج","تكتب فيها خوارزمية لحساب أعداد برنولي","تتخيّل أن الآلة قد تؤلّف الموسيقى"],"citation":"لا تدّعي الآلة التحليلية البتّة أنها تُبدع شيئًا من عندها.","source":"آدا لوفلايس، ملاحظات سنة 1843"},{"type":"texte","titre":"حين يصير التفكير حسابًا","points":["سنة 1854: يختزل جورج بول الاستدلال في حسابات على الصواب والخطأ","سنة 1936: يصف آلان تورينغ آلة مجرّدة قادرة على إجراء أيّ حساب","شريط، ورأس قراءة، وجدول قواعد: إنها «آلة تورينغ»","كل حاسوب حالي هو، من حيث المبدأ، آلة تورينغ"],"illus":"turing"},{"type":"portrait","personne":"turing","nom":"آلان تورينغ","dates":"1912–1954","role":"عالم رياضيات، أبو المعلوماتية النظرية","points":["سنة 1936: الآلة الشاملة","بين 1939 و1945: يُسهم في كسر شيفرة Enigma في بليتشلي بارك","سنة 1950: «Computing Machinery and Intelligence»، المقال المؤسِّس"],"citation":"أقترح أن ننظر في السؤال الآتي: هل تستطيع الآلات أن تفكّر؟","source":"آلان تورينغ، مجلة Mind، سنة 1950"},{"type":"schema","titre":"العصبون الاصطناعي","annee":"1943","illus":"neurone","points":["ينمذج وارن ماكولوك ووالتر بيتس العصبون بعملية حسابية","يجمع إشارات الدخل و«ينشط» عند تجاوز عتبة معيّنة","إنه سلف كل الشبكات العصبية الحالية"]},{"type":"texte","titre":"الحواسيب الأولى","points":["سنة 1945: حاسوب ENIAC، بوزن 30 طنًا، يحسب المسارات الباليستية","سنة 1948: يؤسّس كلود شانون نظرية المعلومات","يصبح البت وحدة كل معلومة: النص والصورة والصوت","صارت الآلات موجودة أخيرًا؛ وبقي أن نجعلها «ذكية»"],"personne":"eniac","encart":"shannon"},{"type":"section","numero":"4","titre":"ميلاد الذكاء الاصطناعي","periode":"1950–1980","texte":"سؤال بدا عبثيًّا: هل يستطيع الحاسوب أن يفكّر؟ وجوابان سيتنافسان: كتابة القواعد، أو محاكاة الخلايا العصبية.","illus":"ampoule"},{"type":"schema","titre":"لعبة المحاكاة","annee":"1950","illus":"imitation","points":["يتحاور حَكَمٌ كتابيًا مع محاوِرَين مخفيَّين","أحدهما إنسان، والآخر آلة","إذا عجز الحَكَم عن التمييز بينهما، «تنجح» الآلة"]},{"type":"citation","texte":"كل جانب من جوانب التعلم، أو أيّ سمة أخرى من سمات الذكاء، يمكن من حيث المبدأ وصفه بدقة بالغة إلى حدّ يمكن معه صنع آلة تحاكيه.","auteur":"ج. مكارثي، م. مينسكي، ن. روتشستر، ك. شانون","source":"مقترح ورشة دارتموث، 31 أغسطس 1955"},{"type":"portrait","personne":"mccarthy","nom":"جون مكارثي","dates":"1927–2011","role":"عالم حاسوب، منح الذكاء الاصطناعي اسمه","points":["صيف 1956: ينظّم ورشة دارتموث، شهادة ميلاد الذكاء الاصطناعي","سنة 1958: يبتكر لغة Lisp، التي ظلّت طويلًا لغة الذكاء الاصطناعي","معه: مارفن مينسكي، وكلود شانون، وناثانيال روتشستر"],"encart":"dartmouth"},{"type":"texte","titre":"أول برنامج «ذكي»","annee":"1956","points":["برنامج Logic Theorist لآلن نيويل وهربرت سايمون وكليف شو","يبرهن 38 من المبرهنات الـ52 الأولى في *Principia Mathematica*","ويجد لإحداها برهانًا أكثر أناقة من برهان المؤلِّفَين","فكرة أساسية: البحث بين الإمكانات بواسطة قواعد"],"illus":"arbre"},{"type":"texte","titre":"عصر القواعد: إذا… فإنّ…","points":["الحقبة الأولى للذكاء الاصطناعي: عصر المنطق، أو عصر القواعد","لكي تتصرّف الآلة مثلنا، نعطيها قواعد: «إذا حدث هذا، فافعلي ذاك»","والنتيجة منفِّذ جيّد يتبع الخطوات، لا ذكاء","لكنّ القواعد وُضعت لتُكسَر… وسيتولّى ذلك باحث شابّ"],"illus":"regles"},{"type":"portrait","personne":"perceptron","nom":"فرانك روزنبلات وآلة Mark I Perceptron","dates":"1957–1960","role":"عالم نفس في مختبر كورنيل للملاحة الجوية (بافالو، الولايات المتحدة)","points":["بدل القواعد الثابتة، التعلّم كما يتعلّم الإنسان: محاكاة خلايا الدماغ العصبية","«شبكية» من 20 × 20 = 400 خلية ضوئية تحوّل الصورة إلى أرقام","دائرة أم مربّع؟ إذا أخطأت الآلة صحّحت أوزانها: إنها تتعلّم من أخطائها"],"citation":"أول آلة قادرة على أن تكون لها فكرة أصيلة","source":"فرانك روزنبلات، 1958","illus":"perceptron"},{"type":"schema","titre":"كيف يقرّر البيرسبترون","annee":"1958","illus":"perceptron","points":["تُضرَب كل معلومة مُدخَلة في *وزن*، ثم يُجمَع الكلّ","المجموع فوق العتبة ← 1، وتحتها ← 0: كخليّة عصبية تُطلق إشارتها أو لا تُطلقها","مهندس؟ معدّل البكالوريا ثقيل الوزن، والطول يكاد لا يزن شيئًا","رياضيّ؟ العكس: الطول مهمّ (الكرة الطائرة، كرة السلّة). لكل معلومة وزنها"]},{"type":"citation","texte":"كشفت البحرية اليوم عن جنينِ حاسوبٍ إلكتروني تتوقّع أن يكون قادرًا على المشي والكلام والرؤية والكتابة واستنساخ نفسه والوعي بوجوده.","auteur":"صحيفة *The New York Times*","source":"«جهاز جديد للبحرية يتعلّم بالممارسة»، 8 يوليو 1958"},{"type":"texte","titre":"آرثر صامويل: التعلّم باللعب","annee":"1959","points":["في شركة IBM، يكتب آرثر صامويل برنامجًا للعب الداما يتحسّن باللعب ضدّ نفسه","سنة 1959: يُطلق مقاله عبارة «machine learning»، أي التعلّم الآلي","بعد 8 إلى 10 ساعات من اللعب، يلعب البرنامج أفضل من مبتكره نفسه","يرتسم مساران: كتابة القواعد، أو جعل الآلة تتعلّمها"],"illus":"dames"},{"type":"citation","texte":"ستكون الآلات قادرة، في غضون عشرين سنة، على القيام بأيّ عمل يستطيع الإنسان القيام به.","auteur":"هربرت سايمون","source":"1965"},{"type":"chat","titre":"إليزا (ELIZA)، أول معالِجة نفسية اصطناعية","annee":"1966","legende":"مقتطف من مقال جوزيف فايزنباوم (1966)، مترجَم","echanges":[{"qui":"h","texte":"الرجال كلهم متشابهون."},{"qui":"m","texte":"بأيّ معنى؟"},{"qui":"h","texte":"إنهم يزعجوننا دائمًا بشيء أو بآخر."},{"qui":"m","texte":"هل يمكنكِ أن تذكري مثالًا محدَّدًا؟"},{"qui":"h","texte":"حسنًا، صديقي هو الذي جعلني آتي إلى هنا."},{"qui":"m","texte":"صديقكِ جعلكِ تأتين إلى هنا."}]},{"type":"texte","titre":"شيكي (Shakey)، أول روبوت يستدلّ","annee":"1966–1972","points":["صُنع في معهد ستانفورد للأبحاث (SRI)","يدرك بيئته بواسطة كاميرا","يخطّط لسلسلة من الأفعال لبلوغ هدف","من أجله طُوِّرت خوارزمية A*‎، التي ما تزال تُستعمل لحساب المسارات"],"personne":"shakey","illus":"robot"},{"type":"schema","titre":"1969: جدار XOR","annee":"1969","illus":"xor","points":["سنة 1969: ينشر مارفن مينسكي وسيمور بابرت (MIT) كتاب *Perceptrons*","يفصل البيرسبترون بين مجموعتين بخطّ مستقيم واحد: دائرة أو مربّع، مريض أو سليم","باب بمفتاحين: يُفتح إذا أدار أحدكما مفتاحه، لا إذا أدرتما المفتاحين معًا","نحتاج إلى قاعدة فوق قاعدة: لا يكفي أيّ خطّ مستقيم، إنها مسألة «أو الحصرية» (XOR)"],"personne":"minsky"},{"type":"schema","titre":"الشتاء الأول للذكاء الاصطناعي","annee":"1974–1980","illus":"courbe","points":["بعد كتاب *Perceptrons*، يسود الخوف: يتوقّف تمويل الشبكات العصبية","سنة 1973: يرى تقرير لايتهيل (المملكة المتحدة) أنّ الوعود لم تتحقّق، فيُقطع التمويل","نحو سنة 1974 في الولايات المتحدة، تشترط وكالة DARPA نتائج عسكرية وتقلّص تمويلها","الشبكات العصبية: نحو خمس عشرة سنة من الشك، «الذكاء حكرٌ على الدماغ وحده»"]},{"type":"section","numero":"5","titre":"من القواعد إلى البيانات","periode":"1980–2005","texte":"تغزو القواعدُ الشركات، ثم تصطدم بالواقع. وفي هذه الأثناء، تبدأ الآلات في التعلّم من الأمثلة.","illus":"regles"},{"type":"schema","titre":"تحويل المعرفة إلى قواعد","illus":"regles","points":["قاعدة وقائع، وقاعدة قواعد من نوع «إذا … فإن …»، ومحرّك استدلال","سبعينيات القرن العشرين: نظام MYCIN، في ستانفورد، يشخّص عدوى الدم","سنة 1980: يضبط نظام XCON تهيئة حواسيب شركة DEC","تستثمر الشركات: فيصبح الذكاء الاصطناعي صناعة"]},{"type":"texte","titre":"التعلّم بدل كتابة كل شيء","points":["قطّ أم كلب أم ضبع؟ لكلٍّ منها ذيل وعينان وفرو: فتتوه القواعد","على الآلة أن تتعلّم كالطفل: ترى أمثلة كثيرة وتكتشف الفروق","الثمانينيات: حواسيب أسرع وأرخص، فيجرّب الباحثون بحرية","البيانات صالة رياضة الذكاء الاصطناعي: كلما زادت قويت عضلاته"],"illus":"donnees"},{"type":"deux","titre":"طريقتان لصنع ذكاء اصطناعي","gauche":{"titre":"الذكاء الاصطناعي الرمزي","points":["يكتب خبيرٌ القواعد","قابل للتفسير: نتتبّع الاستدلال","هشّ خارج مجاله","مثال: نظام خبير"]},"droite":{"titre":"التعلم الآلي","points":["تستخرج الآلة الانتظامات من الأمثلة","يصعب تفسيره في الغالب","متين، إذا توفّرت بيانات كثيرة","مثال: مرشِّح الرسائل المزعجة"]}},{"type":"texte","titre":"عودة العصبونات","annee":"1986","points":["الفكرة: طبقات من البيرسبترون بعضها فوق بعض، كطبقات صينية البشاميل","كل طبقة تتحقق من شرط ثم تسلّم إلى التالية: فيصبح حلّ مسألة XOR ممكنًا","كلما صعبت المسألة زدنا عدد الطبقات","سنة 1986: يُشيع روملهارت وهينتون وويليامز الانتشار الخلفي لتدريبها"],"personne":"rumelhart","illus":"reseau"},{"type":"schema","titre":"إرجاع الخطأ إلى الوراء","annee":"1986","illus":"retro","points":["تجيب الآلة، فيقارن المعلّم جوابها بالجواب الصحيح: صواب أم خطأ؟","إن أخطأت رجعت عبر الطبقات: أيّ الأوزان سبّب الخطأ، وبأيّ قدر؟","تصحّح هذه الأوزان وتعيد المحاولة آلاف المرات: هذا هو الانتشار الخلفي","معلّم يعرف الجواب: هذا هو التعلّم *المُراقَب* (بإشراف)"]},{"type":"portrait","personne":"lecun","nom":"يان لوكان وشبكة LeNet","dates":"1989–1998","role":"باحث فرنسي في مختبرات Bell، ترأّس لاحقًا أبحاث الذكاء الاصطناعي في Meta","points":["سنة 1989: تقرأ شبكته الأرقام المكتوبة باليد في الرموز البريدية الأمريكية","لأول مرة، يؤدّي الذكاء الاصطناعي عملًا حقيقيًا خارج المختبر","منذ 1996 تقرأ LeNet الصكوك: نحو 10% من صكوك الولايات المتحدة سنة 2001"],"illus":"reseau"},{"type":"texte","titre":"الشتاء الثاني","annee":"1987–1993","points":["سنة 1987: تنهار سوق آلات Lisp، وتخيّب الأنظمة الخبيرة الآمال","تبقى الشبكات ضعيفة: تدريب بطيء جدًا وحواسيب غير كافية القوة","ليس فشلًا بل توقعات مبالغ فيها: بعد 5 أهداف، يبدو الهدفان هزيمة","أما الشبكات العصبية فيدوم بردها حتى نحو 2006"],"illus":"flocon"},{"type":"portrait","personne":"deepblue","nom":"حاسوب Deep Blue في مواجهة كاسباروف","dates":"مايو 1997","role":"حاسوب شركة IBM يهزم بطل العالم في الشطرنج","points":["نيويورك، ست جولات: فوزان وخسارة وثلاثة تعادلات، أي 3½ مقابل 2½","الجولة 2: نقلة «إنسانية» حتى إنّ كاسباروف يتّهم IBM بالغشّ","لا شبكة عصبية: 200 مليون وضعية في الثانية وقواعد وضعها خبراء"],"illus":"echecs","encart":"kasparov"},{"type":"frise","titre":"التعلّم يترسّخ في كل مكان","evenements":[{"annee":"1992","titre":"TD-Gammon","texte":"شبكة تتعلّم لعبة الطاولة باللعب ضد نفسها، دون الاستعانة بمباريات البشر"},{"annee":"1997","titre":"ذاكرة (LSTM)","texte":"هوخرايتر وشميدهوبر يمنحان الشبكات ذاكرة لقراءة المتتاليات"},{"annee":"2001","titre":"الوجوه","texte":"فيولا وجونز: آلة تتعلّم اكتشاف الوجوه في الوقت الحقيقي"},{"annee":"2002","titre":"مرشّح البريد المزعج","texte":"مرشِّحات تتعلّم من رسائلك أنت التعرّف على البريد المزعج"},{"annee":"2005","titre":"Stanley","texte":"سيارة بلا سائق من ستانفورد تفوز بسباق الصحراء الذي تنظّمه DARPA"}]},{"type":"section","numero":"6","titre":"ثورة التعلم العميق","periode":"2006–2017","texte":"في عزّ الشتاء، يُحيي باحثٌ الشبكاتِ العميقة. وفي 2012 تلتقي البيانات وبطاقات الرسوميات والخوارزميات: فتتعلّم الآلة أن ترى، وأن تُبدع، ثم أن تهزم الأبطال.","illus":"reseau"},{"type":"portrait","personne":"hinton","nom":"جيفري هينتون","dates":"وُلد سنة 1947","role":"باحث في جامعة تورنتو، ورائد الشبكات العصبية","points":["دافع عن الشبكات العصبية خلال الشتاءين، في وجه الجميع تقريبًا","سنة 2006: يدرّب شبكة عميقة طبقةً طبقة؛ و«العميقة» تعني كثيرة الطبقات","جائزة تورينغ 2018 (مع بنجيو ولوكان)، وجائزة نوبل في الفيزياء 2024 (مع هوبفيلد)"]},{"type":"schema","titre":"بطاقات الرسوميات في خدمة الحساب","annee":"2007","illus":"gpu","puces":["CPU: 4 أنوية","GPU: آلاف الأنوية"],"personne":"gpu","points":["صُنعت بطاقات الرسوميات (GPU) لألعاب الفيديو: ملايين البكسلات دفعةً واحدة","سنة 2007: بفضل منصة CUDA، تتيح NVIDIA برمجتها لأيّ عملية حسابية","للمعالج المركزي (CPU) بضع أنوية كبيرة، ولبطاقة الرسوميات مئات ثم آلاف الأنوية الصغيرة","تتدرّب الشبكة أسرع بما يصل إلى 70 مرة؛ وفي 2016 تكشف Google عن رقائق TPU"]},{"type":"portrait","personne":"feifei","nom":"فاي فاي لي وقاعدة ImageNet","dates":"2009–2017","role":"باحثة في برينستون ثم ستانفورد: راهنت على البيانات","points":["سنة 2009: ImageNet؛ ستتجاوز 14 مليون صورة موزّعة على نحو 22 ألف فئة","وسمها يدويًا نحو 49 ألف شخص من 167 بلدًا، عبر منصة Amazon Mechanical Turk","من 2010 إلى 2017، مسابقة سنوية: أيّ برنامج يتعرّف أفضل من غيره على 1000 فئة؟"],"illus":"imagenet"},{"type":"texte","titre":"2011: الذكاء الاصطناعي يغادر المختبر","annee":"2011","points":["فبراير 2011: واتسون (Watson) من IBM يهزم أعظم بطلَين في برنامج المسابقات *Jeopardy!*","أسئلة مليئة بالتلاعب بالألفاظ: لا يكفي أن يعرف، بل عليه أن يفهم السياق","يربح واتسون مليون دولار، تهبها IBM لجمعيات خيرية","أكتوبر 2011: تصل «سيري» (Siri) إلى iPhone 4S؛ فيحادث الملايين هواتفهم"],"personne":"watson"},{"type":"texte","titre":"2012: الآلة تكتشف القطّ وحدها","annee":"2012","points":["فريق Google Brain (أندرو نغ وجيف دين) يربط 1000 حاسوب: 16 ألف نواة حسابية","تشاهد الشبكة 10 ملايين صورة من مقاطع YouTube، ولا يخبرها أحد بشيء","تكوّن وحدها كاشفًا لـ«القطّ»: إنه التعلّم *غير المُراقَب*","أول دليل على أن الشبكة العميقة قد تكتشف مفاهيم، لا أن تحفظ فقط"],"illus":"chat"},{"type":"schema","titre":"2012: AlexNet، التقاء التروس الثلاثة","annee":"2012","illus":"engrenages","points":["كريجيفسكي وسوتسكيفر وهينتون (تورنتو) يدرّبون شبكة عميقة على بطاقتَي رسوميات للألعاب","مسابقة ImageNet سنة 2012: خطأ بنسبة 15.3%، مقابل 26.2% لصاحب المرتبة الثانية","الخوارزميات (الشبكات العميقة) + البيانات (ImageNet) + الحوسبة (GPU): التقى كل شيء","يبدأ الربيع الثاني للذكاء الاصطناعي: عصر التعلّم العميق"]},{"type":"schema","titre":"شبكة عميقة، طبقةً بعد طبقة","illus":"reseau","points":["ترصد الطبقات الأولى سماتٍ بسيطة: حوافَّ وبُقعًا","وتركّب منها الطبقات التالية أشكالًا وأنسجةً وأجزاءً","وتتعرّف الطبقات الأخيرة على أشياء كاملة: «قطّ»، «سيارة»","تتعلّم كل طبقة بنفسها ما ينبغي أن ترصده"]},{"type":"schema","titre":"2014: المزوِّر والمحقّق","annee":"2014","illus":"gan","roles":["المزوِّر","المحقّق"],"personne":"goodfellow","points":["يبتكر إيان غودفيلو شبكات GAN: شبكتان تتدرّب كلٌّ منهما في مواجهة الأخرى","المزوِّر يصنع صورًا مزيّفة، والمحقّق يحاول كشف التزوير","كلما انكشف أمر المزوِّر تحسّن، ويتحسّن المحقّق كذلك","صور تكاد تكون حقيقية، ثم «التزييف العميق»: لم يعد الذكاء الاصطناعي يحكم فقط، بل صار يُبدع"]},{"type":"schema","titre":"لعبة غو: وضعيات أكثر من الذرّات","illus":"go10","echelle":["الشطرنج 10⁴³","الذرّات 10⁸⁰","غو 10¹⁷⁰"],"personne":"goban","points":["لوح من 19 × 19 خطًّا، وأحجار سوداء وبيضاء: عليك أن تحاصر خصمك","وُلدت في الصين قبل أكثر من 2500 عام، وهي لعبة حدس أكثر منها لعبة حساب","الشطرنج: نحو 10⁴³ وضعية ممكنة (شانون، 1950)؛ وغو: نحو 10¹⁷⁰","وهذا أكثر بكثير من نحو 10⁸⁰ ذرّة في الكون المرئي"]},{"type":"portrait","personne":"hassabis","nom":"برنامج AlphaGo والنقلة 37","dates":"مارس 2016، سيول","role":"شركة DeepMind (Google)، التي شارك في تأسيسها ديميس هاسابيس","points":["خمس مباريات ضد لي سيدول، أسطورة لعبة غو: الجميع ينتظر فوز الإنسان","المباراة 2، النقلة 37: نقلة ما كان أيّ إنسان ليلعبها؛ ويظنّها الخبراء خطأً","يفوز AlphaGo بنتيجة 4 مقابل 1؛ ويفوز لي سيدول بالمباراة 4 بنقلة عبقرية، النقلة 78"],"citation":"ليست نقلة بشرية. لم أرَ قطّ إنسانًا يلعب هذه النقلة. ما أجملها!","source":"فان هوي، بطل أوروبا في لعبة غو، في مجلة *Wired*، مارس 2016","illus":"go","encart":"leesedol"},{"type":"texte","titre":"AlphaZero ثم AlphaFold: من اللعب إلى العلم","annee":"2017–2024","points":["سنة 2017: يتعلّم AlphaGo Zero لعبة غو باللعب ضد نفسه، من دون أيّ مباراة بشرية","في 3 أيام، يهزم بنتيجة 100 مقابل 0 النسخةَ التي تغلّبت على لي سيدول","ويتعلّم AlphaZero الشطرنج والشوغي أيضًا، من القواعد وحدها، في بضع ساعات","سنة 2020: يتنبّأ AlphaFold بشكل البروتينات؛ ونوبل الكيمياء 2024 (هاسابيس وجمبر)"],"illus":"echecs"},{"type":"frise","titre":"ثلاثة انتصارات وثلاث طرق لهزيمة الإنسان","evenements":[{"annee":"1997","titre":"Deep Blue","texte":"الحساب: 200 مليون وضعية في الثانية، وقواعد كتبها خبراء"},{"annee":"2011","titre":"Watson","texte":"اللغة: يفوز في برنامج *Jeopardy!* ذي الأسئلة الملتوية، ويربح مليون دولار"},{"annee":"2016","titre":"AlphaGo","texte":"الإبداع: 10¹⁷⁰ وضعية في لعبة غو؛ والنقلة 37 تفاجئ صانعيه أنفسهم"},{"annee":"2017","titre":"AlphaGo Zero","texte":"بلا مباريات بشرية: بعد 3 أيام من اللعب ضد نفسه، يهزم AlphaGo بنتيجة 100 مقابل 0"},{"annee":"2024","titre":"AlphaFold","texte":"من الألعاب إلى العلم: شكل البروتينات، وجائزة نوبل في الكيمياء"}]},{"type":"section","numero":"7","titre":"المحوِّلات والذكاء الاصطناعي التوليدي","periode":"2017–2026","texte":"حتى الآن كانت الآلة تحكم. ومع المحوِّل (2017)، تتعلّم قراءة نصوص كاملة، ثم تشرع في الكتابة والرسم والتلحين وصناعة الفيديو.","illus":"attention"},{"type":"deux","titre":"من التصنيف إلى التوليد","gauche":{"titre":"ذكاء يحكم (بالأمس)","points":["صورة: «قطة أم كلب؟»","شيك: ما المبلغ المكتوب؟","مريض: ما احتمال إصابته بالمرض؟","يجيب بوسم أو بنسبة مئوية"]},"droite":{"titre":"ذكاء يولّد (اليوم)","points":["تعلّم أنماطًا: الوجوه، وترتيب الكلمات، والأصوات","ينتج جديدًا: صورًا وموسيقى وقصصًا","يقلّد الأسلوب: «على طريقة بيكاسو، أو دالي»","ابتكار أسلوب جديد حقًّا؟ مسألة ما تزال مفتوحة"]}},{"type":"schema","titre":"مقال «Attention Is All You Need»","annee":"2017","illus":"attention","points":["يونيو 2017: ثمانية باحثين من Google يقدّمون **المحوِّل** (Transformer)، وقد جرّبوه في الترجمة","يقرأ الجملة كلها دفعة واحدة: يربط **الانتباه** كل كلمة بالكلمات التي توضّح معناها","في «فتحت الطالبة الكتاب لأنها…»، يتّجه الضمير «ها» إلى «الطالبة»","هو حرف «T» في GPT، ومنه تنحدر كل النماذج اللغوية الكبيرة (الجزء 9)"]},{"type":"frise","titre":"من GPT-1 إلى ChatGPT","evenements":[{"annee":"2018","titre":"GPT-1 وBERT","texte":"تدرّب OpenAI نموذج GPT-1 على أكثر من 7 آلاف كتاب غير منشور، وتطلق Google نموذج BERT"},{"annee":"2019","titre":"GPT-2","texte":"1.5 مليار معامل؛ وتؤجّل OpenAI نشره كاملًا خوفًا من إساءة استعماله"},{"annee":"2020","titre":"GPT-3","texte":"175 مليار معامل: يحرّر النصوص ويلخّصها ويعيد صياغتها"},{"annee":"2022","titre":"ChatGPT","texte":"30 نوفمبر: مليون مستخدم في 5 أيام، و100 مليون في شهرين"},{"annee":"2023","titre":"GPT-4","texte":"14 مارس: يقبل الصور أيضًا، وينجح في امتحان محاماة تجريبي"}]},{"type":"frise","titre":"نحو تعدّد الوسائط: يرى ويقرأ ويتكلّم","evenements":[{"annee":"2014","titre":"الوصف","texte":"شبكة ترى وشبكة تكتب، مُلصَقتان معًا، تصفان صورة"},{"annee":"2021","titre":"CLIP","texte":"400 مليون زوج من صورة ونص: الصور والكلمات في فضاء واحد"},{"annee":"2022","titre":"الانتشار","texte":"DALL·E 2 وStable Diffusion: تولد الصورة من ضجيج يُزال شيئًا فشيئًا"},{"annee":"2023","titre":"الجسور","texte":"يُربط نموذج رؤية كبير بنموذج لغوي كبير"},{"annee":"2024","titre":"أصيل","texte":"شبكة واحدة للنص والصورة والصوت: نحو ثلث ثانية للإجابة"}]},{"type":"texte","titre":"2026: ربيع دائم أم شتاء جديد؟","illus":"saisons","courbes":["التوقّعات","القدرات"],"points":["صار الذكاء الاصطناعي متعدّد الوسائط: يكتب ويلخّص ويرسم ويلحّن ويصنع الفيديو ويبرمج","سؤال هذا التاريخ كله: هل فاقت توقّعاتنا قدراته؟","إن كان الجواب نعم، فقد يأتي شتاء جديد حتى لو ظلّت الإنجازات عظيمة","درس الشتاءين: نحكم بالنتائج لا بالوعود"]},{"type":"section","numero":"8","titre":"كيف تتعلّم الآلة؟","periode":"الحلقة 3: الشبكة العصبية","texte":"لنفتح الآلة: كيف تتعلّم شبكة من العصبونات الاصطناعية؟ لكن لنبدأ بقصة.","illus":"reseau"},{"type":"texte","titre":"ليلة في تمبي","annee":"2018","personne":"ubercar","points":["18 مارس 2018، نحو العاشرة ليلًا، في تمبي (أريزونا): امرأة تعبر شارعًا مظلمًا بدرّاجتها","على الدرّاجة أكياس مشترياتها. تصل سيارة فلا تكبح في الوقت المناسب، فتموت المرأة","كانت السيارة تقود نفسها: تجربة لشركة Uber، وعلى متنها سائقة سلامة","كانت مستشعراتها قد «رأت» المرأة. فلماذا لم تفهم؟ تُوقِف Uber تجاربها"]},{"type":"texte","titre":"محاكاة الطبيعة","illus":"oiseau","points":["لكي نطير نظرنا إلى الطيور، ولكي نبني ذكاءً ننظر إلى الدماغ","في الدماغ البشري نحو 86 مليار خلية عصبية، يتّصل بعضها ببعض","لعلّ فهمَ طريقة عملها يقرّبنا من الذكاء الاصطناعي العام","من هذه الفكرة وُلدت الشبكة العصبية الاصطناعية: نسخة مبسّطة جدًّا"]},{"type":"schema","titre":"لعبة التخمين: ما مهنة هذا الشخص؟","illus":"devinette","indices":["خوذة: 90%","سترة: 70%","حذاء: 60%"],"resultat":"مهندس","points":["مئزر أبيض وسمّاعة حول العنق: إنه طبيب. سهل!","والآن فريق لا يعرف مِهَننا؛ كل عضو فيه لا يرى إلا جزءًا من الصورة","واحد ينظر إلى الرأس (خوذة؟ قبّعة؟)، وآخر إلى الملابس، وثالث إلى الحذاء","خوذة 90%، سترة 70%، حذاء أمان 60%: يستنتج الفريق «مهندس»"]},{"type":"schema","titre":"تشريح القرار: الأوزان والتحيّز والتنشيط","illus":"decision","etapes":["المدخلات × الأوزان","المجموع + التحيّز","التنشيط"],"points":["الوزن = الأهمية: الخوذة 100، السترة 70، الحذاء 50 (أضعف القرائن)","⁦(0.9 × 100 + 0.7 × 70 + 0.6 × 50) ÷ 220 = 169 ÷ 220 ≈ 77%⁩: «مهندس»","التحيّز (bias): عدد يُضاف إلى المجموع ليصحّح ميلًا ما (حذاء مُبالَغ في أهميته)","التنشيط: لا «مهندس أو لا»، بل «60% مهندس، 30% جندي…»"]},{"type":"schema","titre":"المستوى الثاني: الجندي ببدلة مموّهة","illus":"devinette","indices":["خوذة: 90%","سترة: 70%","حذاء: 60%"],"resultat":"مهندس ✗","points":["الخوذة نفسها والسترة نفسها والحذاء نفسه… لكن ببدلة مموّهة: إنه جندي في الخدمة","أجاب الفريق «مهندس»: لم يكن للون الملابس أيّ وزن","ننبّهه إلى الخطأ فيعدّل: من الآن فصاعدًا يُحسب للون حسابه. هذا هو التعلّم","فِرق أكثر (ما يحمله، ما يركبه، المكان حوله) = معاملات أكثر = أجوبة أدقّ"]},{"type":"texte","titre":"الشبكة العصبية في جملة واحدة","illus":"reseau","points":["يستقبل كل عصبون اصطناعي معلومات، ويعطيها احتمالًا ووزنًا","ثم يمرّر استنتاجه إلى الطبقة التالية، حتى الجواب النهائي","التعلّم = تعديل الأوزان بعد كل خطأ: ملايين منها، ثم مليارات","وكل ذلك دون أن تفهم الآلة شيئًا: تلك هي الفكرة المؤسِّسة للذكاء الاصطناعي اليوم"]},{"type":"schema","titre":"ثلاث طرق للتعلّم","illus":"apprendre","types":["بإشراف","دون إشراف","بالتعزيز"],"points":["بإشراف (التعلّم المُراقَب): يعطي المعلّم الجواب الصحيح حتى بعد الخطأ (LeNet والشيكات)","دون إشراف: «اكتشف وحدك ما يتكرّر» (قطّة Google، 2012)","بالتعزيز: «خطأ» أو «صواب» فقط، ولا جواب أبدًا (AlphaGo Zero، 2017)","يجمع ChatGPT بين الثلاث: يقرأ وحده، ويحاكي حوارات، ثم يقيّم البشر إجاباته"]},{"type":"schema","titre":"حين تتعلّم الآلة أكثر مما ينبغي أو أقل","illus":"ajustement","cas":["نقص الملاءمة","التوازن","الإفراط في الملاءمة"],"points":["الإفراط في الملاءمة (Overfitting): في صور التدريب، كان كل الأطباء يلبسون نظّارات","يعطي النموذج النظّارات وزنًا قدره 100: طبيب بلا نظّارات؟ «ليس طبيبًا»","نقص الملاءمة (Underfitting): التلميذ الذي يتصفّح الكتاب سطحيًّا فتفوته تفاصيل مهمّة","والعلاج واحد: بيانات أكثر وأكثر تنوّعًا: ليلًا ونهارًا، أماكن وألوان وملابس مختلفة"]},{"type":"texte","titre":"عودة إلى تمبي: ماذا حدث؟","annee":"2018","illus":"uber","points":["رُصدت قبل الاصطدام بـ5.6 ثانية، لكن تصنيفها ظلّ يتبدّل: مركبة، درّاجة، «شيء آخر»","لم يكن النظام يتوقّع مشاةً يعبرون خارج الممرّات (NTSB، 2019): نظرة ضيّقة جدًّا","الكبح الطارئ معطَّل في وضع القيادة الذاتية، وسائقة السلامة تنظر إلى هاتفها","درس Uber ودرسنا: أن نفهم الآلة قبل أن نثق بها"]},{"type":"section","numero":"9","titre":"كيف تقرأ الآلة نصًّا؟","periode":"من الكلمات إلى الأرقام","texte":"رأينا كيف «يرى» النموذج، وهو يفهم اللغة بطريقة قريبة من ذلك. فكيف يحوّل الكلمات إلى أعداد؟","illus":"attention"},{"type":"schema","titre":"من النص إلى الأعداد","illus":"tokens","phrase":"القط يشرب الحليب","ids":"4127 9038 2310","points":["لا يعرف الحاسوب إلا الأعداد","يُقطَّع النص إلى أجزاء: **الرموز** (tokens)","يأخذ كل رمز رقمًا، ثم قائمة طويلة من الأعداد: **متّجهًا**","لا يرى النموذج الحروف أبدًا، بل هذه الأعداد فقط"]},{"type":"schema","titre":"خريطة المعاني","illus":"sens","mots":["قط","كلب","حصان","كتاب","رواية","قارئ","رجل","امرأة","ملك","ملكة"],"points":["كل متّجه عنوانٌ على خريطة ضخمة للمعاني","الكلمات التي لها الجيران أنفسهم تتقارب: «قط» و«كلب»","يتعلّم النموذج ذلك وحده، بتخمين كلمات مخفية في مليارات الجمل","تحفظ الخريطة العلاقات: من «رجل» إلى «امرأة» كما من «ملك» إلى «ملكة»"]},{"type":"schema","titre":"السياق يحدّد المعنى","illus":"contexte","phrase1":"الفأرة تأكل الجبن","phrase2":"نقرتُ زرّ الفأرة","liens":[[0,2],[2,0]],"points":["قد تحمل الكلمة الواحدة عدة معانٍ: «الفأرة»","يربط **الانتباه** كل كلمة بجيرانها","مع «الجبن» تكون الفأرة الحيوان، ومع «نقرتُ» تكون أداة الحاسوب","يُعاد حساب متّجه الكلمة بحسب سياقها"]},{"type":"schema","titre":"كيف «يكتب» نموذج لغوي","illus":"motsuivant","points":["يقطّع النص إلى أجزاء، هي الرموز (tokens)","يحسب احتمال كل رمز تالٍ","يختار واحدًا منها، ويضيفه إلى النص، ثم يعيد الكرّة","ثم يقيّم بشرٌ إجاباته لصقله"],"debut":"القط يشرب","suites":["الحليب","الماء","الشاي","العصير"]},{"type":"chat","titre":"حوار مع نموذج لغوي","annee":"2022","legende":"مثال متخيَّل، كُتب للطلبة","echanges":[{"qui":"h","texte":"اشرح التسلسل الأمامي لطالب في الأدب."},{"qui":"m","texte":"تخيّل محقّقًا: ينطلق من القرائن التي يعرفها ويطبّق قواعده واحدةً تلو الأخرى، حتى يجد الجاني."},{"qui":"h","texte":"أعطني مرجعًا لأستشهد به في مذكّرتي."},{"qui":"m","texte":"انتبه: تحقّق دائمًا من المرجع في مكتبة. فقد أخطئ، وقد أختلق مراجع."}]},{"type":"section","numero":"10","titre":"عصر الوكلاء","periode":"2023–2026","texte":"لم يعد النموذج اللغوي يكتفي بالإجابة: إنه يخطّط، ويستعمل الأدوات، ويتصرّف.","illus":"agent"},{"type":"texte","titre":"ما الوكيل؟","points":["يدرك الوكيل بيئته ويؤثّر فيها لبلوغ هدف","منظّم الحرارة وكيل بسيط جدًا: يقيس الحرارة، ثم يشغّل التدفئة أو يوقفها","يعرّف راسل ونورفيغ (1995) الذكاء الاصطناعي كله بأنه دراسة الوكلاء","يتلقّى وكيل الذكاء الاصطناعي الحديث هدفًا، لا مجرّد سؤال"],"illus":"thermostat"},{"type":"schema","titre":"حلقة الوكيل","illus":"boucle","points":["الهدف: ما يطلبه المستخدم","التفكير: يخطّط النموذج للخطوة التالية","التصرّف: يستعمل أداة (بحث، حساب، ملف، متصفّح)","الملاحظة: يقرأ النتيجة، ثم يعيد الكرّة حتى بلوغ الهدف"]},{"type":"frise","titre":"من وكلاء المحادثة إلى الوكلاء","evenements":[{"annee":"2022","titre":"ReAct","texte":"يُناوِب باحثون بين الاستدلال والفعل داخل نموذج واحد"},{"annee":"2023","titre":"الأدوات","texte":"نموذج GPT-4؛ وتتعلّم النماذج استدعاء الأدوات والبرامج"},{"annee":"2024","titre":"الاستدلال والتصرّف","texte":"نماذج تفكّر قبل أن تجيب؛ ونموذج يقود حاسوبًا؛ وبروتوكول MCP لربط الأدوات"},{"annee":"2025","titre":"وكلاء في العمل","texte":"وكلاء يتصفّحون الويب، ويكتبون البرامج ويصحّحونها"},{"annee":"2026","titre":"في الحياة اليومية","texte":"يستقرّ الوكلاء في البرمجيات المكتبية وبرمجيات البحث والتعليم"}]},{"type":"deux","titre":"وكيل محادثة أم وكيل؟","gauche":{"titre":"وكيل المحادثة","points":["يجيب عن سؤال","ينتج نصًّا","جولة واحدة","يتولّى الإنسان الباقي"]},"droite":{"titre":"الوكيل","points":["يسعى إلى هدف","يستعمل الأدوات ويتصرّف","عدة خطوات، ويصحّح خطّته","يُشرف الإنسان ويصادق"]}},{"type":"texte","titre":"المخاطر، والممارسات الجيدة","points":["الهلوسات: قد يتصرّف الوكيل بناءً على معلومة خاطئة","أفعال لا رجعة فيها: الحذف، والإرسال، والدفع؛ فلا بدّ من المصادقة","قد تحرف تعليماتٌ مخفيّة في صفحة ويب الوكيلَ عن مساره","البيانات الشخصية: يُطبَّق القانون الجزائري 18-07","سنة 2024: يعتمد الاتحاد الأوروبي اللائحة الخاصة بالذكاء الاصطناعي (AI Act)"],"illus":"bouclier"},{"type":"texte","titre":"وماذا عن الجزائر؟","points":["سنة 2021: افتتاح المدرسة الوطنية العليا للذكاء الاصطناعي (ENSIA)","ما تزال النماذج تخدم العربية والدارجة والأمازيغية خدمة أقلّ جودة","المدوّنات اللغوية المحلية التي تُبنى في العلوم الإنسانية والاجتماعية إسهامٌ حقيقي","يمكن لمذكّراتكم أن تسهم في ذلك: نصوص، واستبيانات، ومقابلات"],"illus":"carte"},{"type":"section","numero":"11","titre":"خلاصة","periode":"من 1206 إلى 2026","texte":"ثمانية قرون من الأحلام، وسبعون سنة من العلم، وبضع سنوات من الوكلاء.","illus":"frise"},{"type":"frise","titre":"التواريخ الثمانية التي ينبغي حفظها","evenements":[{"annee":"1843","titre":"لوفلايس","texte":"أول برنامج، لآلة لم تكتمل قطّ"},{"annee":"1950","titre":"تورينغ","texte":"هل تستطيع الآلات أن تفكّر؟"},{"annee":"1956","titre":"دارتموث","texte":"يحصل الذكاء الاصطناعي على اسمه"},{"annee":"1974","titre":"الشتاء","texte":"الشتاء الأول للذكاء الاصطناعي"},{"annee":"1997","titre":"Deep Blue","texte":"يهزم الحاسوب بطلَ العالم في الشطرنج"},{"annee":"2012","titre":"AlexNet","texte":"ينتصر التعلم العميق"},{"annee":"2017","titre":"المحوِّل","texte":"آلية الانتباه في صميم النماذج اللغوية"},{"annee":"2022","titre":"ChatGPT","texte":"ذكاء اصطناعي توليدي للجميع؛ ثم يأتي الوكلاء"}]},{"type":"deux","titre":"عائلات الذكاء الاصطناعي، في شريحة واحدة","gauche":{"titre":"بحسب الطريقة","points":["الرمزي: قواعد مكتوبة","التعلم الآلي: أمثلة","التعلم العميق: شبكات ذات طبقات عديدة","التعلم المعزَّز: محاولات ومكافآت"]},"droite":{"titre":"بحسب الطموح","points":["الذكاء الاصطناعي الضعيف (الضيّق): مهمة محدّدة","الذكاء الاصطناعي القوي (العام): كل المهام، وما يزال فرضيًّا","الوكلاء الحاليون ما زالوا ذكاءً اصطناعيًا ضعيفًا","… لكنهم يزدادون تعدّدًا في القدرات"]}},{"type":"texte","titre":"أربعة دروس من 90 سنة من الذكاء الاصطناعي","illus":"saisons","courbes":["التوقّعات","قوة الحساب"],"points":["الخطر ليس في الفشل بل في التوقّعات المفرطة: هي التي تسبّبت في الشتاءين","تعود الأفكار القديمة حين تتوفّر البيانات وقوة الحساب: بيرسبترون 1958 يعيش في ChatGPT","النجاح في الاختبار ليس فهمًا: التعميم على العالم الحقيقي يبقى الأصعب","ربيع دائم أم شتاء جديد؟ احكموا بالنتائج لا بالوعود"]},{"type":"video","titre":"فيديو: التاريخ الكامل للذكاء الاصطناعي (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence»، على YouTube"},{"type":"video","titre":"فيديو: مئة سنة من الذكاء الاصطناعي","youtube":"mSd9nmPM7Vg","legende":"فيلم وثائقي بالإنجليزية بعنوان «The Entire History of Artificial Intelligence (Last 100 Years)»، على YouTube"},{"type":"quiz","question":"في أيّ سنة فرضت عبارة «الذكاء الاصطناعي» نفسها، مع ورشة دارتموث؟","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"ظهرت العبارة في مقترح سنة 1955، وفرضت نفسها مع ورشة صيف 1956."},{"type":"quiz","question":"لماذا نتحدّث عن «شتاءات» الذكاء الاصطناعي؟","choix":["كانت الحواسيب تسخن كثيرًا","أدّت خيبة الأمل إلى تراجع التمويل والاهتمام","كانت الأبحاث تُجرى في فصل الشتاء","حُظرت الآلات"],"reponse":1,"explication":"بعد وعود مفرطة، خيّبت النتائج الآمال: فقُطع التمويل (1974–1980، ثم 1987–1993)."},{"type":"quiz","question":"ما الذي يميّز الوكيل عن مجرّد وكيل محادثة؟","choix":["يكتب بسرعة أكبر","يسعى إلى هدف بالتصرّف بواسطة الأدوات","لا يخطئ أبدًا","يعمل من دون كهرباء"],"reponse":1,"explication":"ينجز الوكيل سلسلة من الأفعال (البحث، والحساب، وكتابة ملف…) ويلاحظ النتائج لبلوغ هدف."},{"type":"quiz","question":"هل كانت ELIZA (1966) تفهم ما يُقال لها؟","choix":["نعم، مثل طبيب نفسي","لا: كانت تحوّل الجمل بواسطة قواعد","نعم، بفضل التعلم العميق","لا نعرف ذلك"],"reponse":1,"explication":"كانت ELIZA ترصد كلمات مفتاحية وتعيد جملًا جاهزة. والاعتقاد بأنها تفهم هو «أثر ELIZA»."},{"type":"quiz","question":"لماذا لا يستطيع البيرسبترون البسيط تعلّم «الباب ذي المفتاحين» (XOR)؟","choix":["ليست له ذاكرة كافية","لا يفصل خطٌّ مستقيم واحد بين المجموعتين","لا وجود لـ XOR في الرياضيات","يحتاج إلى كاميرا أدق"],"reponse":1,"explication":"يرسم البيرسبترون حدًّا مستقيمًا واحدًا، أما XOR فيتطلّب قاعدتين إحداهما فوق الأخرى، أي طبقتين على الأقل تُدرَّبان بالانتشار الخلفي."},{"type":"quiz","question":"لم يرَ نموذجٌ إلا أطباء يلبسون نظّارات؛ وأمام طبيب بلا نظّارة أجاب «ليس طبيبًا». ما هذا العيب؟","choix":["نقص الملاءمة","الإفراط في الملاءمة","الهلوسة","تحيّز التنشيط"],"reponse":1,"explication":"حفظ تفصيلًا من أمثلته بدل القاعدة العامة: هذا هو الإفراط في الملاءمة. والعلاج أمثلة أكثر عددًا وتنوّعًا."},{"type":"quiz","question":"ترجمة Google مثال على أيّ نوع من الذكاء الاصطناعي؟","choix":["الذكاء الضيّق","الذكاء العام","الذكاء الفائق","وكيل مستقلّ"],"reponse":0,"explication":"بارعة في الترجمة، لكنها لا تلعب الشطرنج ولا تبرمج: تتفوّق في مهمة واحدة. إنها ذكاء اصطناعي ضيّق."},{"type":"quiz","question":"سنة 2012، ما الذي جعل فوز AlexNet ممكنًا؟","choix":["خوارزمية جديدة كليًّا، وحدها","ملايين الصور، وحدها","بطاقات الرسوميات، وحدها","شبكة عميقة وصور ImageNet وبطاقات الرسوميات، مجتمعةً"],"reponse":3,"explication":"كانت الأفكار موجودة منذ الثمانينيات، لكن لزمت أيضًا صور ImageNet وقوة وحدات معالجة الرسوميات. فالتقت التروس الثلاثة أخيرًا."},{"type":"quiz","question":"تمبي، 2018: لماذا لم تتصرّف سيارة Uber التجريبية في الوقت المناسب؟","choix":["لم يكن لها أيّ مستشعر قادر على الرؤية ليلًا","كانت مسرعة جدًّا فلم تستطع الكبح في الوقت المناسب","لم تتعلّم أن الناس يعبرون خارج الممرّات، وظلّت متردّدة فيما تراه","كانت المرأة غير مرئية لكاميراتها ولراداراتها"],"reponse":2,"explication":"رصدتها السيارة قبل الاصطدام بـ5.6 ثانية، لكنها لم تتعرّف عليها قطّ بوصفها راجلة: لم يتوقّع النظام عبورًا خارج الممرّ (NTSB، 2019)."},{"type":"fin","titre":"ما ينبغي تذكّره","points":["ينتشر الذكاء الاصطناعي أسرع من الحاسوب الشخصي والهاتف المحمول والإنترنت: رهانُ دول ووظائف","يحاكي الذكاء الاصطناعي الذكاء: يبدو فاهمًا؛ أما الذكاء العام فلا وجود له بعد","تتناوب القواعد والخلايا العصبية؛ والشتاءات تولد من التوقّعات المفرطة","2012: التقت البيانات وبطاقات الرسوميات والشبكات العميقة","تزن الشبكة الأدلّة وتصحّح أخطاءها؛ وتخفق إن تعلّمت أكثر من اللازم أو أقلّ منه","من يمنح الآلة السلطة؟ التحقّق، والاحتفاظ بزمام الأمور، والإفصاح عن الاستعمال"],"texte":"عمل شخصي: اختاروا تاريخًا من الخط الزمني، واكتبوا عشرة أسطر عمّا غيّره، مع الاستشهاد بمصدر تحقّقتم منه."}]}};
