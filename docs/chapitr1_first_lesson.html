<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De l'automate à l'agent · Chapitre 1, première leçon</title>
<meta name="description" content="Présentation animée en trois langues : l'histoire complète de l'intelligence artificielle, des automates aux agents (Chapitre 1, première leçon).">
<meta name="theme-color" content="#07070a">
<link rel="preload" href="assets/fonts/im-fell-dw-pica-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/polices.css">
<style>
/* ==========================================================================
   « De l'automate à l'agent » : une présentation autonome (un seul fichier).
   Chaque diapositive est dessinée à 1280 × 720 puis mise à l'échelle de l'écran.
   ========================================================================== */
:root {
  --fond: #07070a; --surface: #151515; --surface-2: #1f1f25; --ligne: #2e2e35; --texte: #f5f5f5; --doux: #a9a9b6;
  --c1: #ffff00; --c2: #87ceeb; --c3: #ff512f; --c4: #dd2476; --c5: #1c64ff; --juste: #6fdcaa;
  --t1: #ffe94d; --t2: #87ceeb; --t3: #ff8466; --t4: #f472a8; --t5: #86a8ff;
  --prisme: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5));
  --prisme-conique: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c1));
  --f-titre: "IM Fell DW Pica SC", Georgia, "Times New Roman", serif;
  --f-texte: Literata, Georgia, "Times New Roman", serif;
  --f-ui: Rajdhani, "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --fond: #f4f4f6; --surface: #ffffff; --surface-2: #ececf1; --ligne: #d6d6de; --texte: #121216; --doux: #55555f;
  --t1: #8a7400; --t2: #1f6f96; --t3: #c2371b; --t4: #b0195b; --t5: #1c4fd1;
  color-scheme: light;
}
:root[lang="ar"] {
  --f-titre: "El Messiri", "Noto Naskh Arabic", Tahoma, serif;
  --f-texte: "Noto Naskh Arabic", "El Messiri", Tahoma, serif;
  --f-ui: "El Messiri", Tahoma, system-ui, sans-serif;
  --f-code: "JetBrains Mono", "Noto Naskh Arabic", monospace;
}
:root[lang="ar"] .bulle--m { font-family: var(--f-texte); font-size: 23px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font-family: var(--f-texte); overflow: hidden; }
:root[lang="ar"] body * { letter-spacing: 0 !important; }
button { font: inherit; color: inherit; }
a { color: var(--t2); }
.visuellement-cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Barre du haut ---------- */
.barre {
  position: fixed; inset: 0 0 auto; z-index: 20; height: 56px; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid var(--ligne); background: color-mix(in srgb, var(--fond) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: var(--f-ui);
}
.barre::after { content: ""; position: absolute; inset: auto 0 -1px 0; height: 3px; background: var(--prisme); transform-origin: left; transform: scaleX(var(--avance, 0)); transition: transform .4s; }
[dir="rtl"] .barre::after { transform-origin: right; }
.marque { display: flex; align-items: center; gap: 10px; color: var(--texte); text-decoration: none; font-weight: 700; white-space: nowrap; }
.marque__anneau { width: 18px; height: 18px; border-radius: 50%; background: var(--prisme-conique); -webkit-mask: radial-gradient(closest-side, transparent 55%, #000 58%); mask: radial-gradient(closest-side, transparent 55%, #000 58%); }
.barre__titre { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--doux); font-size: 15px; font-weight: 600; }
.langues { display: flex; padding: 3px; border: 1px solid var(--ligne); border-radius: 30px; }
.langues button { min-width: 44px; height: 32px; padding: 0 10px; border: 0; border-radius: 30px; background: none; color: var(--doux); font-weight: 700; cursor: pointer; }
.langues button[aria-pressed="true"] { background: var(--texte); color: var(--fond); }
.outils { display: flex; gap: 4px; }
.outil {
  display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--ligne); border-radius: 50%;
  background: var(--surface); cursor: pointer; transition: border-color .2s, transform .2s;
}
.outil:hover { border-color: var(--texte); transform: scale(1.06); }
.outil[aria-pressed="true"] { border-color: var(--t2); color: var(--t2); }
.outil svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }

/* ---------- Scène et diapositives ---------- */
.scene { position: fixed; inset: 56px 0 52px 0; overflow: hidden; }
.avec-notes .scene { bottom: 200px; }
.scene__cadre { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--k, 1)); }
.diapo {
  position: absolute; inset: 0; overflow: hidden; border-radius: 22px; padding: 64px 80px 56px;
  background:
    radial-gradient(110% 90% at 100% 0%, color-mix(in srgb, var(--c5) 14%, transparent), transparent 55%),
    radial-gradient(90% 80% at 0% 100%, color-mix(in srgb, var(--c4) 12%, transparent), transparent 60%),
    var(--surface);
  box-shadow: 0 30px 80px -30px #000, inset 0 0 0 1px var(--ligne);
  opacity: 0; visibility: hidden; transform: translateX(6%) scale(.98);
  transition: opacity .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1), visibility .55s;
  font-size: 28px; line-height: 1.42;
}
.diapo::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: var(--prisme); }
.diapo.passee { transform: translateX(-6%) scale(.98); }
[dir="rtl"] .diapo { transform: translateX(-6%) scale(.98); }
[dir="rtl"] .diapo.passee { transform: translateX(6%) scale(.98); }
.diapo.active { opacity: 1; visibility: visible; transform: none; }
.diapo--section.active .grand-numero { animation: zoom 1s cubic-bezier(.2,.7,.2,1) both; }
.diapo__num { position: absolute; bottom: 20px; inset-inline-end: 34px; color: var(--doux); font: 700 16px var(--f-ui); }
.diapo__marque { position: absolute; bottom: 20px; inset-inline-start: 34px; color: var(--doux); font: 600 16px var(--f-ui); letter-spacing: .04em; }

/* Ajustement : une diapositive trop chargée est réduite (zoom) pour tenir dans le cadre */
.diapo > :not(.diapo__marque):not(.diapo__num):not(.anneau-decor):not(.guillemet):not(.grand-numero) { zoom: var(--z, 1); }
.mesure .diapo, .mesure .a, .mesure .bulle { transform: none !important; }

/* Apparition progressive des éléments d'une diapositive active */
.a { opacity: 0; transform: translateY(18px); }
.active .a { animation: monte .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms + 150ms); }
.active .a--gauche { animation-name: glisse; }
@keyframes monte { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes glisse { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
[dir="rtl"] .active .a--gauche { animation-name: glisse-rtl; }
@keyframes glisse-rtl { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes zoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

/* Typographie commune */
.surtitre { color: var(--t2); font: 700 22px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
.titre { margin: 0 0 26px; font-family: var(--f-titre); font-size: 52px; font-weight: 400; line-height: 1.1; text-wrap: balance; }
.titre::after { content: ""; display: block; width: 130px; height: 6px; margin-top: 16px; border-radius: 6px; background: var(--prisme); }
.annee { display: inline-block; margin-bottom: 14px; padding: 4px 16px; border-radius: 30px; background: color-mix(in srgb, var(--c1) 16%, transparent); color: var(--t1); font: 700 22px var(--f-ui); letter-spacing: .06em; }
.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.points li { position: relative; padding-inline-start: 40px; }
.points li::before { content: ""; position: absolute; inset-inline-start: 4px; top: .52em; width: 16px; height: 16px; border-radius: 50%; background: var(--prisme-conique); }
em { font-style: italic; } strong { font-weight: 700; } .insecable { white-space: nowrap; }
.colonnes { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 50px; align-items: center; height: calc(100% - 20px); }
.colonnes--schema { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.illus { width: 100%; max-height: 440px; }
.illus svg { width: 100%; height: auto; max-height: 440px; display: block; overflow: visible; }

/* Couverture */
.diapo--couverture { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 40px; align-items: center; padding: 80px 90px; }
.diapo--couverture .titre { font-size: 84px; }
.diapo--couverture .titre::after { width: 220px; }
.sous-titre { margin: 0; color: var(--doux); font-size: 30px; line-height: 1.4; }
.anneau-decor { position: absolute; width: 420px; height: 420px; inset-inline-end: -170px; bottom: -250px; border-radius: 50%; background: var(--prisme-conique); -webkit-mask: radial-gradient(closest-side, transparent 74%, #000 75%); mask: radial-gradient(closest-side, transparent 74%, #000 75%); opacity: .8; }
.active .anneau-decor { animation: tourne 22s linear infinite; }
@keyframes tourne { to { transform: rotate(1turn); } }

/* Plan */
.plan { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; counter-reset: etape; }
.plan li { display: flex; gap: 18px; align-items: center; padding: 18px 22px; border: 1px solid var(--ligne); border-radius: 18px; background: var(--surface-2); counter-increment: etape; font-size: 25px; line-height: 1.3; }
.plan li::before { content: counter(etape); flex: none; display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--prisme-conique); color: #111; font: 700 24px var(--f-ui); }

/* Section */
.diapo--section { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; }
.grand-numero { font-family: var(--f-titre); font-size: 200px; line-height: .9; background: var(--prisme); -webkit-background-clip: text; background-clip: text; color: transparent; }
.periode { display: inline-block; margin: 10px 0 18px; padding: 6px 18px; border: 2px solid var(--t2); border-radius: 30px; color: var(--t2); font: 700 24px var(--f-ui); }
.diapo--section .titre { font-size: 64px; }
.diapo--section .texte { color: var(--doux); font-size: 28px; margin: 0; }

/* Portrait */
.portrait { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 56px; align-items: center; height: 100%; }
.photo { position: relative; width: 340px; height: 420px; border-radius: 28px; padding: 6px; background: var(--prisme-conique); }
.photo__cadre { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 23px; background: var(--surface-2); }
.photo img[hidden] { display: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.15) contrast(1.05); }
.photo__repli { position: absolute; inset: 0; display: grid; place-items: center; }
.photo__repli svg { width: 88%; height: auto; }
.photo__initiales { position: absolute; inset: auto 0 18px; text-align: center; font: 700 44px var(--f-titre); color: var(--texte); }
.photo__credit { position: absolute; inset: auto 12px 10px auto; padding: 2px 8px; border-radius: 8px; background: #000a; color: #fff; font: 600 12px var(--f-ui); text-decoration: none; }
.nom { margin: 0; font-family: var(--f-titre); font-size: 56px; line-height: 1.05; }
.dates { margin: 6px 0 4px; color: var(--t1); font: 700 24px var(--f-ui); letter-spacing: .05em; }
.role { margin: 0 0 22px; color: var(--doux); font-size: 26px; font-style: italic; }
.citation-courte { margin: 22px 0 0; padding: 16px 22px; border-inline-start: 6px solid var(--c4); border-radius: 12px; background: color-mix(in srgb, var(--c4) 10%, transparent); font-family: var(--f-titre); font-size: 26px; }
.citation-courte small { display: block; margin-top: 6px; color: var(--doux); font: italic 18px var(--f-texte); }

/* Citation */
.diapo--citation { display: grid; align-content: center; padding: 80px 120px; }
.guillemet { position: absolute; top: 40px; inset-inline-start: 60px; font-family: var(--f-titre); font-size: 260px; line-height: 1; color: var(--c4); opacity: .5; }
.citation__texte { margin: 0; font-family: var(--f-titre); font-size: 46px; line-height: 1.3; text-wrap: balance; }
.citation__auteur { margin: 30px 0 0; color: var(--t2); font: 700 26px var(--f-ui); }
.citation__source { margin: 4px 0 0; color: var(--doux); font-size: 22px; font-style: italic; }

/* Deux colonnes */
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.carte { padding: 28px 32px; border: 1px solid var(--ligne); border-radius: 22px; background: color-mix(in srgb, var(--surface-2) 85%, transparent); }
.carte:first-child { border-top: 6px solid var(--c2); }
.carte:last-child { border-top: 6px solid var(--c4); }
.carte h3 { margin: 0 0 18px; font-size: 32px; }
.carte .points { gap: 12px; font-size: 25px; }

/* Frise */
.frise { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; margin-top: 30px; padding-top: 150px; }
.frise__ligne { position: absolute; left: 0; right: 0; top: 118px; height: 6px; border-radius: 6px; background: var(--prisme); transform-origin: left; transform: scaleX(0); }
[dir="rtl"] .frise__ligne { transform-origin: right; }
.active .frise__ligne { animation: trace-ligne 1.2s .2s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes trace-ligne { to { transform: scaleX(1); } }
.evenement { position: relative; text-align: center; }
.evenement::before { content: ""; position: absolute; top: -41px; left: calc(50% - 12px); width: 24px; height: 24px; border: 5px solid var(--surface); border-radius: 50%; background: var(--texte); }
.evenement__annee { position: absolute; top: -118px; left: 0; right: 0; font-family: var(--f-titre); font-size: 40px; color: var(--t1); }
.evenement__titre { margin: 0 0 6px; font: 700 23px var(--f-ui); }
.evenement__texte { margin: 0; color: var(--doux); font-size: 19px; line-height: 1.35; }
.frise--dense .evenement__texte { font-size: 17px; }
.frise--dense .evenement__annee { font-size: 32px; }

/* Dialogue */
.chat { position: relative; display: grid; gap: 14px; max-width: 900px; margin: 0 auto; padding: 24px; border: 1px solid var(--ligne); border-radius: 22px; background: var(--fond); }
.bulle { max-width: 80%; margin: 0; padding: 14px 20px; border-radius: 20px; font-size: 24px; line-height: 1.35; opacity: 0; transform: translateY(10px); }
.bulle--h { justify-self: start; border-end-start-radius: 4px; background: var(--surface-2); }
.bulle--m { justify-self: end; border-end-end-radius: 4px; background: color-mix(in srgb, var(--c5) 22%, var(--surface)); font-family: var(--f-code); font-size: 21px; }
.bulle.vue { animation: monte .5s both; }
.frappe { position: absolute; inset-inline-end: 24px; display: none; gap: 6px; padding: 14px 18px; border-radius: 20px; background: color-mix(in srgb, var(--c5) 22%, var(--surface)); }
.frappe.vue { display: flex; }
.frappe i { width: 10px; height: 10px; border-radius: 50%; background: var(--texte); animation: point 1s infinite; }
.frappe i:nth-child(2) { animation-delay: .15s; } .frappe i:nth-child(3) { animation-delay: .3s; }
@keyframes point { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
.legende { margin: 14px 0 0; color: var(--doux); font-size: 19px; font-style: italic; text-align: center; }

/* Vidéo */
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 470px; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video__vignette { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.video__repli { position: absolute; inset: 0; z-index: 1; text-shadow: 0 2px 8px #000; display: grid; place-content: center; gap: 16px; padding: 30px; color: #fff; text-align: center; font-size: 24px; }
.video__repli a { color: #9fd3ff; font-weight: 700; }
.video__jouer { width: 110px; height: 110px; margin: 0 auto; border-radius: 50%; background: var(--prisme-conique); display: grid; place-items: center; }
.video__jouer::after { content: ""; border-left: 34px solid #111; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 8px; }

/* Quiz */
.question { margin: 0 0 26px; font-size: 36px; font-weight: 700; line-height: 1.3; }
.choix { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.choix button { display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px 20px; border: 2px solid var(--ligne); border-radius: 18px; background: var(--surface-2); text-align: start; font-size: 25px; line-height: 1.3; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.choix button:hover { border-color: var(--t2); transform: translateY(-2px); }
.lettre { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--t2); border-radius: 50%; color: var(--t2); font: 700 22px var(--f-ui); }
.choix button[aria-pressed="true"] { border-color: var(--t2); }
.quiz--revele .choix button.juste { border-color: var(--juste); background: color-mix(in srgb, var(--juste) 16%, var(--surface-2)); }
.quiz--revele .choix button.faux[aria-pressed="true"] { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 14%, var(--surface-2)); }
.explication { margin: 22px 0 0; padding: 16px 22px; border-radius: 16px; background: color-mix(in srgb, var(--juste) 14%, transparent); font-size: 24px; visibility: hidden; opacity: 0; transition: opacity .4s; }
.quiz--revele .explication { visibility: visible; opacity: 1; }
.reveler { margin-top: 18px; padding: 10px 22px; border: 2px solid var(--texte); border-radius: 30px; background: none; font: 700 20px var(--f-ui); cursor: pointer; }

/* Fin */
.fin .points li::before { content: "✓"; display: grid; place-items: center; width: 26px; height: 26px; top: .25em; background: var(--juste); color: #111; font: 700 16px var(--f-ui); }
.devoir { margin-top: 26px; padding: 18px 24px; border: 2px dashed var(--t1); border-radius: 18px; font-size: 24px; }

/* ---------- Illustrations : couleurs et animations ---------- */
.i-t { stroke: var(--texte); } .i-d { stroke: var(--doux); } .i-l { stroke: var(--ligne); }
.i-c1 { stroke: var(--c1); } .i-c2 { stroke: var(--c2); } .i-c3 { stroke: var(--c3); } .i-c4 { stroke: var(--c4); } .i-c5 { stroke: var(--c5); } .i-j { stroke: var(--juste); }
.f-t { fill: var(--texte); } .f-d { fill: var(--doux); } .f-s { fill: var(--surface-2); } .f-f { fill: var(--fond); }
.f-c1 { fill: var(--c1); } .f-c2 { fill: var(--c2); } .f-c3 { fill: var(--c3); } .f-c4 { fill: var(--c4); } .f-c5 { fill: var(--c5); } .f-j { fill: var(--juste); }
svg .trait { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
svg .fin { stroke-width: 2.5; }
svg text { font-family: var(--f-ui); font-weight: 700; }
.active .anim-tourne { animation: tourne 8s linear infinite; transform-box: fill-box; transform-origin: center; }
.active .anim-tourne-inverse { animation: tourne 8s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
.active .anim-tourne-lent { animation: tourne 30s linear infinite; transform-box: fill-box; transform-origin: center; }
.active .anim-pulse { animation: pulse 1.8s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 1s); }
.active .anim-flotte { animation: flotte 3s ease-in-out infinite; }
.active .anim-trace { stroke-dasharray: var(--l, 800); stroke-dashoffset: var(--l, 800); animation: trace 1.8s .3s ease-out forwards; }
.active .anim-apparait { opacity: 0; animation: apparait .6s both; animation-delay: calc(var(--d, 0) * 1s + .3s); }
.active .anim-signal { animation: signal 2.4s linear infinite; animation-delay: calc(var(--d, 0) * 1s); }
.active .anim-tete { animation: tete 6s steps(1) infinite; }
.active .anim-clignote { animation: clignote 1.2s steps(2) infinite; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes flotte { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes trace { to { stroke-dashoffset: 0; } }
@keyframes apparait { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes signal { from { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
@keyframes tete { 0% { transform: translateX(0); } 16% { transform: translateX(48px); } 33% { transform: translateX(96px); } 50% { transform: translateX(144px); } 66% { transform: translateX(96px); } 83% { transform: translateX(48px); } }
@keyframes clignote { 50% { opacity: 0; } }
svg [class*="anim-apparait"] { transform-box: fill-box; transform-origin: center; }

/* ---------- Pied : navigation ---------- */
.pied { position: fixed; inset: auto 0 0 0; z-index: 20; height: 52px; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: var(--f-ui); }
.pied__compteur { min-width: 90px; text-align: center; color: var(--doux); font-weight: 700; font-variant-numeric: tabular-nums; }
.avec-notes .pied { bottom: 148px; }
.notes { position: fixed; inset: auto 0 0 0; z-index: 19; height: 148px; overflow-y: auto; padding: 14px 24px; border-top: 1px solid var(--ligne); background: var(--surface); font-size: 18px; line-height: 1.6; }
.notes h2 { margin: 0 0 4px; color: var(--doux); font: 700 13px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; }
.notes p { margin: 0; max-width: 1100px; }

/* Vue d'ensemble */
.apercu { position: fixed; inset: 56px 0 0 0; z-index: 30; overflow-y: auto; padding: 24px; background: var(--fond); }
.apercu[hidden] { display: none; }
.apercu__grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.miniature { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid var(--ligne); border-radius: 12px; background: var(--surface); cursor: pointer; padding: 0; }
.miniature[aria-current="true"] { border-color: var(--c1); }
.miniature .diapo { opacity: 1; visibility: visible; transform: scale(var(--km, .18)); transform-origin: 0 0; width: 1280px; height: 720px; transition: none; border-radius: 0; }
[dir="rtl"] .miniature .diapo { transform-origin: 100% 0; right: 0; left: auto; }
.miniature .a { opacity: 1; transform: none; }
.miniature__num { position: absolute; top: 6px; inset-inline-start: 6px; z-index: 2; padding: 0 7px; border-radius: 6px; background: #000b; color: #fff; font: 700 13px/20px var(--f-ui); }

/* Mouvement réduit */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* Petits écrans : la barre se simplifie */
@media (max-width: 720px) {
  .barre__titre, .outil--secondaire { display: none; }
  .barre { gap: 6px; padding: 0 8px; }
  .langues button { min-width: 36px; padding: 0 6px; }
}

/* Impression : une diapositive par page 16:9 */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .barre, .pied, .notes, .apercu, .scene { display: none !important; }
  .impression { display: block !important; }
  .impression .diapo { position: relative; opacity: 1; visibility: visible; transform: none; width: 1280px; height: 720px; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .impression .a, .impression .bulle { opacity: 1 !important; transform: none !important; animation: none !important; }
  .impression .frise__ligne { transform: none !important; }
  .impression .explication { visibility: visible; opacity: 1; }
}
.impression { display: none; }
</style>

<script>
window.LECON = {"fr":{"langue":"fr","titre":"De l'automate à l'agent","sousTitre":"L'histoire complète de l'intelligence artificielle, des premières machines aux agents d'aujourd'hui","diapos":[{"type":"couverture","surtitre":"Intelligence artificielle · Chapitre 1 · Première leçon","titre":"De l'automate à l'agent","sousTitre":"L'histoire complète de l'intelligence artificielle, des premières machines aux agents d'aujourd'hui","illus":"agent","notes":"Accueillez la classe avec une question au tableau : « Une machine peut-elle penser ? » Ne répondez pas : toute la leçon y revient. Annoncez le fil conducteur : le rêve de machines intelligentes est très ancien, mais l'IA comme science a soixante-dix ans, et ses agents quelques années seulement."},{"type":"plan","titre":"Le voyage de cette leçon","points":["Le rêve des machines (de l'Antiquité à 1945)","La naissance de l'IA (1950–1956)","L'âge d'or, puis le premier hiver (1956–1980)","Les systèmes experts (1980–1993)","Apprendre à partir des données (1990–2016)","La révolution de l'apprentissage profond (2006–2016)","Transformers et IA générative (2017–2022)","L'ère des agents (2023–2026)"],"notes":"Huit étapes, chacune avec une date clé à retenir. Proposez aux étudiants de noter une date par étape : ils reconstitueront la frise à la fin."},{"type":"texte","titre":"Et vous, qu'appelez-vous « intelligence » ?","points":["Comprendre une phrase, traduire un poème","Reconnaître un visage parmi mille","Gagner aux échecs, résoudre un problème","Apprendre de ses erreurs","Agir seul pour atteindre un but"],"illus":"cerveau","notes":"Deux minutes de vote à main levée : lesquelles de ces capacités une machine a-t-elle déjà ? Réponse de fin de leçon : toutes, à des degrés divers, mais aucune machine ne les réunit comme un humain. La dernière ligne, agir seul pour un but, définit l'agent : c'est la destination de la leçon."},{"type":"section","numero":"1","titre":"Le rêve des machines","periode":"De l'Antiquité à 1945","texte":"Bien avant les ordinateurs, les humains ont imaginé et construit des machines qui imitent la vie, puis des machines qui calculent.","illus":"engrenages","notes":"Première étape : l'IA n'est pas née de rien. Deux lignes se rejoignent ici : les automates, qui imitent le mouvement, et les machines à calculer, qui imitent le raisonnement."},{"type":"texte","titre":"Des automates dans les mythes et les ateliers","points":["Mythe grec : Talos, géant de bronze qui garde la Crète","Ier siècle : Héron d'Alexandrie décrit des automates de théâtre","1739 : le canard de Vaucanson bat des ailes et « digère »","Vers 1770 : l'Écrivain des Jaquet-Droz trace des lettres à la plume"],"illus":"engrenages","notes":"Un automate reproduit un mouvement prévu d'avance par ses engrenages ou ses cames. Il ne décide rien : c'est la différence avec une IA. Demandez : l'Écrivain des Jaquet-Droz « écrit »-il vraiment ?"},{"type":"texte","titre":"Al-Jazari, l'ingénieur des machines ingénieuses","annee":"1206","points":["Ingénieur de la cour artuqide, en Haute-Mésopotamie","Écrit en 1206 le *Livre de la connaissance des procédés mécaniques ingénieux*","Décrit une cinquantaine de machines : horloges, pompes, automates","Son horloge-éléphant marque les heures par des automates"],"illus":"elephant","notes":"Al-Jazari montre que la tradition des automates traverse le monde arabe et musulman médiéval. Ses dessins détaillés permettent encore aujourd'hui de reconstruire ses machines. Restez prudent : ce sont des automates programmés d'avance, pas des machines qui apprennent."},{"type":"texte","titre":"Des machines qui calculent","points":["1642 : Blaise Pascal construit la Pascaline, qui additionne","1673 : Leibniz présente une machine qui multiplie","1837 : Charles Babbage conçoit la machine analytique, programmable par cartes perforées","La machine analytique ne sera jamais achevée de son vivant"],"illus":"calculatrice","personne":"babbage","notes":"Passage clé : une machine qui calcule remplace une partie du travail de l'esprit. La machine analytique de Babbage a déjà une mémoire et une unité de calcul, comme nos ordinateurs."},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathématicienne, première programmeuse","points":["1843 : ses notes sur la machine analytique de Babbage","Elle y écrit un algorithme pour calculer les nombres de Bernoulli","Elle imagine que la machine pourrait composer de la musique"],"citation":"La machine analytique n'a aucune prétention à créer quoi que ce soit.","source":"Ada Lovelace, notes de 1843","notes":"Sa phrase, l'« objection de Lady Lovelace », sera discutée par Turing un siècle plus tard : une machine ne fait-elle que ce qu'on lui dit ? Question à poser à la classe : un modèle qui écrit un poème crée-t-il quelque chose ?"},{"type":"texte","titre":"Quand la pensée devient calcul","points":["1854 : George Boole réduit le raisonnement à des calculs sur vrai et faux","1936 : Alan Turing décrit une machine abstraite capable de tout calcul","Un ruban, une tête de lecture, une table de règles : c'est la « machine de Turing »","Tout ordinateur actuel est, en principe, une machine de Turing"],"illus":"turing","notes":"Boole fournit l'alphabet (vrai, faux, et, ou, non) ; Turing fournit la machine universelle. Montrez l'animation : la tête lit une case, écrit, se déplace, change d'état. Avec des règles aussi simples, on peut tout calculer."},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathématicien, père de l'informatique théorique","points":["1936 : la machine universelle","1939–1945 : contribue à casser le code Enigma à Bletchley Park","1950 : « Computing Machinery and Intelligence », l'article fondateur"],"citation":"Je propose d'examiner la question suivante : les machines peuvent-elles penser ?","source":"Alan Turing, Mind, 1950","notes":"Turing remplace une question impossible (« penser ») par un test observable, le jeu de l'imitation. C'est le geste fondateur de l'IA. La phrase citée ouvre son article de 1950."},{"type":"schema","titre":"Le neurone formel","annee":"1943","illus":"neurone","points":["Warren McCulloch et Walter Pitts modélisent un neurone par un calcul","Il additionne des signaux d'entrée et « s'active » au-delà d'un seuil","C'est l'ancêtre de tous les réseaux de neurones actuels"],"notes":"Premier pont entre biologie et calcul. Dessinez au tableau : trois entrées, des poids, une somme, un seuil. On retrouvera exactement ce schéma avec le perceptron en 1958, puis dans l'apprentissage profond."},{"type":"texte","titre":"Les premiers ordinateurs","points":["1945 : l'ENIAC, 30 tonnes, calcule des trajectoires balistiques","1948 : Claude Shannon fonde la théorie de l'information","Le bit devient l'unité de toute information : texte, image, son","Les machines existent enfin ; reste à les rendre « intelligentes »"],"personne":"eniac","notes":"L'ENIAC occupe une salle entière et se programme en branchant des câbles. Shannon, lui, sera l'un des quatre signataires du projet de Dartmouth. Fin de la première étape : tout est prêt pour la naissance de l'IA."},{"type":"section","numero":"2","titre":"La naissance de l'IA","periode":"1950–1956","texte":"En six ans, une question devient un programme de recherche, puis une discipline avec un nom.","illus":"ampoule","notes":"Deuxième étape : trois moments à retenir, 1950 (Turing), 1956 (Dartmouth) et le premier programme « intelligent »."},{"type":"schema","titre":"Le jeu de l'imitation","annee":"1950","illus":"imitation","points":["Un juge dialogue par écrit avec deux interlocuteurs cachés","L'un est un humain, l'autre une machine","Si le juge ne sait pas les distinguer, la machine « réussit »"],"notes":"Faites jouer la scène : deux volontaires cachés, un juge, cinq minutes de questions écrites. Discussion : le test mesure-t-il l'intelligence, ou l'art de faire illusion ? Les agents conversationnels actuels ont relancé ce débat."},{"type":"citation","texte":"Chaque aspect de l'apprentissage ou de toute autre caractéristique de l'intelligence peut en principe être décrit si précisément qu'une machine peut être construite pour le simuler.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposition pour l'atelier de Dartmouth, 31 août 1955","notes":"C'est dans ce texte qu'apparaît l'expression « intelligence artificielle ». L'hypothèse est très ambitieuse : tout ce que fait l'intelligence pourrait être décrit précisément. Demandez : est-ce vrai pour l'humour ? pour l'intuition poétique ?"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Informaticien, a donné son nom à l'IA","points":["Été 1956 : organise l'atelier de Dartmouth, acte de naissance de l'IA","1958 : crée le langage Lisp, longtemps langage de l'IA","Avec lui : Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"notes":"L'atelier de Dartmouth réunit une dizaine de chercheurs pendant l'été 1956. Il ne produit pas de grande découverte, mais il donne un nom, une communauté et un programme à la discipline."},{"type":"texte","titre":"Le premier programme « intelligent »","annee":"1956","points":["Le Logic Theorist d'Allen Newell, Herbert Simon et Cliff Shaw","Il démontre 38 des 52 premiers théorèmes des *Principia Mathematica*","Pour l'un d'eux, une preuve plus élégante que celle des auteurs","Une idée clé : chercher parmi des possibilités avec des règles"],"illus":"arbre","notes":"Le Logic Theorist incarne l'IA symbolique : des symboles, des règles, une recherche dans un arbre de possibilités. C'est la même logique que le chaînage avant du TD du chapitre 3."},{"type":"section","numero":"3","titre":"L'âge d'or, puis le premier hiver","periode":"1956–1980","texte":"Des succès spectaculaires, des promesses démesurées, puis la déception et la fin des crédits.","illus":"courbe","notes":"Troisième étape : c'est le premier cycle d'enthousiasme et de désillusion. Il se répétera, ce qui aide à juger les promesses d'aujourd'hui."},{"type":"schema","titre":"Le perceptron de Rosenblatt","annee":"1958","illus":"perceptron","points":["Frank Rosenblatt construit une machine qui apprend à reconnaître des formes","Elle ajuste elle-même ses poids après chaque erreur","La presse annonce des machines qui « pensent » : l'enthousiasme s'emballe"],"personne":"perceptron","notes":"Le perceptron est le premier réseau de neurones qui apprend. Faites le lien avec l'activité « le neurone humain » du guide : des poids, un seuil, une correction après chaque erreur."},{"type":"texte","titre":"Apprendre sans être programmé","annee":"1959","points":["Arthur Samuel écrit un programme de jeu de dames qui s'améliore en jouant","Il invente l'expression « machine learning », apprentissage automatique","Le programme finit par battre son propre créateur","Deux voies se dessinent : écrire les règles, ou les faire apprendre"],"illus":"dames","notes":"Voilà l'opposition qui structure toute l'histoire : l'IA symbolique (on écrit les règles) contre l'IA connexionniste ou statistique (la machine les apprend à partir d'exemples)."},{"type":"chat","titre":"ELIZA, la première psychothérapeute artificielle","annee":"1966","legende":"Extrait de l'article de Joseph Weizenbaum (1966), traduit","echanges":[{"qui":"h","texte":"Les hommes sont tous pareils."},{"qui":"m","texte":"EN QUEL SENS ?"},{"qui":"h","texte":"Ils nous embêtent toujours avec une chose ou une autre."},{"qui":"m","texte":"POUVEZ-VOUS DONNER UN EXEMPLE PRÉCIS ?"},{"qui":"h","texte":"Eh bien, c'est mon ami qui m'a fait venir ici."},{"qui":"m","texte":"VOTRE AMI VOUS A FAIT VENIR ICI."}],"notes":"ELIZA ne comprend rien : elle repère des mots-clés et renvoie la phrase avec des règles de transformation. Pourtant, des utilisateurs lui confiaient leurs secrets. Weizenbaum en fut inquiet toute sa vie. C'est l'« effet ELIZA » : prêter une compréhension à une machine qui répond bien."},{"type":"texte","titre":"Shakey, le premier robot qui raisonne","annee":"1966–1972","points":["Construit au Stanford Research Institute (SRI)","Il perçoit son environnement avec une caméra","Il planifie une suite d'actions pour atteindre un but","Pour lui naît l'algorithme A*, encore utilisé pour calculer des itinéraires"],"personne":"shakey","illus":"robot","notes":"Shakey est un ancêtre direct des agents : il perçoit, planifie, agit. Mais il met des minutes à décider de pousser une boîte. Retenez le schéma percevoir, planifier, agir : il revient à la fin de la leçon."},{"type":"citation","texte":"Les machines seront capables, d'ici vingt ans, de faire tout travail qu'un homme peut faire.","auteur":"Herbert Simon","source":"1965","notes":"Les promesses de l'époque étaient démesurées. Vingt ans plus tard, en 1985, on en était très loin. Demandez aux étudiants de trouver une promesse actuelle sur l'IA et de se demander comment on la jugera dans vingt ans."},{"type":"schema","titre":"Le premier hiver de l'IA","annee":"1974–1980","illus":"courbe","points":["1969 : Minsky et Papert montrent les limites du perceptron simple","1973 : le rapport Lighthill, au Royaume-Uni, juge les résultats décevants","Les calculs explosent dès que les problèmes grandissent","Les financements publics sont coupés : c'est l'« hiver »"],"notes":"Un hiver de l'IA, c'est une période où la déception fait fuir les crédits et les chercheurs. La courbe montre les deux hivers : 1974–1980 et 1987–1993. Point de méthode : juger une technique sur ses résultats, pas sur ses promesses."},{"type":"section","numero":"4","titre":"Les systèmes experts","periode":"1980–1993","texte":"L'IA revient en mettant le savoir des experts en règles. Elle entre dans les entreprises, puis retombe.","illus":"regles","notes":"Quatrième étape : le triomphe de l'IA symbolique, celle du chapitre 3 et de son TD sur le chaînage avant."},{"type":"schema","titre":"Mettre le savoir en règles","illus":"regles","points":["Une base de faits, une base de règles SI … ALORS …, un moteur d'inférence","Années 1970 : MYCIN, à Stanford, diagnostique des infections du sang","1980 : XCON configure les ordinateurs de l'entreprise DEC","Les entreprises investissent : l'IA devient une industrie"],"notes":"Reliez à la séance 6 : le jeu de rôle des formes poétiques est un petit système expert. MYCIN comptait environ 600 règles écrites avec des médecins."},{"type":"texte","titre":"Le retour des neurones","annee":"1986","points":["1982 : le Japon lance le projet des ordinateurs de cinquième génération","1986 : Rumelhart, Hinton et Williams popularisent la rétropropagation","On sait enfin entraîner des réseaux à plusieurs couches","Mais les ordinateurs et les données manquent encore"],"illus":"reseau","notes":"La rétropropagation calcule comment corriger chaque poids d'un réseau à partir de l'erreur finale. C'est la descente de gradient du chapitre 3, appliquée à des millions de poids. L'idée est prête vingt-cinq ans avant son triomphe."},{"type":"texte","titre":"Le second hiver","annee":"1987–1993","points":["1987 : le marché des machines spécialisées Lisp s'effondre","Les systèmes experts coûtent cher et se trompent hors de leur domaine","Chaque nouvelle règle en contredit d'autres : ils deviennent ingérables","Le mot « IA » devient mal vu : on parle plutôt d'« informatique avancée »"],"illus":"flocon","notes":"Les systèmes experts sont fragiles : ils ne savent que ce qu'on leur a écrit, et ne savent pas qu'ils ne savent pas. Cette faiblesse explique le virage suivant : apprendre à partir de données."},{"type":"section","numero":"5","titre":"Apprendre à partir des données","periode":"1990–2016","texte":"Au lieu d'écrire les règles, on donne des exemples. Avec Internet, les exemples deviennent des milliards.","illus":"donnees","notes":"Cinquième étape : c'est le grand retournement. Il s'appuie sur trois ingrédients : des algorithmes, des données et de la puissance de calcul."},{"type":"deux","titre":"Deux façons de faire une IA","gauche":{"titre":"IA symbolique","points":["Un expert écrit les règles","Explicable : on suit le raisonnement","Fragile hors de son domaine","Exemple : un système expert"]},"droite":{"titre":"Apprentissage automatique","points":["La machine tire des régularités des exemples","Souvent difficile à expliquer","Robuste, s'il y a beaucoup de données","Exemple : un filtre anti-spam"]},"notes":"Faites classer trois objets par les étudiants : un correcteur orthographique, un traducteur automatique, un GPS. Aujourd'hui, les meilleurs systèmes combinent souvent les deux approches."},{"type":"portrait","personne":"deepblue","nom":"Deep Blue contre Kasparov","dates":"Mai 1997","role":"L'ordinateur d'IBM bat le champion du monde d'échecs","points":["Victoire 3½ à 2½ en six parties, à New York","Environ 200 millions de positions évaluées par seconde","Une force de calcul, pas d'apprentissage : c'est encore une IA de recherche"],"illus":"echecs","notes":"L'événement fait le tour du monde. Mais Deep Blue ne comprend pas les échecs : il calcule des coups et les évalue avec des règles écrites par des experts. Comparez avec AlphaGo, qui apprendra en jouant, vingt ans plus tard."},{"type":"frise","titre":"L'apprentissage s'installe partout","evenements":[{"annee":"1989","titre":"Lire les chiffres","texte":"Yann LeCun entraîne un réseau convolutif à lire les codes postaux"},{"annee":"1992","titre":"TD-Gammon","texte":"Un programme apprend le jacquet en jouant contre lui-même"},{"annee":"1998","titre":"Chèques","texte":"Les réseaux de LeCun lisent des chèques bancaires aux États-Unis"},{"annee":"2002","titre":"Roomba","texte":"Un robot aspirateur entre dans les maisons"},{"annee":"2005","titre":"Stanley","texte":"Une voiture sans conducteur gagne la course du désert de la DARPA"},{"annee":"2011","titre":"Watson, Siri","texte":"Watson gagne au jeu télévisé Jeopardy! ; Siri arrive dans les téléphones"}],"notes":"Remarquez que l'IA devient invisible : elle trie le courrier, lit les chèques, filtre le spam, sans qu'on l'appelle IA. C'est ce qu'on appelle parfois l'« effet IA » : dès qu'une technique marche, on cesse de la considérer comme de l'intelligence."},{"type":"section","numero":"6","titre":"La révolution de l'apprentissage profond","periode":"2006–2016","texte":"Des réseaux de neurones à très nombreuses couches, entraînés sur d'énormes données avec des processeurs graphiques.","illus":"reseau","notes":"Sixième étape. Le mot « profond » désigne le nombre de couches du réseau, pas la profondeur de la pensée."},{"type":"schema","titre":"Un réseau profond, couche après couche","illus":"reseau","points":["Les premières couches repèrent des traits simples : bords, taches","Les couches suivantes combinent : formes, textures, parties","Les dernières reconnaissent des objets entiers : « chat », « voiture »","Chaque couche apprend seule ce qu'elle doit repérer"],"notes":"Montrez l'animation : le signal traverse les couches de gauche à droite. Dans un texte, c'est pareil : lettres, mots, expressions, sens. Personne n'écrit ce que chaque neurone doit repérer : il l'apprend."},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li et ImageNet","dates":"2009–2012","role":"Une base d'images qui change tout","points":["2009 : ImageNet, plus de 14 millions d'images annotées à la main","2012 : le réseau AlexNet écrase la compétition de reconnaissance d'images","Son taux d'erreur tombe à 15 %, contre 26 % pour le deuxième"],"illus":"imagenet","notes":"Trois ingrédients se rencontrent en 2012 : des données (ImageNet), des cartes graphiques pour calculer vite, et des réseaux profonds. C'est le début de la vague actuelle. L'annotation des images a été faite par des milliers de travailleurs payés à la tâche : un point éthique à discuter."},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Né en 1947","role":"Pionnier des réseaux de neurones","points":["Défend les réseaux de neurones pendant les deux hivers","2018 : prix Turing avec Yoshua Bengio et Yann LeCun","2024 : prix Nobel de physique avec John Hopfield"],"notes":"Hinton est l'exemple d'un chercheur qui a eu raison trop tôt : ses idées des années 1980 ne marchent vraiment qu'en 2012. En 2023, il quitte Google pour alerter sur les risques de l'IA."},{"type":"frise","titre":"Les machines apprennent aussi le langage et le jeu","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Les mots deviennent des vecteurs : « roi » − « homme » + « femme » ≈ « reine »"},{"annee":"2014","titre":"GAN","texte":"Deux réseaux s'affrontent pour produire des images réalistes"},{"annee":"2015","titre":"Jeux Atari","texte":"Un agent de DeepMind apprend 49 jeux vidéo à partir des pixels et du score"},{"annee":"2016","titre":"AlphaGo","texte":"Le programme de DeepMind bat Lee Sedol au go, 4 parties à 1"}],"notes":"Le go était réputé trop complexe pour l'ordinateur : plus de positions possibles que d'atomes dans l'univers. AlphaGo combine apprentissage profond et apprentissage par renforcement, le troisième type d'apprentissage du chapitre 1."},{"type":"portrait","personne":"hassabis","nom":"AlphaGo et le coup 37","dates":"Mars 2016, Séoul","role":"DeepMind, cofondé par Demis Hassabis","points":["Deuxième partie : AlphaGo joue un coup qu'aucun humain n'aurait joué","Les commentateurs croient à une erreur ; c'est un coup gagnant","La machine n'imite plus les humains : elle trouve ses propres stratégies"],"illus":"go","notes":"Le « coup 37 » est devenu le symbole d'une créativité machinique. Revenez à l'objection de Lovelace : AlphaGo a-t-il « créé » quelque chose ? En 2024, Demis Hassabis et John Jumper reçoivent le prix Nobel de chimie pour AlphaFold, qui prédit la forme des protéines."},{"type":"section","numero":"7","titre":"Transformers et IA générative","periode":"2017–2022","texte":"Une nouvelle architecture apprend à lire des textes entiers. Les machines se mettent à écrire, dessiner, traduire.","illus":"attention","notes":"Septième étape : celle qui mène aux agents conversationnels que vos étudiants utilisent déjà."},{"type":"schema","titre":"« Attention Is All You Need »","annee":"2017","illus":"attention","points":["Huit chercheurs de Google proposent le Transformer","Le mécanisme d'attention relie chaque mot à tous les autres","Dans « L'étudiante ouvrit le livre car elle… », « elle » regarde « étudiante »","Tous les grands modèles de langue actuels en descendent"],"notes":"Le titre de l'article est devenu célèbre. L'animation montre les liens d'attention : l'épaisseur indique l'importance. Le Transformer lit tous les mots en même temps, ce qui permet d'entraîner des modèles immenses."},{"type":"frise","titre":"De BERT à ChatGPT","evenements":[{"annee":"2018","titre":"BERT","texte":"Google : un modèle qui comprend le contexte d'un mot"},{"annee":"2019","titre":"GPT-2","texte":"OpenAI : des textes si fluides qu'on hésite à le publier"},{"annee":"2020","titre":"GPT-3","texte":"175 milliards de paramètres ; AlphaFold 2 résout la forme des protéines"},{"annee":"2021","titre":"DALL·E","texte":"Une image dessinée à partir d'une phrase"},{"annee":"2022","titre":"ChatGPT","texte":"30 novembre : l'IA générative arrive dans le grand public"}],"notes":"En cinq ans, on passe d'un outil de laboratoire à un service utilisé par des centaines de millions de personnes. Demandez qui, dans la classe, a déjà utilisé un agent conversationnel, et pour quoi faire."},{"type":"schema","titre":"Comment « écrit » un modèle de langue","illus":"motsuivant","points":["Il découpe le texte en morceaux, les tokens","Il calcule la probabilité de chaque token suivant","Il en choisit un, l'ajoute au texte, et recommence","Des humains notent ensuite ses réponses pour l'affiner"],"notes":"C'est le modèle de bigrammes du carnet 08, en immensément plus grand. Le réglage par des humains s'appelle en anglais RLHF : apprentissage par renforcement à partir de retours humains. Insistez : le modèle prédit du texte plausible, pas du texte vrai."},{"type":"chat","titre":"Un dialogue avec un modèle de langue","annee":"2022","legende":"Exemple fictif, écrit pour la classe","echanges":[{"qui":"h","texte":"Explique le chaînage avant à un étudiant de littérature."},{"qui":"m","texte":"Imaginez un détective : il part des indices qu'il connaît et applique ses règles une à une, jusqu'à trouver le coupable."},{"qui":"h","texte":"Donne-moi une référence pour citer ça dans mon mémoire."},{"qui":"m","texte":"Attention : vérifiez toujours une référence dans une bibliothèque. Je peux me tromper ou en inventer."}],"notes":"Comparez avec ELIZA : cette fois, la réponse est pertinente, reformulée, adaptée au public. Mais le risque demeure : un modèle peut inventer une référence, une citation, une date. C'est l'objet de l'activité « l'épreuve des références » du guide."},{"type":"section","numero":"8","titre":"L'ère des agents","periode":"2023–2026","texte":"Le modèle de langue ne se contente plus de répondre : il planifie, utilise des outils et agit.","illus":"agent","notes":"Dernière étape : c'est le sujet de l'actualité. Rappelez Shakey (1966) : percevoir, planifier, agir. L'idée d'agent est ancienne ; ce qui change, c'est qu'un modèle de langue sert maintenant de « cerveau »."},{"type":"texte","titre":"Qu'est-ce qu'un agent ?","points":["Un agent perçoit son environnement et agit sur lui pour atteindre un but","Un thermostat est un agent très simple : il mesure, puis chauffe ou non","Russell et Norvig (1995) définissent toute l'IA comme l'étude des agents","Un agent d'IA moderne reçoit un objectif, pas seulement une question"],"illus":"thermostat","notes":"Définition à faire noter. La différence avec un agent conversationnel classique : on ne demande plus « réponds », on demande « fais ». Exemple : « Trouve trois articles sur Kateb Yacine, lis-les et fais-moi une fiche. »"},{"type":"schema","titre":"La boucle d'un agent","illus":"boucle","points":["Objectif : ce que l'utilisateur demande","Réfléchir : le modèle planifie l'étape suivante","Agir : il utilise un outil (recherche, calcul, fichier, navigateur)","Observer : il lit le résultat, puis recommence jusqu'au but"],"notes":"Faites suivre la boucle animée. Chaque tour peut réussir ou échouer ; l'agent corrige son plan. C'est pourquoi il faut limiter les outils auxquels il a accès et vérifier ses actions importantes."},{"type":"frise","titre":"Des agents conversationnels aux agents","evenements":[{"annee":"2022","titre":"ReAct","texte":"Des chercheurs font alterner raisonnement et actions dans un même modèle"},{"annee":"2023","titre":"Outils","texte":"GPT-4 ; les modèles apprennent à appeler des outils et des programmes"},{"annee":"2024","titre":"Raisonner, agir","texte":"Modèles qui réfléchissent avant de répondre ; un modèle pilote un ordinateur ; protocole MCP pour brancher des outils"},{"annee":"2025","titre":"Agents au travail","texte":"Agents qui naviguent sur le Web, écrivent et corrigent des programmes"},{"annee":"2026","titre":"Au quotidien","texte":"Les agents s'installent dans les logiciels de bureau, de recherche et d'enseignement"}],"notes":"Les dates de 2025 et 2026 décrivent des tendances générales plutôt que des produits précis, qui changent vite. Invitez les étudiants à chercher un exemple récent et à le présenter en deux minutes."},{"type":"deux","titre":"Agent conversationnel ou agent ?","gauche":{"titre":"Agent conversationnel","points":["Répond à une question","Produit du texte","Un seul tour","L'humain fait le reste"]},"droite":{"titre":"Agent","points":["Poursuit un objectif","Utilise des outils et agit","Plusieurs étapes, il corrige son plan","L'humain supervise et valide"]},"notes":"La frontière est mouvante : beaucoup d'agents conversationnels savent déjà chercher sur le Web. Retenez le critère : un agent enchaîne des actions sur le monde pour atteindre un but."},{"type":"texte","titre":"Les risques, et les bonnes pratiques","points":["Hallucinations : un agent peut agir sur une information fausse","Actions irréversibles : effacer, envoyer, payer ; il faut valider","Consignes cachées dans une page Web peuvent détourner un agent","Données personnelles : la loi algérienne 18-07 s'applique","2024 : l'Union européenne adopte le règlement sur l'IA (AI Act)"],"illus":"bouclier","notes":"Règle simple pour les étudiants : on garde la main sur toute action importante, on vérifie les sources, et on déclare l'usage de l'IA dans ses travaux. Renvoyez à la charte d'usage de l'IA du guide."},{"type":"texte","titre":"Et en Algérie ?","points":["2021 : ouverture de l'École nationale supérieure d'intelligence artificielle (ENSIA)","L'arabe, la darja et le tamazight restent moins bien servis par les modèles","Des corpus locaux, construits en SHS, sont une vraie contribution","Vos mémoires peuvent y participer : textes, enquêtes, entretiens"],"illus":"carte","notes":"Point d'ancrage local. Les langues moins présentes sur le Web sont moins bien traitées par les modèles : c'est une question de données, donc aussi de sciences humaines. Encouragez les étudiants à imaginer un corpus qu'ils pourraient constituer."},{"type":"section","numero":"9","titre":"Synthèse","periode":"De 1206 à 2026","texte":"Huit siècles de rêves, soixante-dix ans de science, quelques années d'agents.","illus":"frise","notes":"Dernière partie : récapituler, voir les vidéos, vérifier ce qui a été compris."},{"type":"frise","titre":"Les huit dates à retenir","evenements":[{"annee":"1843","titre":"Lovelace","texte":"Premier programme, pour une machine jamais achevée"},{"annee":"1950","titre":"Turing","texte":"Les machines peuvent-elles penser ?"},{"annee":"1956","titre":"Dartmouth","texte":"L'IA reçoit son nom"},{"annee":"1974","titre":"Hiver","texte":"Premier hiver de l'IA"},{"annee":"1997","titre":"Deep Blue","texte":"L'ordinateur bat le champion d'échecs"},{"annee":"2012","titre":"AlexNet","texte":"L'apprentissage profond l'emporte"},{"annee":"2017","titre":"Transformer","texte":"L'attention au cœur des modèles de langue"},{"annee":"2022","titre":"ChatGPT","texte":"L'IA générative pour tous ; puis viennent les agents"}],"notes":"Faites réciter la frise à l'envers, de 2022 à 1843. Ces huit dates suffisent pour raconter toute l'histoire à l'examen."},{"type":"deux","titre":"Les familles d'IA, sur une seule diapositive","gauche":{"titre":"Selon la méthode","points":["Symbolique : des règles écrites","Apprentissage automatique : des exemples","Apprentissage profond : des réseaux à nombreuses couches","Renforcement : des essais et des récompenses"]},"droite":{"titre":"Selon l'ambition","points":["IA faible (étroite) : une tâche précise","IA forte (générale) : toutes les tâches, hypothétique","Les agents actuels restent des IA faibles","… mais de plus en plus polyvalentes"]},"notes":"Ce tableau relie la leçon au chapitre 1 du cours (IA faible et forte, types d'apprentissage) et au chapitre 3 (types d'IA). Un agent moderne combine plusieurs familles : un modèle profond, des règles de sécurité, parfois du renforcement."},{"type":"video","titre":"Vidéo : l'histoire complète de l'IA (1950–2026)","youtube":"Xl-G6Mv-N0A","legende":"« The Complete History of AI (1950–2026) - The Rise of Artificial Intelligence », documentaire en anglais, sur YouTube","notes":"Montrez un passage choisi à l'avance plutôt que la vidéo entière. Demandez aux étudiants de repérer trois dates de la frise dans la vidéo. La vidéo demande une connexion Internet."},{"type":"video","titre":"Vidéo : cent ans d'intelligence artificielle","youtube":"mSd9nmPM7Vg","legende":"« The Entire History of Artificial Intelligence (Last 100 Years) », documentaire en anglais, sur YouTube","notes":"Pour les groupes d'anglais, faites résumer oralement la vidéo en anglais : c'est aussi un exercice de langue. Pour les autres, sous-titres automatiques dans la langue choisie."},{"type":"quiz","question":"En quelle année l'expression « intelligence artificielle » s'impose-t-elle, avec l'atelier de Dartmouth ?","choix":["1943","1956","1997","2012"],"reponse":1,"explication":"L'expression apparaît dans la proposition de 1955 et s'impose avec l'atelier de l'été 1956.","notes":"Faites voter avant de dévoiler la réponse (touche R ou bouton)."},{"type":"quiz","question":"Pourquoi parle-t-on d'« hivers » de l'IA ?","choix":["Les ordinateurs chauffaient trop","La déception a fait chuter les crédits et l'intérêt","Les recherches se faisaient l'hiver","Les machines ont été interdites"],"reponse":1,"explication":"Après des promesses démesurées, les résultats ont déçu : les financements ont été coupés (1974–1980, puis 1987–1993).","notes":"Demandez un exemple de promesse démesurée vu dans la leçon : la citation de Herbert Simon (1965)."},{"type":"quiz","question":"Qu'est-ce qui distingue un agent d'un simple agent conversationnel ?","choix":["Il écrit plus vite","Il poursuit un objectif en agissant avec des outils","Il ne fait jamais d'erreur","Il fonctionne sans électricité"],"reponse":1,"explication":"Un agent enchaîne des actions (chercher, calculer, écrire un fichier…) et observe les résultats pour atteindre un but.","notes":"Revenez à la boucle : objectif, réfléchir, agir, observer."},{"type":"quiz","question":"ELIZA (1966) comprenait-elle ce qu'on lui disait ?","choix":["Oui, comme un psychologue","Non : elle transformait les phrases avec des règles","Oui, grâce à l'apprentissage profond","On ne le sait pas"],"reponse":1,"explication":"ELIZA repérait des mots-clés et renvoyait des phrases types. Croire qu'elle comprenait, c'est l'« effet ELIZA ».","notes":"Question de transition vers le débat : et les modèles d'aujourd'hui comprennent-ils ?"},{"type":"fin","titre":"À retenir","points":["Le rêve est ancien ; l'IA comme science naît entre 1950 et 1956","Deux voies alternent : écrire les règles ou apprendre des données","Les hivers rappellent de juger sur les résultats, pas sur les promesses","Un agent perçoit, planifie et agit : de Shakey (1966) aux agents de 2025","Vérifier, garder la main, déclarer son usage : les trois règles d'or"],"texte":"Travail personnel : choisissez une date de la frise et écrivez dix lignes sur ce qu'elle a changé, en citant une source vérifiée.","notes":"Terminez par la question du début : une machine peut-elle penser ? Recueillez trois réponses argumentées. Le travail personnel prépare la table ronde sur la genèse de l'IA."}]},"en":{"langue":"en","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","diapos":[{"type":"couverture","surtitre":"Artificial intelligence · Chapter 1 · First lesson","titre":"From Automaton to Agent","sousTitre":"The complete history of artificial intelligence, from the first machines to today's agents","illus":"agent","notes":"Welcome the class with a question on the board: “Can a machine think?” Do not answer it: the whole lesson keeps coming back to it. Announce the common thread: the dream of intelligent machines is very old, but AI as a science is seventy years old, and its agents only a few years."},{"type":"plan","titre":"This lesson's journey","points":["The dream of machines (from Antiquity to 1945)","The birth of AI (1950–1956)","The golden age, then the first winter (1956–1980)","Expert systems (1980–1993)","Learning from data (1990–2016)","The deep learning revolution (2006–2016)","Transformers and generative AI (2017–2022)","The age of agents (2023–2026)"],"notes":"Eight stages, each with a key date to remember. Suggest that students write down one date per stage: they will rebuild the timeline at the end."},{"type":"texte","titre":"And you, what do you call “intelligence”?","points":["Understanding a sentence, translating a poem","Recognizing one face among a thousand","Winning at chess, solving a problem","Learning from one's mistakes","Acting alone to reach a goal"],"illus":"cerveau","notes":"Two minutes of voting by show of hands: which of these abilities does a machine already have? The answer at the end of the lesson: all of them, to varying degrees, but no machine combines them as a human does. The last line, acting alone to reach a goal, defines the agent: it is where the lesson is heading."},{"type":"section","numero":"1","titre":"The dream of machines","periode":"From Antiquity to 1945","texte":"Long before computers, humans imagined and built machines that imitate life, then machines that calculate.","illus":"engrenages","notes":"First stage: AI did not come from nowhere. Two lines meet here: automata, which imitate movement, and calculating machines, which imitate reasoning."},{"type":"texte","titre":"Automata in myths and workshops","points":["Greek myth: Talos, a bronze giant who guards Crete","1st century: Hero of Alexandria describes theater automata","1739: Vaucanson's duck flaps its wings and “digests”","Around 1770: the Jaquet-Droz Writer traces letters with a quill"],"illus":"engrenages","notes":"An automaton reproduces a movement set in advance by its gears or cams. It decides nothing: that is the difference from an AI. Ask: does the Jaquet-Droz Writer really “write”?"},{"type":"texte","titre":"Al-Jazari, the engineer of ingenious machines","annee":"1206","points":["Engineer at the Artuqid court, in Upper Mesopotamia","In 1206, writes *The Book of Knowledge of Ingenious Mechanical Devices*","Describes some fifty machines: clocks, pumps, automata","His elephant clock marks the hours with automata"],"illus":"elephant","notes":"Al-Jazari shows that the tradition of automata runs through the medieval Arab and Muslim world. His detailed drawings still make it possible to rebuild his machines today. Be careful: these are automata programmed in advance, not machines that learn."},{"type":"texte","titre":"Machines that calculate","points":["1642: Blaise Pascal builds the Pascaline, which adds","1673: Leibniz presents a machine that multiplies","1837: Charles Babbage designs the Analytical Engine, programmable with punched cards","The Analytical Engine would never be completed in his lifetime"],"illus":"calculatrice","personne":"babbage","notes":"A key transition: a machine that calculates takes over part of the work of the mind. Babbage's Analytical Engine already has a memory and a calculating unit, like our computers."},{"type":"portrait","personne":"lovelace","nom":"Ada Lovelace","dates":"1815–1852","role":"Mathematician, the first programmer","points":["1843: her notes on Babbage's Analytical Engine","In them, she writes an algorithm to compute Bernoulli numbers","She imagines that the machine could compose music"],"citation":"The Analytical Engine has no pretensions whatever to originate anything.","source":"Ada Lovelace, notes of 1843","notes":"Her sentence, “Lady Lovelace's objection”, would be discussed by Turing a century later: does a machine only do what it is told? A question for the class: does a model that writes a poem create something?"},{"type":"texte","titre":"When thought becomes calculation","points":["1854: George Boole reduces reasoning to calculations on true and false","1936: Alan Turing describes an abstract machine capable of any calculation","A tape, a read head, a table of rules: the “Turing machine”","Every computer today is, in principle, a Turing machine"],"illus":"turing","notes":"Boole provides the alphabet (true, false, and, or, not); Turing provides the universal machine. Show the animation: the head reads a cell, writes, moves, changes state. With rules this simple, anything can be calculated."},{"type":"portrait","personne":"turing","nom":"Alan Turing","dates":"1912–1954","role":"Mathematician, father of theoretical computer science","points":["1936: the universal machine","1939–1945: helps break the Enigma code at Bletchley Park","1950: “Computing Machinery and Intelligence”, the founding paper"],"citation":"I propose to consider the question, ‘Can machines think?’","source":"Alan Turing, Mind, 1950","notes":"Turing replaces an impossible question (“think”) with an observable test, the imitation game. This is the founding move of AI. The quoted sentence opens his 1950 paper."},{"type":"schema","titre":"The formal neuron","annee":"1943","illus":"neurone","points":["Warren McCulloch and Walter Pitts model a neuron as a calculation","It adds up input signals and “fires” above a threshold","It is the ancestor of all today's neural networks"],"notes":"The first bridge between biology and calculation. Draw on the board: three inputs, weights, a sum, a threshold. We will find exactly this diagram again with the perceptron in 1958, then in deep learning."},{"type":"texte","titre":"The first computers","points":["1945: ENIAC, 30 tonnes, calculates ballistic trajectories","1948: Claude Shannon founds information theory","The bit becomes the unit of all information: text, image, sound","The machines finally exist; now they must be made “intelligent”"],"personne":"eniac","notes":"ENIAC fills an entire room and is programmed by plugging in cables. Shannon, for his part, would be one of the four signatories of the Dartmouth proposal. End of the first stage: everything is ready for the birth of AI."},{"type":"section","numero":"2","titre":"The birth of AI","periode":"1950–1956","texte":"In six years, a question becomes a research program, then a discipline with a name.","illus":"ampoule","notes":"Second stage: three moments to remember: 1950 (Turing), 1956 (Dartmouth) and the first “intelligent” program."},{"type":"schema","titre":"The imitation game","annee":"1950","illus":"imitation","points":["A judge converses in writing with two hidden interlocutors","One is a human, the other a machine","If the judge cannot tell them apart, the machine “passes”"],"notes":"Act out the scene: two hidden volunteers, a judge, five minutes of written questions. Discussion: does the test measure intelligence, or the art of creating an illusion? Today's chatbots have revived this debate."},{"type":"citation","texte":"Every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it.","auteur":"J. McCarthy, M. Minsky, N. Rochester, C. Shannon","source":"Proposal for the Dartmouth workshop, August 31, 1955","notes":"This is the text in which the expression “artificial intelligence” appears. The hypothesis is very ambitious: everything intelligence does could be described precisely. Ask: is that true of humor? Of poetic intuition?"},{"type":"portrait","personne":"mccarthy","nom":"John McCarthy","dates":"1927–2011","role":"Computer scientist who gave AI its name","points":["Summer 1956: organizes the Dartmouth workshop, the birth certificate of AI","1958: creates the Lisp language, long the language of AI","With him: Marvin Minsky, Claude Shannon, Nathaniel Rochester"],"notes":"The Dartmouth workshop brought together about ten researchers during the summer of 1956. It produced no major discovery, but it gave the discipline a name, a community and a program."},{"type":"texte","titre":"The first “intelligent” program","annee":"1956","points":["The Logic Theorist by Allen Newell, Herbert Simon and Cliff Shaw","It proves 38 of the first 52 theorems of *Principia Mathematica*","For one of them, a more elegant proof than the authors' own","A key idea: searching among possibilities with rules"],"illus":"arbre","notes":"The Logic Theorist embodies symbolic AI: symbols, rules, a search through a tree of possibilities. It is the same logic as forward chaining in the chapter 3 tutorial (TD)."},{"type":"section","numero":"3","titre":"The golden age, then the first winter","periode":"1956–1980","texte":"Spectacular successes, excessive promises, then disappointment and the end of funding.","illus":"courbe","notes":"Third stage: this is the first cycle of enthusiasm and disillusion. It will repeat itself, which helps us judge today's promises."},{"type":"schema","titre":"Rosenblatt's perceptron","annee":"1958","illus":"perceptron","points":["Frank Rosenblatt builds a machine that learns to recognize shapes","It adjusts its own weights after each error","The press announces machines that “think”: enthusiasm runs wild"],"personne":"perceptron","notes":"The perceptron is the first neural network that learns. Link it to the “human neuron” activity in the guide: weights, a threshold, a correction after each error."},{"type":"texte","titre":"Learning without being programmed","annee":"1959","points":["Arthur Samuel writes a checkers program that improves by playing","He coins the term “machine learning”","The program ends up beating its own creator","Two paths emerge: writing the rules, or having them learned"],"illus":"dames","notes":"Here is the opposition that structures the whole history: symbolic AI (we write the rules) versus connectionist or statistical AI (the machine learns them from examples)."},{"type":"chat","titre":"ELIZA, the first artificial psychotherapist","annee":"1966","legende":"From Joseph Weizenbaum's 1966 paper","echanges":[{"qui":"h","texte":"Men are all alike."},{"qui":"m","texte":"IN WHAT WAY"},{"qui":"h","texte":"They're always bugging us about something or other."},{"qui":"m","texte":"CAN YOU THINK OF A SPECIFIC EXAMPLE"},{"qui":"h","texte":"Well, my boyfriend made me come here."},{"qui":"m","texte":"YOUR BOYFRIEND MADE YOU COME HERE"}],"notes":"ELIZA understands nothing: it spots keywords and sends the sentence back using transformation rules. Yet users confided their secrets to it. Weizenbaum was troubled by this all his life. This is the “ELIZA effect”: attributing understanding to a machine that answers well."},{"type":"texte","titre":"Shakey, the first robot that reasons","annee":"1966–1972","points":["Built at the Stanford Research Institute (SRI)","It perceives its environment with a camera","It plans a sequence of actions to reach a goal","The A* algorithm, still used to compute routes, was created for it"],"personne":"shakey","illus":"robot","notes":"Shakey is a direct ancestor of agents: it perceives, plans, acts. But it takes minutes to decide to push a box. Remember the pattern perceive, plan, act: it comes back at the end of the lesson."},{"type":"citation","texte":"Machines will be capable, within twenty years, of doing any work a man can do.","auteur":"Herbert Simon","source":"1965","notes":"The promises of the time were excessive. Twenty years later, in 1985, the field was very far from them. Ask students to find a current promise about AI and to consider how it will be judged in twenty years."},{"type":"schema","titre":"The first AI winter","annee":"1974–1980","illus":"courbe","points":["1969: Minsky and Papert show the limits of the single-layer perceptron","1973: the Lighthill report, in the United Kingdom, finds the results disappointing","Computations explode as soon as problems grow","Public funding is cut: this is the “winter”"],"notes":"An AI winter is a period when disappointment drives away funding and researchers. The curve shows both winters: 1974–1980 and 1987–1993. A point of method: judge a technique on its results, not on its promises."},{"type":"section","numero":"4","titre":"Expert systems","periode":"1980–1993","texte":"AI comes back by turning experts' knowledge into rules. It enters companies, then falls back.","illus":"regles","notes":"Fourth stage: the triumph of symbolic AI, the AI of chapter 3 and its tutorial (TD) on forward chaining."},{"type":"schema","titre":"Turning knowledge into rules","illus":"regles","points":["A fact base, a base of IF … THEN … rules, an inference engine","1970s: MYCIN, at Stanford, diagnoses blood infections","1980: XCON configures computers for the company DEC","Companies invest: AI becomes an industry"],"notes":"Link this to session 6: the role play on poetic forms is a small expert system. MYCIN had about 600 rules written with doctors."},{"type":"texte","titre":"The return of neural networks","annee":"1986","points":["1982: Japan launches the Fifth Generation Computer project","1986: Rumelhart, Hinton and Williams popularize backpropagation","Networks with several layers can finally be trained","But computers and data are still lacking"],"illus":"reseau","notes":"Backpropagation calculates how to correct each weight of a network from the final error. It is the gradient descent of chapter 3, applied to millions of weights. The idea was ready twenty-five years before its triumph."},{"type":"texte","titre":"The second winter","annee":"1987–1993","points":["1987: the market for specialized Lisp machines collapses","Expert systems are expensive and fail outside their domain","Each new rule contradicts others: they become unmanageable","The word “AI” falls out of favor: people say “advanced computing” instead"],"illus":"flocon","notes":"Expert systems are brittle: they know only what has been written into them, and do not know what they do not know. This weakness explains the next turn: learning from data."},{"type":"section","numero":"5","titre":"Learning from data","periode":"1990–2016","texte":"Instead of writing the rules, we give examples. With the Internet, the examples run into the billions.","illus":"donnees","notes":"Fifth stage: this is the great reversal. It rests on three ingredients: algorithms, data and computing power."},{"type":"deux","titre":"Two ways to build an AI","gauche":{"titre":"Symbolic AI","points":["An expert writes the rules","Explainable: the reasoning can be followed","Brittle outside its domain","Example: an expert system"]},"droite":{"titre":"Machine learning","points":["The machine draws patterns from examples","Often hard to explain","Robust, if there is plenty of data","Example: a spam filter"]},"notes":"Have students classify three objects: a spellchecker, a machine translator, a GPS. Today, the best systems often combine both approaches."},{"type":"portrait","personne":"deepblue","nom":"Deep Blue versus Kasparov","dates":"May 1997","role":"IBM's computer beats the world chess champion","points":["Wins 3½ to 2½ over six games, in New York","About 200 million positions evaluated per second","Computing power, not learning: this is still search-based AI"],"illus":"echecs","notes":"The event made headlines around the world. But Deep Blue does not understand chess: it calculates moves and evaluates them with rules written by experts. Compare with AlphaGo, which would learn by playing, twenty years later."},{"type":"frise","titre":"Learning spreads everywhere","evenements":[{"annee":"1989","titre":"Reading digits","texte":"Yann LeCun trains a convolutional network to read postal codes"},{"annee":"1992","titre":"TD-Gammon","texte":"A program learns backgammon by playing against itself"},{"annee":"1998","titre":"Checks","texte":"LeCun's networks read bank checks in the United States"},{"annee":"2002","titre":"Roomba","texte":"A robot vacuum cleaner enters people's homes"},{"annee":"2005","titre":"Stanley","texte":"A driverless car wins the DARPA desert race"},{"annee":"2011","titre":"Watson, Siri","texte":"Watson wins the TV quiz show Jeopardy!; Siri arrives on phones"}],"notes":"Notice that AI becomes invisible: it sorts mail, reads checks, filters spam, without being called AI. This is sometimes called the “AI effect”: as soon as a technique works, people stop considering it intelligence."},{"type":"section","numero":"6","titre":"The deep learning revolution","periode":"2006–2016","texte":"Neural networks with very many layers, trained on huge amounts of data with graphics processors.","illus":"reseau","notes":"Sixth stage. The word “deep” refers to the number of layers in the network, not to depth of thought."},{"type":"schema","titre":"A deep network, layer by layer","illus":"reseau","points":["The first layers detect simple features: edges, blobs","The next layers combine them: shapes, textures, parts","The last ones recognize whole objects: “cat”, “car”","Each layer learns by itself what to detect"],"notes":"Show the animation: the signal crosses the layers from left to right. It is the same with a text: letters, words, phrases, meaning. Nobody writes down what each neuron should detect: it learns it."},{"type":"portrait","personne":"feifei","nom":"Fei-Fei Li and ImageNet","dates":"2009–2012","role":"An image database that changes everything","points":["2009: ImageNet, over 14 million images labeled by hand","2012: the AlexNet network crushes the image recognition competition","Its error rate falls to 15%, against 26% for the runner-up"],"illus":"imagenet","notes":"Three ingredients came together in 2012: data (ImageNet), graphics cards to compute fast, and deep networks. It is the start of the current wave. The images were labeled by thousands of workers paid per task: an ethical point to discuss."},{"type":"portrait","personne":"hinton","nom":"Geoffrey Hinton","dates":"Born in 1947","role":"Pioneer of neural networks","points":["Defends neural networks through both winters","2018: Turing Award with Yoshua Bengio and Yann LeCun","2024: Nobel Prize in Physics with John Hopfield"],"notes":"Hinton is an example of a researcher who was right too early: his ideas from the 1980s only really worked in 2012. In 2023, he left Google to warn about the risks of AI."},{"type":"frise","titre":"Machines also learn language and games","evenements":[{"annee":"2013","titre":"Word2vec","texte":"Words become vectors: “king” − “man” + “woman” ≈ “queen”"},{"annee":"2014","titre":"GAN","texte":"Two networks compete to produce realistic images"},{"annee":"2015","titre":"Atari games","texte":"A DeepMind agent learns 49 video games from the pixels and the score"},{"annee":"2016","titre":"AlphaGo","texte":"DeepMind's program beats Lee Sedol at Go, 4 games to 1"}],"notes":"Go was thought to be too complex for computers: it has more possible positions than there are atoms in the universe. AlphaGo combines deep learning and reinforcement learning, the third type of learning in chapter 1."},{"type":"portrait","personne":"hassabis","nom":"AlphaGo and Move 37","dates":"March 2016, Seoul","role":"DeepMind, co-founded by Demis Hassabis","points":["Game two: AlphaGo plays
