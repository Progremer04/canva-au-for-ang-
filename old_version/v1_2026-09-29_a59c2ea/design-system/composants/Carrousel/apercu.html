<div class="apercu" style="max-inline-size:460px">
  <div class="carrousel" data-carrousel data-auto aria-roledescription="carrousel" aria-label="Photos du slider d'origine">
    <div class="carrousel__piste">
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:blog-1.jpg}}" alt="Un barista verse du lait chaud près d'une machine à expresso"><figcaption class="carrousel__legende">Le geste du barista</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:blog-3.jpg}}" alt="Café turc versé depuis une cezve dans des tasses en argent, avec baklavas et halva"><figcaption class="carrousel__legende">Café turc et baklava</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:gallery-4.jpg}}" alt="Tasse de cappuccino décorée d'une feuille en latte art"><figcaption class="carrousel__legende">Latte art</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:menu-2.jpg}}" alt="Éclats de gaufrette tombant dans une tasse de café fumante sur fond noir"><figcaption class="carrousel__legende">Café et gaufrette</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:menu-5.jpg}}" alt="Latte macchiato en couches dans un verre à pied"><figcaption class="carrousel__legende">Latte macchiato</figcaption></figure>
    </div>
    <div class="carrousel__commandes">
      <button type="button" class="bouton-verre" data-carrousel-precedent aria-label="Diapositive précédente">{{ICONE:gauche}}</button>
      <ol class="carrousel__points"></ol>
      <button type="button" class="bouton bouton--petit" data-carrousel-pause aria-pressed="false">Pause</button>
      <button type="button" class="bouton-verre" data-carrousel-suivant aria-label="Diapositive suivante">{{ICONE:droite}}</button>
    </div>
  </div>
</div>
