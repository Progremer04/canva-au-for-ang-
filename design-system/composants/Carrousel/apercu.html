<div class="apercu" style="max-inline-size:460px">
  <div class="carrousel" data-carrousel data-auto aria-roledescription="carrousel" aria-label="Paysages du slider d'origine">
    <div class="carrousel__piste">
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:blog-1.jpg}}" alt="Sommets enneigés de l'Himalaya"><figcaption class="carrousel__legende">Himalaya</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:blog-3.jpg}}" alt="Aurore boréale dans un ciel nocturne"><figcaption class="carrousel__legende">Aurores boréales</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:gallery-4.jpg}}" alt="Paysage arctique"><figcaption class="carrousel__legende">Arctique</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:menu-2.jpg}}" alt="Forêt amazonienne"><figcaption class="carrousel__legende">Amazonie</figcaption></figure>
      <figure class="carrousel__diapo" style="margin:0"><img src="{{IMG:menu-5.jpg}}" alt="Dunes du désert"><figcaption class="carrousel__legende">Désert</figcaption></figure>
    </div>
    <div class="carrousel__commandes">
      <button type="button" class="bouton-verre" data-carrousel-precedent aria-label="Diapositive précédente">{{ICONE:gauche}}</button>
      <ol class="carrousel__points"></ol>
      <button type="button" class="bouton bouton--petit" data-carrousel-pause aria-pressed="false">Pause</button>
      <button type="button" class="bouton-verre" data-carrousel-suivant aria-label="Diapositive suivante">{{ICONE:droite}}</button>
    </div>
  </div>
</div>
